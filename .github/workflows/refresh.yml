name: Akışı yenile
on:
  schedule:
    # Yedek: GitHub zamanlanmis isleri geciktirir (pratikte saatte bir). Asil dongu asagidaki
    # "tekrar" isi: her calisma bitince ~8 dk bekleyip kendini workflow_dispatch ile yeniden baslatir.
    # Zincir bir sebeple kopsa bu cron (ya da elle calistirma) yeniden baslatir.
    - cron: "*/30 * * * *"
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]            # gelistirme dallari yayin zincirini baslatmasin
    paths: [sources.json, fetch_feeds.py, masa.py, akis2.py, ekler.py, index.tpl.html, build.py, kisisel.py, kisisel/**, tests/**, .github/workflows/refresh.yml]
permissions:
  contents: write
  actions: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Testler agsiz ve ~5 sn: kirik kod yayina girmez. Veri zinciri yine de kopmaz: 'tekrar' isi basarisizlikta da calisir.
      - name: Testler
        run: python -m unittest discover -s tests -t .
      - run: python fetch_feeds.py
      - run: python masa.py          # eski cikti (masa.json): TechTurco paneli okur
      - run: python akis2.py         # yeni arayuzun parcali verisi (site/data/*.json), Google Trends ve Guncelleme Radari (ekler.py)
      - run: python build.py         # site/index.html (+ panelin okudugu id="snap" blogu)
      # Kisisel masa (Piril Cennet, Dunya masasi): ayri kaynak listesi ve ayri dosyalar (site/kisisel/piril, site/data/kisisel).
      # Ana akisin dosyalarina dokunmaz; bozulursa ana akisin yayini durmaz.
      - name: "Kisisel masa: Piril kaynaklari"
        continue-on-error: true
        run: python fetch_feeds.py --profil piril
      - name: "Kisisel masa: Piril verisi"
        continue-on-error: true
        run: python kisisel.py
      - name: "Cikti dogrulama (bozuk uretim commitlenmez, onceki site yayinda kalir)"
        run: python -m unittest tests.test_sozlesme tests.test_cikti -v
      - name: "Değişiklik varsa kaydet (site/data commitlenmez, .gitignore'da; yalnız durum ve eski çıktılar)"
        run: |
          git config user.name "akis-bot"
          git config user.email "akis-bot@users.noreply.github.com"
          git add site
          git diff --cached --quiet || (git commit -m "Akış yenilendi" && git push)
      # Yayın paketi bu işte, doğrulanmış çıktıdan üretilir (yeniden hesaplama yok, git geçmişi şişmez).
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write, contents: read }
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/configure-pages@v5
      - id: d
        uses: actions/deploy-pages@v4
  tekrar:
    needs: deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: { actions: write }
    steps:
      - name: Bekle ve kendini yeniden başlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 480
          gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" --ref main
