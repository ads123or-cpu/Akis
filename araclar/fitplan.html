<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitPlan">
<title>FitPlan · Makine Odaklı Atletik & Kol Programı</title>
<style>
:root{--bg:#0b0e14;--s1:#131823;--s2:#1a2232;--bd:rgba(255,255,255,.08);--tx:#f3f6fb;--mu:#9aa5b8;--gr:#22c55e;--bl:#38bdf8;--or:#f59e0b;--pu:#a78bfa;--rd:#ef4444;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.app{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 110px}
h1,h2,h3,h4{margin:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#0ea5e9,#22c55e);display:grid;place-items:center;font-weight:800;color:#04121a}
.top h1{font-size:19px}.top p{margin:0;font-size:12px;color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.green{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3)}
.card.orange{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3)}
.card.blue{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.3)}
.card.purple{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.35)}
.muted{color:var(--mu)}.small{font-size:12px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08)}
.pill.g{background:rgba(34,197,94,.16);color:var(--gr)}.pill.b{background:rgba(56,189,248,.16);color:var(--bl)}
.pill.o{background:rgba(245,158,11,.16);color:var(--or)}.pill.p{background:rgba(167,139,250,.18);color:var(--pu)}
.weeks{display:flex;gap:3px;margin:10px 0 8px}.weeks i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
.weeks i.past{background:rgba(34,197,94,.4)}.weeks i.now{background:var(--gr)}
.strip{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.dbtn{flex:0 0 auto;background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:9px 13px;text-align:left}
.dbtn b{display:block;font-size:12px}.dbtn span{font-size:11px;color:var(--mu)}
.dbtn.on{background:var(--gr);border-color:var(--gr);color:#04120a}.dbtn.on span{color:rgba(0,0,0,.7)}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--gr)}
details.warm{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:14px;padding:12px;margin-bottom:12px}
details.warm summary{font-weight:700;color:var(--or);cursor:pointer;font-size:14px}
details.warm ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--mu)}
.ss{font-size:11px;font-weight:700;color:var(--pu);margin:6px 2px}
.ex{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ex.done{border-color:rgba(34,197,94,.5)}
.exh{display:flex;gap:10px;align-items:center;padding:10px;cursor:pointer}
.thumb{position:relative;width:78px;flex:0 0 78px;height:64px;background:rgba(255,255,255,.04);border-radius:11px}
.thumb svg,.thumb canvas{width:100%;height:100%;display:block}
.anim{background:radial-gradient(circle at 50% 40%,#162033,#0d121c 75%);border:1px solid var(--bd);border-radius:14px;margin-top:12px;overflow:hidden}
.anim canvas{width:100%;height:250px;display:block}
.anim .cap{font-size:11px;color:var(--mu);padding:0 12px 10px;text-align:center}
.num{position:absolute;bottom:3px;right:3px;font-size:10px;font-weight:800;background:rgba(0,0,0,.75);border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 4px}
.ex.done .num{background:var(--gr);color:#04120a}
.exi{flex:1;min-width:0}.exi h3{font-size:15px}.exi .sub{font-size:12px;color:var(--mu);margin-top:2px}
.up{font-size:11px;font-weight:700;color:var(--gr);margin-top:3px}
.chev{color:var(--mu);transition:transform .2s}.ex.open .chev{transform:rotate(180deg)}
.exb{display:none;padding:0 12px 14px;border-top:1px solid var(--bd)}.ex.open .exb{display:block}
.map{background:rgba(255,255,255,.04);border-radius:14px;padding:10px;margin-top:12px}
.map svg{width:100%;height:170px;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.btns{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.btn{flex:1;padding:11px;border-radius:12px;font-weight:700;font-size:14px;text-align:center}
.btn.red{background:#dc2626;color:#fff}.btn.gray{background:var(--s2);border:1px solid var(--bd)}
select.btn{appearance:none;-webkit-appearance:none;width:100%;text-align:left;padding-left:14px}
.sugg{border-radius:12px;padding:11px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
.sugg.up{background:rgba(34,197,94,.13);color:#86efac}.sugg.info{background:rgba(56,189,248,.12);color:#7dd3fc}
.sets .sr{display:grid;grid-template-columns:54px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:7px}
.sets .hd{font-size:11px;color:var(--mu);text-transform:uppercase}
.si{font-size:12px;font-weight:700;color:var(--mu)}.si em{display:block;font-style:normal;color:var(--pu);font-size:10px}
.in{width:100%;background:#0e1420;border:1px solid var(--bd);border-radius:10px;padding:9px;text-align:center;font-size:15px;outline:none}
.in:focus{border-color:var(--gr)}
.ck{height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);font-weight:800;color:var(--mu)}
.ck.on{background:var(--gr);border-color:var(--gr);color:#04120a}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pos div{border-radius:13px;padding:11px;font-size:13px}
.pos .a{background:rgba(56,189,248,.12)}.pos .z{background:rgba(34,197,94,.12)}
.pos b{display:block;font-size:11px;margin-bottom:4px}.pos .a b{color:var(--bl)}.pos .z b{color:var(--gr)}
.card h4{font-size:13px;margin-bottom:6px}
.card ul,.card ol{margin:0;padding-left:18px;font-size:13px}.card li{margin-bottom:4px}
.card p{margin:0;font-size:13px}
.finish{display:flex;gap:8px;margin-top:8px}
.finish .btn.go{background:linear-gradient(135deg,#0ea5e9,#22c55e);color:#04121a}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:730px;background:#101929;border:1px solid rgba(34,197,94,.5);border-radius:16px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;box-shadow:0 14px 36px rgba(0,0,0,.55);z-index:40}
.timer.show{display:flex}.timer b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--gr)}
.timer button{padding:7px 11px;border-radius:10px;background:var(--s2);border:1px solid var(--bd);font-size:12px;font-weight:700;margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,14,20,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:30}
nav div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
nav button{padding:8px;border-radius:12px;color:var(--mu);font-size:12px;font-weight:700}
nav button.on{color:var(--gr);background:rgba(34,197,94,.12)}
.sec{display:none}.sec.on{display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:10px;padding:3px;margin:8px 0}
.seg button{padding:7px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mu)}.seg button.on{background:var(--gr);color:#04120a}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0 10px;scrollbar-width:none}
.chips button{flex:0 0 auto;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.08);font-size:12px;font-weight:700}
.chips button.on{background:var(--gr);color:#04120a}
.hi{display:flex;justify-content:space-between;align-items:center;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#0f1d17;border:1px solid rgba(34,197,94,.5);color:#bbf7d0;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:700;display:none;z-index:50}
.toast.show{display:block}
input[type=date]{background:#0e1420;border:1px solid var(--bd);border-radius:10px;padding:7px 9px;color-scheme:dark}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
  <div class="top">
    <div class="logo">FP</div>
    <div><h1>FitPlan</h1><p id="lvl"></p></div>
  </div>
  <section class="sec on" id="s-program">
    <div id="phase"></div>
    <div class="strip" id="strip"></div>
    <div id="dayCard"></div>
    <div id="warm"></div>
    <div id="list"></div>
    <div class="finish">
      <button class="btn go" id="finish">Antrenmanı Bitir ve Kaydet</button>
      <button class="btn gray" id="reset" style="flex:0 0 auto">Sıfırla</button>
    </div>
  </section>
  <section class="sec" id="s-guide"></section>
  <section class="sec" id="s-history"></section>
</div>
<div class="timer" id="timer">
  <div><div class="tiny muted">Dinlenme</div><b id="tclock">00:00</b></div>
  <div><button id="tplus">+15 sn</button><button id="tstop">Bitir</button></div>
</div>
<nav><div>
  <button class="on" data-t="program">🏋️ Program</button>
  <button data-t="guide">📘 Rehber</button>
  <button data-t="history">📈 Geçmiş</button>
</div></nav>
<script>
const P = {"version":2,"title":"Atletik Fit & Kol Programı","level":"6–8 ay deneyim · makine ağırlıklı","muscles":{"chest":"Göğüs","frontDelt":"Ön omuz","sideDelt":"Yan omuz","rearDelt":"Arka omuz","upperBack":"Üst sırt","lats":"Kanat (lat)","lowerBack":"Bel","biceps":"Biceps","triceps":"Triceps","forearms":"Ön kol","abs":"Karın","obliques":"Yan karın","quads":"Ön bacak","hamstrings":"Arka bacak","glutes":"Kalça","abductors":"Kalça yanı","calves":"Baldır"},"phases":[{"weeks":[1,2],"name":"Uyum","rir":"3 tekrar rezerv","detail":"Makine ayarlarını ve ağırlıklarını öğren. Her seti 3 tekrar daha yapabilecekken bitir. Ağırlıkları not et.","deload":false,"peak":false},{"weeks":[3,4,5],"name":"Gelişim","rir":"1–2 tekrar rezerv","detail":"Asıl büyüme dönemi. Tüm setlerde tekrar aralığının üstüne ulaşınca ağırlığı bir kademe artır.","deload":false,"peak":false},{"weeks":[6,7],"name":"Zirve","rir":"İzolasyonda 0–1 rezerv","detail":"İşaretli hareketlerin son setinde zirve tekniğini (drop set / duraklamalı tekrar) uygula. Temel preslerde form bozulmasın.","deload":false,"peak":true},{"weeks":[8],"name":"Hafif hafta","rir":"4 tekrar rezerv","detail":"Set sayısı yarıya iner, ağırlıkları %10 hafiflet. Eklemler ve sinir sistemi toparlanır; 9. hafta 1. haftadan daha güçlü başlarsın.","deload":true,"peak":false}],"schedule4":["Pzt: Gün 1","Sal: Gün 2","Çar: Dinlen","Per: Gün 3","Cum: Gün 4","Cmt–Paz: Dinlen / yürüyüş"],"schedule5":["Pzt: Gün 1","Sal: Gün 2","Çar: Dinlen","Per: Gün 3","Cum: Gün 4","Cmt: Gün 5 (Kol & Omuz)","Paz: Dinlen"],"principles":[{"title":"Çift ilerleme kuralı","detail":"Örn. 3×8–12. Aynı ağırlıkla her hafta tekrarı artır. Üç setin hepsinde 12'ye ulaştığında ağırlığı bir kademe (makinede genelde 2.5–5 kg) artır ve tekrar 8'den başla. Uygulama bunu sana otomatik söyler."},{"title":"Tekrar rezervi (RIR)","detail":"\"2 rezerv\" = seti bitirdiğinde temiz formla 2 tekrar daha yapabilirdin. Tükenişe her sette gitmek gereksiz yorgunluk yapar; zirve haftalarında yalnız izolasyon hareketlerinde sınıra yaklaş."},{"title":"Tempo","detail":"Ağırlığı 2–3 saniyede indir, kası en gergin noktada 1 saniye tut, kontrollü kaldır. Makinede savurmak kası değil momentumu çalıştırır."},{"title":"Süperset (A1 / A2)","detail":"A1 ve A2 işaretli iki hareketi arka arkaya yap, sonra dinlen. Biceps ile triceps birbirini yormaz; kol çalışması yarı sürede biter."},{"title":"Protein 1.6–2.0 g/kg","detail":"75 kg için günde 120–150 g. Her öğünde avuç içi kadar protein (tavuk, et, balık, yumurta, yoğurt, lor)."},{"title":"Şişmeden kas: hafif fazla kalori","detail":"Günlük ihtiyacın + en fazla 150–250 kcal. Bel ölçün ayda 1 cm'den hızlı artıyorsa kaloriyi azalt."},{"title":"Uyku ve adım","detail":"7.5–8 saat uyku. Günde 8–10 bin adım yağ oranını kas kaybetmeden düşük tutar."}],"days":[{"id":"d1","short":"Gün 1","title":"Üst Vücut A","focus":"Üst göğüs · Sırt genişliği · Biceps","duration":55,"optional":false,"warmup":["5 dk eliptik veya kürek, hafif tempo.","Kablo ile 2×15 hafif face pull (omuzları hazırlar).","İlk harekette 2 ısınma seti: boş/çok hafif ×12, sonra çalışma ağırlığının yarısı ×6."],"exercises":[{"id":"d1.incline_press","name":"Eğimli Göğüs Pres (Makine / Smith)","en":"incline chest press machine","machine":"Incline chest press makinesi veya Smith makinesi + 30° sehpa","primary":["chest"],"secondary":["frontDelt","triceps"],"sets":3,"reps":"6–10","rest":120,"tempo":"İniş 3 sn · altta 1 sn · güçlü it","warmupSets":2,"setup":["Koltuğu, tutamaklar göğsünün üst kısmı (köprücük kemiğinin biraz altı) hizasına gelecek şekilde ayarla.","Smith'te sehpayı 30° aç; bar göğsün üst kısmına insin."],"start":"Sırt yaslanmış, kürek kemikleri geriye-aşağı sıkışık, kollar önde neredeyse düz.","end":"Tutamaklar göğsüne bir yumruk kalana kadar indi, dirsekler gövdeyle ~45° açıda.","steps":["Göğsünü hafif yukarı kaldır, omuzlarını koltuğa bastır.","Tutamakları 3 saniyede göğsüne doğru indir.","Altta 1 saniye bekle, göğsünle iterek kaldır; tepede dirsekleri kilitleme."],"feel":"Göğsün üst kısmında, köprücük kemiğinin altında.","mistakes":["Dirsekleri omuz hizasına kadar yana açmak (omuz ağrısı yapar).","Kalçayı koltuktan kaldırıp beli köprü yapmak."],"breath":"İnerken al, iterken ver.","tip":"Tişörtün üstünü dolduran bölge burasıdır; programın ilk hareketi olması bilinçli.","alternatives":[{"name":"Eğimli Dambıl Pres","en":"incline dumbbell press","note":"Makine doluysa. 30° sehpa, aynı set/tekrar."},{"name":"Kablo Aşağıdan Yukarı Fly","en":"low to high cable fly","note":"Omuz ağrıyorsa daha hafif seçenek, 3×12–15."}],"anim":"inclinePress"},{"id":"d1.lat_pulldown","name":"Lat Pulldown (Önden Çekiş)","en":"lat pulldown","machine":"Lat pulldown istasyonu","primary":["lats"],"secondary":["biceps","upperBack","forearms"],"sets":3,"reps":"8–12","rest":90,"tempo":"Çek 1 sn · altta 1 sn sık · 3 sn bırak","warmupSets":1,"setup":["Diz pedini, uyluklarını sıkıca sabitleyecek kadar indir.","Barı omuz genişliğinden bir karış geniş tut (ya da nötr V-tutamak)."],"start":"Kollar yukarıda tamamen uzanmış, gövde ~15° geriye yaslı, göğüs açık.","end":"Bar köprücük kemiğinin hemen üstünde, dirsekler kaburgaların yanında aşağıda.","steps":["Önce omuzlarını kulaklarından uzaklaştır (aşağı indir).","Dirseklerini cebine sokar gibi aşağı ve geriye çek.","Altta 1 sn sırtını sık, 3 sn'de kollar tam uzanana kadar bırak."],"feel":"Koltuk altının hemen altında, sırtın yanlarında.","mistakes":["Gövdeyi geriye atıp sallanarak çekmek.","Barı ensenin arkasına indirmek."],"breath":"Çekerken ver, bırakırken al.","tip":"Elini kanca gibi düşün; başparmağı barın üstüne koymak ön kol yerine sırtı çalıştırır.","alternatives":[{"name":"Destekli Barfiks Makinesi","en":"assisted pull up machine","note":"Aynı set/tekrar; destek ağırlığı azaldıkça güçleniyorsun."},{"name":"Tek Kol Kablo Pulldown","en":"single arm cable lat pulldown","note":"Her kol 3×10–12, sağ-sol farkını kapatır."}],"anim":"pulldown"},{"id":"d1.chest_row","name":"Göğüs Destekli Row Makinesi","en":"chest function load(){

function daysSince(){ const n = new Date(); n.setHours(0,0,0,0); return Math.max(0, Math.round((n - S.start)/86400000)); }

function cycle(){ return Math.floor(daysSince()/56) + 1; }
function phase(){ const w = week(); return P.phases.find(p => p.weeks.includes(w)) || P.phases[0]; }

function repTop(ex){ const n = nums(ex.reps.split("/")[0]); return n.length ? Math.max(...n) : 10; }
function repBottom(ex){ const n = nums(ex.reps); return n.length ? n[0] : 10; }

function bodySVG(primary, secondary, small){

// ---------- Hareketli figür ----------
const D2R = Math.PI / 180;

  const o = {hip: [A.hip[0] + (B.hip[0] - A.hip[0]) * t, A.hip[1] + (B.hip[1] - A.hip[1]) * t]};
  for(const k of ["torso","ua","fa","th","sh","ft"]) o[k] = lerpA(A[k] ?? 0, B[k] ?? 0, t);
  for(const k of ["uaS","faS","thS","shS"]) o[k] = (A[k] ?? 1) + ((B[k] ?? 1) - (A[k] ?? 1)) * t;

}
function animState(spec, time){

    if(t <= s[2] || i === seq.length - 1){

      const p = s[2] ? Math.min(1, t / s[2]) : 1, e = p * p * (3 - 2 * p);
      const from = spec[prev], to = spec[s[0]];
      return {pose: lerpPose(from, to, e), far: lerpPose(to, from, e), label, bright: s[3]};
    }

  }
}

    const m = a => 180 - a;

    if(spec.together){ J.LW = J.RW; J.LE = [(J.LS[0] + J.RW[0]) / 2, (J.LS[1] + J.RW[1]) / 2 + 3]; }
    else { J.LE = add(J.LS, dv(m(P.ua)), 15 * P.uaS); J.LW = add(J.LE, dv(m(P.fa)), 14 * P.faS); }
    J.RK = add(J.RH, dv(P.th), 20 * P.thS); J.RA = add(J.RK, dv(P.sh), 19 * P.shS);
    J.LK = add(J.LH, dv(m(P.th)), 20 * P.thS); J.LA = add(J.LK, dv(m(P.sh)), 19 * P.shS);

    J.E = add(J.S, dv(P.ua), 15 * P.uaS); J.W = add(J.E, dv(P.fa), 14 * P.faS);
    J.K = add(J.H, dv(P.th), 20 * P.thS); J.A = add(J.K, dv(P.sh), 19 * P.shS); J.T = add(J.A, dv(P.ft), 7);

}
function pts(spec, J, name){

function drawAnim(ctx, spec, time, W, H, small){

      if(glow.has("glute")) [add(J.RH, J.n, 3.5), add(J.LH, J.n, -3.5)].forEach(q => dot(q, 4.5, G));
    } else {

      if(glow.has("back")) dot(add(add(J.S, toH, 11), J.n, -3.5), 5.5, G);

    seg(J.RS, J.LS, BODY, 6); seg(J.RH, J.LH, BODY, 6);

const LIVE = new Set();

function animLoop(ts){

function startTimer(sec){
  tEnd = Date.now() + sec*1000; $("timer").classList.add("show"); tick();
  clearInterval(tInt); tInt = setInterval(tick, 500);
}
function tick(){
  const left = Math.ceil((tEnd - Date.now())/1000);
  if(left <= 0){ stopTimer(); toast("Dinlenme bitti, sıradaki set!"); if(navigator.vibrate) navigator.vibrate([150,80,150]); return; }
  $("tclock").textContent = String(Math.floor(left/60)).padStart(2,"0") + ":" + String(left%60).padStart(2,"0");
}
function stopTimer(){ clearInterval(tInt); tInt = null; $("timer").classList.remove("show"); }
$("tplus").onclick = () => { tEnd += 15000; tick(); };
$("tstop").onclick = stopTimer;

$("finish").onclick = () => {
  const d = curDay(); let vol = 0, done = 0;
  d.exercises.forEach(ex => {
    const l = sets(ex);
    if(l.some(s => s.done)){ S.last[key(ex)] = l; vol += l.filter(s=>s.done).reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0); }
    if(l.every(s => s.done)) done++;
    delete S.sets[key(ex)];
  });
  S.history.push({day: d.short + " · " + d.title, ts: Date.now(), done, total: d.exercises.length, week: week(), vol: Math.round(vol)});
  save(); stopTimer(); render(); toast("Kaydedildi. Bir sonraki seferde ağırlık önerisi hazır.");
};
$("reset").onclick = () => { if(!confirm("Bugünkü set işaretleri silinsin mi?")) return; curDay().exercises.forEach(ex => delete S.sets[key(ex)]); save(); renderDay(); };

function renderGuide(){
  const g = $("s-guide");
  const keys = ["chest","upperBack","lats","frontDelt","sideDelt","rearDelt","biceps","triceps","forearms","quads","hamstrings","glutes","abductors","calves","abs","obliques"];
  const all = P.days.flatMap(d => d.exercises).filter(e => !muscleFilter || e.primary.includes(muscleFilter));
  const sd = new Date(S.start); const sdv = `${sd.getFullYear()}-${String(sd.getMonth()+1).padStart(2,"0")}-${String(sd.getDate()).padStart(2,"0")}`;
  g.innerHTML = `<div id="gphase"></div>
    <div class="card"><h4 style="font-size:15px">Haftalık düzen</h4>
      <div class="seg"><button data-dpw="4" class="${S.dpw===4?"on":""}">Haftada 4 gün</button><button data-dpw="5" class="${S.dpw===5?"on":""}">Haftada 5 gün</button></div>
      <ul>${(S.dpw===5?P.schedule5:P.schedule4).map(s=>`<li>${s}</li>`).join("")}</ul>
      <div class="row between" style="margin-top:10px"><span class="small">Program başlangıcı</span><input type="date" id="sdate" value="${sdv}"></div>
      <button class="pill g" id="w1" style="margin-top:8px">Bu haftayı 1. hafta yap</button></div>
    <div class="card"><h4 style="font-size:15px">8 haftalık döngü</h4>${P.phases.map(p=>`<p style="margin-top:8px"><b>Hafta ${p.weeks.join("–")}: ${p.name}</b><br><span class="muted small">${p.detail}</span></p>`).join("")}</div>
    <h3 style="font-size:16px;margin:16px 2px 8px">Kurallar</h3>
    ${P.principles.map(t=>`<div class="card"><h4>${t.title}</h4><p class="muted">${t.detail}</p></div>`).join("")}
    <div class="card"><h4>Telefona uygulama gibi ekle</h4><p class="muted">iPhone Safari: Paylaş → Ana Ekrana Ekle. Android Chrome: menü → Ana ekrana ekle. Kayıtların yalnız bu cihazda saklanır.</p></div>
    <h3 style="font-size:16px;margin:16px 2px 0">Hareketler (${all.length})</h3>
    <div class="chips"><button data-m="" class="${!muscleFilter?"on":""}">Tümü</button>${keys.map(k=>`<button data-m="${k}" class="${muscleFilter===k?"on":""}">${mName(k)}</button>`).join("")}</div>
    <div id="glist">${all.map((e,i)=>exCard(e,i,true)).join("")}</div>`;
  renderPhase($("gphase"));
  g.querySelectorAll("[data-dpw]").forEach(b => b.onclick = () => { S.dpw = +b.dataset.dpw; save(); render(); });
  $("sdate").onchange = e => { if(!e.target.value) return; const [y,m,d] = e.target.value.split("-").map(Number); S.start = new Date(y, m-1, d).getTime(); save(); render(); };
  $("w1").onclick = () => { const d = new Date(); d.setHours(0,0,0,0); S.start = d.getTime(); save(); render(); toast("Bu hafta 1. hafta oldu."); };
  g.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { muscleFilter = b.dataset.m || null; renderGuide(); });
  bindList($("glist"));
}
function renderHistory(){
  const h = $("s-history");
  const items = S.history.slice().reverse();
  h.innerHTML = `<div class="card"><h4 style="font-size:15px">Özet</h4><p class="muted">Toplam ${S.history.length} seans · Şu an hafta ${week()} (${phase().name})</p></div>` +
    (items.length ? items.map(x => `<div class="hi"><div><b class="small">${x.day}</b><div class="tiny muted">${new Date(x.ts).toLocaleDateString("tr-TR",{day:"2-digit",month:"long",hour:"2-digit",minute:"2-digit"})}${x.week?` · H${x.week}`:""}${x.vol?` · ${x.vol} kg hacim`:""}</div></div><span class="pill g">${x.done}/${x.total}</span></div>`).join("")
      : `<p class="muted" style="text-align:center;padding:30px 10px">Henüz kayıt yok. Bir günü bitirip "Antrenmanı Bitir"e bas.</p>`);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
  document.querySelectorAll(".sec").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $("s-" + b.dataset.t).classList.add("on");
  openId = null; if(b.dataset.t === "guide") renderGuide(); if(b.dataset.t === "program") renderDay();
  window.scrollTo(0, 0);
});
render();
</script>
</body>
</html>
