*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--metin);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px;border-radius:4px}
.ust{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;background:var(--yuzey);border-bottom:1px solid var(--cizgi)}
.logo{font-weight:800;font-size:18px;color:var(--ink);letter-spacing:-.02em}
.sekmeler{display:flex;gap:2px}
.sekmeler button{padding:7px 12px;border-radius:7px;font-weight:600;color:var(--soluk);white-space:nowrap}
.sekmeler button:hover{background:var(--yuzey2);color:var(--ink)}
.sekmeler button[aria-selected=true]{background:var(--vurgu-yumusak);color:var(--vurgu)}
.ara{flex:1;max-width:340px;margin-left:auto;height:36px;padding:0 12px;border:1px solid var(--cizgi);border-radius:8px;background:var(--bg)}
.ikon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--soluk)}
.ikon:hover{background:var(--yuzey2);color:var(--ink)}
.durum{font-size:12px;color:var(--soluk);white-space:nowrap}
.durum.eski{color:var(--sicak);font-weight:600}
.duzen{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;padding:16px}
.yan{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto}
.yan h3{margin:14px 8px 5px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soluk)}
.yan h3:first-child{margin-top:0}
.yan button{display:flex;justify-content:space-between;width:100%;padding:6px 8px;border-radius:6px;text-align:left;font-weight:500}
.yan button:hover{background:var(--yuzey2)}

.kaynaklar li{display:flex;gap:8px;justify-content:space-between}
.kaynaklar a:hover{color:var(--vurgu)}
.kaynaklar span{flex-shrink:0;color:var(--soluk);font-size:12px}
.trend{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;align-items:center;font-size:13px}
.trend b{color:var(--soluk);font-weight:600;margin-right:3px}

.trend a:hover{border-color:var(--vurgu);color:var(--vurgu)}
.bos{padding:40px 16px;text-align:center;color:var(--soluk);background:var(--yuzey);border:1px dashed var(--cizgi);border-radius:10px}
.tablo{width:100%;border-collapse:collapse;background:var(--yuzey);border-radius:10px;overflow:hidden;font-size:13px}
.tablo th,.tablo td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--cizgi)}
.tablo th{font-size:11.5px;color:var(--soluk);text-transform:uppercase;letter-spacing:.05em}
.kaz{overflow-x:auto;border:1px solid var(--cizgi);border-radius:10px}
.alt{display:none}
.diger{display:flex;justify-content:center;margin-top:12px}
@media (max-width:860px){
 .duzen{grid-template-columns:minmax(0,1fr);padding:10px;padding-bottom:calc(68px + env(safe-area-inset-bottom))}

 .yan{position:static;max-height:none;min-width:0;display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin:0 -10px;padding-inline:10px;scrollbar-width:none}

 .alt{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset:auto 0 0;z-index:20;background:var(--yuzey);border-top:1px solid var(--cizgi);padding-bottom:env(safe-area-inset-bottom)}

遭遇独立网络攻击","l":"https://www.cnbeta.com.tw/articles/tech/1584740.htm","p":"cnBeta.COM","d":"2026-11-02T12:51:34+00:00","s":"乌克兰空军周日称，其 空袭警报（Air Alert）应用程序 遭到入侵，该应用向基辅以及其他地区推送了虚假核威胁、化学威胁警报。路透社消息，该应用短暂弹出核事故、化学事故警报，还推送了巷战爆发的警告。乌克兰空军表示，有未授权人员干扰应用运行，已临时关闭推送通知功能。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/6e4996daf987215.jpg"},{"t":"已灭绝数千年的巨鸟或从未消失 DNA研究推翻百年认知","l":"https://www.cnbeta.com.tw/articles/science/1584738.htm","p":"cnBeta.COM","d":"2026-11-02T12:46:45+00:00","s":"一项最新研究推翻了学术界延续超过150年的传统观点。科学家通过古DNA分析发现，一种长期被认为在上一个冰河时代结束后灭绝的巨型鸟类，实际上并不是一个已经消失的独立物种，而是今天仍生活在欧洲的一种现存鸟类的大型祖先个体。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/63c19bca66ef5da.jpg"},{"t":"法国拟对互联网流量征税 每传输1GB数据收费5.5欧分","l":"https://www.cnbeta.com.tw/articles/tech/1584736.htm","p":"cnBeta.COM","d":"2026-11-02T12:44:07+00:00","s":"法国正在考虑推出一项颇具争议的互联网流量税，计划按照内容提供商向法国用户传输的数据量征税，每传输1GB数据就需要缴纳0.055欧元（5.5欧分）。这项提案已经在法国国民议会下院以极其微弱的优势获得通过，但距离正式成为法律仍有相当长的程序。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0127/5a4ac672839f804.webp"},{"t":"Steam硬件调查：16GB内存重夺榜首 英特尔份额回升 Linux用户占比逼近4%","l":"https://www.cnbeta.com.tw/articles/game/1584734.htm","p":"cnBeta.COM","d":"2026-11-02T12:42:42+00:00","s":"Valve发布的2026年10月Steam硬件与软件调查结果显示，在经历9月份多项异常波动后，多项关键硬件统计出现明显回归。内存容量、显卡排名、处理器市场份额以及操作系统占比均出现新的变化，展现出当前PC游戏玩家硬件生态的最新格局。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/0b6e6d45f45fd63.jpg"},{"t":"韩国出口额逼近万亿美元大关 AI存储芯片热潮成最大推手","l":"https://www.cnbeta.com.tw/articles/tech/1584732.htm","p":"cnBeta.COM","d":"2026-11-02T12:31:01+00:00","s":"受全球人工智能产业持续扩张带动，韩国出口表现迎来历史性突破。韩国政府最新公布的数据显示，今年10月韩国出口额达到1152.8亿美元，同比增长93.7%，创下历史第二高单月纪录，仅次于9月份的表现。随着出口持续强劲增长，今年前10个月韩国累计出口额已达到9300亿美元，距离全年突破1万亿美元大关仅剩约700亿美元。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/7d5066d15666770.jpg"},{"t":"澳大利亚发现全新马陆物种 尘封90年的神秘生物终获确认","l":"https://www.cnbeta.com.tw/articles/science/1584730.htm","p":"cnBeta.COM","d":"2026-11-02T12:15:59+00:00","s":"科学家近日确认，一种近90年前在澳大利亚南部首次采集到的神秘马陆终于完成身份鉴定，并被认定为全新物种。研究团队将其命名为“Colobothrix deckeri”。这一发现不仅填补了长期以来的分类学空白，也颠覆了科学界对于该类马陆生态分布范围的既有认知。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/aaafd6ae50c8d70.jpg"},{"t":"树莓派大内存产品再次涨价 16GB型号最高上涨80美元","l":"https://www.cnbeta.com.tw/articles/tech/1584728.htm","p":"cnBeta.COM","d":"2026-11-02T12:10:16+00:00","s":"英国单板计算机制造商树莓派（Raspberry Pi）宣布，由于内存价格持续大幅上涨，公司不得不再次上调部分高内存产品的售价。其中，16GB版 Raspberry Pi 5 的价格将上调80美元，最新售价达到385美元；16GB版 Raspberry Pi Compute Module 5（计算模块5）则上涨40美元。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/fb2dec901830b15.webp"}]},"droidlife":{"name":"Droid Life","lang":"en","cat":"tech","plat":"web","url":"https://www.droid-life.com/feed/","updated":"2026-11-03T00:02:46.520162+00:00","items":[{"t":"Snapseed 4.2 Rolling Out: LUT Imports, Motion Blur, and More","l":"https://www.droid-life.com/2026/11/02/snapseed-4-2-rolling-out-lut-imports-motion-blur-and-more/","d":"2026-11-02T23:35:40+00:00","s":"Snapseed 4.2 is starting its gradual rollout today, bringing a handful of new features to users on both Android and iOS. The changelog mentions things like Motion Blur and Color Grading, but the big f","i":"https://www.droid-life.com/wp-content/uploads/2026/05/Snapseed-4-0-980x639.jpg"},{"t":"Wear OS 8 Status Bar: New Feature Confirmed by Google","l":"https://www.droid-life.com/2026/11/02/wear-os-8-status-bar-new-feature-confirmed-by-google/","d":"2026-11-02T19:48:59+00:00","s":"Google confirmed to developers this week that a status bar is coming to Wear OS . Available already in the Canary emulator for testing with apps, the status bar will always sit at the 12 o’clock posit","i":"https://www.droid-life.com/wp-content/uploads/2026/11/Wear-OS-8-980x523.jpg","c":"mobil"}]},"merlin":{"name":"Merlin'in Kazanı","lang":"tr","cat":"tech","plat":"web","url":"https://www.merlininkazani.com/feed/","updated":"2026-11-03T00:02:46.520162+00:00","items":[{"t":"id Software İşten Çıkarma Endişelerine Rağmen Gelecekten Umutlu","l":"https://www.merlininkazani.com/id-software-isten-cikarma-endiselerine-ragmen-g     '<h2>'+(S.sekme==='reels'?'<span class="sira">'+(i+1)+'</span>':'')+'<a href="'+x(c.l)+'" target="_blank" rel="noopener" data-okundu="'+c.id+'">'+x(c.t)+'</a></h2>'+
