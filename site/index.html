<style>

.zc{position:relative;margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--cz)}.zc li{position:relative;padding:0 0 9px 0;font-size:12.5px}.zc li:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--vg2)}.zc time{color:var(--sk);font-size:11.5px;display:block}
.bt{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.btn{padding:5px 10px;border:1px solid var(--cz);border-radius:7px;font-weight:650;font-size:12px;background:var(--yz)}.btn:hover{border-color:var(--vg);color:var(--vg)}.btn.p{background:var(--vg);border-color:var(--vg);color:var(--bg)}.btn.p:hover{color:var(--bg);opacity:.9}.btn[aria-pressed=true]{border-color:var(--vg);color:var(--vg);background:var(--vgy)}

.say-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:0 0 12px}.say-k button{padding:9px 10px;border:1px solid var(--cz);border-radius:9px;background:var(--yz);text-align:left}.say-k button[aria-pressed=true]{border-color:var(--vg)}.say-k b{display:block;font-size:20px;color:var(--ink);line-height:1.1}.say-k span{font-size:11.5px;color:var(--sk);font-weight:600}

pre.kod{margin:6px 0;padding:9px 11px;border-radius:8px;background:var(--yz2);overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx);white-space:pre-wrap;word-break:break-all}

 .rk-ust{grid-template-columns:54px minmax(0,1fr)}.rk-ust .puan{grid-column:1/3;width:auto;height:auto;padding:6px;flex-direction:row;gap:8px;justify-content:flex-start;font-size:16px}.rk dl{grid-template-columns:1fr}.rk dt{margin-top:4px}.kb-bar{grid-template-columns:110px 1fr 28px}
 .sag{width:100vw}.ol{grid-template-columns:repeat(2,auto)}
}

ps://sozcu01.sozcucdn.com/sozcu/production/uploads/images/2026/11/ataturkjpg-griSG0qs7EKub13l22eneQ.jpg"}]},"cnbeta":{"name":"cnBeta","lang":"zh","cat":"tech","plat":"web","url":"https://rss.cnbeta.com.tw/","updated":"2026-11-10T06:01:35.470118+00:00","items":[{"t":"微软新专利：让闲置游戏显卡参与AI训练 电脑用户或可获得现金报酬","l":"https://www.cnbeta.com.tw/articles/tech/1585710.htm","p":"cnBeta.COM","d":"2026-11-10T05:59:26+00:00","s":"微软正在探索一种利用普通消费者电脑闲置算力训练人工智能模型的方式。根据近日公开的一份专利申请，微软提出建立一个分布式计算网络，将大型AI模型训练任务拆分成大量小型任务，分配给处于空闲状态的游戏电脑、笔记本电脑，甚至智能手机。愿意提供设备算力的用户，则可能获得积分、免费软件、AI模型使用权限，甚至现金报酬。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/05a097f14cfe08e.jpg"},{"t":"Anthropic不顾科技股震荡坚持推进IPO 计划下周上市","l":"https://www.cnbeta.com.tw/articles/tech/1585708.htm","p":"cnBeta.COM","d":"2026-11-10T05:51:13+00:00","s":"人工智能公司Anthropic正在继续推进首次公开募股（IPO）计划。尽管近期美国科技股经历大幅抛售，人工智能行业的投资热情有所降温，同时英伟达CEO黄仁勋卷入的私人关系及间谍指控事件也令市场关注度上升，但Anthropic并未因此改变上市安排。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1106/4d40393e0264f02.png"},{"t":"加州拟征收亿万富豪一次性5%财富税遭否决 硅谷科技巨头投入数亿美元阻击","l":"https://www.cnbeta.com.tw/articles/tech/1585706.htm","p":"cnBeta.COM","d":"2026-11-10T05:49:43+00:00","s":"美国加利福尼亚州选民正式否决了一项备受争议的亿万富豪财富税提案。当地时间11月9日，美联社确认，编号为第40号提案（Proposition 40）的财富税计划未能获得通过。这项原本希望向加州最富有居民征收一次性5%财富税、为医疗保障体系筹集资金的计划，最终在激烈的政治和商业游说中宣告失败。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0122/52dbede36705277.png"},{"t":"黄仁勋早在2025年便聘请曾处理多起名人性丑闻的危机公关公司","l":"https://www.cnbeta.com.tw/articles/tech/1585704.htm","p":"cnBeta.COM","d":"2026-11-10T05:49:14+00:00","s":"英伟达首席执行官黄仁勋近期承认婚外情，并因此卷入与情报活动有关的争议。随着事件持续发酵，媒体调查发现黄仁勋早在至少一年前就已经聘请了一家专门处理公共关系危机的公关公司。这家公司过去曾协助多位知名男性应对性丑闻和个人声誉危机。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/5f6c7ec40fb919a.jpg"},{"t":"地中海深海中微子观测未发现相对论偏离 为物理定律设下新限制","l":"https://www.cnbeta.com.tw/articles/science/1585702.htm","p":"cnBeta.COM","d":"2026-11-10T05:48:04+00:00","s":"国际KM3NeT合作组利用地中海海底的ORCA中微子探测器，检验爱因斯坦相对论中的洛伦兹不变性。研究团队分析了持续1.4年的观测数据，共筛选出5828个大气中微子候选事件；结果没有发现这一基本对称性遭到破坏的迹象，但为若干可能的偏离设定了新的实验限制。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/a8f8c66b2d5e3fc.jpg"},{"t":"铁粉或改写清洁能源格局 科学家提出“新铁时代”能源方案","l":"https://www.cnbeta.com.tw/articles/science/1585700.htm","p":"cnBeta.COM","d":"2026-11-10T05:44:57+00:00","s":"德国卡尔斯鲁厄理工学院（KIT）研究团队近日发布最新研究成果指出，铁粉有望成为未来清洁能源体系中的重要组成部分。这种可循环利用的燃料不仅能够帮助储存和运输可再生能源，还可能让逐步退出历史舞台的燃煤电厂获得新的用途，在实现气候中和目标的同时提升电力系统稳定性。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/f6f84b3a554408c.jpg"},{"t":"恐龙时代的开花植物早已结出大型果实 而恐龙可能是重要的种子传播者","l":"https://www.cnbeta.com.tw/articles/science/1585698.htm","p":"cnBeta.COM","d":"2026-11-10T05:44:01+00:00","s":"一项最新古植物学研究发现，恐龙时代的开花植物可能比科学家此前认为的更加多样化。来自美国新墨西哥州的一处距今约7400万年的古森林化石，保存了大量果实、种子及其他植物繁殖结构，其中一些果实的尺寸竟然达到了现代葡萄大小。这意味着，在非鸟类恐龙灭绝之前，开花植物就已经发展出较为复杂的繁殖策略，而恐龙等大型动物可能早已参与植物种子的传播。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/e891c7fb578df56.jpg"},{"t":"Mozilla Firefox 160正式发布：新增40种语言离线语音转文字 全面支持MKV多种音频格式","l":"https://www.cnbeta.com.tw/articles/tech/1585696.htm","p":"cnBeta.COM","d":"2026-11-10T05:42:18+00:00","s":"Mozilla Firefox 160.0正式版发布。这是该浏览器按照双周更新节奏推出的最新稳定版本。本次更新带来了多项实用功能，其中最值得关注的是新增设备端实时语音识别能力，以及扩展了Matroska（MKV）视频容器的音频格式支持范围。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/adbe66212af4f6d.webp"},{"t":"机器人首次在太空自主搭建结构 DARPA验证轨道制造关键技术","l":"https://www.cnbeta.com.tw/articles/science/1585694.htm","p":"cnBeta.COM","d":"2026-11-10T05:41:08+00:00","s":"在人类迈向更大规模太空基础设施建设的道路上，一项重要里程碑近日诞生。由美国加州理工学院研发、美国国防高级研究计划局（DARPA）资助的一台机器人，成功在轨道上完成结构组装任务，被研究团队称为人类首次实现太空中的自主结构建造。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/7afc4fcfe4587d5.webp"},{"t":"澳航空客A350-1000ULR创商业航空新纪录 连续飞行24小时24分钟 航程2.3万公里","l":"https://www.cnbeta.com.tw/articles/tech/1585692.htm","p":"cnBeta.COM","d":"2026-11-10T05:39:11+00:00","s":"澳洲航空（Qantas）的一架空客A350-1000ULR超远程客机，正式创造了商业航空史上最长的不间断飞行距离纪录。从澳大利亚墨尔本起飞后，飞机连续飞行24小时24分钟，最终抵达法国图卢兹，航程达到23155公里。这一纪录已经获得国际航空联合会（FAI）核实，并被吉尼斯世界纪录收录。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/ef7a0f7068d322c.webp"},{"t":"范德堡大学疑遭勒索软件攻击 百万级敏感信息或面临泄露风险","l":"h /* ---- yardımcılar ---- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function dAd(d){return (DURUMLAR.filter(function(x){return x[0]===d})[0]||[0,d])[1]}
function listeHtml(arr,adet){

  return ic}

/* ---- süzgeç ---- */
var PEN={'1':1,'6':6,'24':24,'72':72,'168':168};
function suz(arr,opt){
  opt=opt||{};var now=Date.now()/1000,q=S.q?fold(S.q).split(/\s+/).filter(Boolean):null;
  return arr.filter(function(c){
    if(!opt.gizliGoster&&gizli[c.id])return false;
    if(S.zaman!=='hepsi'){
      if(S.zaman==='ozel'){var b=S.zBas?Date.parse(S.zBas)/1000:0,s=S.zSon?Date.parse(S.zSon+'T23:59:59')/1000:1e12;if(c.son<b||c.son>s)return false}
      else if(now-c.son>PEN[S.zaman]*3600)return false}
    var dk=Object.keys(S.dil).filter(function(k){return S.dil[k]});
    if(dk.length){var ok=false;(c.diller||[c.dil]).forEach(function(d){var kk=['tr','en','zh','de','fr','ja','ko','ar'].indexOf(d)>=0?d:'x';if(S.dil[kk])ok=true});if(!ok)return false}
    if(S.alt&&!((c.alt&&c.alt[S.alanKey||S.alan]||[]).indexOf(S.alt)>=0||(c.gundem_alt||[]).indexOf(S.alt)>=0))return false;
    if(S.ek){var ek=[].concat(c.ul||[],c.ld||[],c.mk||[]);if(ek.indexOf(S.ek)<0)return false}
    if(S.kapsam==='tr'&&!((c.gundem_alt||[]).indexOf('turkiye')>=0||c.dil==='tr'))return false;
    if(S.kapsam==='dunya'&&(c.gundem_alt||[]).indexOf('turkiye')>=0)return false;
    if(S.kapsam==='federasyon'&&!/federasyon|TFF|TBF|TVF|UEFA|FIFA|NBA|ATP|WTA|Olympic|Olimpiyat/.test((c.kaynaklar||[]).join(' ')+' '+c.t))return false;
    if(q){var m=fold(c.t+' '+(c.s||'')+' '+(c.kaynaklar||[]).join(' '));for(var i=0;i<q.length;i++)if(m.indexOf(q[i])<0)return false}
    return true})}
