<style>
/* Akış 8 — Modern Komuta Merkezi; tek vurgu rengi; açık/koyu tema light-dark() ile */
:root{color-scheme:light dark;
 --bg:light-dark(#f4f5f7,#0b0d11);--yuz:light-dark(#ffffff,#13161d);--yuz2:light-dark(#eceef2,#1b2029);--cz:light-dark(#e1e4ea,#252b37);--cz2:light-dark(#cdd2dc,#333b4a);
 --yaz:light-dark(#111318,#edf0f5);--ik:light-dark(#4e5564,#9ca5b5);--ik2:light-dark(#6b7280,#7e8799);
 --sc:light-dark(#c4281c,#ff8470);--sc-z:light-dark(#fce9e7,#341a16);--ye:light-dark(#0f764a,#4fd698);--ye-z:light-dark(#dff4ea,#112f20);--sa:light-dark(#8a5300,#f2bd52);--sa-z:light-dark(#fcf0d8,#312512);
 --vr-a:#0b6b66;--vr-k:#3fd0c2;--vr:light-dark(var(--vr-a),var(--vr-k));--vr-y:light-dark(#fff,#06211e);--vr-z:color-mix(in oklab,var(--vr) 13%,var(--yuz));--toast-vr:light-dark(var(--vr-k),var(--vr-a));
 --gl:0 1px 3px rgb(17 19 24/.06),0 8px 24px rgb(17 19 24/.07);--gl-k:0 1px 2px rgb(17 19 24/.05);--r1:8px;--r2:12px;--r3:14px;--ust:56px;--panel:440px;
 --a-gundem:#c2410c;--a-adana:#b45309;--a-tekno:#0369a1;--a-yz:#7c3aed;--a-siyaset:#be123c;--a-spor:#15803d;--a-ekonomi:#a16207;--a-bilim:#0e7490;--a-siber:#4d7c0f;--a-oto:#64748b;--a-oyun:#c026d3;--a-eglence:#db2777;--a-savunma:#787236}
:root[data-tema=acik]{color-scheme:light}:root[data-tema=koyu]{color-scheme:dark}
:root[data-vurgu=kehribar]{--vr-a:#a34a04;--vr-k:#f5a524}:root[data-vurgu=mor]{--vr-a:#5546d6;--vr-k:#a69cff}:root[data-vurgu=klasik]{--vr-a:#2a5fd8;--vr-k:#7aa2ff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--ust) + 8px)}
body{margin:0;background:var(--bg);color:var(--yaz);font:15.5px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4{text-wrap:balance}
:focus-visible{outline:2px solid var(--vr);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.gizli-m{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
/* üst çubuk */
.ust{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--yuz) 88%,transparent);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--cz)}
.ust-i{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:4px;height:var(--ust);padding:0 18px}
.logo{font-weight:750;font-size:18.5px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px;margin-right:12px;flex:none}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--vr);display:inline-grid;place-items:center}
.logo i svg{width:16px;height:16px;stroke:var(--vr-y);stroke-width:2.6;fill:none;stroke-linecap:round}
.ana-nav{display:flex;gap:2px}
.ana-nav a,.ana-nav button{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:var(--r1);font-size:14.5px;color:var(--ik);font-weight:550;white-space:nowrap;transition:background .12s,color .12s}
.ana-nav a:hover,.ana-nav button:hover{color:var(--yaz);background:var(--yuz2)}
.ana-nav [aria-current=page],.ana-nav .on{color:var(--vr);background:var(--vr-z);font-weight:620}
.bos{flex:1}
.saat{font-size:12.5px;color:var(--ik);display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--yuz2);white-space:nowrap;margin-right:4px}
.nokta{width:7px;height:7px;border-radius:50%;background:var(--ye);display:inline-block;flex:none}
.nokta.sa{background:var(--sa)}.nokta.sc{background:var(--sc)}
.ara-b{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 12px;border-radius:10px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--cz);color:var(--ik);font-size:13.5px;min-width:220px;transition:box-shadow .12s}
.ara-b:hover{box-shadow:inset 0 0 0 1px var(--cz2)}
kbd,.kbd{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--cz2);border-radius:5px;padding:0 5px;color:var(--ik2);background:var(--yuz)}
.ara-b kbd{margin-left:auto}
.ik-b{width:38px;height:38px;border-radius:var(--r1);display:inline-grid;place-items:center;color:var(--ik);flex:none}
.ik-b:hover{background:var(--yuz2);color:var(--yaz)}
.ik-b.on{color:var(--vr)}
.yeni-veri{white-space:nowrap;position:fixed;top:calc(var(--ust) + 10px);left:50%;transform:translateX(-50%);z-index:40;background:var(--vr);color:var(--vr-y);border-radius:99px;padding:9px 18px;font-size:14px;font-weight:600;box-shadow:var(--gl)}
/* hızlı kategori şeridi */
.kat-bar{background:var(--yuz);border-bottom:1px solid var(--cz)}
.kat-bar-i{max-width:1320px;margin:0 auto;padding:7px 18px;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.kat-bar-i::-webkit-scrollbar{display:none}
.kat-cip{flex:none;position:relative;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:99px;font-size:13px;font-weight:550;color:var(--ik);background:var(--bg);box-shadow:inset 0 0 0 1px var(--cz);white-space:nowrap;transition:background .12s,color .12s}
.kat-cip:hover{color:var(--yaz);box-shadow:inset 0 0 0 1px var(--cz2)}
.kat-cip[aria-current=page],.kat-cip.on{background:var(--yaz);color:var(--bg);box-shadow:none}
.kat-cip small{opacity:.72;font-size:11.5px}
/* yerleşim */
.ana{max-width:1320px;margin:0 auto;padding:22px 18px 120px}
.sayfa{max-width:840px;margin:0 auto}
.sayfa.genis{max-width:1320px}
.iki{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:30px;align-items:start;max-width:1320px;margin:0 auto}
.ray{position:sticky;top:calc(var(--ust) + 20px);display:flex;flex-direction:column;gap:18px}
.bas{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 18px;flex-wrap:wrap}
.bas-e{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.bas h1{font-size:28px;line-height:1.12;letter-spacing:-.03em;margin:0;font-weight:750}
.bas p{margin:5px 0 0;color:var(--ik);font-size:14px}
.bolum{margin:0 0 28px}
.bolum-b{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.bolum-b h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ik);margin:0;font-weight:700}
.bolum-b .sag-l{margin-left:auto;font-size:13.5px;color:var(--vr);font-weight:600;white-space:nowrap}
.bilgi{font-size:13.5px;color:var(--ik)}
.an{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none;background:var(--ik2)}
/* satır (Akış görünümü varsayılan — Yön B kart-satır hibriti) */
.liste{display:flex;flex-direction:column;background:var(--yuz);border-radius:var(--r3);box-shadow:var(--gl-k),inset 0 0 0 1px var(--cz);overflow:hidden}
.sat{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"m g";column-gap:14px;padding:13px 16px;margin:0;border-radius:0;cursor:pointer;position:relative;content-visibility:auto;contain-intrinsic-size:auto 98px;transition:background .1s}
.sat+.sat:before{content:"";position:absolute;left:16px;right:16px;top:0;border-top:1px solid var(--cz)}
.sat:hover,.sat.imlec{background:var(--yuz2)}
.sat:hover:before,.sat.imlec:before,.sat:hover+.sat:before,.sat.imlec+.sat:before,.sat.secili:before,.sat.secili+.sat:before{border-color:transparent}
.sat.secili{background:var(--vr-z)}
.sat-g{grid-area:g;width:96px;height:66px;border-radius:var(--r1);object-fit:cover;background:var(--yuz2);display:block}
.sat-m{grid-area:m;min-width:0}
.sat-u{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ik);min-width:0;white-space:nowrap;margin:0 0 4px}
.sat-u .kn{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;color:var(--yaz);font-weight:600}
.sat-u>*{flex:none}
.sat-u .ks{font-size:12px}
.sat-u .ks b{display:inline-flex;align-items:center;padding:0 7px;border-radius:99px;background:var(--vr-z);color:var(--vr);font-weight:650;line-height:1.65}
/* satır sınırı bağlantının kendisinde: odak geri dönünce başlık kutusu kaymasın */
.sat-t{font-size:16.5px;line-height:1.34;font-weight:640;margin:0;letter-spacing:-.014em;overflow-wrap:anywhere}
.sat-t a,.dk-t a{color:inherit;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sat.ok .sat-t{color:var(--ik);font-weight:500}
.sat-o{font-size:14px;color:var(--ik);margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yeni-n{position:absolute;left:5px;top:21px;width:6px;height:6px;border-radius:50%;background:var(--vr)}
.sat-e{position:absolute;right:10px;bottom:8px;display:flex;opacity:0;background:var(--yuz);border-radius:var(--r1);box-shadow:0 0 0 1px var(--cz),0 4px 12px rgb(0 0 0/.1)}
.sat:hover .sat-e,.sat.imlec .sat-e,.sat:focus-within .sat-e{opacity:1}
.sat-e .ik-b{width:34px;height:34px}
.sat-e .on{opacity:1}
.sat-el{display:none}
.sat-t,.sat-o,.manset h2,.manset p,.dk-t,.dk-u b,.tr-c b,.tr-t,.mini .t,.rk-t,.rk-aci,.rk-neden,.rk-ayr,.rk-gor,.vk-t,.vk-u span,.p-t,.p-o,.kay .kt,.kp,.kn,.dil-k b,.k-item-u a,.tbl td b,.ara-s .t,.ara-s .a,.cip,.hook span,[dir="auto"]{unicode-bidi:isolate}
.kaydir-sag{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.et{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:620;padding:1px 7px;border-radius:99px;background:var(--yuz2);color:var(--ik);white-space:nowrap;line-height:1.6}
.et.vr{background:var(--vr-z);color:var(--vr)}.et.sc{background:var(--sc-z);color:var(--sc)}.et.ye{background:var(--ye-z);color:var(--ye)}.et.sa{background:var(--sa-z);color:var(--sa)}
.et.dl{background:none;box-shadow:inset 0 0 0 1px var(--cz2);font:650 10.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em;text-transform:uppercase;padding:0 5px;border-radius:5px}
.et.dl.cok{color:var(--vr);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--vr) 45%,transparent)}
mark{background:var(--sa-z);color:inherit;border-radius:3px;padding:0 2px}

.g-basliklar .gv .sat{grid-template-columns:minmax(0,1fr);grid-template-areas:"m";padding:9px 14px;contain-intrinsic-size:auto 62px}
.g-basliklar .gv .sat-g,.g-basliklar .gv .sat-o,.g-basliklar .gv .sat-e{display:none}
.g-basliklar .gv .sat-t{font-size:15px;font-weight:580}.g-basliklar .gv .sat-t a{-webkit-line-clamp:2}
.g-basliklar .gv .sat-u{font-size:12px;margin:0 0 2px}
/* Kartlar görünümü */
.g-kartlar .gv.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,255px),1fr));gap:14px;background:none;box-shadow:none;overflow:visible;border-radius:0}
.g-kartlar .gv .sat{display:flex;flex-direction:column;margin:0;padding:0;border-radius:var(--r3);overflow:hidden;background:var(--yuz);box-shadow:var(--gl-k),inset 0 0 0 1px var(--cz);contain-intrinsic-size:auto 320px}
.g-kartlar .gv .sat:before{display:none}
.g-kartlar .gv .sat:hover,.g-kartlar .gv .sat.imlec{box-shadow:var(--gl),inset 0 0 0 1px var(--cz2);background:var(--yuz)}
.g-kartlar .gv .sat.secili{box-shadow:inset 0 0 0 2px var(--vr);background:var(--yuz)}
.g-kartlar .gv .sat-g{order:-1;width:100%;height:auto;aspect-ratio:16/9;border-radius:0}
.g-kartlar .gv .sat-m{padding:12px 14px 14px}
.g-kartlar .gv .sat-t{font-size:15.5px}.g-kartlar .gv .sat-t a{-webkit-line-clamp:4}
.g-kartlar .gv .sat-o{font-size:13.5px;-webkit-line-clamp:3}
.g-kartlar .gv .sat-e{top:6px;bottom:auto;background:color-mix(in srgb,var(--yuz) 90%,transparent);border-radius:var(--r1)}
.g-kartlar .gv .yeni-n{left:8px;top:8px;z-index:1;width:8px;height:8px;box-shadow:0 0 0 2px var(--yuz)}
.gorselsiz .sat-g:not(.p-g){display:none}
/* çipler, segment, düğmeler */
.serit{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin:0 0 10px;overscroll-behavior-x:contain}
.serit::-webkit-scrollbar{display:none}
.cip{flex:none;position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);font-size:13.5px;font-weight:530;white-space:nowrap}
.cip:hover{box-shadow:inset 0 0 0 1px var(--cz2)}
.cip.on,.cip[aria-pressed=true]{background:var(--yaz);color:var(--bg);box-shadow:none}

.cip .an{margin-right:1px}
.seg{display:inline-flex;background:var(--yuz2);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none;flex:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:550;color:var(--ik);white-space:nowrap;flex:none}
.seg button.on{background:var(--yuz);color:var(--yaz);box-shadow:0 1px 2px rgb(0 0 0/.1)}
.seg small{font-size:11.5px;opacity:.8}
.arac{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.arac select,.sec{height:36px;border-radius:10px;border:1px solid var(--cz);background:var(--yuz);padding:0 10px;font-size:14px;max-width:100%}
.tg{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:540;color:var(--ik);height:36px;padding:0 12px;border-radius:10px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);white-space:nowrap}
.tg:hover{color:var(--yaz);box-shadow:inset 0 0 0 1px var(--cz2)}
.tg.on{color:var(--vr);background:var(--vr-z);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--vr) 40%,transparent)}
.dg{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:10px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);font-size:14px;font-weight:560;white-space:nowrap}
.dg:hover{box-shadow:inset 0 0 0 1px var(--cz2)}
.dg.ana-d{background:var(--vr);color:var(--vr-y);box-shadow:none}
.dg.on{background:var(--vr-z);color:var(--vr);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--vr) 40%,transparent)}
.daha{display:block;width:100%;height:48px;border-radius:var(--r2);background:var(--yuz);box-shadow:var(--gl-k),inset 0 0 0 1px var(--cz);font-weight:580;margin-top:14px;color:var(--ik)}
.daha:hover{color:var(--yaz);box-shadow:inset 0 0 0 1px var(--cz2)}
.bosluk{padding:44px 16px;text-align:center;color:var(--ik);background:var(--yuz);border-radius:var(--r3);box-shadow:inset 0 0 0 1px var(--cz)}
.bosluk-eylem{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.iskelet{height:76px;border-radius:var(--r2);background:linear-gradient(90deg,var(--yuz) 0,var(--yuz2) 50%,var(--yuz) 100%);background-size:200% 100%;animation:isk 1.2s infinite;margin:10px 0}
@keyframes isk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.iskelet{animation:none}}
.sayac{font-size:13.5px;color:var(--ik);margin:2px 0 6px}.sayac b{color:var(--yaz)}
.suz-b{display:none}
/* Bugün */
.manset{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:center;padding:16px;margin:0 0 16px;border-radius:var(--r3);background:var(--yuz);box-shadow:var(--gl),inset 0 0 0 1px var(--cz);cursor:pointer;transition:box-shadow .12s}
.manset:hover{box-shadow:var(--gl),inset 0 0 0 1px var(--cz2)}
.manset img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r2);background:var(--yuz2);display:block}
.manset h2{font-size:clamp(21px,2.4vw,27px);line-height:1.18;letter-spacing:-.026em;margin:6px 0 9px;font-weight:740}
.manset h2 a{color:inherit}
.manset p{margin:0;color:var(--ik);font-size:14.5px;line-height:1.48}
.manset.gorselsiz-m{grid-template-columns:minmax(0,1fr)}
.manset.secili{box-shadow:inset 0 0 0 2px var(--vr)}
.manset.secili h2{color:var(--vr)}
.tr-serit{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.tr-serit::-webkit-scrollbar{display:none}
.tr-c{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:var(--r2);background:var(--yuz);box-shadow:var(--gl-k),inset 0 0 0 1px var(--cz);text-align:left;max-width:230px}
.tr-c:hover{box-shadow:inset 0 0 0 1px var(--cz2)}
.tr-c b{font-size:14.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.tr-c span{font-size:12px;color:var(--ik)}
.tr-c.firsat{box-shadow:inset 0 0 0 1px var(--sc-z),inset 3px 0 0 var(--sc)}
.kutu{background:var(--yuz);border-radius:var(--r3);box-shadow:var(--gl-k),inset 0 0 0 1px var(--cz);padding:15px 17px}
.mini{display:flex;flex-direction:column}
.mini>a,.mini>button{display:flex;gap:10px;align-items:baseline;padding:9px 0;text-align:left;font-size:14.5px;width:100%;min-height:40px}
.mini>*+*{border-top:1px solid var(--cz)}
.mini .n{color:var(--ik);font-size:12.5px;width:56px;flex:none}
.mini .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .sn{color:var(--ik);font-size:12.5px;flex:none}
.mini>a:hover .t,.mini>button:hover .t{color:var(--vr)}
.dunya-serit{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,270px);gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.dunya-serit::-webkit-scrollbar{display:none}
.dk{display:flex;flex-direction:column;gap:6px;padding:13px 15px;border-radius:var(--r2);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);cursor:pointer;min-height:124px;min-width:0}
.dk:hover{box-shadow:inset 0 0 0 1px var(--ik2)}
.dk-u{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--ik);white-space:nowrap}
.dk-u b{font-size:14px;color:var(--yaz)}
.dk-t{font-size:15px;line-height:1.38;font-weight:600;margin:0}
.dk-a{margin-top:auto;font-size:12.5px;color:var(--ik);display:flex;gap:10px}
.dk-a a{color:var(--vr);margin-left:auto}
.sik .sat{padding:10px 12px;contain-intrinsic-size:auto 66px;grid-template-columns:minmax(0,1fr);grid-template-areas:"m"}
.sik .sat-t{font-size:15.5px}.sik .sat-t a{-webkit-line-clamp:2}
.sik .sat-g,.sik .sat-o{display:none}
/* Akış alan başlıkları */
.alan-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;border-bottom:1px solid var(--cz)}
.alan-nav::-webkit-scrollbar{display:none}
.alan-nav a{flex:none;display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 12px;font-size:15px;font-weight:550;color:var(--ik);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.alan-nav a:hover{color:var(--yaz)}
.alan-nav a[aria-current=page]{color:var(--yaz);border-bottom-color:var(--vr)}
.alan-nav small{font-size:12px;color:var(--ik2);font-weight:500}
.alt-nav-s{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px}
.alt-nav-s::-webkit-scrollbar{display:none}
.alt-nav-s a{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;font-size:14px;color:var(--ik);box-shadow:inset 0 0 0 1px var(--cz);white-space:nowrap;position:relative}
.alt-nav-s a[aria-current=page]{background:var(--vr-z);color:var(--vr);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--vr) 35%,transparent);font-weight:600}
.konu-s{margin:0 0 10px}
.konu-s .cip{height:30px;font-size:13px;padding:0 11px;background:none}
.konu-s .cip.on{background:var(--yaz)}
/* trend */
.tr-s{display:flex;gap:14px;align-items:center;padding:13px 16px;margin:0;border-radius:var(--r2);cursor:pointer;position:relative}
.tr-s+.tr-s:before{content:"";position:absolute;left:16px;right:16px;top:0;border-top:1px solid var(--cz)}
.tr-s:hover,.tr-s.imlec{background:var(--yuz)}
.tr-s.secili{background:var(--vr-z)}
.tr-h{width:74px;flex:none;font-weight:700;font-size:15px}
.tr-h small{display:block;font-size:11.5px;color:var(--ik);font-weight:500}
.tr-s.son .tr-t,.tr-s.son .tr-h{color:var(--ik)}
.tr-m{flex:1;min-width:0}
.tr-t{font-size:16.5px;font-weight:600;margin:0 0 3px;overflow-wrap:anywhere}
.tr-a{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--ik);align-items:center}
.spark{width:64px;height:24px;flex:none}
.spark polyline{fill:none;stroke:var(--vr);stroke-width:1.6}
/* reels */
.rk-liste{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.rk{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:var(--r3);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);cursor:pointer;position:relative;min-width:0}
.rk:hover,.rk.imlec{box-shadow:inset 0 0 0 1px var(--ik2)}
.rk.secili{box-shadow:inset 0 0 0 2px var(--vr)}
.rk-u{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ik);padding-right:40px}
.rk-t{margin:0;font-size:18px;line-height:1.3;letter-spacing:-.018em;font-weight:680;overflow-wrap:anywhere}
.rk-t a{color:inherit}
.rk-et{margin:2px 0 -4px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--vr)}
.rk-aci{margin:0;font-size:13px;color:var(--ik)}
.rk-neden,.rk-ayr,.rk-gor{margin:0;font-size:13.5px;color:var(--ik)}
.rk-neden b,.rk-ayr b,.rk-gor b{color:var(--yaz);font-weight:600}
.rk-okx{display:flex;gap:8px;flex-wrap:wrap}
.rk-okx .dg{flex:1 1 auto;min-height:40px;font-size:13px}
.rk-hooks{margin-top:-2px}
.guc{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;color:var(--vr)}
.guc i{width:7px;height:7px;border-radius:2px;background:var(--cz)}
.guc i.on{background:var(--vr)}
.rk .kay-b{position:absolute;top:10px;right:10px}
.hook{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 12px;border-radius:10px;background:var(--yuz2);font-size:14.5px}
.hook span{flex:1;min-width:0}
.hook .dg{min-height:34px;padding:0 10px;font-size:13px;background:var(--yuz)}
.rk details summary,#panel details summary{font-size:13px;color:var(--ik);cursor:pointer;padding:4px 0;list-style:none}
.rk details summary::-webkit-details-marker,#panel details summary::-webkit-details-marker{display:none}
.rk details summary:before,#panel details summary:before{content:"▸ "}.rk details[open] summary:before,#panel details[open] summary:before{content:"▾ "}
.kr{display:grid;grid-template-columns:minmax(0,150px) 1fr 30px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.kr i{height:6px;border-radius:9px;background:var(--yuz2);position:relative;overflow:hidden}
.kr i:after{content:"";position:absolute;inset:0;width:var(--w);background:var(--vr);border-radius:9px}
/* videolar */
.vliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.vk{position:relative;border-radius:var(--r3);overflow:hidden;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);min-width:0}
.vk:hover{box-shadow:inset 0 0 0 1px var(--ik2)}
.vk-a{display:block}
.vk-g{display:block;position:relative;aspect-ratio:16/9;background:var(--yuz2)}
.vk-g img{width:100%;height:100%;object-fit:cover;display:block}
.vk-k{position:absolute;left:8px;bottom:8px;background:#c8102e;color:#fff;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px}
.vk-m{display:block;padding:11px 13px 13px}
.vk-t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.vk-u{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--ik);margin-top:6px}
.vk-konu{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--vr);background:var(--vr-z);padding:2px 8px;border-radius:7px}
.vk .kay-b{position:absolute;top:6px;right:6px;background:color-mix(in srgb,var(--yuz) 90%,transparent)}
/* Dünya */
.dil-ray{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 18px}
.dil-k{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:11px 13px;border-radius:var(--r2);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);text-align:left;min-width:0}
.dil-k:hover{box-shadow:inset 0 0 0 1px var(--ik2)}
.dil-k.on{box-shadow:inset 0 0 0 2px var(--vr);background:var(--vr-z)}
.dil-k b{font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dil-k span{font-size:12.5px;color:var(--ik)}
.dil-k i{font-style:normal;font-size:12px;color:var(--ik2)}
/* tablo, sayılar ve Kaynak Merkezi */
.tbl-kap{background:var(--yuz);border-radius:var(--r3);box-shadow:var(--gl-k),inset 0 0 0 1px var(--cz);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.tbl th{text-align:left;font-size:11.5px;color:var(--ik);font-weight:650;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--cz);background:var(--yuz2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--cz);vertical-align:top;overflow-wrap:anywhere}
.tbl tr:last-child td{border-bottom:0}
.tbl td.s{color:var(--ik)}
.tbl col.c1{width:auto}.tbl col.c2{width:130px}.tbl col.c3{width:140px}.tbl col.c4{width:70px}.tbl col.c5{width:100px}
.sayilar{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 16px}
.sayi{background:var(--yuz);border-radius:var(--r2);box-shadow:var(--gl-k),inset 0 0 0 1px var(--cz);padding:12px 14px;text-align:left;transition:box-shadow .12s}
.sayi:hover{box-shadow:inset 0 0 0 1px var(--cz2)}
.sayi b{display:block;font-size:22px;letter-spacing:-.025em;line-height:1.1}
.sayi span{font-size:12.5px;color:var(--ik);display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.sayi.on{box-shadow:inset 0 0 0 2px var(--vr)}
.k-filtre{background:var(--yuz);border-radius:var(--r3);box-shadow:var(--gl-k),inset 0 0 0 1px var(--cz);padding:14px 16px;margin:0 0 16px;display:flex;flex-direction:column;gap:10px}
.k-suz-ek{display:flex;flex-direction:column;gap:10px}
.k-frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.k-flbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ik2);width:70px;flex:none}
.k-frow .serit{margin:0;flex:1;min-width:0}
.k-grup{margin:0 0 16px;background:var(--yuz);border-radius:var(--r3);box-shadow:var(--gl-k),inset 0 0 0 1px var(--cz);overflow:hidden}
.k-grup-h{display:flex;align-items:center;gap:8px;padding:11px 16px;background:var(--yuz2);border-bottom:1px solid var(--cz)}
.k-grup-h h2{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;color:var(--yaz)}
.k-grup-h .say{margin-left:auto;font-size:12.5px;color:var(--ik)}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:1px;background:var(--cz)}
.k-item{background:var(--yuz);padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0;transition:background .1s}
.k-item:hover{background:var(--bg)}
.k-item-u{display:flex;align-items:center;gap:6px;min-width:0}
.k-item-u a{font-size:14px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.k-item-u a:hover{color:var(--vr)}
.k-onc{margin-left:auto;font-size:11px;font-weight:650;padding:1px 6px;border-radius:5px;background:var(--yuz2);color:var(--ik);flex:none}
.k-onc.p1{background:var(--vr-z);color:var(--vr)}
.k-item-m{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--ik)}
.k-item-a{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ik2);margin-top:auto;padding-top:2px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.form label{font-size:13px;color:var(--ik);display:flex;flex-direction:column;gap:4px}
.inp,.form input,.form select{height:40px;border-radius:10px;border:1px solid var(--cz);background:var(--bg);padding:0 10px;font-size:15px;width:100%}
pre.kod{background:var(--yuz2);border-radius:10px;padding:12px;font-size:12.5px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
details.kutu>summary{cursor:pointer;list-style:none}
details.kutu>summary::-webkit-details-marker{display:none}
/* ayrıntı paneli: geniş ekranda sağ sütun (kipsiz), dar ekranda tam ekran (kipli) */
#panel{position:fixed;inset:var(--ust) 0 0 auto;width:var(--panel);height:auto;max-height:none;max-width:100%;margin:0;padding:0;border:0;background:var(--yuz);color:var(--yaz);box-shadow:-1px 0 0 var(--cz);overflow-y:auto;overscroll-behavior:contain;z-index:25}
#panel:modal{inset:0 0 0 auto;width:min(600px,100%);height:100%;box-shadow:var(--gl);z-index:auto}
body:not(.uc) #panel:not(:modal){box-shadow:var(--gl),-1px 0 0 var(--cz)}
#panel::backdrop{background:rgb(0 0 0/.32);overflow:hidden;overscroll-behavior:contain}
@media (prefers-reduced-motion:no-preference){#panel:modal[open]{animation:yuk .2s ease-out}@keyframes yuk{from{transform:translateY(16px);opacity:.4}}}
.p-i{padding:0 24px 64px}
.p-ust{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--yuz);padding:10px 24px;margin:0 -24px 14px;border-bottom:1px solid var(--cz);z-index:2;font-size:13px;color:var(--ik);min-height:56px}
.p-ust .an{margin-right:-2px}
.p-t{font-size:24px;line-height:1.24;letter-spacing:-.022em;margin:8px 0 10px;font-weight:700;overflow-wrap:anywhere}
.p-g{width:100%;border-radius:var(--r2);aspect-ratio:16/9;object-fit:cover;background:var(--yuz2);margin:2px 0 12px;display:block}
.p-o{color:var(--ik);margin:0 0 14px;font-size:15.5px}
.p-a{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;color:var(--ik);margin:0 0 16px;align-items:center}
.p-a b{color:var(--yaz)}
.eylem{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.p-b{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ik);margin:24px 0 8px;font-weight:650}
.kay a,.kay div{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--cz);font-size:14.5px;align-items:baseline}
.kay>:first-child{border-top:0}
.kay a:hover .kt{color:var(--vr)}
.kay .kp{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kay .kt{min-width:0;overflow-wrap:anywhere}
.kay .kz{color:var(--ik);font-size:12.5px;white-space:nowrap}
.not{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--cz);background:var(--bg);padding:10px 12px;resize:vertical;font-size:15px}
.rnot{background:var(--vr-z);border-radius:var(--r2);padding:13px 15px;font-size:14.5px}
.rnot b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--vr);margin:10px 0 2px}
.rnot b:first-child{margin-top:0}
.p-bos{color:var(--ik);font-size:14.5px;padding:48px 0}
.p-bos h2{font-size:17px;color:var(--yaz);margin:0 0 8px}
/* diyaloglar */
dialog.dlg{border:0;padding:0;background:var(--yuz);color:var(--yaz);box-shadow:var(--gl);border-radius:var(--r3);max-height:min(82dvh,760px);width:min(680px,calc(100% - 32px));max-width:none}
dialog.dlg:modal{overscroll-behavior:contain}
dialog.dlg::backdrop{background:rgb(0 0 0/.32);overflow:hidden;overscroll-behavior:contain}
dialog.dlg[open]{display:flex;flex-direction:column}
.dlg-u{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 20px;border-bottom:1px solid var(--cz)}
.dlg-u h2{font-size:17px;margin:0;flex:1}
.dlg-i{overflow-y:auto;padding:6px 20px 24px;overscroll-behavior:contain}
#arama{margin-top:9vh}
.ara-u{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--cz);padding:0 8px 0 6px}
.ara-u input{border:0;outline:0;background:none;font-size:18px;padding:16px 8px;flex:1;min-width:0}
.ara-s{overflow-y:auto;padding:6px}
.ara-s button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
.ara-s button.on,.ara-s button:hover{background:var(--yuz2)}
.ara-s .t{font-size:15px;font-weight:550;display:block;overflow-wrap:anywhere}
.ara-s .a{font-size:12.5px;color:var(--ik)}
.ara-ip{padding:14px 16px;color:var(--ik);font-size:14px}
#dahaSayfa{margin:auto auto 0;width:100%;max-width:560px;border-radius:var(--r3) var(--r3) 0 0;padding-bottom:env(safe-area-inset-bottom)}
.daha-l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:14px 16px 18px}
.daha-l a,.daha-l button{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 14px;border-radius:var(--r2);background:var(--bg);box-shadow:inset 0 0 0 1px var(--cz);font-size:15px;font-weight:550;text-align:left}
.daha-l [aria-current=page]{box-shadow:inset 0 0 0 2px var(--vr);color:var(--vr)}
#ayarD{width:min(620px,calc(100% - 32px))}
#okxD{width:min(560px,calc(100% - 32px))}
#okxO{width:min(680px,calc(100% - 32px))}
#okxO .okx-oto li{flex-direction:column;align-items:stretch;gap:6px}
#okxD textarea,#okxO textarea{width:100%;min-height:150px;resize:vertical;font:inherit;line-height:1.45;padding:12px;border-radius:var(--r2);background:var(--bg);color:var(--yaz);box-shadow:inset 0 0 0 1px var(--cz)}
#okxD .okx-s,#okxO .okx-s{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ik);margin:6px 0 12px}
#okxD .okx-g,#okxO .okx-g{width:100%;max-height:200px;object-fit:cover;border-radius:var(--r2);margin:6px 0}
#okxD .okx-b,#okxO .okx-b{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
#okxD .okx-k,#okxO .okx-k{font-size:13px;color:var(--ik);margin:0 0 6px;line-height:1.45}
#okxD .okx-u,#okxO .okx-u{font-size:13px;margin:8px 0 0;padding:8px 10px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--cz)}
.okx-t{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.okx-t .dg[aria-selected=true]{box-shadow:inset 0 0 0 2px var(--vr);color:var(--vr)}
#okxD .okx-l,#okxO .okx-l{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px;font-size:13px;line-height:1.4}
#okxD .okx-l li,#okxO .okx-l li{padding:7px 10px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--cz)}
#okxD .okx-l .hata,#okxO .okx-l .hata{box-shadow:inset 0 0 0 2px var(--sc)}
#okxD .okx-l .uyari,#okxO .okx-l .uyari{box-shadow:inset 0 0 0 1px var(--sa)}
#okxD .okx-l .tamam,#okxO .okx-l .tamam{color:var(--ik)}
#okxD .okx-f,#okxO .okx-f{display:grid;gap:4px;margin:12px 0;font-size:14px}
#okxD .okx-c,#okxO .okx-c{display:flex;gap:8px;align-items:center}
#okxD .okx-f input[type=text],#okxD .okx-f select,#okxD .okx-f textarea,#okxO .okx-f input[type=text],#okxO .okx-f select,#okxO .okx-f textarea{width:100%;font:inherit;padding:9px 10px;border-radius:var(--r2);background:var(--bg);color:inherit;box-shadow:inset 0 0 0 1px var(--cz)}
#okxD .okx-ons,#okxO .okx-ons{margin:0 0 6px;padding:10px;border-radius:var(--r2);background:var(--bg);box-shadow:inset 0 0 0 1px var(--cz);white-space:pre-wrap;font:inherit;font-size:13px;color:var(--ik)}
#okxD .okx-tl,#okxO .okx-tl{list-style:none;padding:0;margin:8px 0;display:grid}
#okxD .okx-tl li,#okxO .okx-tl li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--cz)}
#okxD .okx-tl small,#okxO .okx-tl small{display:block;color:var(--ik)}
.ayar-b{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ik);margin:22px 0 8px;font-weight:650}
.kisayol{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px;align-items:center}
/* açılır menüler (popover) */
.menu{position:fixed;inset:auto;margin:0;min-width:220px;max-width:calc(100vw - 16px);background:var(--yuz);color:var(--yaz);border:0;border-radius:var(--r2);box-shadow:var(--gl),inset 0 0 0 1px var(--cz);padding:6px}
.menu:is(:popover-open){display:flex;flex-direction:column}
.menu button,.menu a{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:8px;font-size:14.5px;min-height:40px}
.menu button:hover,.menu a:hover,.menu :focus-visible{background:var(--yuz2);outline:0}
.menu [aria-pressed=true],.menu [aria-current=page]{color:var(--vr);font-weight:600}
.menu hr{border:0;border-top:1px solid var(--cz);margin:4px 6px}
/* toast */

function okxGorselAl(u,tur){
  var a=okxAyar();
  function al(url){return fetch(url,{mode:'cors',referrerPolicy:'no-referrer'}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.blob()})}
  return al(u).catch(function(e){if(a.gorselVekil===false)throw e;return al('https://wsrv.nl/?url='+encodeURIComponent(u)+'&output='+tur)})
}
function okxPng(b){
  return createImageBitmap(b).then(function(bm){var cv=document.createElement('canvas');cv.width=bm.width;cv.height=bm.height;cv.getContext('2d').drawImage(bm,0,0);return new Promise(function(res,rej){cv.toBlob(function(x){x?res(x):rej(new Error('png'))},'image/png')})})
}
function okxGorsel(u){
  if(!(navigator.clipboard&&window.ClipboardItem&&window.createImageBitmap)){toast('Bu tarayıcı görseli kopyalayamıyor; “Fotoğrafı indir”i kullan');return}
  toast('Fotoğraf hazırlanıyor…');
  var png=okxGorselAl(u,'png').then(okxPng);
  navigator.clipboard.write([new ClipboardItem({'image/png':png})]).then(function(){toast('Fotoğraf kopyalandı: yazı penceresinde yapıştır (⌘V)')})
  .catch(function(){toast('Fotoğraf kopyalanamadı. “Fotoğrafı indir” ya da “Fotoğrafı aç” ile kaydedip ekle.')})
}

  var oz=ad==='ozet';
  /* ozet.json: önce birkaç baytlık surum.json; sürüm aynıysa ikinci açılış tarayıcı önbelleğinden okur */
  var sur=oz?fetch('data/surum.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(s){return s&&s.generated||null}).catch(function(){return null}):Promise.resolve(D.ozet&&D.ozet.generated||null);

  return yukleniyor[ad];
}

function takipHtml(){
  var es=[],gor={};
  Object.keys(REG).forEach(function(id){var c=REG[id];if(c.son&&simdi()-c.son<48*3600&&takipEsles(c.t)&&!gizli[id]){es.push(c);gor[id]=1}});

  return es.length?liste(es.slice(0,8),{},'sik'):'<p class="bilgi">Son 48 saatte takip kelimelerinle eşleşen haber yok: '+esc(ayar.takip.join(', '))+'</p>';
