://www.cnbeta.com.tw/articles/science/1585410.htm","p":"cnBeta.COM","d":"2026-11-07T17:00:39+00:00","s":"据美国蒙特雷湾水族馆研究所（MBARI）消息，研究人员在太平洋深海罕见拍摄到一条头部完全透明的管眼鱼（学名 Macropinna microstoma），这是该机构首次以4K画质记录这一物种，也是首次从新的旗舰科考船“戴维·帕卡德号”上拍到它。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1108/5156326a1b56a95.jpg"},{"t":"NASA Artemis II任务在电离层打出两个5000公里空洞 GPS信号受到干扰","l":"https://www.cnbeta.com.tw/articles/science/1585408.htm","p":"cnBeta.COM","d":"2026-11-07T16:59:14+00:00","s":"今年早些时候，“阿耳忒弥斯2号”（Artemis II）任务半个多世纪以来首次将宇航员送绕月球并安全返回。研究人员指出，这次历史性任务也给地球最外层的电离大气层造成了“沉重”代价。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1108/82346c73cefb403.webp"},{"t":"收购EA之后 银湖资本与沙特公共投资基金据报出价250亿美元收购Unity","l":"https://www.cnbeta.com.tw/articles/game/1585406.htm","p":"cnBeta.COM","d":"2026-11-07T16:58:17+00:00","s":"据路透社援引未具名知情人士的消息报道，由美国私募股权公司银湖资本（Silver Lake Partners）与沙特阿拉伯主权财富基金——公共投资基金（PIF）组成的投资者财团，已向Unity Software提出收购要约，对这家公司的估值约为250亿美元。据悉，Unity正在认真考虑这一报价，并已聘请一家投资银行提供咨询。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1108/10cc21f07c2823d.jpg"},{"t":"欧空局赫拉探测器首次近距离拍摄到Didymos双小行星系统","l":"https://www.cnbeta.com.tw/articles/science/1585404.htm","p":"cnBeta.COM","d":"2026-11-07T16:56:25+00:00","s":"欧洲空间局（ESA）负责行星防御的赫拉（Hera）任务日前首次近距离拍摄到迪迪莫斯（Didymos）双小行星系统。美国宇航局的DART探测器曾于2022年9月26日撞击其较小的伴星迪莫弗斯（Dimorphos），而这张新图像提供了一个此前从未见过的视角：从相邻的母小行星一侧回望整个系统。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1108/d8b9f8642b52722.webp"},{"t":"任天堂将推更多重制作品 粉丝盼姆吉拉假面与马64","l":"https://www.cnbeta.com.tw/articles/game/1585402.htm","p":"cnBeta.COM","d":"2026-11-07T16:52:43+00:00","s":"任天堂素来擅长将旗下人气老作品重新打磨后搬上现代平台，这早已不是什么新鲜事。但从今年的《星际火狐》开始，任天堂对“重制版”的定义似乎有了新的变化。据工作室高级副总裁透露，未来重制作品将与全新作品并驾齐驱，成为任天堂的核心业务方向。 阅读全文","i":"https://img.3dmgame.com/uploads/images/news/20261107/1794018350_578687_jpg_r.jpg"},{"t":"消息称古天乐拟进军内地网剧市场 与马楚成再合作警匪剧","l":"https://www.cnbeta.com.tw/articles/movie/1585400.htm","p":"cnBeta.COM","d":"2026-11-07T16:51:46+00:00","s":"消息称，古天乐可能首次进军内地网络剧市场，与导演马楚成合作一部由内地投资的警匪题材网络剧。目前该项目尚未官宣，项目名称、正式演员阵容及开机日期等信息也 var TUR=[['hepsi','En iyi adaylar'],['kesin','Kesin'],['gundem','Gündem'],['turkiye','Türkiye'],['yurtdisi','Yurt dışı'],['carpici','Çarpıcı'],['yeni','Yeni']];
var GENEL=[['tr','Türkiye'],['world','Dünya'],['eco','Ekonomi'],['sci','Bilim'],['cool','İlginç'],['viral','Viral'],['ent','Eğlence'],['sport','Spor']];
var KAT={samsung:'samsung',ios:'apple',mac:'apple',mobil:'android',win:'yazilim',auto:'oto'};
var S={sirala:'puan',gizliGoster:false,geri:null,sekme:'gundem',konu:'hepsi',dil:'hepsi',saat:72,tur:'hepsi',q:'',kat:'tech',adet:40,acik:{},secili:-1,gorunum:oku('akis-gorunum','liste')};
var M={kumeler:[],reels:[],konular:[],trendler:[],kaynaklar:[],saglik:{}};
function oku(k,v){try{return JSON.parse(localStorage.getItem(k))||v}catch(e){return v}}
function yaz(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var kayit=oku('akis-kayit',{}),okundu=oku('akis-okundu',{}),gizli=oku('akis-gizli',{});
// "Yeni": önceki oturumdan sonra ortaya çıkan konular (30 dk'dan uzun ara yeni oturum sayılır; ilk ziyarette son 6 saat).
var ZY=oku('akis-ziyaret',{son:0,onceki:0}),ZS=Date.now()/1000;
if(ZS-(ZY.son||0)>1800){ZY.onceki=ZY.son||(ZS-6*3600)}ZY.son=ZS;yaz('akis-ziyaret',ZY);
function yeniMi(c){return !!c.ilk&&c.ilk>ZY.onceki}
function $(i){return document.getElementById(i)}
function x(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function kac(z){var d=Math.max(0,(Date.now()/1000-z)/60);if(d<60)return Math.round(d)+' dk';if(d<1440)return Math.round(d/60)+' sa';return Math.round(d/1440)+' gün'}
function norm(s){return String(s||'').toLocaleLowerCase('tr')}
function konuAd(k){var o=M.konular.filter(function(a){return a.k===k})[0];return o?o.ad:''}

// Gorsel: engelleyen sunucuda bir kez vekil dener, olmazsa temiz bir yer tutucu kalir. Kirik simge cikmaz.
window.__gorsel=function(img){
  if(!img.dataset.d&&/^https?:/.test(img.src)&&img.src.indexOf('weserv')<0){img.dataset.d='1';img.src='https://images.weserv.nl/?w=480&url='+encodeURIComponent(img.src.replace(/^https?:\/\//,''));return}
  img.remove();
};
function resim(c,ad,link){
  var yer='<span class="yer" aria-hidden="true">'+x(ad||'Akış')+'</span>';
  var im=c&&/^https?:/.test(c)?'<img src="'+x(c)+'" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="__gorsel(this)">':'';
  return '<a class="res" href="'+x(link)+'" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">'+yer+im+'</a>';
}
function eylem(c){
  var ozet=c.s||'',kayitli=!!kayit[c.id];
  var stud=PANEL+'/sosyal-studyo?baslik='+encodeURIComponent(c.t)+'&ozet='+encodeURIComponent(ozet)+'&link='+encodeURIComponent(c.l);
  var hizli=PANEL+'/hizli-yaz?metin='+encodeURIComponent((c.t+'\n\n'+ozet+'\n\nKaynak: '+c.l).slice(0,1500));
  var cevir=c.dil!=='tr'?'<a class="dg" target="_blank" rel="noopener" href="https://translate.google.com/translate?sl=auto&tl=tr&u='+encodeURIComponent(c.l)+'">Çevir</a>':'';
  var kaynak=c.og&&c.og.length>1?'<button class="dg" data-ac="'+c.id+'" aria-expanded="'+(S.acik[c.id]?'true':'false')+'">'+c.og.length+' haberi gör</button>':'';
  return '<div class="eylem">'+(S.sekme==='reels'?'<a class="dg birincil" target="_blank" rel="noopener" href="'+x(stud)+'">Stüdyo\'ya aktar</a><a class="dg" target="_blank" rel="noopener" href="'+x(hizli)+'">Hızlı Yaz</a>':'<a class="dg" target="_blank" rel="noopener" href="'+x(hizli)+'">Hızlı Yaz</a><a class="dg" target="_blank" rel="noopener" href="'+x(stud)+'">Stüdyo</a>')+kaynak+cevir+'<button class="dg" data-kaydet="'+c.id+'" aria-pressed="'+kayitli+'">'+(kayitli?'Kaydedildi':'Kaydet')+'</button><button class="dg gz" data-gizle="'+c.id+'" title="Bu konu bana uygun değil: listeden kaldır (geri alınabilir)">'+(gizli[c.id]?'Geri getir':'İlgisiz')+'</button></div>';
}
function kart(c,i){
  var konu=konuAd(c.k),ks=c.ks||1;
  var ned=S.sekme==='reels'&&c.ned&&c.ned.length?'<ul class="nedenler">'+c.ned.map(function(n){return'<li>'+x(n)+'</li>'}).join('')+'</ul>':'';
  var liste=S.acik[c.id]&&c.og?'<ul class="kaynaklar">'+c.og.map(function(o){return'<li><a href="'+x(o.l)+'" target="_blank" rel="noopener" data-okundu="'+c.id+'">'+x(o.t)+'</a><span>'+x(o.p)+' · '+kac(o.z)+'</span></li>'}).join('')+'</ul>':'';
  var kaynakAd=c.og&&c.og[0]?c.og[0].p:'';
  return '<article class="kart'+(gizli[c.id]?' gizlenen':'')+(okundu[c.id]?' okundu':'')+(S.secili===i?' secili':'')+'" data-i="'+i+'">'+resim(c.i,konu||kaynakAd,c.l)+'<div>'+
    '<h2>'+(S.sekme==='reels'?'<span class="sira">'+(i+1)+'</span>':'')+'<a href="'+x(c.l)+'" target="_blank" rel="noopener" data-okundu="'+c.id+'">'+x(c.t)+'</a></h2>'+
    '<div class="meta"><span class="ks'+(ks<2?' tek':'')+'">'+(ks>1?ks+' kaynak':x(kaynakAd))+'</span><span>'+kac(c.son)+' önce</span>'+(konu?'<span>'+x(konu)+'</span>':'')+(yeniMi(c)?'<span class="yeni">Yeni</span>':'')+(c.dil!=='tr'?'<span class="dil">'+(c.dil==='zh'?'ZH':'EN')+'</span>':'')+'</div>'+
    ned+(c.s?'<p class="ozet">'+x(c.s)+'</p>':'')+eylem(c)+liste+'</div></article>';
}
// Liste görünümü: küçük fotoğraf, başlık, tek satır özet ve meta. Kart görünümünün aksiyonları yok; kaydet/aç klavyeyle de çalışır.
function satir(c,i){
  var konu=konuAd(c.k),ks=c.ks||1,kaynakAd=c.og&&c.og[0]?c.og[0].p:'';
  return '<article class="satir'+(gizli[c.id]?' gizlenen':'')+(okundu[c.id]?' okundu':'')+(S.secili===i?' secili':'')+'" data-i="'+i+'">'+resim(c.i,konu||kaynakAd,c.l)+'<div>'+
    '<h2><a href="'+x(c.l)+'" target="_blank" rel="noopener" data-okundu="'+c.id+'">'+x(c.t)+'</a></h2>'+
    (c.s?'<p class="ozet">'+x(c.s)+'</p>':'')+
    '<div class="meta"><span class="ks'+(ks<2?' tek':'')+'">'+(ks>1?ks+' kaynak':x(kaynakAd))+'</span><span>'+kac(c.son)+' önce</span>'+(konu?'<span>'+x(konu)+'</span>':'')+(yeniMi(c)?'<span class="yeni">Yeni</span>':'')+'<button class="gz gzs" data-gizle="'+c.id+'" title="Bu konu bana uygun değil (x)">'+(gizli[c.id]?'Geri getir':'İlgisiz')+'</button></div></div></article>';
}
function suz(l){
  var q=norm(S.q),sinir=Date.now()/1000-S.saat*3600;
  return l.filter(function(c){
    if(c.son<sinir)return false;
    if(gizli[c.id]&&!S.gizliGoster)return false;
    if(S.konu!=='hepsi'&&c.k!==S.konu)return false;
    if(S.dil==='tr'&&c.dil!=='tr')return false;
    if(S.dil==='en'&&c.dil==='tr')return false;
    if(S.dil==='zh'&&c.dil!=='zh')return false;
    if(q&&norm(c.t+' '+(c.s||'')+' '+(c.og||[]).map(function(o){return o.t+' '+o.p}).join(' ')).indexOf(q)<0)return false;
    return true;
  });
}
var GORUNEN=[];
function liste(l,bosMetin){
  GORUNEN=l.slice(0,S.adet);
  if(!l.length)return '<div class="bos">'+x(bosMetin)+'</div>';
  var satirMi=S.gorunum!=='kart';
  return (satirMi?'<div class="satirlar">'+GORUNEN.map(satir).join('')+'</div>':'<div class="liste">'+GORUNEN.map(kart).join('')+'</div>')+(l.length>S.adet?'<div class="diger"><button class="dg" id="daha">Daha fazla ('+(l.length-S.adet)+')</button></div>':'');
}
function sonHaberler(){
  var o=[],g={};
  Object.keys(SNAP.feeds||{}).forEach(function(k){var f=SNAP.feeds[k];(f.items||[]).forEach(function(it){
    if(!it.l||g[it.l]||/trends/.test(k))return;g[it.l]=1;
    var cat=it.c||f.cat,z=Date.parse(it.d||'')/1000;if(!z)return;
    if(S.kat==='tech'?['tech','samsung','ios','mac','mobil','win','auto'].indexOf(cat)<0:cat!==S.kat)return;
    o.push({id:'s'+it.l.slice(-16),t:it.t,s:it.s,i:it.i,l:it.l,son:z,dil:f.lang,ks:1,k:KAT[cat]||'',og:[{p:it.p||f.name}]});
  })});
  return o.sort(function(a,b){return b.son-a.son});
}
function cipler(v,liste,alan){return liste.map(function(t){return'<button class="cip" data-'+alan+'="'+t[0]+'" aria-pressed="'+(v===t[0])+'">'+t[1]+'</button>'}).join('')}
function yanCiz(){
  var y=$('yan'),h='';
  if(S.sekme==='gundem'||S.sekme==='reels'){
    var say={};suzKonusuz().forEach(function(c){say[c.k]=(say[c.k]||0)+1});
    var top=suzKonusuz().length;
    h+='<h3>Konular</h3><button data-konu="hepsi" aria-pressed="'+(S.konu==='hepsi')+'">Hepsi <small>'+top+'</small></button>';
    M.konular.forEach(function(k){if(say[k.k])h+='<button data-konu="'+k.k+'" aria-pressed="'+(S.konu===k.k)+'">'+x(k.ad)+' <small>'+say[k.k]+'</small></button>'});
  }else if(S.sekme==='son'){
    h+='<h3>Bölümler</h3><button data-kat="tech" aria-pressed="'+(S.kat==='tech')+'">Teknoloji</button>';
    GENEL.forEach(function(k){h+='<button data-kat="'+k[0]+'" aria-pressed="'+(S.kat===k[0])+'">'+k[1]+'</button>'});
  }
  y.innerHTML=h;y.style.display=h?'':'none';document.querySelector('.duzen').style.gridTemplateColumns=h?'':'minmax(0,1fr)';
}
function suzKonusuz(){var k=S.konu;S.konu='hepsi';var l=suz(S.sekme==='reels'?reelsListe():M.kumeler);S.konu=k;return l}
function reelsListe(){var m={};M.kumeler.forEach(function(c){m[c.id]=c});return M.reels.map(function(i){return m[i]}).filter(Boolean)}
function gizliChip(){var n=Object.keys(gizli).length;return n?'<button class="cip" data-gizlig="1" aria-pressed="'+S.gizliGoster+'">Gizlenenler ('+n+')</button>':''}
function geriBar(){return S.geri&&gizli[S.geri]?'<div class="geri" role="status">Konu listeden kaldırıldı. <button data-gizle="'+S.geri+'">Geri al</button></div>':''}
function ciz(){
  var a=$('ana'),h='';
  $('gorunum').innerHTML=[['liste','Liste'],['kart','Kart']].map(function(t){return'<button data-gorunum="'+t[0]+'" aria-pressed="'+(S.gorunum===t[0])+'">'+t[1]+'</button>'}).join('');
  document.querySelectorAll('[data-sekme]').forEach(function(b){b.setAttribute('aria-selected',b.dataset.sekme===S.sekme)});
  yanCiz();
  var filtre=cipler(S.dil,[['hepsi','Tüm diller'],['tr','Türkçe'],['en','Yabancı'],['zh','Çince']],'dil')+cipler(S.saat,[[6,'6 saat'],[24,'24 saat'],[72,'3 gün']],'saat');
  if(S.sekme==='gundem'){
    h=geriBar()+'<div class="ana-ust"><h1>Gündem</h1>'+filtre+gizliChip()+'</div>'+liste(suz(M.kumeler),'Bu süzgeçte haber yok.');
  }else if(S.sekme==='reels'){
    var l=suz(reelsListe());
    if(S.tur==='yeni')l=l.filter(yeniMi);else if(S.tur!=='hepsi')l=l.filter(function(c){return(c.tur||[]).indexOf(S.tur)>=0});
    if(S.sirala==='yeni')l=l.slice().sort(function(a,b){return(b.ilk||0)-(a.ilk||0)});
    var trTr=(M.trendler||[]).filter(function(t){return t.ulke==='TR'});
    h=geriBar()+'<div class="ana-ust"><h1>Reels konuları</h1>'+cipler(S.tur,TUR,'tur')+'<span class="ayrac"></span>'+cipler(S.sirala,[['puan','Puana göre'],['yeni','En yeni']],'sirala')+gizliChip()+'</div><p class="bilgi">Telefon, uygulama, güvenlik ve yapay zekâ kullanıcısını ilgilendiren haberler öne çıkar; kaza, dizi, borsa ve yabancı ülke kampanyaları listeye girmez. Sıra: kaynak sayısı, hız, kullanıcıya etki, Türkiye ilgisi ve tazelik. Tahmindir, görüntülenme garantisi değildir. Alakasız olanı <b>İlgisiz</b> ile kaldırabilirsin (Geri al mümkün).</p>';
    if(trTr.length)h+='<div class="trend"><b>Teknoloji trendleri</b>'+trTr.slice(0,10).map(function(t){return'<a href="'+x(t.l)+'" target="_blank" rel="noopener">'+x(t.t)+'</a>'}).join('')+'</div>';
    h+=liste(l,'Bu türde aday yok. Başka bir tür seçin.');
  }else if(S.sekme==='son'){
    var q=norm(S.q),ls=sonHaberler().filter(function(c){return(S.dil==='hepsi'||c.dil===S.dil)&&(!q||norm(c.t).indexOf(q)>=0)});
    h='<div class="ana-ust"><h1>Son haberler</h1>'+cipler(S.dil,[['hepsi','Tüm diller'],['tr','Türkçe'],['en','Yabancı'],['zh','Çince']],'dil')+'</div>'+liste(ls,'Bu bölümde haber yok.');
  }else if(S.sekme==='kayit'){
    var kl=Object.keys(kayit).map(function(k){return kayit[k]}).sort(function(a,b){return b.son-a.son});
    h='<div class="ana-ust"><h1>Kaydedilenler</h1></div>'+liste(kl,'Kaydettiğin haberler burada durur. Yalnız bu tarayıcıda saklanır.');
  }else{
    var sg=M.saglik||{},kl2=M.kaynaklar.slice().sort(function(a,b){return(a.son||'')<(b.son||'')?-1:1});
    h='<div class="ana-ust"><h1>Kaynaklar</h1></div><p class="bilgi">'+(sg.kaynak||0)+' kaynak: '+(sg.basarili||0)+' çalışıyor, '+(sg.bayat||0)+' bu tur yanıt vermedi, '+(sg.beklemede||0)+' beklemede. 12 saatten eski kopya akışa girmez. En eski güncellenen en üstte.</p><div class="kaz"><table class="tablo"><thead><tr><th>Kaynak</th><th>Bölüm</th><th>Son haber</th><th>Durum</th></tr></thead><tbody>'+kl2.map(function(k){return'<tr><td>'+x(k.ad)+'</td><td>'+x(k.cat)+'</td><td>'+(k.son?kac(Date.parse(k.son)/1000)+' önce':'–')+'</td><td>'+(k.bayat?'Yanıt vermedi':'Çalışıyor')+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  a.innerHTML=h;
}
function git(s){S.geri=null;S.sekme=s;S.adet=40;S.secili=-1;S.konu='hepsi';if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);ciz();window.scrollTo(0,0)}
function sekmeCiz(){
  $('sekmeler').innerHTML=SEKME.map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('alt').innerHTML=SEKME.slice(0,4).map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1].replace('Son haberler','Son').replace('Kaydedilenler','Kayıtlı')+'</button>'}).join('');
}
function bul(id){var m=M.kumeler.concat(sonHaberler()).filter(function(c){return c.id===id})[0];return m||kayit[id]}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-sekme],[data-konu],[data-dil],[data-saat],[data-tur],[data-kat],[data-ac],[data-kaydet],[data-gorunum],[data-sirala],[data-gizle],[data-gizlig],#daha,#tema,[data-okundu]');
  if(!t)return;var d=t.dataset;
  if(d.okundu){okundu[d.okundu]=1;var ks=Object.keys(okundu);if(ks.length>1500)delete okundu[ks[0]];yaz('akis-okundu',okundu);return}
  if(d.sekme)return git(d.sekme);
  if(d.konu){S.konu=d.konu;S.adet=40}
  else if(d.dil)S.dil=d.dil;
  else if(d.saat)S.saat=+d.saat;
  else if(d.tur)S.tur=d.tur;
  else if(d.sirala)S.sirala=d.sirala;
  else if(d.gizlig)S.gizliGoster=!S.gizliGoster;
  else if(d.gizle){if(gizli[d.gizle]){delete gizli[d.gizle];S.geri=null}else{gizli[d.gizle]=Math.round(Date.now()/1000);S.geri=d.gizle;var gk=Object.keys(gizli);if(gk.length>800)delete gizli[gk[0]]}yaz('akis-gizli',gizli)}
  else if(d.gorunum){S.gorunum=d.gorunum;yaz('akis-gorunum',S.gorunum)}
  else if(d.kat){S.kat=d.kat;S.adet=40}
  else if(d.ac)S.acik[d.ac]=!S.acik[d.ac];
  else if(d.kaydet){if(kayit[d.kaydet])delete kayit[d.kaydet];else{var c=bul(d.kaydet);if(c)kayit[d.kaydet]=c}yaz('akis-kayit',kayit)}
  else if(t.id==='daha')S.adet+=40;
  else if(t.id==='tema'){var r=document.documentElement,kz=matchMedia('(prefers-color-scheme:dark)').matches,su=r.dataset.tema||(kz?'koyu':'acik'),yn=su==='koyu'?'acik':'koyu';r.dataset.tema=yn;try{localStorage.setItem('akis-tema',yn)}catch(er){}return}
  ciz();
});
var zm;$('ara').addEventListener('input',function(){clearTimeout(zm);var v=this.value;zm=setTimeout(function(){S.q=v;S.adet=40;ciz()},150)});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var h=e.target.tagName;
  if(h==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  if(e.key==='/'){e.preventDefault();$('ara').focus();return}
  if((e.key==='j'||e.key==='k')&&GORUNEN.length){S.secili=Math.min(GORUNEN.length-1,Math.max(0,S.secili+(e.key==='j'?1:-1)));ciz();var el=document.querySelector('.kart.secili');if(el)el.scrollIntoView({block:'center'});return}
  var c=GORUNEN[S.secili];if(!c)return;
  if(e.key==='o'||e.key==='Enter')window.open(c.l,'_blank','noopener');
  if(e.key==='x'){if(gizli[c.id]){delete gizli[c.id];S.geri=null}else{gizli[c.id]=Math.round(Date.now()/1000);S.geri=c.id}yaz('akis-gizli',gizli);ciz()}
  if(e.key==='s'){if(kayit[c.id])delete kayit[c.id];else kayit[c.id]=c;yaz('akis-kayit',kayit);ciz()}
});
function durumYaz(){
  var g=M.generated||SNAP.generated,el=$('durum');if(!g)return;
  var z=Date.parse(g)/1000,dk=(Date.now()/1000-z)/60;
  el.textContent=(dk>90?'Güncellenmedi: ':'Güncellendi: ')+kac(z)+' önce';el.classList.toggle('eski',dk>90);
}
sekmeCiz();
fetch('masa.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){M=j;durumYaz();var h=location.hash.slice(1);git(SEKME.some(function(t){return t[0]===h})?h:'gundem')}).catch(function(){durumYaz();$('ana').innerHTML='<div class="bos">Masa verisi yüklenemedi. Son haberler yine çalışır.</div>';S.sekme='son';ciz()});
})();
</script>
</body>
</html>
