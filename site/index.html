<style>

.zc{position:relative;margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--cz)}.zc li{position:relative;padding:0 0 9px 0;font-size:12.5px}.zc li:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--vg2)}.zc time{color:var(--sk);font-size:11.5px;display:block}
.bt{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.btn{padding:5px 10px;border:1px solid var(--cz);border-radius:7px;font-weight:650;font-size:12px;background:var(--yz)}.btn:hover{border-color:var(--vg);color:var(--vg)}.btn.p{background:var(--vg);border-color:var(--vg);color:var(--bg)}.btn.p:hover{color:var(--bg);opacity:.9}.btn[aria-pressed=true]{border-color:var(--vg);color:var(--vg);background:var(--vgy)}

.say-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:0 0 12px}.say-k button{padding:9px 10px;border:1px solid var(--cz);border-radius:9px;background:var(--yz);text-align:left}.say-k button[aria-pressed=true]{border-color:var(--vg)}.say-k b{display:block;font-size:20px;color:var(--ink);line-height:1.1}.say-k span{font-size:11.5px;color:var(--sk);font-weight:600}

pre.kod{margin:6px 0;padding:9px 11px;border-radius:8px;background:var(--yz2);overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx);white-space:pre-wrap;word-break:break-all}

 .rk-ust{grid-template-columns:54px minmax(0,1fr)}.rk-ust .puan{grid-column:1/3;width:auto;height:auto;padding:6px;flex-direction:row;gap:8px;justify-content:flex-start;font-size:16px}.rk dl{grid-template-columns:1fr}.rk dt{margin-top:4px}.kb-bar{grid-template-columns:110px 1fr 28px}
 .sag{width:100vw}.ol{grid-template-columns:repeat(2,auto)}
}

1+00:00","items":[{"l":"https://www.gazetevatan.com/galeri/anadolu-universitesi-acikogretim-sinavlari-ne-zaman-2026-2027-aof-guz-ve-bahar-donemi-sinav-tarihleri-belli-oldu-mu-aof-sinav-giris-2463435","t":"Anadolu Üniversitesi Açıköğretim sınavları ne zaman? 2026 - 2027 AÖF Güz ve Bahar Dönemi sınav tarihleri belli oldu mu? AÖF sınav giriş yerleri belgesi erişime açıldı mı?","d":"2026-11-10T11:48:49+00:00","s":"","i":"https://image.gazetevatan.com/i/gazetevatan/75/0x0/615edbfe7800a9e36b729747.jpg6af2fe1b594aa80a97b8ae1a.jpg"}]},"cnbeta":{"name":"cnBeta","lang":"zh","cat":"tech","plat":"web","url":"https://rss.cnbeta.com.tw/","updated":"2026-11-10T12:06:30.881311+00:00","items":[{"t":"英格兰将全面收紧校园手机管理 学生不得再将手机放在口袋或书包中","l":"https://www.cnbeta.com.tw/articles/tech/1585802.htm","p":"cnBeta.COM","d":"2026-11-10T11:48:37+00:00","s":"英国英格兰地区将进一步强化校园手机禁令。从2027年9月开始，学生在校期间将不再被允许仅仅把手机关闭后放在口袋或书包内，学校必须采取更严格措施，确保学生在整个上课期间无法接触到个人手机，以打造真正意义上的“无手机校园”。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/c4ed2bcf40c7edf.jpg"},{"t":"Rapidus遭遇关键技术障碍 日本2纳米芯片量产计划面临延期风险","l":"https://www.cnbeta.com.tw/articles/tech/1585800.htm","p":"cnBeta.COM","d":"2026-11-10T11:45:07+00:00","s":"日本先进半导体企业Rapidus的2纳米制程项目正遭遇重要挑战。最新消息显示，该公司在推进2纳米工艺研发过程中未能如期完成SRAM（静态随机存取存储器）相关技术里程碑，这使其原定于2027财年实现2纳米芯片量产的目标面临不确定性。 阅读全文","i":"https://www.techpowerup.com/img/O7qJSXwfbZopmWRy.jpg"},{"t":"希捷推出FireCuda Forge智能混合存储系统 机械硬盘与SSD自动协作","l":"https://www.cnbeta.com.tw/articles/tech/1585798.htm","p":"cnBeta.COM","d":"2026-11-10T11:44:44+00:00","s":"希捷（Seagate）推出了一款名为FireCuda Forge的新型外置存储设备，试图将传统机械硬盘的大容量、低成本优势与SSD的高速性能结合起来。它并不是简单地将两块硬盘安装在同一个外壳内，而是通过希捷全新的Alkemi智能存储平台，利用机器学习分析用户的数据访问习惯，自动在机械硬盘和SSD之间迁移文件，让用户在获得大容量存储空间的同时，也能享受到接近SSD的访问速度。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/2815c6edeb05094.jpg"},{"t":"任天堂Switch 2首次破解遭快速封堵 23.5.0固件修复系统漏洞","l":"https://www.cnbeta.com.tw/articles/game/1585796.htm","p":"cnBeta.COM","d":"2026-11-10T11:40:49+00:00","s":"任天堂近日发布Switch 2系统固件23.5.0更新，修复了此前被破解者利用的关键操作系统漏洞，使得这款新 var PEN={'1':1,'6':6,'24':24,'72':72,'168':168};

    if(S.alt&&!((c.alt&&c.alt[S.alanKey||S.alan]||[]).indexOf(S.alt)>=0||(c.gundem_alt||[]).indexOf(S.alt)>=0))return false;
    if(S.ek){var ek=[].concat(c.ul||[],c.ld||[],c.mk||[]);if(ek.indexOf(S.ek)<0)return false}
