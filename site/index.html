<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Akış</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f9;--bg2:#ffffff;--bg3:#eceef5;--ink:#0f1222;--ink2:#4b5169;--ink3:#8a90a8;--line:#e2e5f0;
  --ac:#5b5bf6;--ac2:#c026d3;--glass:rgba(255,255,255,.72);--shadow:0 1px 2px rgba(15,18,34,.05),0 8px 24px -12px rgba(15,18,34,.18);
  --r:18px;
  --c-tr:#ef4444;--c-world:#3b82f6;--c-tech:#8b5cf6;--c-ios:#14b8a6;--c-mac:#64748b;--c-win:#0ea5e9;--c-mobil:#3ddc84;--c-auto:#ca8a04;--c-eco:#10b981;--c-sci:#06b6d4;--c-cool:#f59e0b;--c-viral:#ec4899;--c-ent:#d946ef;--c-sport:#22c55e;--c-samsung:#1428a0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0c14;--bg2:#12151f;--bg3:#1a1e2c;--ink:#eef0f8;--ink2:#a9afc6;--ink3:#6b7390;--line:#222738;--glass:rgba(14,17,28,.72);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0a0c14;--bg2:#12151f;--bg3:#1a1e2c;--ink:#eef0f8;--ink2:#a9afc6;--ink3:#6b7390;--line:#222738;--glass:rgba(14,17,28,.72);--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}

/* üst çubuk */
.top{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px;box-shadow:0 6px 16px -6px var(--ac)}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:0;margin-top:-2px}
.search{flex:1;max-width:560px;margin-left:auto;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);padding:0 54px 0 42px;outline:0;transition:.15s}
.search input:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:600 11px/1 inherit;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--bg3)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg2);transition:.15s}
.iconbtn:hover{border-color:var(--ac);color:var(--ac)}
.iconbtn.go{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;box-shadow:0 8px 18px -8px var(--ac)}
.iconbtn.go:hover{color:#fff;filter:brightness(1.08)}
.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* çipler */
.bar{padding:16px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;color:var(--ink2);transition:.15s;flex:none}
.chip .d{width:auto;height:auto;font-size:15px;line-height:1;background:none;border-radius:0}
.chip em{font-style:normal;font-size:12px;color:var(--ink3);font-weight:600}
.chip:hover{border-color:color-mix(in srgb,var(--c,var(--ac)) 60%,var(--line));color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] em{color:inherit;opacity:.65}

.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0 18px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg3);border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;padding:0 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--bg2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg svg{width:16px;height:16px}
.sel{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:0 12px;font-weight:600;font-size:13px;outline:0}
.sp{flex:1}
.trres{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--ac)}
.cfoot .mini{height:28px;font-size:12px;display:inline-flex;align-items:center;margin-right:6px}
#langseg em{font-style:normal;opacity:.6;font-weight:500;margin-left:4px}
.mini{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--bg2)}
.mini[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.sub{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 12px}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink3);font-weight:600;padding:2px 2px 16px}
.stat b{color:var(--ink);font-weight:700}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--c-tr);font-weight:700}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;margin-bottom:26px}
.feat{position:relative;border-radius:24px;overflow:hidden;min-height:420px;display:flex;align-items:flex-end;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,#0a0c14),var(--c));box-shadow:var(--shadow);isolation:isolate}
.feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .6s}
.feat:hover img{transform:scale(1.03)}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(5,7,15,.92));z-index:-1}
.feat .in{padding:28px;color:#fff;max-width:760px}
.feat h2{font-size:clamp(24px,3vw,38px);line-height:1.12;letter-spacing:-.025em;font-weight:800;margin:10px 0 12px;text-wrap:balance}
.feat p{color:rgba(255,255,255,.8);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 85%,#000);color:#fff}
.pill.glass{background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.side{background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:8px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.side h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:14px 0 6px;font-weight:700}
.side a{display:block;padding:13px 0;border-top:1px solid var(--line);font-weight:700;line-height:1.35;letter-spacing:-.01em}
.side a:first-of-type{border-top:0}
.side a small{display:flex;gap:8px;margin-bottom:5px;font-size:12px;font-weight:600;color:var(--ink3);align-items:center}
.side a small i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.side a:hover{color:var(--ac)}

/* kartlar */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.media{position:relative;aspect-ratio:16/9;display:block;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,#0a0c14),var(--c));overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .media img{transform:scale(1.04)}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:54px;color:rgba(255,255,255,.9);letter-spacing:-.04em}
.media .pill{position:absolute;left:12px;top:12px}
.media .plat{position:absolute;right:12px;top:12px;height:26px;padding:0 9px;border-radius:999px;background:rgba(10,12,20,.55);backdrop-filter:blur(8px);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center}
.body{padding:15px 16px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3);font-weight:600;min-width:0}
.av{width:22px;height:22px;border-radius:7px;background:color-mix(in srgb,var(--c) 22%,var(--bg2));color:var(--c);display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.meta .src{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.meta .age{margin-left:auto;white-space:nowrap}
.meta .age.fresh{color:var(--c-tr)}
.title{font-weight:700;font-size:16.5px;line-height:1.32;letter-spacing:-.012em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.title:hover{color:var(--ac)}
.sum{font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cfoot{margin-top:auto;display:flex;justify-content:flex-end}
.save{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink3);transition:.15s}
.save:hover{background:var(--bg3);color:var(--ink)}
.save[aria-pressed="true"]{color:var(--ac)}.save[aria-pressed="true"] svg{fill:currentColor}
.unread{position:absolute;right:12px;bottom:14px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.card[data-read="1"]{opacity:.62}.card[data-read="1"] .unread{display:none}
.card[data-read="1"]:hover{opacity:1}
/* liste */
.list{display:flex;flex-direction:column;gap:12px}
.list .card{flex-direction:row;align-items:stretch}
.list .media{width:240px;aspect-ratio:auto;min-height:140px;flex:none}
.list .ph{font-size:38px}
.list .title{-webkit-line-clamp:3;font-size:18px}
.list .unread{bottom:auto;top:14px}
/* kompakt */
.compact{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:8px 56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);font-weight:600;transition:.12s}
.row:first-child{border-top:0}
.row:hover{background:var(--bg3)}
.row i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.row .tm{font-size:12.5px;color:var(--ink3);font-weight:700}.row .tm.fresh{color:var(--c-tr)}
.row .title{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .s{font-size:12.5px;color:var(--ink3);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row[data-read="1"] .title{color:var(--ink3)}
.empty{padding:70px 20px;text-align:center;color:var(--ink3);grid-column:1/-1}
.empty b{display:block;font-size:19px;color:var(--ink);margin-bottom:6px}
.more{display:block;margin:30px auto 60px;height:50px;padding:0 30px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-weight:700;box-shadow:var(--shadow)}
.more:hover{border-color:var(--ac);color:var(--ac)}
.foot{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--ink3);font-size:13px;font-weight:600;display:flex;gap:18px;flex-wrap:wrap}
.foot a{color:var(--ink2)}

/* pencere */
dialog{border:0;padding:0;background:transparent;color:inherit;max-width:none;max-height:none}
dialog::backdrop{background:rgba(5,7,15,.6);backdrop-filter:blur(4px)}
.dlg{width:min(780px,calc(100vw - 24px));max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);overflow:hidden;margin:20px auto}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh h2{font-size:19px;letter-spacing:-.02em}
.dh button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line)}
.add{display:grid;grid-template-columns:1fr 140px 170px;gap:10px;padding:18px 22px 8px}
.add input,.add select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;outline:0}
.add .url{grid-column:1/3}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-size:14px}
.btn.primary{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff}
.tools{display:flex;gap:8px;padding:6px 22px 14px;flex-wrap:wrap}
.tools .btn{height:38px;font-size:13px}
.srcs{overflow:auto;padding:0 22px 22px;border-top:1px solid var(--line)}
.srcs h4{position:sticky;top:0;background:var(--bg2);padding:16px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);z-index:1}
.src-r{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.src-r label{display:flex;gap:10px;align-items:center;flex:1;min-width:0;cursor:pointer}
.src-r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.src-r .c{color:var(--ink3);font-size:12px;white-space:nowrap}
.src-r .x{font-size:12px;color:var(--ink3);padding:4px 8px;border-radius:8px}.src-r .x:hover{background:var(--bg3);color:var(--c-tr)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:80;box-shadow:0 14px 40px -10px rgba(0,0,0,.5)}
.toast[hidden]{display:none}
.skeleton{animation:fade .35s}@keyframes fade{from{opacity:0;transform:translateY(6px)}}

@media (max-width:1000px){.hero{grid-template-columns:1fr}.feat{min-height:340px}}
@media (max-width:720px){
  .wrap{padding:0 14px}.top .wrap{height:60px;gap:8px}.logo small,.search kbd{display:none}
  .logo span{display:none}
  .grid{grid-template-columns:1fr}.list .card{flex-direction:column}.list .media{width:100%;aspect-ratio:16/9;min-height:0}
  .row{grid-template-columns:8px 44px minmax(0,1fr)}.row .s{display:none}
  .add{grid-template-columns:1fr 1fr}.add .url{grid-column:1/-1}.sp{display:none}
  .feat .in{padding:20px}.feat{min-height:300px;border-radius:20px}
}

/* ---- yenilenmiş görünüm ---- */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 500px at 8% -10%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 60%),
             radial-gradient(800px 480px at 100% 0%,color-mix(in srgb,var(--ac2) 13%,transparent),transparent 60%),
             radial-gradient(700px 500px at 50% 110%,color-mix(in srgb,var(--c-win) 10%,transparent),transparent 60%)}
.logo span{background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--ac) 70%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{-webkit-text-fill-color:var(--ink3)}
.top{box-shadow:0 10px 30px -22px rgba(15,18,34,.35)}
.chip{height:42px;padding:0 16px;border-radius:14px;box-shadow:0 1px 2px rgba(15,18,34,.04)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--ink)) 92%,#000),color-mix(in srgb,var(--c,var(--ink)) 70%,#000));color:#fff;border-color:transparent;box-shadow:0 10px 22px -10px var(--c,var(--ink))}
.chip[aria-pressed="true"] em{color:#fff;opacity:.8}
.seg{background:color-mix(in srgb,var(--bg3) 85%,transparent);border:1px solid var(--line)}
.grid{gap:22px}
.card{border-radius:22px;border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:0 1px 2px rgba(15,18,34,.05),0 14px 30px -18px rgba(15,18,34,.28);animation:rise .5s both}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,transparent));z-index:2}
.card:hover{transform:translateY(-5px);box-shadow:0 2px 4px rgba(15,18,34,.06),0 26px 44px -22px color-mix(in srgb,var(--c) 55%,rgba(15,18,34,.4))}
.media::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(180deg,transparent,rgba(5,7,15,.55));pointer-events:none}
.media .pill{z-index:2;background:rgba(10,12,20,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);height:28px}
.media .plat{z-index:2}
.title{font-size:17px;font-weight:750;letter-spacing:-.015em}
.av{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c));color:#fff;border-radius:8px}
.cfoot{border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.feat{border-radius:28px;min-height:460px}
.feat h2{font-size:clamp(26px,3.2vw,42px);text-shadow:0 2px 18px rgba(0,0,0,.35)}
.feat::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 15% 100%,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%);z-index:-1}
.side{border-radius:28px;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(12px)}
.side a{transition:.15s}.side a:hover{padding-left:6px}
.more{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;box-shadow:0 14px 28px -14px var(--ac)}
.more:hover{color:#fff;filter:brightness(1.08)}
.compact{border-radius:22px}
.row{border-left:3px solid transparent}.row:hover{border-left-color:var(--c)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card:nth-child(2){animation-delay:.03s}.card:nth-child(3){animation-delay:.06s}.card:nth-child(4){animation-delay:.09s}.card:nth-child(5){animation-delay:.12s}.card:nth-child(6){animation-delay:.15s}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
/* Dergi düzeni: ilk iki haber geniş, gerisi ızgara. */
.grid.dergi{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.dergi .card:nth-child(-n+2){grid-column:span 2}
.dergi .card:nth-child(-n+2) .media{aspect-ratio:21/9}
.dergi .card:nth-child(-n+2) .title{font-size:24px}
@media (max-width:640px){.dergi .card:nth-child(-n+2){grid-column:auto}.dergi .card:nth-child(-n+2) .media{aspect-ratio:16/9}}
/* Renk paletleri (Klasik = varsayılan). Koyu/açık tema düğmesiyle birlikte çalışır. */
:root[data-palette="gece"]{--bg:#0b1220;--bg2:#121b2e;--bg3:#1a2540;--ink:#e6edf7;--ink2:#a3b1c9;--ink3:#6f7f9c;--line:#24314d;--ac:#38bdf8;--glass:rgba(18,27,46,.72)}
:root[data-palette="kagit"]{--bg:#f5efe3;--bg2:#fbf7ef;--bg3:#efe7d6;--ink:#2a2118;--ink2:#6b5c48;--ink3:#9a8a72;--line:#e3d8c3;--ac:#b45309;--glass:rgba(251,247,239,.72)}
:root[data-palette="okyanus"]{--bg:#eef8f7;--bg2:#ffffff;--bg3:#dff1ef;--ink:#0b2b2b;--ink2:#3f6b69;--ink3:#7aa3a1;--line:#cfe6e3;--ac:#0d9488;--glass:rgba(255,255,255,.72)}

/* Inoreader tarzı düzen: sol klasör kenar çubuğu + liste */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;align-items:start;max-width:1400px}
.rail{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:12px 10px}
.rail-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:4px 10px 8px}
.rail .chips{flex-direction:column;overflow:visible;padding:0;gap:2px}
.rail .chip{width:100%;height:auto;min-height:38px;padding:8px 12px;border-radius:10px;border-color:transparent;background:transparent;box-shadow:none;justify-content:space-between}
.rail .chip[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink);border-color:transparent}
.main{min-width:0}
.bar .row2{flex-wrap:wrap}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{position:static;max-height:none}.rail .chips{flex-direction:row;overflow-x:auto}.rail .chip{width:auto}}
</style>
</head>

THRBV4VG55ATOCFDKI6P76M/","d":"2026-11-01T03:03:00+00:00","s":"中小ベンチャー企業部は1日、スマート技術の支援を受けた小商工人の事業所1万2000カ所を点検すると発表した。同部はキオスク、テーブルオーダー（注文）、配膳ロボットなどを小商工人が導入できるよう支援している。デジタル機器を購入またはレンタルする費用を提供する方式だ。","i":"https://www.chosun.com/resizer/v2/HE3TEMZRGM3WIMJSGJTDIOLCMI.jpg?auth=d0b6f6bbfa09a810a27ae7f5ed3f3161fa06fafafa4e90366138dfb546dfd1db&smart=true&width=1411&height=934"},{"t":"イ・ソヨン中小ベンチャー企業部長官、慶尚圏の産業現場を訪問","l":"https://www.chosun.com/jp/economy-jp/2026/11/01/IR34BHI3DFGA3DDGVV3APYTHIA/","d":"2026-11-01T03:02:00+00:00","s":"イ・ソヨン中小ベンチャー企業部長官が最近、蔚山と慶北で中小企業や地域商圏などを訪問したことが1日、分かった。中小ベンチャー企業部は、イ長官が先月30日から31日まで1泊2日の日程で現場訪問を続けたと明らかにした。","i":"https://www.chosun.com/resizer/v2/MYYDOMJYMNTDCOJUGZSGINDFGQ.jpg?auth=4d82ccef4a55747aeb3bfe8d44d4f39c1ff0c8bb033670aa621e1034d1de4dc6&smart=true&width=5000&height=3333"},{"t":"이소영 장관, 1박2일 경상권 산업 현장 방문","l":"https://www.chosun.com/economy/smb-venture/2026/11/01/GY3TIMRRGQ2WMOLDGEYGMNTGGE/","d":"2026-11-01T03:02:00+00:00","s":"이소영 중소벤처기업부 장관은 최근 울산과 경북에서 중소기업과 지역 상권 등을 방문한 것으로 1일 나타났다. 중기부는 이 장관이 지난달 30일부터 31일까지 1박 2일 현장 행보를 이어갔다고 밝혔다.","i":"https://www.chosun.com/resizer/v2/MYYDOMJYMNTDCOJUGZSGINDFGQ.jpg?auth=4d82ccef4a55747aeb3bfe8d44d4f39c1ff0c8bb033670aa621e1034d1de4dc6&smart=true&width=5000&height=3333"},{"t":"한국거래소, 저PBR 151곳 첫 공개…증권사 앱에 꼬리표","l":"https://www.chosun.com/economy/stock-finance/2026/11/01/MG6DOBKHIJGMJPLQ4JRGXVAJWI/","d":"2026-11-01T03:00:00+00:00","s":"주가가 회사 장부상 순자산에 크게 못 미치는 저PBR 기업 명단이 처음 공개됐다. PBR(주가순자산비율)은 시가총액을 자기자본(순자산)으로 나눈 것으로 이 값이 1배를 밑돌면 주식시장이 매긴 회사 가치가 장부상 재산보다 작다는 뜻이다. 1일 한국거래소는 코스피 96곳, 코스닥 55곳이 포함된 저PBR 기업 151곳을 최초로 선정해 공표했다.","i":"https://www.chosun.com/resizer/v2/GI3DAYTCMI4TAOJWMNSDCZBXGE.jpg?auth=626e8cdb06777c4e26805992ddf0045e3775428f1f1d4a7127f5cf751502df29&smart=true&width=3444&height=2242"},{"t":"韓国公取委、下請け技術情報で特許出願のハンセモビリティに4億2000万ウォン課徴金","l":"https://www.chosun.com/jp/economy-jp/2026/11/01/BIYXIA6HEBBENOHJFSTUKU6RXI/","d":"2026-11-01T03:00:00+00:00","s":"公正取引委員会は1日、自動車部品を製造する下請け業者の技術情報を流用し、特許を出願・登録したハンセモビリティに対し、是正命令と課徴金4億2000万ウォンを科したと発表した。","i":"https://www.chosun.com/resizer/v2/MFSWEYRZHAZWGMTEMJTGCYLGMU.jpg?auth=de2c6e6942cbd174869e7d34cc91eccd1164c8879f167839eeda2c4370c855bb&smart=true&width=5131&height=2995"},{"t":"韓国取引所、低PBR企業151社を初公表…証券会社アプリにタグ","l":"https://www.chosun.com/jp/economy-jp/2026/11/01/MDALXKW2ONEFFJJ2OGATBP2KQM/","d":"2026-11-01T03:00:00+00:00","s":"株価が会社の帳簿上の純資産を大きく下回る低PBR企業の名簿が初めて公開された。PBR（株価純資産倍率）は時価総額を自己資本（純資産）で割ったもので、この値が1倍を下回れば、株式市場が評価する企業価値が帳簿上の資産より小さいことを意味する。韓国取引所は1日、KOSPI上場96社、KOSDAQ上場55社を含む低PBR企業151社を初めて選定し、公表した。","i":"https://www.chosun.com/resizer/v2/GI3DAYTCMI4TAOJWMNSDCZBXGE.jpg?auth=626e8cdb06777c4e26805992ddf0045e3775428f1f1d4a7127f5cf751502df29&smart=true&width=3444&height=2242"},{"t":"하도급업체 기술정보 빼돌려 특허 출원까지...공정위, 한세모빌리티에 과징금 4억2000만원","l":"https://www.chosun.com/economy/economy_general/2026/11/01/WQA35RQSDVEJZHCRL6RSKRVZ5Q/","d":"2026-11-01T03:00:00+00:00","s":"공정거래위원회가 자동차 부품을 제조하는 하도급 업체의 기술 정보를 빼돌려 특허 출원·등록한 한세모빌리티에 대해 시정 명령과 과징금 4억2000만원을 부과했다고 1일 밝혔다.","i":"https://www.chosun.com/resizer/v2/MFSWEYRZHAZWGMTEMJTGCYLGMU.jpg?auth=de2c6e6942cbd174869e7d34cc91eccd1164c8879f167839eeda2c4370c855bb&smart=true&width=5131&height=2995"}]},"asahi":{"name":"朝日新聞","lang":"ja","cat":"world","plat":"web","url":"https://www.asahi.com/rss/asahi/newsheadlines.rdf","updated":"2026-11-01T03:40:47.041058+00:00","items":[{"t":"早大が首位独走で最終8区へ 国学院、青学など続く 全日本大学駅伝","l":"http://www.asahi.com/articles/ASVB03FCTVB0UTQP00TM.html?ref=rss","d":"2026-11-01T03:20:07+00:00","s":""},{"t":"熊本市長選が告示 4期目狙う現職と新顔4人が立候補届け出","l":"http://www.asahi.com/articles/ASVC10FR6VC1TIPE00CM.html?ref=rss","d":"2026-11-01T03:00:00+00:00","s":""}]},"yahoojp":{"name":"Yahoo!ニュース","lang":"ja","cat":"world","plat":"web","url":"https://news.yahoo.co.jp/rss/topics/top-picks.xml","updated":"2026-11-01T03:40:47.041058+00:00","items":[{"t":"歩行者5人はねられ1人重傷 宮城","l":"https://news.yahoo.co.jp/pickup/6600926?source=rss","d":"2026-11-01T03:20:01+00:00","s":""},{"t":"「しょまりん」デビュー戦は4位"," <script>

function allItems(){
  const out=[],now=Date.now();
  for(const [sid,f] of Object.entries(feeds)){
    if(hidden.has(sid))continue;
    const fb=f.updated?Date.parse(f.updated):now;
    for(const it of f.items||[]){
      const ts=it.d?Date.parse(it.d):fb;
      out.push({id:hash(it.l),sid,src:it.p||f.name||sid,lang:f.lang,plat:f.plat||"web",cat:it.c||f.cat,t:stripSrc(it.t,it.p),l:it.l,s:it.s||"",i:it.i,ts:Math.min(ts||fb,now)});
    }
  }
  const seen=new Map(),res=[];
  for(const x of out){
    const key=x.id,tk=x.t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"").slice(0,70);
    let j=seen.get(key);if(j===undefined&&tk.length>25)j=seen.get("t"+tk);
    if(j!==undefined){if(!res[j].i&&x.i)res[j]=x;continue}
    seen.set(key,res.length);if(tk.length>25)seen.set("t"+tk,res.length);res.push(x);
  }

}
const langOK=x=>lang==="all"||(lang==="tren"?(x.lang==="tr"||x.lang==="en"):(lang==="other"?group(x.lang)==="other":x.lang===lang));

   +CATS.filter(([k])=>cc[k]||cat===k).map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${cat===k}" style="--c:${colorOf(k)}"><span class="d">${EMO[k]||""}</span>${l}<em>${(cc[k]||0).toLocaleString("tr-TR")}</em></button>`).join("")

/* Cevirmen: Chrome'un tarayici ici Translator API'si (ucretsiz, anahtarsiz).
   Yoksa Google Translate sayfasina acilir. */
const trCache={};
async function trText(text,src){
  const key=src+"|"+text;if(trCache[key])return trCache[key];
  if("Translator" in self){
    try{
      const av=await Translator.availability({sourceLanguage:src,targetLanguage:"tr"});
      if(av!=="unavailable"){
        const t=await Translator.create({sourceLanguage:src,targetLanguage:"tr"});
        const out=await t.translate(text);trCache[key]=out;return out;
      }
    }catch(e){}
  }
  return null;
}
function gtUrl(text,src){return "https://translate.google.com/?sl="+encodeURIComponent(src||"auto")+"&tl=tr&op=translate&text="+encodeURIComponent(text)}
async function trCard(card){
  const t=card.querySelector(".title");const out=card.querySelector(".trres");if(!t||!out||out.dataset.done)return true;
  const r=await trText(t.textContent,card.dataset.lang||"en");
  if(r){out.textContent="TR: "+r;out.hidden=false;out.dataset.done="1";return true}
  return false;
}

  if(!ok){const t=card.querySelector(".title").textContent;window.open(gtUrl(t,card.dataset.lang),"_blank","noopener")}
},true);
async function trAll(){

  btn.disabled=true;btn.textContent="Çevriliyor…";let n=0;
  for(const c of cards){if(await trCard(c))n++}
  btn.disabled=false;btn.textContent="Görünenleri çevir";toast(n+" başlık çevrildi");
}

/* yenileme */
const plain=h=>{try{return (new DOMParser().parseFromString(h||"","text/html").body.textContent||"").replace(/\s+/g," ").trim()}catch(e){return""}};
function pdate(s){if(!s)return null;let d=new Date(s);if(isNaN(d)&&/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(s))d=new Date(s.replace(" ","T")+"Z");return isNaN(d)?null:d.toISOString()}
function parseXML(text){
  const doc=new DOMParser().parseFromString(text,"text/xml");if(doc.querySelector("parsererror"))throw new Error("xml");
  const out=[];
  for(const n of doc.querySelectorAll("item,entry")){
    let t="",l="",d=null,desc="",img="";
    for(const c of n.children){const k=c.localName,v=(c.textContent||"").trim();
      if(k==="title")t=plain(v);
      else if(k==="link"){const h=c.getAttribute("href")||v;if(h&&(!c.getAttribute("rel")||c.getAttribute("rel")==="alternate")&&!l)l=h}
      else if((k==="pubDate"||k==="published"||k==="updated"||k==="date")&&!d)d=pdate(v);
      else if((k==="description"||k==="summary"||k==="content"||k==="encoded")&&c.children.length===0&&v.length>desc.length)desc=v;
      else if((k==="thumbnail"||k==="content")&&c.getAttribute("url")&&!img&&(c.getAttribute("type")||"image").includes("image"))img=c.getAttribute("url");
      else if(k==="enclosure"&&(c.getAttribute("type")||"").includes("image")&&!img)img=c.getAttribute("url");}
    if(!img){const m=desc.match(/<img[^>]+src=["']([^"']+)/i);if(m)img=m[1].replace(/&amp;/g,"&")}
    if(!t&&desc)t=plain(desc).slice(0,110);
    if(t&&l)out.push({t,l,d,s:plain(desc).slice(0,200),i:/^https?:/.test(img)?img:undefined});
    if(out.length>=40)break;}
  if(!out.length)throw new Error("empty");return out;
}
async function get(url,ms){const ac=new AbortController(),h=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error(r.status);return r}finally{clearTimeout(h)}}
async function fetchFeed(url){
  const e=encodeURIComponent(url);
  const tries=[
    async()=>{const j=await (await get("https://api.rss2json.com/v1/api.json?rss_url="+e,15000)).json();if(j.status!=="ok")throw 0;
      return j.items.slice(0,40).map(x=>({t:plain(x.title),l:x.link,d:pdate(x.pubDate),s:plain(x.description).slice(0,200),i:x.thumbnail||(x.enclosure&&x.enclosure.link)||undefined})).filter(x=>x.t&&x.l)},
    async()=>parseXML(await (await get("https://corsproxy.io/?url="+e,10000)).text()),
    async()=>parseXML(await (await get("https://api.allorigins.win/raw?url="+e,10000)).text())];
  for(const f of tries){try{const r=await f();if(r&&r.length)return r}catch(e){}}
  throw new Error("fetch");
}
async function loadJson(){
  try{const r=await fetch("feeds.json?"+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();
    if(j&&j.feeds&&Object.keys(j.feeds).length){DEF=j.feeds;GEN=j.generated||GEN;return true}}catch(e){}return false}
async function refresh(){
  if(busy)return;busy=true;$("refresh").disabled=true;$("refresh").classList.add("spin");progress="Yenileniyor…";render();
  const fresh=await loadJson();buildFeeds();render();
  const stale=!GEN||Date.now()-Date.parse(GEN)>45*60e3;
  if(stale){
    const pri=Object.entries(DEF).filter(([id,f])=>!deleted.has(id)&&!hidden.has(id)&&["web","gnews"].includes(f.plat||"web")&&(id.startsWith("gn-tr")||id.startsWith("gnq-")||id.startsWith("gn-en")||["tr","world","tech","ios","mac","win","auto"].includes(f.cat)&&(f.lang==="tr"||f.lang==="en"))).map(([id])=>id).slice(0,70);
    let done=0,okc=0;const qq=pri.slice();
    const worker=async()=>{while(qq.length){const id=qq.shift();try{const items=await fetchFeed(DEF[id].url);live[id]={items,updated:new Date().toISOString()};okc++}catch(e){}
      done++;if(done%4===0||!qq.length){progress=`Canlı çekiliyor ${done}/${pri.length}`;buildFeeds();render()}}};
    await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
    buildFeeds();render();
    if(okc===0)toast("Sunucu verisi bayat ve canlı çekim engellendi: GitHub Actions çalışmıyor olabilir");
  }
  const ids=Object.keys(custom).filter(id=>!hidden.has(id));
  for(let i=0;i<ids.length;i++){progress=`Eklediğin kaynaklar ${i+1}/${ids.length}`;render();
    try{const items=await fetchFeed(custom[ids[i]].url);cache[ids[i]]={items,updated:new Date().toISOString()}}catch(e){}buildFeeds();}
  store.set("cache",cache);busy=false;progress="";$("refresh").disabled=false;$("refresh").classList.remove("spin");render();
  toast(fresh?(stale?"Canlı kaynaklarla güncellendi":"Akış yenilendi"):(location.protocol==="file:"?"Dosyadan açıldı: hazır kopya":"feeds.json okunamadı: hazır kopya"));
}
$("refresh").onclick=refresh;
setInterval(()=>{if(!busy&&!document.hidden)refresh()},10*60*1000);

/* kaynaklar penceresi */
function renderSources(){
  const groups={};for(const [id,f] of Object.entries(feeds)){const g=(f.plat&&f.plat!=="web")?"p:"+f.plat:f.lang;(groups[g]=groups[g]||[]).push([id,f])}
  const label=g=>g.startsWith("p:")?PLAT[g.slice(2)]||g:LANG[g]||g;
  const rank=g=>g==="tr"?-3:g==="en"?-2:g.startsWith("p:")?5:0;
  const order=Object.keys(groups).sort((a,b)=>rank(a)-rank(b)||label(a).localeCompare(label(b)));
  $("srclist").innerHTML=order.map(g=>`<h4>${esc(label(g))} · ${groups[g].length}</h4>`+groups[g].sort((a,b)=>(a[1].cat||"").localeCompare(b[1].cat||"")||a[1].name.localeCompare(b[1].name)).map(([id,f])=>
    `<div class="src-r"><label><input type="checkbox" data-id="${esc(id)}" ${hidden.has(id)?"":"checked"}><span class="n">${esc(f.name)}</span></label><span class="c">${esc(CAT[f.cat]||f.cat)} · ${(f.items||[]).length}</span><button class="x" data-del="${esc(id)}">Sil</button></div>`).join("")).join("");
}

$("srclist").addEventListener("change",e=>{const id=e.target.dataset.id;if(!id)return;e.target.checked?hidden.delete(id):hidden.add(id);store.set("hidden",[...hidden]);render()});

  if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Emin misin?";setTimeout(()=>{b.dataset.arm="";b.textContent="Sil"},3000);return}
  delete custom[id];delete cache[id];deleted.add(id);store.set("custom",custom);store.set("deleted",[...deleted]);store.set("cache",cache);buildFeeds();render();toast("Kaynak silindi")});
$("a-lang").innerHTML=Object.entries(LANG).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");

$("addform").addEventListener("submit",async e=>{e.preventDefault();
  const name=$("a-name").value.trim(),url=$("a-url").value.trim(),l=$("a-lang").value,c=$("a-cat").value;
  const id=(name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"kaynak")+"-"+hash(url).slice(0,4);
  const btn=e.submitter;if(btn)btn.disabled=true;
  try{const items=await fetchFeed(url);custom[id]={name,url,lang:l,cat:c,plat:"web"};cache[id]={items,updated:new Date().toISOString()};
    store.set("custom",custom);store.set("cache",cache);buildFeeds();$("addform").reset();render();toast(`${name} eklendi (${items.length} haber)`)}
  catch(err){toast("Bu adresten akış okunamadı. Adresin RSS/Atom olduğundan emin ol.")}
  if(btn)btn.disabled=false;});
$("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({custom,deleted:[...deleted],hidden:[...hidden],saved},null,2)],{type:"application/json"}));a.download="akis-ayarlar.json";a.click()};
$("import").onclick=()=>$("file").click();
$("file").onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());custom=j.custom||{};deleted=new Set(j.deleted||[]);hidden=new Set(j.hidden||[]);saved=j.saved||saved;
  store.set("custom",custom);store.set("deleted",[...deleted]);store.set("hidden",[...hidden]);store.set("saved",saved);buildFeeds();render();toast("İçe aktarıldı")}catch(err){toast("Dosya okunamadı")}e.target.value=""};
$("reset").onclick=()=>{const b=$("reset");if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Emin misin?";setTimeout(()=>{b.dataset.arm="";b.textContent="Varsayılana dön"},3000);return}
  custom={};deleted=new Set();hidden=new Set();store.set("custom",{});store.set("deleted",[]);store.set("hidden",[]);buildFeeds();render();toast("Varsayılan kaynaklar geri geldi")};

buildFeeds();render();refresh();
</script>
