<style>

.zc{position:relative;margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--cz)}.zc li{position:relative;padding:0 0 9px 0;font-size:12.5px}.zc li:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--vg2)}.zc time{color:var(--sk);font-size:11.5px;display:block}
.bt{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.btn{padding:5px 10px;border:1px solid var(--cz);border-radius:7px;font-weight:650;font-size:12px;background:var(--yz)}.btn:hover{border-color:var(--vg);color:var(--vg)}.btn.p{background:var(--vg);border-color:var(--vg);color:var(--bg)}.btn.p:hover{color:var(--bg);opacity:.9}.btn[aria-pressed=true]{border-color:var(--vg);color:var(--vg);background:var(--vgy)}

.say-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:0 0 12px}.say-k button{padding:9px 10px;border:1px solid var(--cz);border-radius:9px;background:var(--yz);text-align:left}.say-k button[aria-pressed=true]{border-color:var(--vg)}.say-k b{display:block;font-size:20px;color:var(--ink);line-height:1.1}.say-k span{font-size:11.5px;color:var(--sk);font-weight:600}

pre.kod{margin:6px 0;padding:9px 11px;border-radius:8px;background:var(--yz2);overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx);white-space:pre-wrap;word-break:break-all}

 .rk-ust{grid-template-columns:54px minmax(0,1fr)}.rk-ust .puan{grid-column:1/3;width:auto;height:auto;padding:6px;flex-direction:row;gap:8px;justify-content:flex-start;font-size:16px}.rk dl{grid-template-columns:1fr}.rk dt{margin-top:4px}.kb-bar{grid-template-columns:110px 1fr 28px}
 .sag{width:100vw}.ol{grid-template-columns:repeat(2,auto)}
}

子物理实验，创造了迄今为止人类实现的最低温度纪录。研究人员成功将约2万枚铷原子冷却至接近绝对零度的极端状态，其等效温度估计仅为绝对零度以上9.7皮开尔文（0.0000000000097开尔文），比此前保持的38皮开尔文纪录低了约四倍。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1109/da6352ebaf1f955.webp"},{"t":"法国公布2040年代未来战舰概念：激光武器、电磁轨道炮与无人集群成核心战力","l":"https://www.cnbeta.com.tw/articles/tech/1585534.htm","p":"cnBeta.COM","d":"2026-11-09T05:38:36+00:00","s":"法国造船企业海军集团（Naval Group）近日公开展示了一款面向2040年代海战环境设计的新一代战舰概念方案“SCX 26”。这艘未来舰艇采用罕见的双舰岛结构设计，并整合激光武器、电磁轨道炮以及大规模无人作战系统，旨在应对未来海上战场日益严峻的导弹饱和攻击和无人机蜂群威胁。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1109/00eb14461cce9f3.webp"},{"t":"AMD显卡驱动程序被爆严重问题 每月可写入13TB数据影响固态硬盘寿命","l":"https://www.cnbeta.com.tw/articles/tech/1585532.htm","p":"cnBeta.COM","d":"2026-11-09T05:36:36+00:00","s":"近期部分 AMD 用户发现即便电脑处在空闲状态，显卡驱动的后台进程也会持续向系统盘写入数据。有用户观察到的情况是 AMD 显卡驱动程序后台进程以每秒 5MB 的速率进行数据写入，其他用户则观察到每秒写入数百 KB 到 1MB 以上的数据。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1109/f7d7d4d67539310.jpg"},{"t":"开发者玩梗编写内存检测脚本 检测电脑剩余内存并发邮件向萨姆奥尔特曼汇报","l":"https://www.cnbeta.com.tw/articles/tech/1585530.htm","p":"cnBeta.COM","d":"2026-11-09T05:35:02+00:00","s":"萨姆奥尔特曼此前关于个人电脑内存利用率的言论引起争议，奥尔特曼称将大量内存放在个人电脑上是浪费，因为这些内存大多数时间都是空闲状态。而 AI 数据中心急需更多内存，在内存短缺的背景下，将内存集中到云端数据中心才可以提高效率。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/805a85326f50e48.png"}]},"ithome":{"name":"IT之家","lang":"zh","cat":"tech","plat":"web","url":"https://www.ithome.com/rss/","updated":"2026-11-09T05:44:06.439049+00:00","items":[{"t":"OPPO Pad Air6 平板配置曝光：12.1 英寸 LCD 屏 + 天玑 7360 芯片， 11 月 16 日发布","l":"https://www.ithome.com/1/024/213.htm","d":"2026-11-09T05:43:16+00:00","s":"IT之家 11 月 9 日消息，博主 @体验more 今日曝光了 OPPO Pad Air6 平板配置，这款新品将于 11 月 16 日 19:00 发布。 据爆料，新品搭载 天玑 7360 处理器 ，搭配 LPDDR5X + UFS3.1，提供 8GB+128GB/8GB+256GB/12GB+256GB 三个规格。机身正面配备 12.1 英寸 2.8K 120Hz LCD 大屏，提供奇遇蓝 /","i":"https://img.ithome.com/newsuploadfiles/2026/11/e75b9092-9286-440e-9a81-645401a5b717.png"},{"t":"夸克网盘 11.11 继续发车： SVIP 低至 7 元 / 月，支持每月 100 次离线下载","l":"https://www.ithome.com/1/024/212.htm","d":"2026-11-09T05:38:5
