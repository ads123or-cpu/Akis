*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--metin);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px;border-radius:4px}
.ust{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;background:var(--yuzey);border-bottom:1px solid var(--cizgi)}
.logo{font-weight:800;font-size:18px;color:var(--ink);letter-spacing:-.02em}

.ikon:hover{background:var(--yuzey2);color:var(--ink)}

.yan button:hover{background:var(--yuzey2)}
.yan button[aria-pressed=true]{background:var(--vurgu-yumusak);color:var(--vurgu);font-weight:650}

.ana-ust{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}

版》特别鸣谢名单","l":"https://www.cnbeta.com.tw/articles/game/1585120.htm","p":"cnBeta.COM","d":"2026-11-05T06:31:45+00:00","s":"《塞尔达：时之笛 重制版》公开片尾制作人员名单，Monolith Soft出现在“特别鸣谢”部分，确认该工作室曾协助本作开发。 阅读全文","i":"https://img.3dmgame.com/uploads/images/news/20261105/1793841513_761456_jpg_r.jpg"},{"t":"奥特曼回应内存分配言论争议：短暂改名“Ram Altman”自嘲","l":"https://www.cnbeta.com.tw/articles/funny/1585118.htm","p":"cnBeta.COM","d":"2026-11-05T06:25:45+00:00","s":"据《商业内幕》报道，OpenAI CEO萨姆·奥特曼(Sam Altman)曾短暂将自己在X上的名字改为“Ram Altman”。RAM指的是内存。此前，奥特曼就内存资源如何分配发表了争议性言论，被网友调侃对电脑内存的需求胃口太大。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/805a85326f50e48.png"},{"t":"Anthropic公布Claude生物学研究成果：首次解析新型蛋白质结构 3天实验缩短至90分钟","l":"https://www.cnbeta.com.tw/articles/tech/1585116.htm","p":"cnBeta.COM","d":"2026-11-05T06:24:00+00:00","s":"11月5日，Anthropic公布了旗下AI模型Claude在生物学研究领域的最新成果。该公司研究团队在Claude协助下，首次解析出在原核细胞中构建的Vault（穹窿颗粒）三维结构，并将原本需要约3天的蛋白质颗粒纯化流程缩短至90分钟。Claude还参与了蛋白质数据库检索、DNA构建设计和冷冻电镜数据分析等多个科研环节。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/69f06b1e841e2d3.png"},{"t":"离职消息公布仅一天 Claude Code负责人宣布加盟OpenAI","l":"https://www.cnbeta.com.tw/articles/tech/1585114.htm","p":"cnBeta.COM","d":"2026-11-05T06:22:40+00:00","s":"据《商业内幕》报道，Anthropic旗下AI编程工具Claude Code前产品负责人Cat Wu已宣布加入OpenAI，将领导其核心产品团队的产品管理工作。OpenAI已向该媒体确认这一消息。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/b281c34dadc3ae9.png"},{"t":"大一新生手机丢沙漠 埋了一个多月后意外被捡到","l":"https://www.cnbeta.com.tw/articles/tech/1585112.htm","p":"cnBeta.COM","d":"2026-11-05T06:21:55+00:00","s":"据“阿拉尔发布”公众号消息，塔里木大学一名大一新生的苹果手机遗失在沙漠中一个多月，近日意外被找回。 9月16日，这名大一新生随军训徒步队伍，在沙漠之门重走沙海老兵路时不慎丢失手机。手机内存储了近400G照片与视频，全是他入学前的珍贵回忆。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/34613696801f0cb.png"},{"t":"OpenAI自曝GPT-6 Astra异常行为：做安全研究时“暗中少干活” 任务完成度低近四成","l":"https://www.cnbeta.com.tw/articles/tech/1585110.htm","p":"cnBeta.COM","d":"2026-11-05T06:21:35+00:00","s":"OpenAI在11月4日更新的一份研究报告中披露，其旗舰模型GPT-6 Astra在执行人工智能安全研究任务时，出现了一种令人担忧的异常行为：模型会在不明确告知用户的情况下，减少工作量、放弃有效方案，甚至制造并不存在的技术障碍。 阅读 922680054\" style=\"box-sizing: border-box;border-width: 0px;border-style: solid;vertical-align: middle;display: block;min-width: 100%;position: static;visibility: visible;width: 550px;height: 1085px;flex-grow: 1\"><\/iframe><\/p><p>X首席工程师Yagiz Nizipli在介绍更新内容的博文中表示，新版网页应用在性能方面实现了显著提升，尤其是在网络连接条件较差的环境下效果更加明显。根据X公布的数据，当用户通过较慢的网络打开个人主页时，旧版网页应用需要等待超过22秒才能看到首条帖子内容，而新版网页应用将这一时间缩短至约2.7秒。<\/p><p>为了实现性能提升，X对底层架构进行了大规模调整。开发团队将此前分别服务于普通用户访问、搜索引擎爬虫以及链接预览功能的三套独立服务器体系整合为统一架构，从而减少系统复杂度并提高资源利用效率。<\/p><p><img src=\"https://static.cnbetacdn.com/article/2026/1105/732c2a18884bad7.jpg"},{"t":"Windows 11画图工具曝出高危“零点击”漏洞 开启自动更新也可能尚未安装安全补丁","l":"https://www.cnbeta.com.tw/articles/tech/1585094.htm","p":"cnBeta.COM","d":"2026-11-05T05:49:24+00:00","s":"微软Windows 11自带的画图工具（Microsoft Paint）近日被发现存在一项严重安全漏洞。攻击者在特定条件下，只需向受影响设备发送经过特殊构造的网络数据包，就可能在用户毫无察觉、甚至不需要点击任何文件或链接的情况下，远程执行恶意代码。更令人困惑的是，微软虽然已经发布了修复补丁，但部分用户即使开启了Microsoft Store自动更新，仍然无法获得相应更新。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/b7e4ad042642446.jpg"},{"t":"苹果收紧内部AI开支 部分员工使用额度或大幅下调","l":"https://www.cnbeta.com.tw/articles/tech/1585092.htm","p":"cnBeta.COM","d":"2026-11-05T05:46:57+00:00","s":"苹果公司近期开始对内部人工智能工具的使用成本进行更加严格的控制。根据多家媒体援引知情人士的消息报道，苹果已下调部分员工的AI使用预算，希望在持续推进人工智能战略的同时控制不断增长的运营支出。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0619/8ba602f4fedc371.jpg"},{"t":"美国中期选举后各地数据中心建设或将迎来更大阻力","l":"https://www.cnbeta.com.tw/articles/tech/1585090.htm","p":"cnBeta.COM","d":"2026-11-05T05:46:29+00:00","s":"美国2026年中期选举结束后，数据中心建设可能成为美国政治和科技产业下一轮冲突的焦点。随着民主党在国会选举中取得两院控制权，而共和党仍掌握白宫，美国政府内部围绕人工智能基础设施的政策分歧可能进一步扩大。此次选举也显示，围绕数据中心耗电、环境污染、电价上涨以及地方社区缺乏决策权的反对声音，已经从局部抗议发展成为具有全国影响力的政治议题。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0921/5b98fb500107b8c.jpg"},{"t":"研究揭示蜜蜂拥有类似免疫系统的防御机制 还会利用天然材料抵御病原体","l":"https://www.cnbeta.com.tw/articles/science/1585088.htm","p":"cnBeta.COM","d":"2026-11-05T05:45:47+00:00","s":"蜜蜂蜂群不仅依靠单只蜜蜂的免疫能力抵御疾病，整个蜂巢本身也可能构成一套高度组织化的集体防御系统。澳大利亚悉尼大学研究团队的一项最新研究发现，蜂蜜、蜂蜡、蜂胶、花粉以及蜜蜂自身分泌的物质，能够按照蜂巢内部不同区域形成多层次的抗菌屏障。这种结构化防御机制与动物免疫系统有着令人惊讶的相似之处。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/3d04103e9c1add7.jpg"}]},"abc-news":{"name":"ABC News","lang":"en","cat":"world","plat":"web","url":"https://abcnews.go.com/abcnews/topstories","updated":"2026-11-05T10:21:30.709795+00:00","items":[{"t":"Judges to hear Trump's appeal of 2024 criminal hush money conviction","l":"https://abcnews.com/US/judges-hear-trumps-appeal-2024-criminal-hush-money/story?id=137859786","d":"2026-11-05T10:15:47+00:00","s":"Two and a half years after a jury convicted Donald Trump of 34 felony counts in his hush money case, the president's lawyers are seeking to have the verdict overturned.","i":"https://s.abcnews.com/images/US/donald-trump-1-rt-gmh-261104_1793814688050_hpMain_4x3t_384.jpg"}]},"yenicag":{"name":"Yeniçağ","lang":"tr","cat":"tr","plat":"web","url":"https://www.yenicaggazetesi.com.tr/rss","updated":"2026-11-05T10:21:30.709795+00:00","items":[{"d":"2026-11-05T10:15:13+00:00","t":"Bob Dylan, Papa 14. Leo ile Vatikan'da bir araya geldi","l":"https://www.yenicaggazetesi.com/bob-dylan-papa-14-leo-ile-vatikanda-bir-araya-geldi-1088360h.htm","s":"Nobel Edebiyat Ödüllü Bob Dylan, Roma'daki turnesi sırasında Papa 14. Leo tarafından Vatikan'da kabul edildi. Görüşmede iki isim hediye alışverişinde bulunurken, sanatçının yıllar önce yazdığı savaş k","i":"https://img.yenicaggazetesi.com/rcman/Cw150h84q95gc/storage/files/images/2026/11/05/bob-dylan-papa-14-leo-ile-vatikanda-bir-araya-geldi-2fl9.jpg"},{"d":"2026-11-05T10:08:11+00:00","t":"Nestlé Türkiye, COP31'de sürdürülebilirlik çalışmalarını tanıtacak","l":"https://www.yenicaggazetesi.com/nestle-turkiye-cop31de-surdurulebilirlik-calismalarini-tanitacak-1088359h.htm","s":"Nestlé Türkiye, COP31 kapsamında sürdürülebilir gıda sistemleri ve iklim hedeflerine yönelik çalışmalarını uluslararası paydaşlarla paylaşacak. Şirket, Onarıcı Tarım ve Genç İşi Tarım programlarıyla T","i":"https://img.yenicaggazetesi.com/rcman/Cw150h84q95gc/storage/files/images/2026/11/05/nest }

  var filtre=cipler(S.dil,[['hepsi','Tüm diller'],['tr','Türkçe'],['en','Yabancı'],['zh','Çince']],'dil')+cipler(S.saat,[[6,'6 saat'],[24,'24 saat'],[72,'3 gün']],'saat');
  if(S.sekme==='gundem'){
    h='<div class="ana-ust"><h1>Gündem</h1>'+filtre+'</div>'+liste(suz(M.kumeler),'Bu süzgeçte haber yok.');
  }else if(S.sekme==='reels'){

  }else{
    var sg=M.saglik||{},kl2=M.kaynaklar.slice().sort(function(a,b){return(a.son||'')<(b.son||'')?-1:1});
    h='<div class="ana-ust"><h1>Kaynaklar</h1></div><p class="bilgi">'+(sg.kaynak||0)+' kaynak: '+(sg.basarili||0)+' çalışıyor, '+(sg.bayat||0)+' bu tur yanıt vermedi, '+(sg.beklemede||0)+' beklemede. 12 saatten eski kopya akışa girmez. En eski güncellenen en üstte.</p><div class="kaz"><table class="tablo"><thead><tr><th>Kaynak</th><th>Bölüm</th><th>Son haber</th><th>Durum</th></tr></thead><tbody>'+kl2.map(function(k){return'<tr><td>'+x(k.ad)+'</td><td>'+x(k.cat)+'</td><td>'+(k.son?kac(Date.parse(k.son)/1000)+' önce':'–')+'</td><td>'+(k.bayat?'Yanıt vermedi':'Çalışıyor')+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  a.innerHTML=h;
}
function git(s){S.sekme=s;S.adet=40;S.secili=-1;S.konu='hepsi';if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);ciz();window.scrollTo(0,0)}
function sekmeCiz(){
  $('sekmeler').innerHTML=SEKME.map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('alt').innerHTML=SEKME.slice(0,4).map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1].replace('Son haberler','Son').replace('Kaydedilenler','Kayıtlı')+'</button>'}).join('');
}
function bul(id){var m=M.kumeler.concat(sonHaberler()).filter(function(c){return c.id===id})[0];return m||kayit[id]}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-sekme],[data-konu],[data-dil],[data-saat],[data-tur],[data-kat],[data-ac],[data-kaydet],[data-gorunum],#daha,#tema,[data-okundu]');
  if(!t)return;var d=t.dataset;
  if(d.okundu){okundu[d.okundu]=1;var ks=Object.keys(okundu);if(ks.length>1500)delete okundu[ks[0]];yaz('akis-okundu',okundu);return}
  if(d.sekme)return git(d.sekme);
  if(d.konu){S.konu=d.konu;S.adet=40}
  else if(d.dil)S.dil=d.dil;
  else if(d.saat)S.saat=+d.saat;
  else if(d.tur)S.tur=d.tur;
  else if(d.gorunum){S.gorunum=d.gorunum;yaz('akis-gorunum',S.gorunum)}
  else if(d.kat){S.kat=d.kat;S.adet=40}
  else if(d.ac)S.acik[d.ac]=!S.acik[d.ac];
  else if(d.kaydet){if(kayit[d.kaydet])delete kayit[d.kaydet];else{var c=bul(d.kaydet);if(c)kayit[d.kaydet]=c}yaz('akis-kayit',kayit)}
  else if(t.id==='daha')S.adet+=40;
  else if(t.id==='tema'){var r=document.documentElement,kz=matchMedia('(prefers-color-scheme:dark)').matches,su=r.dataset.tema||(kz?'koyu':'acik'),yn=su==='koyu'?'acik':'koyu';r.dataset.tema=yn;try{localStorage.setItem('akis-tema',yn)}catch(er){}return}
  ciz();
});
var zm;$('ara').addEventListener('input',function(){clearTimeout(zm);var v=this.value;zm=setTimeout(function(){S.q=v;S.adet=40;ciz()},150)});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var h=e.target.tagName;
  if(h==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  if(e.key==='/'){e.preventDefault();$('ara').focus();return}
  if((e.key==='j'||e.key==='k')&&GORUNEN.length){S.secili=Math.min(GORUNEN.length-1,Math.max(0,S.secili+(e.key==='j'?1:-1)));ciz();var el=document.querySelector('.kart.secili');if(el)el.scrollIntoView({block:'center'});return}
  var c=GORUNEN[S.secili];if(!c)return;
  if(e.key==='o'||e.key==='Enter')window.open(c.l,'_blank','noopener');
  if(e.key==='s'){if(kayit[c.id])delete kayit[c.id];else kayit[c.id]=c;yaz('akis-kayit',kayit);ciz()}
});
function durumYaz(){
  var g=M.generated||SNAP.generated,el=$('durum');if(!g)return;
  var z=Date.parse(g)/1000,dk=(Date.now()/1000-z)/60;
  el.textContent=(dk>90?'Güncellenmedi: ':'Güncellendi: ')+kac(z)+' önce';el.classList.toggle('eski',dk>90);
}
sekmeCiz();
fetch('masa.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){M=j;durumYaz();var h=location.hash.slice(1);git(SEKME.some(function(t){return t[0]===h})?h:'gundem')}).catch(function(){durumYaz();$('ana').innerHTML='<div class="bos">Masa verisi yüklenemedi. Son haberler yine çalışır.</div>';S.sekme='son';ciz()});
})();
</script>
