<style>

.zc{position:relative;margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--cz)}.zc li{position:relative;padding:0 0 9px 0;font-size:12.5px}.zc li:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--vg2)}.zc time{color:var(--sk);font-size:11.5px;display:block}
.bt{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.btn{padding:5px 10px;border:1px solid var(--cz);border-radius:7px;font-weight:650;font-size:12px;background:var(--yz)}.btn:hover{border-color:var(--vg);color:var(--vg)}.btn.p{background:var(--vg);border-color:var(--vg);color:var(--bg)}.btn.p:hover{color:var(--bg);opacity:.9}.btn[aria-pressed=true]{border-color:var(--vg);color:var(--vg);background:var(--vgy)}

.say-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:0 0 12px}.say-k button{padding:9px 10px;border:1px solid var(--cz);border-radius:9px;background:var(--yz);text-align:left}.say-k button[aria-pressed=true]{border-color:var(--vg)}.say-k b{display:block;font-size:20px;color:var(--ink);line-height:1.1}.say-k span{font-size:11.5px;color:var(--sk);font-weight:600}

pre.kod{margin:6px 0;padding:9px 11px;border-radius:8px;background:var(--yz2);overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx);white-space:pre-wrap;word-break:break-all}

 .rk-ust{grid-template-columns:54px minmax(0,1fr)}.rk-ust .puan{grid-column:1/3;width:auto;height:auto;padding:6px;flex-direction:row;gap:8px;justify-content:flex-start;font-size:16px}.rk dl{grid-template-columns:1fr}.rk dt{margin-top:4px}.kb-bar{grid-template-columns:110px 1fr 28px}
 .sag{width:100vw}.ol{grid-template-columns:repeat(2,auto)}
}

  $('senk-m').innerHTML='<span class="gizle-m">Son senkron </span>'+new Date(g*1000).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+' · '+agoS(yas)+'<span class="gizle-m"> önce</span>';
  el.className='chip'+(yas>5400?' eski':'');
  var sd=OZ.kaynak_durum||{},top=0,ok=sd.aktif||0;Object.keys(sd).forEach(function(k){if(k!=='devre-disi')top+=sd[k]});var oran=ok/Math.max(1,top);
  $('saglik-m').textContent=ok+'/'+top+' kaynak sağlıklı';$('saglik').className='chip dugme gizle-m '+(oran>=.9?'ok':oran>=.7?'uyari':'kotu');
  var yn=(OZ.son||[]).filter(function(c){return c.son>ZY.onceki}).length,b=$('yeni');if(yn>0){b.hidden=false;b.textContent=yn+' yeni'}else b.hidden=true;
  $('sirit').innerHTML=(OZ.yukselen||[]).slice(0,3).map(function(c){return '<button class="chip dugme" data-act="ac-konu" data-id="'+c.id+'" title="'+esc(c.t)+'">▲ '+esc(c.t.slice(0,34))+'…</button>'}).join('')}
function ciz(){
  menu();ust();var h='',el=$('orta');document.querySelector('.duzen').classList.toggle('tam',['kaynak','ayar','kayit'].indexOf(S.sayfa)>=0&&!S.q);

  else if(S.sayfa==='merkez')h=sayfaMerkez();else if(S.sayfa==='alan')h=sayfaAlan();else if(S.sayfa==='reels')h=sayfaReels();else if(S.sayfa==='kaynak')h=sayfaKaynak();else if(S.sayfa==='kayit')h=sayfaKayit();else h=sayfaAyar();
  var sy=window.scrollY,ae=document.activeElement&&document.activeElement.id;
  el.innerHTML=h;if(ae&&$(ae)&&$(ae).tagName==='INPUT'){var x=$(ae);x.focus();try{x.setSelectionRange(x.value.length,x.value.length)}catch(e){}}
  sagPanel()}
function yukle(a){
  if(a==='reels'&&!REELS)return getJ('reels.json').then(function(j){REELS=j;j.adaylar.forEach(function(r){REG[r.id]=Object.assign({alanlar:r.alanlar,kb:r.kb,ks:r.ks,ilk:r.ilk},REG[r.id]||{},{id:r.id,t:r.t,l:r.l,i:r.i,son:r.son,og:REG[r.id]&&REG[r.id].og||r.og,oneri_baslik:r.oneri_baslik,hooklar:r.hooklar,aci:r.aci,neden_gundemde:r.neden_gundemde,carpici_ayrinti:r.carpici_ayrinti,turk_onemi:r.turk_onemi,dogrulama:r.dogrulama,risk:r.risk,puan:r.puan})})}).then(ciz);
  if(a==='kaynak'&&!KAYNAK)return getJ('kaynaklar.json').then(function(j){KAYNAK=j}).then(ciz);
  if(a==='indeks'&&!INDEKS)return getJ('indeks.json').then(function(j){INDEKS=j}).then(ciz);
  if(ALAN[a]&&!KUME[a])return getJ('kume-'+a+'.json').then(function(j){KUME[a]=j;j.kumeler.forEach(function(c){REG[c.id]=Object.assign(REG[c.id]||{},c)})}).then(ciz);
  return Promise.resolve()}
function git(){
  var qs=location.hash.split('?'),prm={};(qs[1]||'').split('&').forEach(function(x){var kv=x.split('=');if(kv[0])prm[kv[0]]=decodeURIComponent(kv[1]||'')});
  var h=qs[0].replace(/^#\/?/,'').split('/'),p=h[0]||'merkez';
  S.sayfa=['merkez','alan','reels','kaynak','kayit','ayar'].indexOf(p)>=0?p:'merkez';
  if(S.sayfa==='alan'){S.alan=ALAN[h[1]]?h[1]:'gundem';}
  S.adet=30;S.reelsAdet=20;S.alt=null;S.ek=null;S.kapsam='hepsi';S.sec=null;
  ciz();window.scrollTo(0,0);
  var bk=function(){if(prm.k)sec(prm.k)};
  if(prm.q){S.q=prm.q;$('ara').value=prm.q}
  if(S.sayfa==='alan')yukle(S.alan).then(bk);if(S.sayfa==='reels')yukle('reels').then(bk);if(S.sayfa==='kaynak')yukle('kaynak');if(S.q)yukle('indeks');if(S.sayfa==='merkez'||S.sayfa==='kayit')bk()}

function sec(id,scroll){
  S.sec=id;var c=bul(id);if(!c)return;okundu[id]=1;kisalt(okundu,1500);yaz('akis-okundu',okundu);
  if(!c.og||!c.og.length){var a=(c.alanlar||[])[0]||(c.a||[])[0];if(a&&ALAN[a]&&!KUME[a])yukle(a).then(function(){sagPanel()})}
  document.querySelectorAll('.secili').forEach(function(e){e.classList.remove('secili')});var e=document.querySelector('[data-id="'+id+'"]');
  document.querySelectorAll('[data-id="'+id+'"]').forEach(function(e){if(e.classList.contains('sat')||e.classList.contains('kart')||e.classList.contains('sk')||e.classList.contains('rk')){e.classList.add('secili');e.classList.add('okundu')}});
  sagPanel();if(scroll&&e)e.scrollIntoView({block:'nearest'})}
function kaydet(id){var c=bul(id);if(!c)return;if(kayit[id]){delete kayit[id];toast('Kayıt kaldırıldı')}else{kayit[id]={id:c.id,t:c.t,s:c.s,i:c.i,l:c.l,son:c.son,ilk:c.ilk,kb:c.kb,ks:c.ks,alanlar:c.alanlar,og:(c.og||[]).slice(0,6),dil:c.dil,diller:c.diller};['oneri_baslik','hooklar','aci','neden_gundemde','carpici_ayrinti','turk_onemi','dogrulama','risk','puan','gerekce','puan_gerekce'].forEach(function(k){if(c[k]!=null)kayit[id][k]=c[k]});toast('Kaydedildi');if(!durum[id]){durum[id]={d:'kaydedildi',t:c.t,l:c.l,ts:Math.round(Date.now()/1000)};yaz('akis2-durum',durum)}}yaz('akis-kayit',kayit);ciz()}
function gizle(id){if(gizli[id]){delete gizli[id];S.geri=null;toast('Geri getirildi')}else{gizli[id]=Math.round(Date.now()/1000);kisalt(gizli,800);toast('Gizlendi',id)}yaz('akis-gizli',gizli);ciz()}
function durumYaz(id,d){var c=bul(id);if(!c)return;if(!d){delete durum[id]}else{durum[id]={d:d,t:c.t,l:c.l,ts:Math.round(Date.now()/1000)};if(d==='kaydedildi'&&!kayit[id])kaydet(id)}yaz('akis2-durum',durum)}
function disa(){var o={surum:2,tarih:new Date().toISOString(),kayit:kayit,okundu:okundu,gizli:gizli,notlar:notlar,durum:durum,ayar:{gorunum:S.gor,tema:document.documentElement.dataset.tema||''}};var b=new Blob([JSON.stringify(o,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='akis-yedek-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function ice(f){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||typeof o!=='object'||!o.surum)throw 0;Object.assign(kayit,o.kayit||{});Object.assign(okundu,o.okundu||{});Object.assign(gizli,o.gizli||{});Object.assign(notlar,o.notlar||{});Object.assign(durum,o.durum||{});yaz('akis-kayit',kayit);yaz('akis-okundu',okundu);yaz('akis-gizli',gizli);yaz('akis2-not',notlar);yaz('akis2-durum',durum);toast('İçe aktarıldı: '+Object.keys(o.kayit||{}).length+' kayıt, '+Object.keys(o.durum||{}).length+' durum');ciz()}catch(e){toast('Geçersiz yedek dosyası')}};r.readAsText(f)}
function kayitTaslak(){var ad=$('n-ad').value.trim(),u=$('n-url').value.trim();if(!ad||!/^https?:\/\//i.test(u)){toast('Ad ve geçerli bir http(s) adresi girin');return}var id=ad.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');var o={id:id,name:ad,lang:$('n-dil').value,cat:{gundem:'tr',tekno:'tech',siyaset:'world',spor:'sport',ekonomi:'eco',bilim:'sci',siber:'tech',oto:'auto',eglence:'ent'}[$('n-cal').value],url:u,plat:'web',calisma:$('n-cal').value,tip:$('n-tip').value,ulke:$('n-ulke').value.toUpperCase(),oncelik:2,nitelik:[],aktif:true,dogrulama:{durum:'bekliyor',tarih:new Date().toISOString().slice(0,10)}};var p=$('n-cikti');p.hidden=false;p.textContent=JSON.stringify(o,null,1)+'\n\n# Doğrulama:\npython3 tools/kaynak_test.py';kopyala(JSON.stringify(o,null,1))}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){var r=e.target.closest('[data-id]');if(r&&!e.target.closest('a[href]')){sec(r.dataset.id)}return}
  var a=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
  if(t.tagName==='SELECT')return;
  if(a==='ac-konu'||a==='detay'){e.preventDefault();sec(id)}
  else if(a==='kaydet'){e.stopPropagation();kaydet(id)}else if(a==='gizle'){e.stopPropagation();gizle(id)}
  else if(a==='reelsisaret'){e.stopPropagation();durumYaz(id,durum[id]&&durum[id].d==='reels-fikri'?'':'reels-fikri');toast(durum[id]?'Reels fikri olarak işaretlendi':'Reels işareti kaldırıldı');ciz()}
  else if(a==='geri'){if(S.geri){gizle(S.geri)}}
  else if(a==='kapat'){S.sec=null;ciz()}
  else if(a==='daha'){S.adet+=30;ciz()}else if(a==='rdaha'){S.reelsAdet+=20;ciz()}else if(a==='kdaha'){S.kAdet=(S.kAdet||150)+150;ciz()}
  else if(a==='pen'){S.sicakPen=v;ciz()}else if(a==='sonsek'){S.sonSek=v;S.adet=30;ciz()}
  else if(a==='sirala'){S.sirala=v;ciz()}else if(a==='zaman'){S.zaman=v;S.adet=30;ciz()}else if(a==='dil'){S.dil[v]=!S.dil[v];S.adet=30;ciz()}
  else if(a==='alt'){S.alt=v||null;S.adet=30;ciz()}else if(a==='ek'){S.ek=v||null;S.adet=30;ciz()}else if(a==='kapsam'){S.kapsam=v;S.adet=30;ciz()}
  else if(a==='rprofil'){S.reelsProfil=v;S.reelsAdet=20;ciz()}else if(a==='ralt'){S.reelsAlt=v||null;S.reelsAdet=20;ciz()}
  else if(a==='ac-r'){S.ac[id]=!S.ac[id];ciz()}
  else if(a==='kop-b'){var c=bul(id);if(c)kopyala(c.oneri_baslik||c.t)}else if(a==='kop-l'){var c2=bul(id);if(c2)kopyala(c2.l)}
  else if(a==='kdurum'){S.kaynakF.durum=S.kaynakF.durum===v?'':v;ciz()}else if(a==='ksira'){S.kaynakSira=v;ciz()}else if(a==='kf-temizle'){S.kaynakF={durum:'',cal:'',dil:'',ulke:'',tip:'',q:''};ciz()}
  else if(a==='n-uret')kayitTaslak();else if(a==='disa')disa();else if(a==='temizle'){okundu={};yaz('akis-okundu',okundu);toast('Okundu işaretleri temizlendi');ciz()}
  else if(a==='hz'){location.hash=v==='merkez'?'#/merkez':v==='reels'?'#/reels':'#/alan/'+v}
  else if(a==='alt-git'){if(v==='alan'){bottomSheet()}else location.hash='#/'+v}
  else if(a==='sheet-kapat')sheetKapat()});
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset&&t.dataset.act==='durum-sec'){durumYaz(t.dataset.id,t.value);toast('Durum: '+(t.value?dAd(t.value):'kaldırıldı'));ciz()}
  else if(t.dataset&&t.dataset.act==='kf'){S.kaynakF[t.dataset.k]=t.value;ciz()}
  else if(t.id==='ice'&&t.files[0])ice(t.files[0]);

document.addEventListener('input',function(e){var t=e.target;if(t.id==='not'){notlar[t.dataset.id]=t.value;if(!t.value)delete notlar[t.dataset.id];yaz('akis2-not',notlar)}else if(t.id==='k-q'){S.kaynakF.q=t.value;clearTimeout(input.t);input.t=setTimeout(ciz,160)}});function input(){}

document.addEventListener('keydown',function(e){
  var tg=e.target,yaz_=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT');
  if(e.key==='Escape'){if(yaz_){tg.blur();if(tg.id==='ara'&&S.q){tg.value='';S.q='';ciz()}}else if(S.sec){S.sec=null;ciz()}return}
  if(yaz_||e.metaKey||e.ctrlKey||e.altKey)return;
  var items=[].slice.call(document.querySelectorAll('.sat[data-id],.kart[data-id],.sk[data-id],.rk[data-id],.yuk[data-id]'));
  var cur=items.findIndex(function(x){return x.dataset.id===S.sec});

  else if(e.key==='j'||e.key==='k'){e.preventDefault();var n=e.key==='j'?cur+1:cur-1;if(n<0)n=0;if(n>=items.length)n=items.length-1;if(items[n])sec(items[n].dataset.id,true)}
  else if(e.key==='Enter'&&cur>=0)sec(S.sec);
