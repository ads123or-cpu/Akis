e/2026/1105/b281c34dadc3ae9.png"},{"t":"大一新生手机丢沙漠 埋了一个多月后意外被捡到","l":"https://www.cnbeta.com.tw/articles/tech/1585112.htm","p":"cnBeta.COM","d":"2026-11-05T06:21:55+00:00","s":"据“阿拉尔发布”公众号消息，塔里木大学一名大一新生的苹果手机遗失在沙漠中一个多月，近日意外被找回。 9月16日，这名大一新生随军训徒步队伍，在沙漠之门重走沙海老兵路时不慎丢失手机。手机内存储了近400G照片与视频，全是他入学前的珍贵回忆。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/34613696801f0cb.png"},{"t":"OpenAI自曝GPT-6 Astra异常行为：做安全研究时“暗中少干活” 任务完成度低近四成","l":"https://www.cnbeta.com.tw/articles/tech/1585110.htm","p":"cnBeta.COM","d":"2026-11-05T06:21:35+00:00","s":"OpenAI在11月4日更新的一份研究报告中披露，其旗舰模型GPT-6 Astra在执行人工智能安全研究任务时，出现了一种令人担忧的异常行为：模型会在不明确告知用户的情况下，减少工作量、放弃有效方案，甚至制造并不存在的技术障碍。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/5edf98f553a7acb.png"},{"t":"盖茨批评特朗普政府：AI模型能力惊人 不作为让世界面临生物武器风险","l":"https://www.cnbeta.com.tw/articles/tech/1585108.htm","p":"cnBeta.COM","d":"2026-11-05T06:21:06+00:00","s":"11月5日，据《金融时报》报道，微软联合创始人比尔·盖茨(Bill Gates)指责特朗普政府阻碍了防范AI风险的努力。他警告称，这项技术可能被用来制造一场“比新冠疫情严重得多”的大流行病。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/f9d6a51ce38af92.png"},{"t":"月之暗面开源Kimi K3.1 Pro 登顶Agent Arena开源模型榜","l":"https://www.cnbeta.com.tw/articles/tech/1585106.htm","p":"cnBeta.COM","d":"2026-11-05T06:19:19+00:00","s":"月之暗面（Moonshot AI）宣布，正式在Hugging Face平台开放Kimi K3.1 Pro模型权重。据AI模型评测平台Arena官方披露，Kimi K3.1 Pro（Max）在Agent Arena智能体排行榜中位居开放权重模型第一名、全球所有参评模型第13名，并在工作、编程和聊天三大类别中均位列开放模型第一。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/872835df8b8974b.png"},{"t":"马斯克在中期选举后删除了投票支持共和党的帖子","l":"https://www.cnbeta.com.tw/articles/tech/1585104.htm","p":"cnBeta.COM","d":"2026-11-05T06:11:43+00:00","s":"在美国中期选举日当天，科技富豪埃隆·马斯克在X上发布了一条简短的帖子：“今天投‘红色’一票！”然而，在民主党于中期选举中取得压倒性胜利数小时后，马斯克此前呼吁投票给共和党的这条帖子，从他的X账号主页时间线上消失了。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/54c38f6bea06d44.jpg"},{"t":"长江存储IPO计划暂缓：中国收紧芯片企业上市审批 49亿美元融资进程受阻","l":"https://www.cnbeta.com.tw/articles/tech/1585102.htm","p":"cnBeta.COM","d":"2026-11-05T06:08:28+00:00","s":"中国最大的NAND闪存芯片制造商长江存储（YMTC）已经暂时搁置上海证券交易所科创板上市计划。路透社11月4日援引公司内部备忘录及多名知情人士报道称，此次暂停与中国监管部门近期收紧股票发行审批、资本市场表现疲软等因素有关。原本计划在10月底至11月初启动的战略配售工作已经停止，上市进程可能因此推迟数月。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0907/cb9e62f2b52f781.jpg"},{"t":"游戏行业整合代价浮现 近三分之一被收购工作室已关闭","l":"https://www.cnbeta.com.tw/articles/game/1585100.htm","p":"cnBeta.COM","d":"2026-11-05T05:58:00+00:00","s":"近年来，全球游戏行业掀起一轮大规模并购浪潮，各大游戏发行商纷纷斥资收购开发团队，希望扩充产品阵容和技术实力。然而最新研究数据显示，许多被收购的工作室最终并未迎来更稳定的发展，反而在交易完成后的几年内被关闭。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/05f97aa64373b48.webp"},{"t":"Google确认Googlebook将推出可拆卸键盘机型 首款或由联想打造","l":"https://www.cnbeta.com.tw/articles/tech/1585098.htm","p":"cnBeta.COM","d":"2026-11-05T05:57:04+00:00","s":"Google在Android开发者峰会主题演讲中表示，Googlebook产品线将覆盖传统笔记本、二合一可转换设备，并“很快”推出可拆卸式机型。这类设备可将键盘从屏幕上拆下，让平板在平板与笔记本形态间切换；不过，Google目前没有公布具体产品、价格或上市日期。 阅读全文","i":"https://www.techpowerup.com/img/LCcSkDJh2tBznG4m.jpg"},{"t":"X推出新版网页应用 加载速度提升数倍","l":"https://www.cnbeta.com.tw/articles/tech/1585096.htm","p":"cnBeta.COM","d":"2026-11-05T05:51:22+00:00","s":"社交平台X宣布推出经过全面改造的新版网页应用，并已开始面向已登录用户逐步推广。根据官方介绍，新版本将按照“逐个国家”的方式分阶段上线，而未登录用户访问的网页版以及供搜索引擎抓取的页面目前已经开始使用新的系统架构。 阅读全文","i":"https://platform.twitter.com/embed/Tweet.html?dnt=true&embedId=twitter-widget-0&features=eyJ0ZndfdGltZWxpbmVfbGlzdCI6eyJidWNrZXQiOltdLCJ2ZXJzaW9uIjpudWxsfSwidGZ3X2ZvbGxvd2VyX2NvdW50X3N1bnNldCI6eyJidWNrZXQiOnRydWUsInZlcnNpb24iOm51bGx9LCJ0ZndfdHdlZXRfZWRpdF9iYWNrZW5kIjp7ImJ1Y2tldCI6Im9uIiwidmVyc2lvbiI6bnVsbH0sInRmd19yZWZzcmNfc2Vzc2lvbiI6eyJidWNrZXQiOiJvbiIsInZlcnNpb24iOm51bGx9LCJ0ZndfZm9zbnJfc29mdF9pbnRlcnZlbnRpb25zX2VuYWJsZWQiOnsiYnVja2V0Ijoib24iLCJ2ZXJzaW9uIjpudWxsfSwidGZ3X21peGVkX21lZGlhXzE1ODk3Ijp7ImJ1Y2tldCI6InRyZWF0bWVudCIsInZlcnNpb24iOm51bGx9LCJ0ZndfZXhwZXJpbWVudHNfY29va2llX2V4cGlyYXRpb24iOnsiYnVja2V0IjoxMjA5NjAwLCJ2ZXJzaW9uIjpudWxsfSwidGZ3X3Nob3dfYmlyZHdhdGNoX3Bpdm90c19lbmFibGVkIjp7ImJ1Y2tldCI6Im9uIiwidmVyc2lvbiI6bnVsbH0sInRmd19kdXBsaWNhdGVfc2NyaWJlc190b19zZXR0aW5ncyI6eyJidWNrZXQiOiJvbiIsInZlcnNpb24iOm51bGx9LCJ0ZndfdXNlX3Byb2ZpbGVfaW1hZ2Vfc2hhcGVfZW5hYmxlZCI6eyJidWNrZXQiOiJvbiIsInZlcnNpb24iOm51bGx9LCJ0ZndfdmlkZW9faGxzX2R5bmFtaWNfbWFuaWZlc3RzXzE1MDgyIjp7ImJ1Y2tldCI6InRydWVfYml0cmF0ZSIsInZlcnNpb24iOm51bGx9LCJ0ZndfbGVnYWN5X3RpbWVsaW5lX3N1bnNldCI6eyJidWNrZXQiOnRydWUsInZlcnNpb24iOm51bGx9LCJ0ZndfdHdlZXRfZWRpdF9mcm9udGVuZCI6eyJidWNrZXQiOiJvbiIsInZlcnNpb24iOm51bGx9fQ%3D%3D&frame=false&hideCard=false&hideThread=true&id=2118069935922680054&lang=en&origin=https%3A%2F%2Fwww.theverge.com%2Ftech%2F1027113%2Fx-says-its-updated-web-app-is-way-faster&sessionId=675a3ad2f6600f23d92eb541844e54f81a395626&siteScreenName=verge&theme=light&widgetsVersion=6a3ad42b224df%3A1778106238597&width=550px\" data-tweet-id=\"2118069935922680054\" style=\"box-sizing: border-box;border-width: 0px;border-style: solid;vertical-align: middle;display: block;min-width: 100%;position: static;visibility: visible;width: 550px;height: 1085px;flex-grow: 1\"><\/iframe><\/p><p>X首席工程师Yagiz Nizipli在介绍更新内容的博文中表示，新版网页应用在性能方面实现了显著提升，尤其是在网络连接条件较差的环境下效果更加明显。根据X公布的数据，当用户通过较慢的网络打开个人主页时，旧版网页应用需要等待超过22秒才能看到首条帖子内容，而新版网页应用将这一时间缩短至约2.7秒。<\/p><p>为了实现性能提升，X对底层架构进行了大规模调整。开发团队将此前分别服务于普通用户访问、搜索引擎爬虫以及链接预览功能的三套独立服务器体系整合为统一架构，从而减少系统复杂度并提高资源利用效率。<\/p><p><img src=\"https://static.cnbetacdn.com/article/2026/1105/732c2a18884bad7.jpg"},{"t":"Windows 11画图工具曝出高危“零点击”漏洞 开启自动更新也可能尚未安装安全补丁","l":"https://www.cnbeta.com.tw/articles/tech/1585094.htm","p":"cnBeta.COM","d":"2026-11-05T05:49:24+00:00","s":"微软Windows 11自带的画图工具（Microsoft Paint）近日被发现存在一项严重安全漏洞。攻击者在特定条件下，只需向受影响设备发送经过特殊构造的网络数据包，就可能在用户毫无察觉、甚至不需要点击任何文件或链接的情况下，远程执行恶意代码。更令人困惑的是，微软虽然已经发布了修复补丁，但部分用户即使开启了Microsoft Store自动更新，仍然无法获得相应更新。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/b7e4ad042642446.jpg"},{"t":"苹果收紧内部AI开支 部分员工使用额度或大幅下调","l":"https://www.cnbeta.com.tw/articles/tech/1585092.htm","p":"cnBeta.COM","d":"2026-11-05T05:46:57+00:00","s":"苹果公司近期开始对内部人工智能工具的使用成本进行更加严格的控制。根据多家媒体援引知情人士的消息报道，苹果已下调部分员工的AI使用预算，希望在持续推进人工智能战略的同时控制不断增长的运营支出。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0619/8ba602f4fedc371.jpg"},{"t":"美国中期选举后各地数据中心建设或将迎来更大阻力","l":"https://www.cnbeta.com.tw/articles/tech/1585090.htm","p":"cnBeta.COM","d":"2026-11-05T05:46:29+00:00","s":"美国2026年中期选举结束后，数据中心建设可能成为美国政治和科技产业下一轮冲突的焦点。随着民主党在国会选举中取得两院控制权，而共和党仍掌握白宫，美国政府内部围绕人工智能基础设施的政策分歧可能进一步扩大。此次选举也显示，围绕数据中心耗电、环境污染、电价上涨以及地方社区缺乏决策权的反对声音，已经从局部抗议发展成为具有全国影响力的政治议题。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0921/5b98fb500107b8c.jpg"},{"t":"研究揭示蜜蜂拥有类似免疫系统的防御机制 还会利用天然材料抵御病原体","l":"https://www.cnbeta.com.tw/articles/science/1585088.htm","p":"cnBeta.COM","d":"2026-11-05T05:45:47+00:00","s":"蜜蜂蜂群不仅依靠单只蜜蜂的免疫能力抵御疾病，整个蜂巢本身也可能构成一套高度组织化的集体防御系统。澳大利亚悉尼大学研究团队的一项最新研究发现，蜂蜜、蜂蜡、蜂胶、花粉以及蜜蜂自身分泌的物质，能够按照蜂巢内部不同区域形成多层次的抗菌屏障。这种结构化防御机制与动物免疫系统有着令人惊讶的相似之处。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/3d04103e9c1add7.jpg"},{"t":"科学家找到可可黑荚病的关键突破口 巧克力供应危机或迎来解决方案","l":"https://www.cnbeta.com.tw/articles/science/1585086.htm","p":"cnBeta.COM","d":"2026-11-05T05:44:46+00:00","s":"一种正在全球范围内威胁可可产业的严重病害，或许即将迎来转机。美国宾夕法尼亚州立大学研究团队宣布，他们通过基因编辑与传统育种技术相结合，培育出对“黑荚病”具有更强抵抗能力的可可植株。在实验室测试中，仅对可可基因组中的两个DNA碱基进行修改，就使病害发生率下降约42%，为未来保障全球巧克力供应带来了新的希望。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/237b49c36104786.jpg"},{"t":"研究发现新西兰同一类型的企鹅种群却遭遇了两种命运","l":"https://www.cnbeta.com.tw/articles/science/1585084.htm","p":"cnBeta.COM","d":"2026-11-05T05:43:29+00:00","s":"一项新研究发现，新西兰特有的直冠企鹅在仅有的两个繁殖地呈现截然不同的趋势：布恩蒂群岛种群至少25年来大致稳定，安蒂波德斯群岛种群自1995年以来则减少逾40%。研究人员将这种“一种企鹅、两种命运”的状况称为“薛定谔企鹅”，借用薛定谔的猫比喻说明，若只看整个物种的总体评级，可能会掩盖局部种群的严重危机。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/7ad5519af2c027e.jpg"},{"t":"​自闭症为何更常见于男性？研究发现X染色体上存在关键保护机制","l":"https://www.cnbeta.com.tw/articles/science/1585082.htm","p":"cnBeta.COM","d":"2026-11-05T05:41:16+00:00","s":"为什么男性被诊断为自闭症谱系障碍的比例明显高于女性？长期以来，这一现象一直是神经科学和遗传学领域的研究难题。现有统计显示，男孩被诊断为自闭症的概率约为女孩的3至4倍，但与自闭症有关的基因并非男性独有。美国波士顿儿童医院的一项最新研究发现，X染色体上的一个特殊基因可能为女性大脑提供额外保护，从而部分解释这种性别差异。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/b9ef27594ff08b3.webp"},{"t":"苹果开放订阅取消挽留消息 开发者可在用户退订前展示优惠","l":"https://www.cnbeta.com.tw/articles/tech/1585080.htm","p":"cnBeta.COM","d":"2026-11-05T05:39:28+00:00","s":"苹果推出App Store订阅留存消息功能，允许开发者在用户进入取消订阅流程时展示挽留内容，提醒用户订阅价值，或提供特别优惠。消息可以包含文字、图片或优惠方案，目的是让用户在确认取消前看到继续订阅的理由。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/667d856467cf7e6.jpg"},{"t":"AI助力移植任天堂游戏 《超级马力欧：奥德赛》成功运行在Apple TV","l":"https://www.cnbeta.com.tw/articles/game/1585078.htm","p":"cnBeta.COM","d":"2026-11-05T05:38:49+00:00","s":"一名 Reddit 用户近日成功让任天堂旗下热门游戏《集合啦！动物森友会》和《超级马力欧：奥德赛》在 Apple TV 4K 上实现原生运行，进一步展示了人工智能在软件移植领域带来的新可能。 阅读全文","i":"https://embed.reddit.com/r/decomps/comments/1xn3wh1/release_tvport_port_switch_games_to_run_natively/?embed=true&ref_source=embed&ref=share&utm_medium=widgets&utm_source=embedv2&utm_term=23&utm_name=post_embed&embed_host_url=https%3A%2F%2Fwww.macrumors.com%2F2026%2F11%2F04%2Fnintendo-games-apple-tv%2F\" width=\"640px\" scrolling=\"no\" allowfullscreen=\"true\" sandbox=\"allow-scripts allow-same-origin allow-popups\" allow=\"clipboard-read; clipboard-write\" style=\"box-sizing: border-box; margin: 0px auto; padding: 0px; border-width: medium; border-style: none; font: inherit; vertical-align: baseline; -webkit-font-smoothing: antialiased; max-width: 100%; border-radius: 8px; display: block;\"><\/iframe><\/p><p>据报道，这项成果来自一项名为 TVPort 的开源项目。该项目由 Reddit 用户 FloatingFalafel 开发，是 nxnative 工具包的一个分支版本，能够利用 Mac 电脑将 Nintendo Switch 和 Switch 2 游戏重新编译后运行在 Apple TV 平台上。开发者表示，整个项目在开发过程中大量借助了 Anthropic 的 Claude Opus 5.5 人工智能模型。<\/p><p>根据开发者公布的信息，《超级马力欧：奥德赛》在 Apple TV 4K 上能够以每秒 60 帧的速度运行，而《集合啦！动物森友会》则可以达到每秒 30 帧。目前尚未对更多游戏展开大规模测试，不过开发者已经将项目代码开源，欢迎其他用户尝试移植更多作品。<\/p><p style=\"text-align: center;\"><img src=\"https://static.cnbetacdn.com/article/2026/1105/44324c9c72d6c35.jpg"}]},"digitaltrends":{"name":"Digital Trends","lang":"en","cat":"tech","plat":"web","url":"https://www.digitaltrends.com/feed/","updated":"2026-11-05T07:06:06.541675+00:00","items":[{"t":"Google brings Gemini to AT&T home security with smarter alerts and 24/7 recording","l":"https://www.digitaltrends.com/home/google-a   }else{
    var sg=M.saglik||{},kl2=M.kaynaklar.slice().sort(function(a,b){return(a.son||'')<(b.son||'')?-1:1});
    h='<div class="ana-ust"><h1>Kaynaklar</h1></div><p class="bilgi">'+(sg.kaynak||0)+' kaynak: '+(sg.basarili||0)+' çalışıyor, '+(sg.bayat||0)+' bu tur yanıt vermedi, '+(sg.beklemede||0)+' beklemede. 12 saatten eski kopya akışa girmez. En eski güncellenen en üstte.</p><div class="kaz"><table class="tablo"><thead><tr><th>Kaynak</th><th>Bölüm</th><th>Son haber</th><th>Durum</th></tr></thead><tbody>'+kl2.map(function(k){return'<tr><td>'+x(k.ad)+'</td><td>'+x(k.cat)+'</td><td>'+(k.son?kac(Date.parse(k.son)/1000)+' önce':'–')+'</td><td>'+(k.bayat?'Yanıt vermedi':'Çalışıyor')+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  a.innerHTML=h;
}
function git(s){S.sekme=s;S.adet=40;S.secili=-1;S.konu='hepsi';if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);ciz();window.scrollTo(0,0)}
function sekmeCiz(){
  $('sekmeler').innerHTML=SEKME.map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('alt').innerHTML=SEKME.slice(0,4).map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1].replace('Son haberler','Son').replace('Kaydedilenler','Kayıtlı')+'</button>'}).join('');
}
function bul(id){var m=M.kumeler.concat(sonHaberler()).filter(function(c){return c.id===id})[0];return m||kayit[id]}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-sekme],[data-konu],[data-dil],[data-saat],[data-tur],[data-kat],[data-ac],[data-kaydet],[data-gorunum],#daha,#tema,[data-okundu]');
  if(!t)return;var d=t.dataset;
  if(d.okundu){okundu[d.okundu]=1;var ks=Object.keys(okundu);if(ks.length>1500)delete okundu[ks[0]];yaz('akis-okundu',okundu);return}
  if(d.sekme)return git(d.sekme);
  if(d.konu){S.konu=d.konu;S.adet=40}
  else if(d.dil)S.dil=d.dil;
  else if(d.saat)S.saat=+d.saat;
  else if(d.tur)S.tur=d.tur;
  else if(d.gorunum){S.gorunum=d.gorunum;yaz('akis-gorunum',S.gorunum)}
  else if(d.kat){S.kat=d.kat;S.adet=40}
  else if(d.ac)S.acik[d.ac]=!S.acik[d.ac];
  else if(d.kaydet){if(kayit[d.kaydet])delete kayit[d.kaydet];else{var c=bul(d.kaydet);if(c)kayit[d.kaydet]=c}yaz('akis-kayit',kayit)}
  else if(t.id==='daha')S.adet+=40;
  else if(t.id==='tema'){var r=document.documentElement,kz=matchMedia('(prefers-color-scheme:dark)').matches,su=r.dataset.tema||(kz?'koyu':'acik'),yn=su==='koyu'?'acik':'koyu';r.dataset.tema=yn;try{localStorage.setItem('akis-tema',yn)}catch(er){}return}
  ciz();
});
var zm;$('ara').addEventListener('input',function(){clearTimeout(zm);var v=this.value;zm=setTimeout(function(){S.q=v;S.adet=40;ciz()},150)});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var h=e.target.tagName;
  if(h==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  if(e.key==='/'){e.preventDefault();$('ara').focus();return}
  if((e.key==='j'||e.key==='k')&&GORUNEN.length){S.secili=Math.min(GORUNEN.length-1,Math.max(0,S.secili+(e.key==='j'?1:-1)));ciz();var el=document.querySelector('.kart.secili');if(el)el.scrollIntoView({block:'center'});return}
  var c=GORUNEN[S.secili];if(!c)return;
  if(e.key==='o'||e.key==='Enter')window.open(c.l,'_blank','noopener');
  if(e.key==='s'){if(kayit[c.id])delete kayit[c.id];else kayit[c.id]=c;yaz('akis-kayit',kayit);ciz()}
});
function durumYaz(){
  var g=M.generated||SNAP.generated,el=$('durum');if(!g)return;
  var z=Date.parse(g)/1000,dk=(Date.now()/1000-z)/60;
  el.textContent=(dk>90?'Güncellenmedi: ':'Güncellendi: ')+kac(z)+' önce';el.classList.toggle('eski',dk>90);
}
sekmeCiz();
fetch('masa.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){M=j;durumYaz();var h=location.hash.slice(1);git(SEKME.some(function(t){return t[0]===h})?h:'gundem')}).catch(function(){durumYaz();$('ana').innerHTML='<div class="bos">Masa verisi yüklenemedi. Son haberler yine çalışır.</div>';S.sekme='son';ciz()});
})();
</script>
