body{margin:0;background:var(--bg);color:var(--metin);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

"cnBeta.COM","d":"2026-11-05T06:08:28+00:00","s":"中国最大的NAND闪存芯片制造商长江存储（YMTC）已经暂时搁置上海证券交易所科创板上市计划。路透社11月4日援引公司内部备忘录及多名知情人士报道称，此次暂停与中国监管部门近期收紧股票发行审批、资本市场表现疲软等因素有关。原本计划在10月底至11月初启动的战略配售工作已经停止，上市进程可能因此推迟数月。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0907/cb9e62f2b52f781.jpg"},{"t":"游戏行业整合代价浮现 近三分之一被收购工作室已关闭","l":"https://www.cnbeta.com.tw/articles/game/1585100.htm","p":"cnBeta.COM","d":"2026-11-05T05:58:00+00:00","s":"近年来，全球游戏行业掀起一轮大规模并购浪潮，各大游戏发行商纷纷斥资收购开发团队，希望扩充产品阵容和技术实力。然而最新研究数据显示，许多被收购的工作室最终并未迎来更稳定的发展，反而在交易完成后的几年内被关闭。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/05f97aa64373b48.webp"},{"t":"Google确认Googlebook将推出可拆卸键盘机型 首款或由联想打造","l":"https://www.cnbeta.com.tw/articles/tech/1585098.htm","p":"cnBeta.COM","d":"2026-11-05T05:57:04+00:00","s":"Google在Android开发者峰会主题演讲中表示，Googlebook产品线将覆盖传统笔记本、二合一可转换设备，并“很快”推出可拆卸式机型。这类设备可将键盘从屏幕上拆下，让平板在平板与笔记本形态间切换；不过，Google目前没有公布具体产品、价格或上市日期。 阅读全文","i":"https://www.techpowerup.com/img/LCcSkDJh2tBznG4m.jpg"},{"t":"X推出新版网页应用 加载速度提升数倍","l":"https://www.cnbeta.com.tw/articles/tech/1585096.htm","p":"cnBeta.COM","d":"2026-11-05T05:51:22+00:00","s":"社交平台X宣布推出经过全面改造的新版网页应用，并已开始面向已登录用户逐步推广。根据官方介绍，新版本将按照“逐个国家”的方式分阶段上线，而未登录用户访问的网页版以及供搜索引擎抓取的页面目前已经开始使用新的系统架构。 阅读全文","i":"https://platform.twitter.com/embed/Tweet.html?dnt=true&embedId=twitter-widget-0&features=eyJ0ZndfdGltZWxpbmVfbGlzdCI6eyJidWNrZXQiOltdLCJ2ZXJzaW9uIjpudWxsfSwidGZ3X2ZvbGxvd2VyX2NvdW50X3N1bnNldCI6eyJidWNrZXQiOnRydWUsInZlcnNpb24iOm51bGx9LCJ0ZndfdHdlZXRfZWRpdF9iYWNrZW5kIjp7ImJ1Y2tldCI6Im9uIiwidmVyc2lvbiI6bnVsbH0sInRmd19yZWZzcmNfc2Vzc2lvbiI6eyJidWNrZXQiOiJvbiIsInZlcnNpb24iOm51bGx9LCJ0ZndfZm9zbnJfc29mdF9pbnRlcnZlbnRpb25zX2VuYWJsZWQiOnsiYnVja2V0Ijoib24iLCJ2ZXJzaW9uIjpudWxsfSwidGZ3X21peGVkX21lZGlhXzE1ODk3Ijp7ImJ1Y2tldCI6InRyZWF0bWVudCIsInZlcnNpb24iOm51bGx9LCJ0ZndfZXhwZXJpbWVudHNfY29va2llX2V4cGlyYXRpb24iOnsiYnVja2V0IjoxMjA5NjAwLCJ2ZXJzaW9uIjpudWxsfSwidGZ3X3Nob3dfYmlyZHdhdGNoX3Bpdm90c19lbmFibGVkIjp7ImJ1Y2tldCI6Im9uIiwidmVyc2lvbiI6bnVsbH0sInRmd19kdXBsaWNhdGVfc2NyaWJlc190b19zZXR0aW5ncyI6eyJidWNrZXQiOiJvbiIsInZlcnNpb24iOm51bGx9LCJ0ZndfdXNlX3Byb2ZpbGVfaW1hZ2Vfc2hhcGVfZW5hYmxlZCI6eyJidWNrZXQiOiJvbiIsInZlcnNpb24iOm51bGx9LCJ0ZndfdmlkZW9faGxzX2R5bmFtaWNfbWFuaWZlc3RzXzE1MDgyIjp7ImJ1Y2tldCI6InRydWVfYml0cmF0ZSIsInZlcnNpb24iOm51bGx9LCJ0ZndfbGVnYWN5X3RpbWVsaW5lX3N1bnNldCI6eyJidWNrZXQiOnRydWUsInZlcnNpb24iOm51bGx9LCJ0ZndfdHdlZXRfZWRpdF9mcm9udGVuZCI6eyJidWNrZXQiOiJvbiIsInZlcnNpb24iOm51bGx9fQ%3D%3D&frame=false&hideCard=false&hideThread=true&id=2118069935922680054&lang=en&origin=https%3A%2F%2Fwww.theverge.com%2Ftech%2F1027113%2Fx-says-its-updated-web-app-is-way-faster&sessionId=675a3ad2f6600f23d92eb541844e54f81a395626&siteScreenName=verge&theme=light&widgetsVersion=6a3ad42b224df%3A1778106238597&width=550px\" data-tweet-id=\"2118069935922680054\" style=\"box-sizing: border-box;border-width: 0px;border-style: solid;vertical-align: middle;display: block;min-width: 100%;position: static;visibility: visible;width: 550px;height: 1085px;flex-grow: 1\"><\/iframe><\/p><p>X首席工程师Yagiz Nizipli在介绍更新内容的博文中表示，新版网页应用在性能方面实现了显著提升，尤其是在网络连接条件较差的环境下效果更加明显。根据X公布的数据，当用户通过较慢的网络打开个人主页时，旧版网页应用需要等待超过22秒才能看到首条帖子内容，而新版网页应用将这一时间缩短至约2.7秒。<\/p><p>为了实现性能提升，X对底层架构进行了大规模调整。开发团队将此前分别服务于普通用户访问、搜索引擎爬虫以及链接预览功能的三套独立服务器体系整合为统一架构，从而减少系统复杂度并提高资源利用效率。<\/p><p><img src=\"https://static.cnbetacdn.com/article/2026/1105/732c2a18884bad7.jpg"},{"t":"Windows 11画图工具曝出高危“零点击”漏洞 开启自动更新也可能尚未安装安全补丁","l":"https://www.cnbeta.com.tw/articles/tech/1585094.htm","p":"cnBeta.COM","d":"2026-11-05T05:49:24+00:00","s":"微软Windows 11自带的画图工具（Microsoft Paint）近日被发现存在一项严重安全漏洞。攻击者在特定条件下，只需向受影响设备发送经过特殊构造的网络数据包，就可能在用户毫无察觉、甚至不需要点击任何文件或链接的情况下，远程执行恶意代码。更令人困惑的是，微软虽然已经发布了修复补丁，但部分用户即使开启了Microsoft Store自动更新，仍然无法获得相应更新。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/b7e4ad042642446.jpg"},{"t":"苹果收紧内部AI开支 部分员工使用额度或大幅下调","l":"https://www.cnbeta.com.tw/articles/tech/1585092.htm","p":"cnBeta.COM","d":"2026-11-05T05:46:57+00:00","s":"苹果公司近期开始对内部人工智能工具的使用成本进行更加严格的控制。根据多家媒体援引知情人士的消息报道，苹果已下调部分员工的AI使用预算，希望在持续推进人工智能战略的同时控制不断增长的运营支出。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0619/8ba602f4fedc371.jpg"},{"t":"美国中期选举后各地数据中心建设或将迎来更大阻力","l":"https://www.cnbeta.com.tw/articles/tech/1585090.htm","p":"cnBeta.COM","d":"2026-11-05T05:46:29+00:00","s":"美国2026年中期选举结束后，数据中心建设可能成为美国政治和科技产业下一轮冲突的焦点。随着民主党在国会选举中取得两院控制权，而共和党仍掌握白宫，美国政府内部围绕人工智能基础设施的政策分歧可能进一步扩大。此次选举也显示，围绕数据中心耗电、环境污染、电价上涨以及地方社区缺乏决策权的反对声音，已经从局部抗议发展成为具有全国影响力的政治议题。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0921/5b98fb500107b8c.jpg"},{"t":"研究揭示蜜蜂拥有类似免疫系统的防御机制 还会利用天然材料抵御病原体","l":"https://www.cnbeta.com.tw/articles/science/1585088.htm","p":"cnBeta.COM","d":"2026-11-05T05:45:47+00:00","s":"蜜蜂蜂群不仅依靠单只蜜蜂的免疫能力抵御疾病，整个蜂巢本身也可能构成一套高度组织化的集体防御系统。澳大利亚悉尼大学研究团队的一项最新研究发现，蜂蜜、蜂蜡、蜂胶、花粉以及蜜蜂自身分泌的物质，能够按照蜂巢内部不同区域形成多层次的抗菌屏障。这种结构化防御机制与动物免疫系统有着令人惊讶的相似之处。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/3d04103e9c1add7.jpg"},{"t":"科学家找到可可黑荚病的关键突破口 巧克力供应危机或迎来解决方案","l":"https://www.cnbeta.com.tw/articles/science/1585086.htm","p":"cnBeta.COM","d":"2026-11-05T05:44:46+00:00","s":"一种正在全球范围内威胁可可产业的严重病害，或许即将迎来转机。美国宾夕法尼亚州立大学研究团队宣布，他们通过基因编辑与传统育种技术相结合，培育出对“黑荚病”具有更强抵抗能力的可可植株。在实验室测试中，仅对可可基因组中的两个DNA碱基进行修改，就使病害发生率下降约42%，为未来保障全球巧克力供应带来了新的希望。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/237b49c36104786.jpg"},{"t":"研究发现新西兰同一类型的企鹅种群却遭遇了两种命运","l":"https://www.cnbeta.com.tw/articles/science/1585084.htm","p":"cnBeta.COM","d":"2026-11-05T05:43:29+00:00","s":"一项新研究发现，新西兰特有的直冠企鹅在仅有的两个繁殖地呈现截然不同的趋势：布恩蒂群岛种群至少25年来大致稳定，安蒂波德斯群岛种群自1995年以来则减少逾40%。研究人员将这种“一种企鹅、两种命运”的状况称为“薛定谔企鹅”，借用薛定谔的猫比喻说明，若只看整个物种的总体评级，可能会掩盖局部种群的严重危机。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/7ad5519af2c027e.jpg"},{"t":"​自闭症为何更常见于男性？研究发现X染色体上存在关键保护机制","l":"https://www.cnbeta.com.tw/articles/science/1585082.htm","p":"cnBeta.COM","d":"2026-11-05T05:41:16+00:00","s":"为什么男性被诊断为自闭症谱系障碍的比例明显高于女性？长期以来，这一现象一直是神经科学和遗传学领域的研究难题。现有统计显示，男孩被诊断为自闭症的概率约为女孩的3至4倍，但与自闭症有关的基因并非男性独有。美国波士顿儿童医院的一项最新研究发现，X染色体上的一个特殊基因可能为女性大脑提供额外保护，从而部分解释这种性别差异。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/b9ef27594ff08b3.webp"},{"t":"苹果开放订阅取消挽留消息 开发者可在用户退订前展示优惠","l":"https://www.cnbeta.com.tw/articles/tech/1585080.htm","p":"cnBeta.COM","d":"2026-11-05T05:39:28+00:00","s":"苹果推出App Store订阅留存消息功能，允许开发者在用户进入取消订阅流程时展示挽留内容，提醒用户订阅价值，或提供特别优惠。消息可以包含文字、图片或优惠方案，目的是让用户在确认取消前看到继续订阅的理由。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/667d856467cf7e6.jpg"},{"t":"AI助力移植任天堂游戏 《超级马力欧：奥德赛》成功运行在Apple TV","l":"https://www.cnbeta.com.tw/articles/game/1585078.htm","p":"cnBeta.COM","d":"2026-11-05T05:38:49+00:00","s":"一名 Reddit 用户近日成功让任天堂旗下热门游戏《集合啦！动物森友会》和《超级马力欧：奥德赛》在 Apple TV 4K 上实现原生运行，进一步展示了人工智能在软件移植领域带来的新可能。 阅读全文","i":"https://embed.reddit.com/r/decomps/comments/1xn3wh1/release_tvport_port_switch_games_to_run_natively/?embed=true&ref_source=embed&ref=share&utm_medium=widgets&utm_source=embedv2&utm_term=23&utm_name=post_embed&embed_host_url=https%3A%2F%2Fwww.macrumors.com%2F2026%2F11%2F04%2Fnintendo-games-apple-tv%2F\" width=\"640px\" scrolling=\"no\" allowfullscreen=\"true\" sandbox=\"allow-scripts allow-same-origin allow-popups\" allow=\"clipboard-read; clipboard-write\" style=\"box-sizing: border-box; margin: 0px auto; padding: 0px; border-width: medium; border-style: none; font: inherit; vertical-align: baseline; -webkit-font-smoothing: antialiased; max-width: 100%; border-radius: 8px; display: block;\"><\/iframe><\/p><p>据报道，这项成果来自一项名为 TVPort 的开源项目。该项目由 Reddit 用户 FloatingFalafel 开发，是 nxnative 工具包的一个分支版本，能够利用 Mac 电脑将 Nintendo Switch 和 Switch 2 游戏重新编译后运行在 Apple TV 平台上。开发者表示，整个项目在开发过程中大量借助了 Anthropic 的 Claude Opus 5.5 人工智能模型。<\/p><p>根据开发者公布的信息，《超级马力欧：奥德赛》在 Apple TV 4K 上能够以每秒 60 帧的速度运行，而《集合啦！动物森友会》则可以达到每秒 30 帧。目前尚未对更多游戏展开大规模测试，不过开发者已经将项目代码开源，欢迎其他用户尝试移植更多作品。<\/p><p style=\"text-align: center;\"><img src=\"https://static.cnbetacdn.com/article/2026/1105/44324c9c72d6c35.jpg"},{"t":"华为全新英文子品牌名Osta曝光 首批两款旗舰机型浮出水面","l":"https://www.cnbeta.com.tw/articles/tech/1585076.htm","p":"cnBeta.COM","d":"2026-11-05T05:37:56+00:00","s":"华为正在筹备一个全新的手机子品牌，其英文名称及首批产品信息近日陆续曝光。根据GSMArena 11月5日的报道，此前传出的中文名称为“星芒”，如今有两名消息人士透露，该品牌最终采用的英文名称将是“Osta”，这一名称据称也会直接印在产品零售包装盒上。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/1cc608f65fda55d.jpg"},{"t":"Google Chrome Canary测试横向标签页滚动 打开大量标签页时可以用鼠标滚轮切换","l":"https://www.cnbeta.com.tw/articles/tech/1585074.htm","p":"cnBeta.COM","d":"2026-11-05T05:34:51+00:00","s":"Google浏览器金丝雀测试版目前正在为继续使用横向标签页的用户带来新功能，该功能允许用户在打开大量标签页的情况下，使用标签栏箭头或鼠标滚轮进行快速切换，也支持通过触摸板手势进行切换。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/fd2bded0519db36.png"},{"t":"微软发文介绍Windows 11云重建功能 电脑无法启动时也能联网在线重装系统","l":"https://www.cnbeta.com.tw/articles/tech/1585072.htm","p":"cnBeta.COM","d":"2026-11-05T05:31:52+00:00","s":"在经过测试后微软已经为 Windows 11 带来云重建恢复功能，该功能在电脑出现严重系统问题时，用户可以通过 WinRE 恢复环境联网从微软下载新的系统映像和设备驱动程序以重装系统。整个过程不需要用户提前准备 U 盘启动镜像或借用其他电脑制作 U 盘启动镜像。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/ac5ae24cabcae04.png"},{"t":"苹果仍然对iPhone存储升级收取300%的费用","l":"https://www.cnbeta.com.tw/articles/tech/1585070.htm","p":"cnBeta.COM","d":"2026-11-05T05:30:21+00:00","s":"苹果近日表示存储芯片价格涨价正在挤压该公司的利润空间，不过华尔街日报综合苹果产品售价和研究机构的成本估算发现，即使存储芯片价格大幅度上涨，iPhone 18 Pro 系列高容量版本仍然有较大的价格空间。 阅读全文","i":"https://static.cnbetacdn.com/article/2025/0928/87106414a8568d9.jpg"},{"t":"法国血浆冷库遭到网络攻击 黑客将制冷系统设置到110℃ 工作人员紧急转移血浆","l":"https://www.cnbeta.com.tw/articles/tech/1585068.htm","p":"cnBeta.COM","d":"2026-11-05T05:28:54+00:00","s":"法国血液机构 EFS 的制冷设备供应商遭到网络攻击，此次攻击影响 EFS 在法国多地的血浆冷库。攻击者将部分冷库的目标温度从零下 30℃上调到 110℃，监控和报警系统及时发现异常，随后工作人员紧急转移血浆或妥善保护存储的血浆。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/203fc74ec758920.webp"},{"t":"​OpenAI提前布局2028美国大选议题 力推“AI新政”","l":"https://www.cnbeta.com.tw/articles/tech/1585066.htm","p":"cnBeta.COM","d":"2026-11-04T22:30:13+00:00","s":"距离2028年美国总统大选还有两年时间，但OpenAI已经开始试图影响这场选举中有关人工智能的讨论方向。公司全球事务主管克里斯·莱哈恩近日公开表示，人工智能可能成为2028年美国大选最具决定性的议题之一，并呼吁政界人士尽快建立一套能够回应公众担忧的AI政策框架。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1006/4f6add4dd423196.webp"},{"t":"旅行者1号再创历史 即将成为首个距离地球“一光日”的人类航天器","l":"https://www.cnbeta.com.tw/articles/science/1585064.htm","p":"cnBeta.COM","d":"2026-11-04T19:59:41+00:00","s":"美国国家航空航天局（NASA）的“旅行者1号”探测器即将迎来又一个历史性里程碑。这艘已经飞行近半个世纪的深空探测器，预计将在未来数周内达到距离地球一光日的位置，成为人类历史上首个与地球相隔整整一天光程的航天器。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/a9b589763d19186.jpg"},{"t":"DuckDuckGo借Google AI争议进军校园市场","l":"https://www.cnbeta.com.tw/articles/tech/1585062.htm","p":"cnBeta.COM","d":"2026-11-04T19:35:55+00:00","s":"在Google最新教育产品政策引发广泛争议后，主打隐私保护的搜索引擎DuckDuckGo迅速抓住机会，开始积极向美国各地学校推广自身服务，试图在长期由Google主导的教育市场争取更多份额。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/e5c2c39d99dfe1a.webp"},{"t":"自发电抗菌牙刷问世：利用压电效应产生电荷 实验中牙菌斑清除率超过99%","l":"https://www.cnbeta.com.tw/articles/tech/1585060.htm","p":"cnBeta.COM","d":"2026-11-04T19:34:22+00:00","s":"传统电动牙刷主要依靠机械振动和刷毛摩擦清除牙齿表面的牙菌斑，而中国研究人员近日开发出一种全新的实验性牙刷，将压电材料直接编织进刷毛之中。使用者刷牙时，刷毛受到机械作用便会产生电荷，进而触发抗菌化学反应，生成能够破坏细菌的活性氧物质。整个过程无需额外电池供电，有望让普通牙刷同时具备机械清洁和主动杀菌能力。 阅读全文","i":"https://www.science.org/cms/10.1126/sciadv.aeg5744/asset/5c61119b-7990-45ee-8a71-b1ca39df8642/assets/images/large/sciadv.aeg5744-f1.jpg"},{"t":"ChatGPT升级图片能力 支持直接生成和编辑GIF动画","l":"https://www.cnbeta.com.tw/articles/tech/1585058.htm","p":"cnBeta.COM","d":"2026-11-04T19:33:07+00:00","s":"OpenAI宣布为ChatGPT推出全新GIF动画生成功能，用户如今只需输入文字提示或上传一张图片，即可直接创建可播放的GIF动画。这项新能力将随着全新的Images 2.6图像模型一同向用户开放，进一步扩展了ChatGPT在图像创作领域的能力边界。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/cba4d36669fd426.png"},{"t":"免费开源项目让Windows 11彻底摆脱GPU 仅利用处理器NPU渲染整个桌面","l":"https://www.cnbeta.com.tw/articles/tech/1585056.htm","p":"cnBeta.COM","d":"2026-11-04T19:31:08+00:00","s":"随着人工智能处理器逐渐普及，越来越多的PC开始配备专门用于AI计算的神经网络处理单元（NPU）。不过，这类硬件目前主要用于本地AI模型推理和图像处理，日常Windows桌面仍然主要依赖集成显卡或独立显卡完成图形渲染。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/87d5d65fbb55358.gif"},{"t":"苹果将在iOS 27.3中审查公开iCloud分享链接内容 违规账号或面临封禁","l":"https://www.cnbeta.com.tw/articles/tech/1585054.htm","p":"cnBeta.COM","d":"2026-11-04T19:29:21+00:00","s":"苹果公司宣布，将从即将发布的iOS 27.3、iPadOS 27.3、macOS 27.3以及visionOS 27.3开始，对通过公开iCloud链接分享的内容进行安全审查。此举意味着部分原本由用户公开分享的照片和文件内容，将被苹果检测是否包含有害内容。
