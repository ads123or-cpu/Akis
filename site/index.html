026-11-07T19:50:33.642185+00:00","items":[{"t":"Video shows people fleeing as gunman opens fire in Kraków, Poland","l":"https://www.euronews.com/video/2026/11/07/video-shows-people-fleeing-as-gunman-opens-fire-in-krakow-poland","d":"2026-11-07T19:15:23+00:00","s":"UGC footage shows people running for cover as a deadly shooting unfolds in Kraków, Poland, leaving at least six people dead and around a dozen wounded, according to police.","i":"https://images.euronews.com/articles/stories/09/98/40/48/696x392_cmsv2_3d2d649c-cc23-52fe-b4cd-22cfba09c3fc-9984048.jpg"}]},"cnbeta":{"name":"cnBeta","lang":"zh","cat":"tech","plat":"web","url":"https://rss.cnbeta.com.tw/","updated":"2026-11-07T19:50:33.642185+00:00","items":[{"t":"美国再发生NVIDIA AI硬件失窃案：价值1140万美元设备运输途中神秘消失","l":"https://www.cnbeta.com.tw/articles/tech/1585414.htm","p":"cnBeta.COM","d":"2026-11-07T19:15:08+00:00","s":"随着人工智能数据中心建设热潮持续升温，英伟达高价值计算设备正在成为犯罪团伙的新目标。美国加利福尼亚州警方正在调查一起重大货运盗窃案，一批价值约1140万美元的英伟达设备在从奥克兰运往得克萨斯州沃思堡的途中失踪，至今仍未找到，警方也尚未宣布任何逮捕行动。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1108/2281a894aaa6d9f.webp"},{"t":"​AI设计基因编辑工具取得突破 科学家培育出可抵御致命病害的新型水稻","l":"https://www.cnbeta.com.tw/articles/science/1585412.htm","p":"cnBeta.COM","d":"2026-11-07T19:14:02+00:00","s":"美国密苏里大学研究团队近日宣布，他们成功培育出能够抵御细菌性枯萎病（水稻白叶枯病）的水稻植株。这种病害长期以来威胁着全球最重要的粮食作物之一，在亚洲和非洲部分地区尤其严重，常常导致大面积减产，并对农民生计和粮食安全造成重大影响。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1108/8375e23fccc8129.jpg"},{"t":"MBARI罕见拍到管眼鱼 透明头颅的深海怪鱼首次被4K镜头记录","l":"https://www.cnbeta.com.tw/articles/science/1585410.htm","p":"cnBeta.COM","d":"2026-11-07T17:00:39+00:00","s":"据美国蒙特雷湾水族馆研究所（MBARI）消息，研究人员在太平洋深海罕见拍摄到一条头部完全透明的管眼鱼（学名 Macropinna microstoma），这是该机构首次以4K画质记录这一物种，也是首次从新的旗舰科考船“戴维·帕卡德号”上拍到它。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1108/5156326a1b56a95.jpg"},{"t":"NASA Artemis II任务在电离层打出两个5000公里空洞 GPS信号受到干扰","l":"https://www.cnbeta.com.tw/articles/science/1585408.htm","p":"cnBeta.COM","d":"2026-11-07T16:59:14+00:00","s":"今年早些时候，“阿耳忒弥斯2号”（Artemis II）任务半个多世纪以来首次将宇航员送绕月球并安全返回。研究人员指出，这次历史性任务也给地球最外层的电离大气层造成了“沉重”代价。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1108/82346c73cefb403.webp"},{"t":"收购EA之后 银湖资本与沙特公共投资基金据报出价250亿美元收购Unity","l":"https://www.cnbeta.com.tw/articles/game/1585406.htm","p":"cnBeta.COM","d":"2026-11-07T16:58:17+00:00","s":"据路透社援引未具名知情人士的消息报道，由美国私募股权公司银湖资本（Silver Lake Partners）与沙特阿拉伯主权财富基金——公共投资基金（PIF）组成的投资者财团，已向Unity Software提出收购要约，对这家公司的估值约为250亿美元。据悉，Unity正在认真考虑这一报价，并已聘请一家投资银行提供咨询。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1108/10cc21f07c2823d.jpg"},{"t":"欧空局赫拉探测器首次近距离拍摄到Didymos双小行星系统","l":"https://www.cnbeta.com.tw/articles/science/1585404.htm","p":"cnBeta.COM","d":"2026-11-07T16:56:25+00:00","s":"欧洲空间局（ESA）负责行星防御的赫拉（Hera）任务日前首次近距离拍摄到迪迪莫斯（Didymos）双小行星系统。美国宇航局的DART探测器曾于2022年9月26日撞击其较小的伴星迪莫弗斯（Dimorphos），而这张新图像提供了一个此前从未见过的视角：从相邻的母小行星一侧回望整个系统。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1108/d8b9f8642b52722.webp"},{"t":"任天堂将推更多重制作品 粉丝盼姆吉拉假面与马64","l":"https://www.cnbeta.com.tw/articles/game/1585402.htm","p":"cnBeta.COM","d":"2026-11-07T16:52:43+00:00","s":"任天堂素来擅长将旗下人气老作品重新打磨后搬上现代平台，这早已不是什么新鲜事。但从今年的《星际火狐》开始，任天堂对“重制版”的定义似乎有了新的变化。据工作室高级副总裁透露，未来重制作品将与全新作品并驾齐驱，成为任天堂的核心业务方向。 阅读全文","i":"https://img.3dmgame.com/uploads/images/news/20261107/1794018350_578687_jpg_r.jpg"},{"t":"消息称古天乐拟进军内地网剧市场 与马楚成再合作警匪剧","l":"https://www.cnbeta.com.tw/articles/movie/1585400.htm","p":"cnBeta.COM","d":"2026-11-07T16:51:46+00:00","s":"消息称，古天乐可能首次进军内地网络剧市场，与导演马楚成合作一部由内地投资的警匪题材网络剧。目前该项目尚未官宣，项目名称、正式演员阵容及开机日期等信息也未公布。 阅读全文","i":"https://img.3dmgame.com/uploads/images/news/20261107/1794048112_319985_jpg_r.jpg"},{"t":"51岁男子行凶致墨尔本华人骑手身亡 熊猫外卖正核实并帮扶家属","l":"https://www.cnbeta.com.tw/articles/tech/1585398.htm","p":"cnBeta.COM","d":"2026-11-07T16:51:37+00:00","s":"网传消息显示，墨尔本一名华人外卖骑手于6日晚间遇袭身亡，涉事平台熊猫外卖发声，表示正在跟进处置、提供帮助。据维多利亚州警方发布的最初通报，当晚一名男子在墨尔本CBD身中数刀，被宣布当场死亡，另有一名30多岁男子疑似身中刀伤被送医。案件随即在当地展开调查。 阅读全文","i":"https://img.3dmgame.com/uploads/images/news/20261107/1794036229_777971.png"},{"t":"今年双11 为什么收到的快递包装变烂了？","l":"https://www.c 员发现，仅仅将睡眠时间缩短至三个小时，年轻人和老年人的部分脑网络连接就会发生不同变化。这一发现为解释为什么一些老年人似乎比年轻人更能应对偶尔一晚睡眠不足提供了新的线索。 阅读全文","i":"https://static.cnbetacdn.com/article/2024/1104/c83f73d82b38e79.jpg"},{"t":"B-52将搭载AGM-183A高超音速导弹 美军为传奇轰炸机再添新战力","l":"https://www.cnbeta.com.tw/articles/tech/1585384.htm","p":"cnBeta.COM","d":"2026-11-07T14:14:02+00:00","s":"美国空军与洛克希德·马丁近日签署一份价值6.94亿美元的合同，正式推动AGM-183A“空射快速反应武器”（ARRW）进入生产阶段。未来，这款21世纪高超音速武器将装备服役已超过70年的B-52“同温层堡垒”战略轰炸机，让这款冷战时代诞生的传奇战机继续承担美国空军前线打击任务。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1107/d7f66224337ec4f.webp"},{"t":"微软申请“实时改写发言”AI专利 可修改直播内容并同步调整口型","l":"https://www.cnbeta.com.tw/articles/tech/1585382.htm","p":"cnBeta.COM","d":"2026-11-07T14:13:22+00:00","s":"微软近日公开的一项专利申请引发广泛关注。根据专利文件描述，公司正在研究一种能够在直播过程中实时修改发言内容，并同步调整说话者嘴部和面部动作的人工智能系统，从而让观众看到经过修改后的自然视频画面。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1107/0ed006c6fd3c1a7.webp"},{"t":"TCL华星光电T8印刷OLED工厂进入设备安装阶段 计划于2027年底量产","l":"https://www.cnbeta.com.tw/articles/tech/1585380.htm","p":"cnBeta.COM","d":"2026-11-07T12:38:10+00:00","s":"TCL华星光电（TCL CSOT）近日宣布，其位于中国广州的T8工厂已经正式启动生产设备搬入工作。随着首台核心生产设备进场，该项目正式从厂房建设阶段转入设备安装与调试阶段。TCL华星光电高级副总裁张锋表示，首件核心设备的入场标志着T8项目进入设备安装和联调的重要阶段，为后续量产奠定基础。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1107/21722e5b33125ce.jpg"},{"t":"科学家研发可舔舐式药物监测设备 棒棒糖变身医疗检测仪","l":"https://www.cnbeta.com.tw/articles/science/1585378.htm","p":"cnBeta.COM","d":"2026-11-07T08:25:06+00:00","s":"医学检测往往会让人感到紧张和不适，尤其是儿童群体，即便只是采集唾液样本也并不总是轻松愉快。为解决这一问题，美国南加州大学研究团队开发出一种形似棒棒糖的新型检测设备，希望让医疗检测变得更加简单、自然且易于接受。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1107/06408aeea8b5b17.webp"},{"t":"德国认证学习课程可让60名员工为《GTA6/侠盗猎车6》离岗三天","l":"https://www.cnbeta.com.tw/articles/game/1585376.htm","p":"cnBeta.COM","d":"2026-11-07T07:10:25+00:00","s":"日前德国出现一项围绕《GTA6/侠盗猎车6》发售设置的认证学习课程，居然可让60名员工离开工作岗位三天，迅速引发热议。只是该安排属于当地法律制度下的一种特殊途径，但附带条件，并非所有德国玩家都能直接获得三天法定游戏假。 阅读全文","i":"https://img.3dmgame.com/uploads/images/news/20261107/1794013842_108948_jpg_r.jpg"},{"t":"Take Two CEO谈健康习惯：戒烟、适量运动并保证睡眠","l":"https://www.c function reelsListe(){var m={};M.kumeler.forEach(function(c){m[c.id]=c});return M.reels.map(function(i){return m[i]}).filter(Boolean)}
function gizliChip(){var n=Object.keys(gizli).length;return n?'<button class="cip" data-gizlig="1" aria-pressed="'+S.gizliGoster+'">Gizlenenler ('+n+')</button>':''}
function geriBar(){return S.geri&&gizli[S.geri]?'<div class="geri" role="status">Konu listeden kaldırıldı. <button data-gizle="'+S.geri+'">Geri al</button></div>':''}
function ciz(){
  var a=$('ana'),h='';
  $('gorunum').innerHTML=[['liste','Liste'],['kart','Kart']].map(function(t){return'<button data-gorunum="'+t[0]+'" aria-pressed="'+(S.gorunum===t[0])+'">'+t[1]+'</button>'}).join('');
  document.querySelectorAll('[data-sekme]').forEach(function(b){b.setAttribute('aria-selected',b.dataset.sekme===S.sekme)});
  yanCiz();
  var filtre=cipler(S.dil,[['hepsi','Tüm diller'],['tr','Türkçe'],['en','Yabancı'],['zh','Çince']],'dil')+cipler(S.saat,[[6,'6 saat'],[24,'24 saat'],[72,'3 gün']],'saat');
  if(S.sekme==='gundem'){
    h=geriBar()+'<div class="ana-ust"><h1>Gündem</h1>'+filtre+gizliChip()+'</div>'+liste(suz(M.kumeler),'Bu süzgeçte haber yok.');
  }else if(S.sekme==='reels'){
    var l=suz(reelsListe());
    if(S.tur==='yeni')l=l.filter(yeniMi);else if(S.tur!=='hepsi')l=l.filter(function(c){return(c.tur||[]).indexOf(S.tur)>=0});
    if(S.sirala==='yeni')l=l.slice().sort(function(a,b){return(b.ilk||0)-(a.ilk||0)});
    var trTr=(M.trendler||[]).filter(function(t){return t.ulke==='TR'});
    h=geriBar()+'<div class="ana-ust"><h1>Reels konuları</h1>'+cipler(S.tur,TUR,'tur')+'<span class="ayrac"></span>'+cipler(S.sirala,[['puan','Puana göre'],['yeni','En yeni']],'sirala')+gizliChip()+'</div><p class="bilgi">Telefon, uygulama, güvenlik ve yapay zekâ kullanıcısını ilgilendiren haberler öne çıkar; kaza, dizi, borsa ve yabancı ülke kampanyaları listeye girmez. Sıra: kaynak sayısı, hız, kullanıcıya etki, Türkiye ilgisi ve tazelik. Tahmindir, görüntülenme garantisi değildir. Alakasız olanı <b>İlgisiz</b> ile kaldırabilirsin (Geri al mümkün).</p>';
    if(trTr.length)h+='<div class="trend"><b>Teknoloji trendleri</b>'+trTr.slice(0,10).map(function(t){return'<a href="'+x(t.l)+'" target="_blank" rel="noopener">'+x(t.t)+'</a>'}).join('')+'</div>';
    h+=liste(l,'Bu türde aday yok. Başka bir tür seçin.');
  }else if(S.sekme==='son'){
    var q=norm(S.q),ls=sonHaberler().filter(function(c){return(S.dil==='hepsi'||c.dil===S.dil)&&(!q||norm(c.t).indexOf(q)>=0)});
    h='<div class="ana-ust"><h1>Son haberler</h1>'+cipler(S.dil,[['hepsi','Tüm diller'],['tr','Türkçe'],['en','Yabancı'],['zh','Çince']],'dil')+'</div>'+liste(ls,'Bu bölümde haber yok.');
  }else if(S.sekme==='kayit'){
    var kl=Object.keys(kayit).map(function(k){return kayit[k]}).sort(function(a,b){return b.son-a.son});
    h='<div class="ana-ust"><h1>Kaydedilenler</h1></div>'+liste(kl,'Kaydettiğin haberler burada durur. Yalnız bu tarayıcıda saklanır.');
  }else{
    var sg=M.saglik||{},kl2=M.kaynaklar.slice().sort(function(a,b){return(a.son||'')<(b.son||'')?-1:1});
    h='<div class="ana-ust"><h1>Kaynaklar</h1></div><p class="bilgi">'+(sg.kaynak||0)+' kaynak: '+(sg.basarili||0)+' çalışıyor, '+(sg.bayat||0)+' bu tur yanıt vermedi, '+(sg.beklemede||0)+' beklemede. 12 saatten eski kopya akışa girmez. En eski güncellenen en üstte.</p><div class="kaz"><table class="tablo"><thead><tr><th>Kaynak</th><th>Bölüm</th><th>Son haber</th><th>Durum</th></tr></thead><tbody>'+kl2.map(function(k){return'<tr><td>'+x(k.ad)+'</td><td>'+x(k.cat)+'</td><td>'+(k.son?kac(Date.parse(k.son)/1000)+' önce':'–')+'</td><td>'+(k.bayat?'Yanıt vermedi':'Çalışıyor')+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  a.innerHTML=h;
}
function git(s){S.geri=null;S.sekme=s;S.adet=40;S.secili=-1;S.konu='hepsi';if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);ciz();window.scrollTo(0,0)}
function sekmeCiz(){
  $('sekmeler').innerHTML=SEKME.map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('alt').innerHTML=SEKME.slice(0,4).map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1].replace('Son haberler','Son').replace('Kaydedilenler','Kayıtlı')+'</button>'}).join('');
}
function bul(id){var m=M.kumeler.concat(sonHaberler()).filter(function(c){return c.id===id})[0];return m||kayit[id]}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-sekme],[data-konu],[data-dil],[data-saat],[data-tur],[data-kat],[data-ac],[data-kaydet],[data-gorunum],[data-sirala],[data-gizle],[data-gizlig],#daha,#tema,[data-okundu]');
  if(!t)return;var d=t.dataset;
  if(d.okundu){okundu[d.okundu]=1;var ks=Object.keys(okundu);if(ks.length>1500)delete okundu[ks[0]];yaz('akis-okundu',okundu);return}
  if(d.sekme)return git(d.sekme);
  if(d.konu){S.konu=d.konu;S.adet=40}
  else if(d.dil)S.dil=d.dil;
  else if(d.saat)S.saat=+d.saat;
  else if(d.tur)S.tur=d.tur;
  else if(d.sirala)S.sirala=d.sirala;
  else if(d.gizlig)S.gizliGoster=!S.gizliGoster;
  else if(d.gizle){if(gizli[d.gizle]){delete gizli[d.gizle];S.geri=null}else{gizli[d.gizle]=Math.round(Date.now()/1000);S.geri=d.gizle;var gk=Object.keys(gizli);if(gk.length>800)delete gizli[gk[0]]}yaz('akis-gizli',gizli)}
  else if(d.gorunum){S.gorunum=d.gorunum;yaz('akis-gorunum',S.gorunum)}
  else if(d.kat){S.kat=d.kat;S.adet=40}
  else if(d.ac)S.acik[d.ac]=!S.acik[d.ac];
  else if(d.kaydet){if(kayit[d.kaydet])delete kayit[d.kaydet];else{var c=bul(d.kaydet);if(c)kayit[d.kaydet]=c}yaz('akis-kayit',kayit)}
  else if(t.id==='daha')S.adet+=40;
  else if(t.id==='tema'){var r=document.documentElement,kz=matchMedia('(prefers-color-scheme:dark)').matches,su=r.dataset.tema||(kz?'koyu':'acik'),yn=su==='koyu'?'acik':'koyu';r.dataset.tema=yn;try{localStorage.setItem('akis-tema',yn)}catch(er){}return}
  ciz();
});
var zm;$('ara').addEventListener('input',function(){clearTimeout(zm);var v=this.value;zm=setTimeout(function(){S.q=v;S.adet=40;ciz()},150)});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var h=e.target.tagName;
  if(h==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  if(e.key==='/'){e.preventDefault();$('ara').focus();return}
  if((e.key==='j'||e.key==='k')&&GORUNEN.length){S.secili=Math.min(GORUNEN.length-1,Math.max(0,S.secili+(e.key==='j'?1:-1)));ciz();var el=document.querySelector('.kart.secili');if(el)el.scrollIntoView({block:'center'});return}
  var c=GORUNEN[S.secili];if(!c)return;
  if(e.key==='o'||e.key==='Enter')window.open(c.l,'_blank','noopener');
  if(e.key==='x'){if(gizli[c.id]){delete gizli[c.id];S.geri=null}else{gizli[c.id]=Math.round(Date.now()/1000);S.geri=c.id}yaz('akis-gizli',gizli);ciz()}
  if(e.key==='s'){if(kayit[c.id])delete kayit[c.id];else kayit[c.id]=c;yaz('akis-kayit',kayit);ciz()}
});
function durumYaz(){
  var g=M.generated||SNAP.generated,el=$('durum');if(!g)return;
  var z=Date.parse(g)/1000,dk=(Date.now()/1000-z)/60;
  el.textContent=(dk>90?'Güncellenmedi: ':'Güncellendi: ')+kac(z)+' önce';el.classList.toggle('eski',dk>90);
}
sekmeCiz();
fetch('masa.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){M=j;durumYaz();var h=location.hash.slice(1);git(SEKME.some(function(t){return t[0]===h})?h:'gundem')}).catch(function(){durumYaz();$('ana').innerHTML='<div class="bos">Masa verisi yüklenemedi. Son haberler yine çalışır.</div>';S.sekme='son';ciz()});
})();
</script>
</body>
