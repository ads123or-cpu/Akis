*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--metin);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px;border-radius:4px}
.ust{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;background:var(--yuzey);border-bottom:1px solid var(--cizgi)}
.logo{font-weight:800;font-size:18px;color:var(--ink);letter-spacing:-.02em}
.sekmeler{display:flex;gap:2px}
.sekmeler button{padding:7px 12px;border-radius:7px;font-weight:600;color:var(--soluk);white-space:nowrap}
.sekmeler button:hover{background:var(--yuzey2);color:var(--ink)}
.sekmeler button[aria-selected=true]{background:var(--vurgu-yumusak);color:var(--vurgu)}
.ara{flex:1;max-width:340px;margin-left:auto;height:36px;padding:0 12px;border:1px solid var(--cizgi);border-radius:8px;background:var(--bg)}
.ikon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--soluk)}
.ikon:hover{background:var(--yuzey2);color:var(--ink)}
.durum{font-size:12px;color:var(--soluk);white-space:nowrap}
.durum.eski{color:var(--sicak);font-weight:600}
.duzen{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;padding:16px}
.yan{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto}
.yan h3{margin:14px 8px 5px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soluk)}
.yan h3:first-child{margin-top:0}
.yan button{display:flex;justify-content:space-between;width:100%;padding:6px 8px;border-radius:6px;text-align:left;font-weight:500}
.yan button:hover{background:var(--yuzey2)}
.yan button[aria-pressed=true]{background:var(--vurgu-yumusak);color:var(--vurgu);font-weight:650}
.yan small{color:var(--soluk);font-weight:400}
.ana-ust{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.ana-ust h1{margin:0 auto 0 0;font-size:19px;color:var(--ink);letter-spacing:-.01em}
.cip{padding:5px 11px;border:1px solid var(--cizgi);border-radius:7px;background:var(--yuzey);font-size:13px;font-weight:550}
.cip:hover{border-color:var(--soluk)}
.cip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bilgi{margin:0 0 12px;font-size:13px;color:var(--soluk)}
.liste{display:grid;gap:8px}
.kart{display:grid;grid-template-columns:148px minmax(0,1fr);gap:12px;padding:10px;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:10px}

.res{position:relative;display:block;align-self:start;aspect-ratio:16/10;border-radius:7px;overflow:hidden;background:var(--yuzey2)}
.res img{position:relative;width:100%;height:100%;object-fit:cover;display:block}

.trend b{color:var(--soluk);font-weight:600;margin-right:3px}

.kaz{overflow-x:auto;border:1px solid var(--cizgi);border-radius:10px}
.gorunum{display:flex;border:1px solid var(--cizgi);border-radius:8px;overflow:hidden;flex-shrink:0}

.satir:last-child{border-bottom:0}
.satir:hover{background:var(--yuzey2)}
.satir.secili{box-shadow:inset 3px 0 0 var(--vurgu)}
.satir .res{aspect-ratio:4/3;border-radius:6px}
.satir h2{margin:0 0 2px;font-size:14px;line-height:1.3;font-weight:650;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.satir.okundu h2{color:var(--soluk);font-weight:550}
.satir .ozet{-webkit-line-clamp:1;margin:1px 0 3px;font-size:12.5px}
.satir .meta{font-size:12px}
.satir .yer{font-size:10px}
.alt{display:none}
.diger{display:flex;justify-content:center;margin-top:12px}

 .alt button{min-height:50px;font-size:12.5px;font-weight:650;color:var(--soluk)}.alt button[aria-selected=true]{color:var(--vurgu)}
}

  return '<a class="res" href="'+x(link)+'" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">'+yer+im+'</a>';
}
function eylem(c){
  var ozet=c.s||'',kayitli=!!kayit[c.id];
  var stud=PANEL+'/sosyal-studyo?baslik='+encodeURIComponent(c.t)+'&ozet='+encodeURIComponent(ozet)+'&link='+encodeURIComponent(c.l);
  var hizli=PANEL+'/hizli-yaz?metin='+encodeURIComponent((c.t+'\n\n'+ozet+'\n\nKaynak: '+c.l).slice(0,1500));
  var cevir=c.dil!=='tr'?'<a class="dg" target="_blank" rel="noopener" href="https://translate.google.com/translate?sl=auto&tl=tr&u='+encodeURIComponent(c.l)+'">Çevir</a>':'';
  var kaynak=c.og&&c.og.length>1?'<button class="dg" data-ac="'+c.id+'" aria-expanded="'+(S.acik[c.id]?'true':'false')+'">'+c.og.length+' haberi gör</button>':'';
  return '<div class="eylem">'+(S.sekme==='reels'?'<a class="dg birincil" target="_blank" rel="noopener" href="'+x(stud)+'">Stüdyo\'ya aktar</a><a class="dg" target="_blank" rel="noopener" href="'+x(hizli)+'">Hızlı Yaz</a>':'<a class="dg" target="_blank" rel="noopener" href="'+x(hizli)+'">Hızlı Yaz</a><a class="dg" target="_blank" rel="noopener" href="'+x(stud)+'">Stüdyo</a>')+kaynak+cevir+'<button class="dg" data-kaydet="'+c.id+'" aria-pressed="'+kayitli+'">'+(kayitli?'Kaydedildi':'Kaydet')+'</button></div>';
}
function kart(c,i){
  var konu=konuAd(c.k),ks=c.ks||1;
  var ned=S.sekme==='reels'&&c.ned&&c.ned.length?'<ul class="nedenler">'+c.ned.map(function(n){return'<li>'+x(n)+'</li>'}).join('')+'</ul>':'';
  var liste=S.acik[c.id]&&c.og?'<ul class="kaynaklar">'+c.og.map(function(o){return'<li><a href="'+x(o.l)+'" target="_blank" rel="noopener" data-okundu="'+c.id+'">'+x(o.t)+'</a><span>'+x(o.p)+' · '+kac(o.z)+'</span></li>'}).join('')+'</ul>':'';
  var kaynakAd=c.og&&c.og[0]?c.og[0].p:'';
  return '<article class="kart'+(okundu[c.id]?' okundu':'')+(S.secili===i?' secili':'')+'" data-i="'+i+'">'+resim(c.i,konu||kaynakAd,c.l)+'<div>'+
    '<h2>'+(S.sekme==='reels'?'<span class="sira">'+(i+1)+'</span>':'')+'<a href="'+x(c.l)+'" target="_blank" rel="noopener" data-okundu="'+c.id+'">'+x(c.t)+'</a></h2>'+
    '<div class="meta"><span class="ks'+(ks<2?' tek':'')+'">'+(ks>1?ks+' kaynak':x(kaynakAd))+'</span><span>'+kac(c.son)+' önce</span>'+(konu?'<span>'+x(konu)+'</span>':'')+(c.dil!=='tr'?'<span class="dil">'+(c.dil==='zh'?'ZH':'EN')+'</span>':'')+'</div>'+
    ned+(c.s?'<p class="ozet">'+x(c.s)+'</p>':'')+eylem(c)+liste+'</div></article>';
}
// Liste görünümü: küçük fotoğraf, başlık, tek satır özet ve meta. Kart görünümünün aksiyonları yok; kaydet/aç klavyeyle de çalışır.
function satir(c,i){
  var konu=konuAd(c.k),ks=c.ks||1,kaynakAd=c.og&&c.og[0]?c.og[0].p:'';
  return '<article class="satir'+(okundu[c.id]?' okundu':'')+(S.secili===i?' secili':'')+'" data-i="'+i+'">'+resim(c.i,konu||kaynakAd,c.l)+'<div>'+
    '<h2><a href="'+x(c.l)+'" target="_blank" rel="noopener" data-okundu="'+c.id+'">'+x(c.t)+'</a></h2>'+
    (c.s?'<p class="ozet">'+x(c.s)+'</p>':'')+
    '<div class="meta"><span class="ks'+(ks<2?' tek':'')+'">'+(ks>1?ks+' kaynak':x(kaynakAd))+'</span><span>'+kac(c.son)+' önce</span>'+(konu?'<span>'+x(konu)+'</span>':'')+'</div></div></article>';
}
function suz(l){
  var q=norm(S.q),sinir=Date.now()/1000-S.saat*3600;
  return l.filter(function(c){
    if(c.son<sinir)return false;
    if(S.konu!=='hepsi'&&c.k!==S.konu)return false;
    if(S.dil==='tr'&&c.dil!=='tr')return false;
    if(S.dil==='en'&&c.dil==='tr')return false;
    if(S.dil==='zh'&&c.dil!=='zh')return false;
    if(q&&norm(c.t+' '+(c.s||'')+' '+(c.og||[]).map(function(o){return o.t+' '+o.p}).join(' ')).indexOf(q)<0)return false;
    return true;
  });
}
var GORUNEN=[];
function liste(l,bosMetin){
  GORUNEN=l.slice(0,S.adet);
  if(!l.length)return '<div class="bos">'+x(bosMetin)+'</div>';
  var satirMi=S.gorunum!=='kart';
  return (satirMi?'<div class="satirlar">'+GORUNEN.map(satir).join('')+'</div>':'<div class="liste">'+GORUNEN.map(kart).join('')+'</div>')+(l.length>S.adet?'<div class="diger"><button class="dg" id="daha">Daha fazla ('+(l.length-S.adet)+')</button></div>':'');
}
function sonHaberler(){
  var o=[],g={};
  Object.keys(SNAP.feeds||{}).forEach(function(k){var f=SNAP.feeds[k];(f.items||[]).forEach(function(it){
    if(!it.l||g[it.l]||/trends/.test(k))return;g[it.l]=1;
    var cat=it.c||f.cat,z=Date.parse(it.d||'')/1000;if(!z)return;
    if(S.kat==='tech'?['tech','samsung','ios','mac','mobil','win','auto'].indexOf(cat)<0:cat!==S.kat)return;
    o.push({id:'s'+it.l.slice(-16),t:it.t,s:it.s,i:it.i,l:it.l,son:z,dil:f.lang,ks:1,k:KAT[cat]||'',og:[{p:it.p||f.name}]});
  })});
  return o.sort(function(a,b){return b.son-a.son});
}
function cipler(v,liste,alan){return liste.map(function(t){return'<button class="cip" data-'+alan+'="'+t[0]+'" aria-pressed="'+(v===t[0])+'">'+t[1]+'</button>'}).join('')}
function yanCiz(){
  var y=$('yan'),h='';
  if(S.sekme==='gundem'||S.sekme==='reels'){
    var say={};suzKonusuz().forEach(function(c){say[c.k]=(say[c.k]||0)+1});
    var top=suzKonusuz().length;
    h+='<h3>Konular</h3><button data-konu="hepsi" aria-pressed="'+(S.konu==='hepsi')+'">Hepsi <small>'+top+'</small></button>';
    M.konular.forEach(function(k){if(say[k.k])h+='<button data-konu="'+k.k+'" aria-pressed="'+(S.konu===k.k)+'">'+x(k.ad)+' <small>'+say[k.k]+'</small></button>'});
  }else if(S.sekme==='son'){
    h+='<h3>Bölümler</h3><button data-kat="tech" aria-pressed="'+(S.kat==='tech')+'">Teknoloji</button>';
    GENEL.forEach(function(k){h+='<button data-kat="'+k[0]+'" aria-pressed="'+(S.kat===k[0])+'">'+k[1]+'</button>'});
  }
  y.innerHTML=h;y.style.display=h?'':'none';document.querySelector('.duzen').style.gridTemplateColumns=h?'':'minmax(0,1fr)';
}
function suzKonusuz(){var k=S.konu;S.konu='hepsi';var l=suz(S.sekme==='reels'?reelsListe():M.kumeler);S.konu=k;return l}
function reelsListe(){var m={};M.kumeler.forEach(function(c){m[c.id]=c});return M.reels.map(function(i){return m[i]}).filter(Boolean)}
function ciz(){
  var a=$('ana'),h='';
  $('gorunum').innerHTML=[['liste','Liste'],['kart','Kart']].map(function(t){return'<button data-gorunum="'+t[0]+'" aria-pressed="'+(S.gorunum===t[0])+'">'+t[1]+'</button>'}).join('');
  document.querySelectorAll('[data-sekme]').forEach(function(b){b.setAttribute('aria-selected',b.dataset.sekme===S.sekme)});
  yanCiz();
  var filtre=cipler(S.dil,[['hepsi','Tüm diller'],['tr','Türkçe'],['en','Yabancı'],['zh','Çince']],'dil')+cipler(S.saat,[[6,'6 saat'],[24,'24 saat'],[72,'3 gün']],'saat');
  if(S.sekme==='gundem'){
    h='<div class="ana-ust"><h1>Gündem</h1>'+filtre+'</div>'+liste(suz(M.kumeler),'Bu süzgeçte haber yok.');
  }else if(S.sekme==='reels'){
    var l=suz(reelsListe());if(S.tur!=='hepsi')l=l.filter(function(c){return(c.tur||[]).indexOf(S.tur)>=0});
    h='<div class="ana-ust"><h1>Reels konuları</h1>'+cipler(S.tur,TUR,'tur')+'</div><p class="bilgi">Sıralama: kaç kaynak yazdı, ne kadar hızlı yayılıyor, Google trendi, merak unsuru, Türkiye ilgisi, görsel ve tazelik. Tahmindir, görüntülenme garantisi değildir.</p>';
    if(M.trendler.length)h+='<div class="trend"><b>Google trendleri</b>'+M.trendler.filter(function(t){return t.ulke==='TR'}).slice(0,10).map(function(t){return'<a href="'+x(t.l)+'" target="_blank" rel="noopener">'+x(t.t)+'</a>'}).join('')+'</div>';
    h+=liste(l,'Bu türde aday yok. Başka bir tür seçin.');
  }else if(S.sekme==='son'){
    var q=norm(S.q),ls=sonHaberler().filter(function(c){return(S.dil==='hepsi'||c.dil===S.dil)&&(!q||norm(c.t).indexOf(q)>=0)});
    h='<div class="ana-ust"><h1>Son haberler</h1>'+cipler(S.dil,[['hepsi','Tüm diller'],['tr','Türkçe'],['en','Yabancı'],['zh','Çince']],'dil')+'</div>'+liste(ls,'Bu bölümde haber yok.');
  }else if(S.sekme==='kayit'){
    var kl=Object.keys(kayit).map(function(k){return kayit[k]}).sort(function(a,b){return b.son-a.son});
    h='<div class="ana-ust"><h1>Kaydedilenler</h1></div>'+liste(kl,'Kaydettiğin haberler burada durur. Yalnız bu tarayıcıda saklanır.');
  }else{
    var sg=M.saglik||{},kl2=M.kaynaklar.slice().sort(function(a,b){return(a.son||'')<(b.son||'')?-1:1});
    h='<div class="ana-ust"><h1>Kaynaklar</h1></div><p class="bilgi">'+(sg.kaynak||0)+' kaynak: '+(sg.basarili||0)+' çalışıyor, '+(sg.bayat||0)+' bu tur yanıt vermedi, '+(sg.beklemede||0)+' beklemede. 12 saatten eski kopya akışa girmez. En eski güncellenen en üstte.</p><div class="kaz"><table class="tablo"><thead><tr><th>Kaynak</th><th>Bölüm</th><th>Son haber</th><th>Durum</th></tr></thead><tbody>'+kl2.map(function(k){return'<tr><td>'+x(k.ad)+'</td><td>'+x(k.cat)+'</td><td>'+(k.son?kac(Date.parse(k.son)/1000)+' önce':'–')+'</td><td>'+(k.bayat?'Yanıt vermedi':'Çalışıyor')+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  a.innerHTML=h;
}
function git(s){S.sekme=s;S.adet=40;S.secili=-1;S.konu='hepsi';if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);ciz();window.scrollTo(0,0)}
function sekmeCiz(){
  $('sekmeler').innerHTML=SEKME.map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('alt').innerHTML=SEKME.slice(0,4).map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1].replace('Son haberler','Son').replace('Kaydedilenler','Kayıtlı')+'</button>'}).join('');
}
function bul(id){var m=M.kumeler.concat(sonHaberler()).filter(function(c){return c.id===id})[0];return m||kayit[id]}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-sekme],[data-konu],[data-dil],[data-saat],[data-tur],[data-kat],[data-ac],[data-kaydet],[data-gorunum],#daha,#tema,[data-okundu]');
  if(!t)return;var d=t.dataset;
  if(d.okundu){okundu[d.okundu]=1;var ks=Object.keys(okundu);if(ks.length>1500)delete okundu[ks[0]];yaz('akis-okundu',okundu);return}
  if(d.sekme)return git(d.sekme);
  if(d.konu){S.konu=d.konu;S.adet=40}
  else if(d.dil)S.dil=d.dil;
  else if(d.saat)S.saat=+d.saat;
  else if(d.tur)S.tur=d.tur;
  else if(d.gorunum){S.gorunum=d.gorunum;yaz('akis-gorunum',S.gorunum)}
  else if(d.kat){S.kat=d.kat;S.adet=40}
  else if(d.ac)S.acik[d.ac]=!S.acik[d.ac];
  else if(d.kaydet){if(kayit[d.kaydet])delete kayit[d.kaydet];else{var c=bul(d.kaydet);if(c)kayit[d.kaydet]=c}yaz('akis-kayit',kayit)}
  else if(t.id==='daha')S.adet+=40;
  else if(t.id==='tema'){var r=document.documentElement,kz=matchMedia('(prefers-color-scheme:dark)').matches,su=r.dataset.tema||(kz?'koyu':'acik'),yn=su==='koyu'?'acik':'koyu';r.dataset.tema=yn;try{localStorage.setItem('akis-tema',yn)}catch(er){}return}
  ciz();
});
var zm;$('ara').addEventListener('input',function(){clearTimeout(zm);var v=this.value;zm=setTimeout(function(){S.q=v;S.adet=40;ciz()},150)});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var h=e.target.tagName;
  if(h==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  if(e.key==='/'){e.preventDefault();$('ara').focus();return}
  if((e.key==='j'||e.key==='k')&&GORUNEN.length){S.secili=Math.min(GORUNEN.length-1,Math.max(0,S.secili+(e.key==='j'?1:-1)));ciz();var el=document.querySelector('.kart.secili');if(el)el.scrollIntoView({block:'center'});return}
  var c=GORUNEN[S.secili];if(!c)return;
  if(e.key==='o'||e.key==='Enter')window.open(c.l,'_blank','noopener');
  if(e.key==='s'){if(kayit[c.id])delete kayit[c.id];else kayit[c.id]=c;yaz('akis-kayit',kayit);ciz()}
});
function durumYaz(){
  var g=M.generated||SNAP.generated,el=$('durum');if(!g)return;
  var z=Date.parse(g)/1000,dk=(Date.now()/1000-z)/60;
  el.textContent=(dk>90?'Güncellenmedi: ':'Güncellendi: ')+kac(z)+' önce';el.classList.toggle('eski',dk>90);
}
sekmeCiz();
fetch('masa.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){M=j;durumYaz();var h=location.hash.slice(1);git(SEKME.some(function(t){return t[0]===h})?h:'gundem')}).catch(function(){durumYaz();$('ana').innerHTML='<div class="bos">Masa verisi yüklenemedi. Son haberler yine çalışır.</div>';S.sekme='son';ciz()});
})();
</script>
</body>
</html>
