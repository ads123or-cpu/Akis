<style>
:root{--bg:#f4f5f7;--yuzey:#fff;--yuzey2:#eef0f3;--cizgi:#e1e4e9;--ink:#10151f;--metin:#2a3140;--soluk:#667084;--vurgu:#0b57d0;--vurgu-yumusak:#e6effc;--uzerine:#fff;--sicak:#b4510a;--sicak-yumusak:#fdf0e3;--yesil:#14733c;--golge:0 10px 30px -14px rgba(16,21,31,.35)}
@media (prefers-color-scheme:dark){:root:not([data-tema=acik]){--bg:#0b0e14;--yuzey:#141923;--yuzey2:#1d2430;--cizgi:#2a3241;--ink:#f1f4f9;--metin:#d3dae6;--soluk:#94a0b3;--vurgu:#7db0ff;--vurgu-yumusak:#17294a;--uzerine:#0b1324;--sicak:#f5a35c;--sicak-yumusak:#37240f;--yesil:#5fd08d;--golge:0 10px 30px -14px #000}}
:root[data-tema=koyu]{--bg:#0b0e14;--yuzey:#141923;--yuzey2:#1d2430;--cizgi:#2a3241;--ink:#f1f4f9;--metin:#d3dae6;--soluk:#94a0b3;--vurgu:#7db0ff;--vurgu-yumusak:#17294a;--uzerine:#0b1324;--sicak:#f5a35c;--sicak-yumusak:#37240f;--yesil:#5fd08d;--golge:0 10px 30px -14px #000}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--metin);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px;border-radius:4px}
.ust{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;background:var(--yuzey);border-bottom:1px solid var(--cizgi)}
.logo{font-weight:800;font-size:18px;color:var(--ink);letter-spacing:-.02em}
.sekmeler{display:flex;gap:2px}
.sekmeler button{padding:7px 12px;border-radius:7px;font-weight:600;color:var(--soluk);white-space:nowrap}
.sekmeler button:hover{background:var(--yuzey2);color:var(--ink)}
.sekmeler button[aria-selected=true]{background:var(--vurgu-yumusak);color:var(--vurgu)}
.ara{flex:1;max-width:340px;margin-left:auto;height:36px;padding:0 12px;border:1px solid var(--cizgi);border-radius:8px;background:var(--bg)}
.ikon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--soluk)}
.ikon:hover{background:var(--yuzey2);color:var(--ink)}
.durum{font-size:12px;color:var(--soluk);white-space:nowrap}
.durum.eski{color:var(--sicak);font-weight:600}
.duzen{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;padding:16px}
.yan{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto}
.yan h3{margin:14px 8px 5px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soluk)}
.yan h3:first-child{margin-top:0}
.yan button{display:flex;justify-content:space-between;width:100%;padding:6px 8px;border-radius:6px;text-align:left;font-weight:500}
.yan button:hover{background:var(--yuzey2)}
.yan button[aria-pressed=true]{background:var(--vurgu-yumusak);color:var(--vurgu);font-weight:650}
.yan small{color:var(--soluk);font-weight:400}
.ana-ust{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.ana-ust h1{margin:0 auto 0 0;font-size:19px;color:var(--ink);letter-spacing:-.01em}
.cip{padding:5px 11px;border:1px solid var(--cizgi);border-radius:7px;background:var(--yuzey);font-size:13px;font-weight:550}
.cip:hover{border-color:var(--soluk)}
.cip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bilgi{margin:0 0 12px;font-size:13px;color:var(--soluk)}
.liste{display:grid;gap:8px}
.kart{display:grid;grid-template-columns:148px minmax(0,1fr);gap:12px;padding:10px;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:10px}

.kart.okundu h2{color:var(--soluk);font-weight:550}
.res{position:relative;display:block;align-self:start;aspect-ratio:16/10;border-radius:7px;overflow:hidden;background:var(--yuzey2)}
.res img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
.yer{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;font-size:12px;font-weight:700;color:var(--soluk);line-height:1.2}
.kart h2{margin:0 0 4px;font-size:15.5px;line-height:1.3;font-weight:650;color:var(--ink)}
.kart h2 a:hover{color:var(--vurgu)}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--soluk)}
.ks{font-weight:700;color:var(--vurgu)}
.ks.tek{font-weight:500;color:var(--soluk)}
.dil{padding:0 5px;border:1px solid var(--cizgi);border-radius:4px;font-size:11px;font-weight:600}
.ozet{margin:4px 0 0;font-size:13px;color:var(--soluk);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eylem{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.dg{padding:4px 9px;border:1px solid var(--cizgi);border-radius:6px;font-size:12.5px;font-weight:550;color:var(--metin);background:transparent}
.dg:hover{border-color:var(--vurgu);color:var(--vurgu)}
.dg.birincil{background:var(--vurgu);border-color:var(--vurgu);color:var(--uzerine)}
.dg.birincil:hover{color:var(--uzerine);opacity:.9}
.dg[aria-pressed=true]{color:var(--sicak);border-color:var(--sicak)}
.nedenler{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0;padding:0;list-style:none}
.nedenler li{padding:1px 7px;border-radius:5px;background:var(--sicak-yumusak);color:var(--sicak);font-size:12px;font-weight:600}
.sira{font-weight:800;color:var(--sicak);margin-right:4px}
.kaynaklar{margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--cizgi);list-style:none;display:grid;gap:5px;font-size:13px}
.kaynaklar li{display:flex;gap:8px;justify-content:space-between}
.kaynaklar a:hover{color:var(--vurgu)}
.kaynaklar span{flex-shrink:0;color:var(--soluk);font-size:12px}
.trend{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;align-items:center;font-size:13px}
.trend b{color:var(--soluk);font-weight:600;margin-right:3px}
.trend a{padding:2px 8px;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:6px}
.trend a:hover{border-color:var(--vurgu);color:var(--vurgu)}
.bos{padding:40px 16px;text-align:center;color:var(--soluk);background:var(--yuzey);border:1px dashed var(--cizgi);border-radius:10px}
.tablo{width:100%;border-collapse:collapse;background:var(--yuzey);border-radius:10px;overflow:hidden;font-size:13px}
.tablo th,.tablo td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--cizgi)}
.tablo th{font-size:11.5px;color:var(--soluk);text-transform:uppercase;letter-spacing:.05em}
.kaz{overflow-x:auto;border:1px solid var(--cizgi);border-radius:10px}
.alt{display:none}
.diger{display:flex;justify-content:center;margin-top:12px}
@media (max-width:860px){
 .duzen{grid-template-columns:minmax(0,1fr);padding:10px;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
 .ust{gap:8px;padding:0 10px}.ust .sekmeler,.durum{display:none}.ara{max-width:none}
 .yan{position:static;max-height:none;min-width:0;display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin:0 -10px;padding-inline:10px;scrollbar-width:none}
 .yan h3{display:none}.yan button{width:auto;white-space:nowrap;gap:5px;border:1px solid var(--cizgi);background:var(--yuzey)}
 .kart{grid-template-columns:104px minmax(0,1fr);gap:9px;padding:8px}.kart h2{font-size:14.5px}.ozet{display:none}
 .alt{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset:auto 0 0;z-index:20;background:var(--yuzey);border-top:1px solid var(--cizgi);padding-bottom:env(safe-area-inset-bottom)}
 .alt button{min-height:50px;font-size:12.5px;font-weight:650;color:var(--soluk)}.alt button[aria-selected=true]{color:var(--vurgu)}
}
</style>

static.cnbetacdn.com/article/2026/1102/c1741ed45ef4078.jpg"},{"t":"英特尔被取消的Larrabee显卡原型机重见天日 甚至成功运行《孤岛危机》","l":"https://www.cnbeta.com.tw/articles/game/1584752.htm","p":"cnBeta.COM","d":"2026-11-02T14:13:05+00:00","s":"一套尘封近17年的英特尔Larrabee显卡开发系统近日意外重见天日。令人惊讶的是，这套早已被英特尔取消的显卡项目原型，不仅能够重新启动并进入Windows 7系统，爱好者还找回了当年配套的原始驱动程序和开发工具，成功启用了Direct3D硬件加速，甚至运行了经典游戏《孤岛危机》（Crysis）。 阅读全文","i":"https://www.techpowerup.com/img/a3RLtEB01SvZzouL.jpg"},{"t":"德国政界人士iPhone遭间谍软件攻击 苹果向联邦议员和政府部门发出安全警报","l":"https://www.cnbeta.com.tw/articles/tech/1584750.htm","p":"cnBeta.COM","d":"2026-11-02T14:10:01+00:00","s":"德国政府近日证实，部分联邦议员及政府部门工作人员使用的iPhone可能成为间谍软件攻击的目标。苹果已经向疑似受到攻击的人员直接发送安全警告，德国联邦信息安全局（BSI）则要求相关政界人士采取预防措施，暂时将自己的手机视为可能已经遭到入侵的设备。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/12e11dead45de39.jpg"},{"t":"欧洲多国超市冷柜遭网络攻击 黑客远程升温致大量食品报废","l":"https://www.cnbeta.com.tw/articles/tech/1584748.htm","p":"cnBeta.COM","d":"2026-11-02T14:09:37+00:00","s":"欧洲多国近日遭遇一起罕见的针对实体基础设施的网络攻击事件。比利时、荷兰、瑞典以及卢森堡等国多家超市的冷藏和冷冻设备在同一时间段出现异常升温，大量食品因此变质报废。事件被认为是继数周前法国大规模冷链系统遭黑客攻击后，又一次针对超市制冷设备发起的跨国网络袭击。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/ddfa33aca219181.webp"},{"t":"《GTA6》即将上市 索尼正和破解者展开一场PS5“固件大战”","l":"https://www.cnbeta.com.tw/articles/game/1584746.htm","p":"cnBeta.COM","d":"2026-11-02T14:08:18+00:00","s":"过去几周，由于AI模型的进步，针对当前主机系统的破解技术取得了显著进展。虽然主机破解通常是主机厂商力求尽快解决的重大问题，但索尼还有另一个原因：由于《GTA6》即将发售，索尼正与破解者展开一场“固件大战”。 阅读全文","i":"https://img.3dmgame.com/uploads/images/news/20261102/1793624579_973178_jpg_r.jpg"},{"t":"RTX 5080 24GB或无法在2027年1月登场","l":"https://www.cnbeta.com.tw/articles/tech/1584744.htm","p":"cnBeta.COM","d":"2026-11-02T14:07:44+00:00","s":"最近一段时间显卡市场遭遇供应短缺，GeForce RTX 50系列面临较为严重的缺货，特别是高端的RTX 5090系列和RTX 5080，前者所使用的GB202芯片未来仅用于RTX Pro系列工作站显卡，后者英伟达打算以RTX 5080 24GB代替，成为新的旗舰游戏显卡。传闻RTX 5080 24GB会在明年1月现身，定价也将高于目前的RTX 5080。 阅读全文","i":"https://img.3dmgame.com/uploads/images/news/20261102/1793627201_108196.jpg"},{"t":"OpenAI承诺：极端天气下 旗下美国数据中心可削减用电负荷","l":"https://www.cnbeta.com.tw/articles/tech/1584742.htm","p":"cnBeta.COM","d":"2026-11-02T14:05:06+00:00","s":"OpenAI承诺，在美国由其直接投建的数据中心园区，当极端天气或其他紧急情况造成电网承压时，将主动降低用电量。正当AI算力中心的高耗电问题引发公众与政界反对、拖累行业扩张计划之际，OpenAI正推进自建数据中心。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/8cb78c4ef5996d6.png"},{"t":"乌克兰出现虚假核威胁警报：俄乌双方均报告应急应用遭遇独立网络攻击","l":"https://www.cnbeta.com.tw/articles/tech/1584740.htm","p":"cnBeta.COM","d":"2026-11-02T12:51:34+00:00","s":"乌克兰空军周日称，其 空袭警报（Air Alert）应用程序 遭到入侵，该应用向基辅以及其他地区推送了虚假核威胁、化学威胁警报。路透社消息，该应用短暂弹出核事故、化学事故警报，还推送了巷战爆发的警告。乌克兰空军表示，有未授权人员干扰应用运行，已临时关闭推送通知功能。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/6e4996daf987215.jpg"},{"t":"已灭绝数千年的巨鸟或从未消失 DNA研究推翻百年认知","l":"https://www.cnbeta.com.tw/articles/science/1584738.htm","p":"cnBeta.COM","d":"2026-11-02T12:46:45+00:00","s":"一项最新研究推翻了学术界延续超过150年的传统观点。科学家通过古DNA分析发现，一种长期被认为在上一个冰河时代结束后灭绝的巨型鸟类，实际上并不是一个已经消失的独立物种，而是今天仍生活在欧洲的一种现存鸟类的大型祖先个体。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/63c19bca66ef5da.jpg"},{"t":"法国拟对互联网流量征税 每传输1GB数据收费5.5欧分","l":"https://www.cnbeta.com.tw/articles/tech/1584736.htm","p":"cnBeta.COM","d":"2026-11-02T12:44:07+00:00","s":"法国正在考虑推出一项颇具争议的互联网流量税，计划按照内容提供商向法国用户传输的数据量征税，每传输1GB数据就需要缴纳0.055欧元（5.5欧分）。这项提案已经在法国国民议会下院以极其微弱的优势获得通过，但距离正式成为法律仍有相当长的程序。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0127/5a4ac672839f804.webp"},{"t":"Steam硬件调查：16GB内存重夺榜首 英特尔份额回升 Linux用户占比逼近4%","l":"https://www.cnbeta.com.tw/articles/game/1584734.htm","p":"cnBeta.COM","d":"2026-11-02T12:42:42+00:00","s":"Valve发布的2026年10月Steam硬件与软件调查结果显示，在经历9月份多项异常波动后，多项关键硬件统计出现明显回归。内存容量、显卡排名、处理器市场份额以及操作系统占比均出现新的变化，展现出当前PC游戏玩家硬件生态的最新格局。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/0b6e6d45f45fd63.jpg"},{"t":"韩国出口额逼近万亿美元大关 AI存储芯片热潮成最大推手","l":"https://www.cnbeta.com.tw/articles/tech/1584732.htm","p":"cnBeta.COM","d":"2026-11-02T12:31:01+00:00","s":"受全球人工智能产业持续扩张带动，韩国出口表现迎来历史性突破。韩国政府最新公布的数据显示，今年10月韩国出口额达到1152.8亿美元，同比增长93.7%，创下历史第二高单月纪录，仅次于9月份的表现。随着出口持续强劲增长，今年前10个月韩国累计出口额已达到9300亿美元，距离全年突破1万亿美元大关仅剩约700亿美元。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/7d5066d15666770.jpg"},{"t":"澳大利亚发现全新马陆物种 尘封90年的神秘生物终获确认","l":"https://www.cnbeta.com.tw/articles/science/1584730.htm","p":"cnBeta.COM","d":"2026-11-02T12:15:59+00:00","s":"科学家近日确认，一种近90年前在澳大利亚南部首次采集到的神秘马陆终于完成身份鉴定，并被认定为全新物种。研究团队将其命名为“Colobothrix deckeri”。这一发现不仅填补了长期以来的分类学空白，也颠覆了科学界对于该类马陆生态分布范围的既有认知。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/aaafd6ae50c8d70.jpg"},{"t":"树莓派大内存产品再次涨价 16GB型号最高上涨80美元","l":"https://www.cnbeta.com.tw/articles/tech/1584728.htm","p":"cnBeta.COM","d":"2026-11-02T12:10:16+00:00","s":"英国单板计算机制造商树莓派（Raspberry Pi）宣布，由于内存价格持续大幅上涨，公司不得不再次上调部分高内存产品的售价。其中，16GB版 Raspberry Pi 5 的价格将上调80美元，最新售价达到385美元；16GB版 Raspberry Pi Compute Module 5（计算模块5）则上涨40美元。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1102/fb2dec901830b15.webp"}]},"droidlife":{"name":"Droid Life","lang":"en","cat":"tech","plat":"web","url":"https://www.droid-life.com/feed/","updated":"2026-11-03T04:42:12.707475+00:00","items":[{"t":"Snapseed 4.2 Rolling Out: LUT Imports, Motion Blur, and More","l":"https://www.droid-life.com/2026/11/02/snapseed-4-2-rolling-out-lut-imports-motion-blur-and-more/","d":"2026-11-02T23:35:40+00:00","s":"Snapseed 4.2 is starting its gradual rollout today, bringing a handful of new features to users on both Android and iOS. The changelog mentions things like Motion Blur and Color Grading, but the big f","i":"https://www.droid-life.com/wp-content/uploads/2026/05/Snapseed-4-0-980x639.jpg"}]},"merlin":{"name":"Merlin'in Kazanı","lang":"tr","cat":"tech","plat":"web","url":"https://www.merlininkazani.com/feed/","updated":"2026-11-03T04:42:12.707475+00:00","items":[{"t":"id Software İşten Çıkarma Endişelerine Rağmen Gelecekten Umutlu","l":"https://www.merlininkazani.com/id-software-isten-cikarma-endiselerine-ragmen-gelecekten-umutlu-haber-264079","d":"2026-11-02T23:35:00+00:00","s":"id Software, Xbox çatısı altında yaşanan büyük işten çıkarmaların ardından nasıl yoluna devam ettiğini anlattı. Stüdyo geleceğe hâlâ oldukça gü function kart(c,i){
  var konu=konuAd(c.k),ks=c.ks||1;
  var ned=S.sekme==='reels'&&c.ned&&c.ned.length?'<ul class="nedenler">'+c.ned.map(function(n){return'<li>'+x(n)+'</li>'}).join('')+'</ul>':'';
  var liste=S.acik[c.id]&&c.og?'<ul class="kaynaklar">'+c.og.map(function(o){return'<li><a href="'+x(o.l)+'" target="_blank" rel="noopener" data-okundu="'+c.id+'">'+x(o.t)+'</a><span>'+x(o.p)+' · '+kac(o.z)+'</span></li>'}).join('')+'</ul>':'';
  var kaynakAd=c.og&&c.og[0]?c.og[0].p:'';
  return '<article class="kart'+(okundu[c.id]?' okundu':'')+(S.secili===i?' secili':'')+'" data-i="'+i+'">'+resim(c.i,konu||kaynakAd,c.l)+'<div>'+
    '<h2>'+(S.sekme==='reels'?'<span class="sira">'+(i+1)+'</span>':'')+'<a href="'+x(c.l)+'" target="_blank" rel="noopener" data-okundu="'+c.id+'">'+x(c.t)+'</a></h2>'+
    '<div class="meta"><span class="ks'+(ks<2?' tek':'')+'">'+(ks>1?ks+' kaynak':x(kaynakAd))+'</span><span>'+kac(c.son)+' önce</span>'+(konu?'<span>'+x(konu)+'</span>':'')+(c.dil!=='tr'?'<span class="dil">'+(c.dil==='zh'?'ZH':'EN')+'</span>':'')+'</div>'+
    ned+(c.s?'<p class="ozet">'+x(c.s)+'</p>':'')+eylem(c)+liste+'</div></article>';
}
function suz(l){
  var q=norm(S.q),sinir=Date.now()/1000-S.saat*3600;
  return l.filter(function(c){
    if(c.son<sinir)return false;
    if(S.konu!=='hepsi'&&c.k!==S.konu)return false;
    if(S.dil==='tr'&&c.dil!=='tr')return false;
    if(S.dil==='en'&&c.dil==='tr')return false;
    if(S.dil==='zh'&&c.dil!=='zh')return false;
    if(q&&norm(c.t+' '+(c.s||'')+' '+(c.og||[]).map(function(o){return o.t+' '+o.p}).join(' ')).indexOf(q)<0)return false;
    return true;
  });
}
var GORUNEN=[];
function liste(l,bosMetin){
  GORUNEN=l.slice(0,S.adet);
  if(!l.length)return '<div class="bos">'+x(bosMetin)+'</div>';
  return '<div class="liste">'+GORUNEN.map(kart).join('')+'</div>'+(l.length>S.adet?'<div class="diger"><button class="dg" id="daha">Daha fazla ('+(l.length-S.adet)+')</button></div>':'');
}
function sonHaberler(){
  var o=[],g={};
  Object.keys(SNAP.feeds||{}).forEach(function(k){var f=SNAP.feeds[k];(f.items||[]).forEach(function(it){
    if(!it.l||g[it.l]||/trends/.test(k))return;g[it.l]=1;
    var cat=it.c||f.cat,z=Date.parse(it.d||'')/1000;if(!z)return;
    if(S.kat==='tech'?['tech','samsung','ios','mac','mobil','win','auto'].indexOf(cat)<0:cat!==S.kat)return;
    o.push({id:'s'+it.l.slice(-16),t:it.t,s:it.s,i:it.i,l:it.l,son:z,dil:f.lang,ks:1,k:KAT[cat]||'',og:[{p:it.p||f.name}]});
  })});
  return o.sort(function(a,b){return b.son-a.son});
}
function cipler(v,liste,alan){return liste.map(function(t){return'<button class="cip" data-'+alan+'="'+t[0]+'" aria-pressed="'+(v===t[0])+'">'+t[1]+'</button>'}).join('')}
function yanCiz(){
  var y=$('yan'),h='';
  if(S.sekme==='gundem'||S.sekme==='reels'){
    var say={};suzKonusuz().forEach(function(c){say[c.k]=(say[c.k]||0)+1});
    var top=suzKonusuz().length;
    h+='<h3>Konular</h3><button data-konu="hepsi" aria-pressed="'+(S.konu==='hepsi')+'">Hepsi <small>'+top+'</small></button>';
    M.konular.forEach(function(k){if(say[k.k])h+='<button data-konu="'+k.k+'" aria-pressed="'+(S.konu===k.k)+'">'+x(k.ad)+' <small>'+say[k.k]+'</small></button>'});
  }else if(S.sekme==='son'){
    h+='<h3>Bölümler</h3><button data-kat="tech" aria-pressed="'+(S.kat==='tech')+'">Teknoloji</button>';
    GENEL.forEach(function(k){h+='<button data-kat="'+k[0]+'" aria-pressed="'+(S.kat===k[0])+'">'+k[1]+'</button>'});
  }
  y.innerHTML=h;y.style.display=h?'':'none';document.querySelector('.duzen').style.gridTemplateColumns=h?'':'minmax(0,1fr)';
}
function suzKonusuz(){var k=S.konu;S.konu='hepsi';var l=suz(S.sekme==='reels'?reelsListe():M.kumeler);S.konu=k;return l}
function reelsListe(){var m={};M.kumeler.forEach(function(c){m[c.id]=c});return M.reels.map(function(i){return m[i]}).filter(Boolean)}
function ciz(){
  var a=$('ana'),h='';
  document.querySelectorAll('[data-sekme]').forEach(function(b){b.setAttribute('aria-selected',b.dataset.sekme===S.sekme)});
  yanCiz();
  var filtre=cipler(S.dil,[['hepsi','Tüm diller'],['tr','Türkçe'],['en','Yabancı'],['zh','Çince']],'dil')+cipler(S.saat,[[6,'6 saat'],[24,'24 saat'],[72,'3 gün']],'saat');
  if(S.sekme==='gundem'){
    h='<div class="ana-ust"><h1>Gündem</h1>'+filtre+'</div>'+liste(suz(M.kumeler),'Bu süzgeçte haber yok.');
  }else if(S.sekme==='reels'){
    var l=suz(reelsListe());if(S.tur!=='hepsi')l=l.filter(function(c){return(c.tur||[]).indexOf(S.tur)>=0});
    h='<div class="ana-ust"><h1>Reels konuları</h1>'+cipler(S.tur,TUR,'tur')+'</div><p class="bilgi">Sıralama: kaç kaynak yazdı, ne kadar hızlı yayılıyor, Google trendi, merak unsuru, Türkiye ilgisi, görsel ve tazelik. Tahmindir, görüntülenme garantisi değildir.</p>';
    if(M.trendler.length)h+='<div class="trend"><b>Google trendleri</b>'+M.trendler.filter(function(t){return t.ulke==='TR'}).slice(0,10).map(function(t){return'<a href="'+x(t.l)+'" target="_blank" rel="noopener">'+x(t.t)+'</a>'}).join('')+'</div>';
    h+=liste(l,'Bu türde aday yok. Başka bir tür seçin.');
  }else if(S.sekme==='son'){
    var q=norm(S.q),ls=sonHaberler().filter(function(c){return(S.dil==='hepsi'||c.dil===S.dil)&&(!q||norm(c.t).indexOf(q)>=0)});
    h='<div class="ana-ust"><h1>Son haberler</h1>'+cipler(S.dil,[['hepsi','Tüm diller'],['tr','Türkçe'],['en','Yabancı'],['zh','Çince']],'dil')+'</div>'+liste(ls,'Bu bölümde haber yok.');
  }else if(S.sekme==='kayit'){
    var kl=Object.keys(kayit).map(function(k){return kayit[k]}).sort(function(a,b){return b.son-a.son});
    h='<div class="ana-ust"><h1>Kaydedilenler</h1></div>'+liste(kl,'Kaydettiğin haberler burada durur. Yalnız bu tarayıcıda saklanır.');
  }else{
    var sg=M.saglik||{},kl2=M.kaynaklar.slice().sort(function(a,b){return(a.son||'')<(b.son||'')?-1:1});
    h='<div class="ana-ust"><h1>Kaynaklar</h1></div><p class="bilgi">'+(sg.kaynak||0)+' kaynak: '+(sg.basarili||0)+' çalışıyor, '+(sg.bayat||0)+' bu tur yanıt vermedi, '+(sg.beklemede||0)+' beklemede. 12 saatten eski kopya akışa girmez. En eski güncellenen en üstte.</p><div class="kaz"><table class="tablo"><thead><tr><th>Kaynak</th><th>Bölüm</th><th>Son haber</th><th>Durum</th></tr></thead><tbody>'+kl2.map(function(k){return'<tr><td>'+x(k.ad)+'</td><td>'+x(k.cat)+'</td><td>'+(k.son?kac(Date.parse(k.son)/1000)+' önce':'–')+'</td><td>'+(k.bayat?'Yanıt vermedi':'Çalışıyor')+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  a.innerHTML=h;
}
function git(s){S.sekme=s;S.adet=40;S.secili=-1;S.konu='hepsi';if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);ciz();window.scrollTo(0,0)}
function sekmeCiz(){
  $('sekmeler').innerHTML=SEKME.map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('alt').innerHTML=SEKME.slice(0,4).map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1].replace('Son haberler','Son').replace('Kaydedilenler','Kayıtlı')+'</button>'}).join('');
}
function bul(id){var m=M.kumeler.concat(sonHaberler()).filter(function(c){return c.id===id})[0];return m||kayit[id]}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-sekme],[data-konu],[data-dil],[data-saat],[data-tur],[data-kat],[data-ac],[data-kaydet],#daha,#tema,[data-okundu]');
  if(!t)return;var d=t.dataset;
  if(d.okundu){okundu[d.okundu]=1;var ks=Object.keys(okundu);if(ks.length>1500)delete okundu[ks[0]];yaz('akis-okundu',okundu);return}
  if(d.sekme)return git(d.sekme);
  if(d.konu){S.konu=d.konu;S.adet=40}
  else if(d.dil)S.dil=d.dil;
  else if(d.saat)S.saat=+d.saat;
  else if(d.tur)S.tur=d.tur;
  else if(d.kat){S.kat=d.kat;S.adet=40}
  else if(d.ac)S.acik[d.ac]=!S.acik[d.ac];
  else if(d.kaydet){if(kayit[d.kaydet])delete kayit[d.kaydet];else{var c=bul(d.kaydet);if(c)kayit[d.kaydet]=c}yaz('akis-kayit',kayit)}
  else if(t.id==='daha')S.adet+=40;
  else if(t.id==='tema'){var r=document.documentElement,kz=matchMedia('(prefers-color-scheme:dark)').matches,su=r.dataset.tema||(kz?'koyu':'acik'),yn=su==='koyu'?'acik':'koyu';r.dataset.tema=yn;try{localStorage.setItem('akis-tema',yn)}catch(er){}return}
  ciz();
});
var zm;$('ara').addEventListener('input',function(){clearTimeout(zm);var v=this.value;zm=setTimeout(function(){S.q=v;S.adet=40;ciz()},150)});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var h=e.target.tagName;
  if(h==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  if(e.key==='/'){e.preventDefault();$('ara').focus();return}
  if((e.key==='j'||e.key==='k')&&GORUNEN.length){S.secili=Math.min(GORUNEN.length-1,Math.max(0,S.secili+(e.key==='j'?1:-1)));ciz();var el=document.querySelector('.kart.secili');if(el)el.scrollIntoView({block:'center'});return}
  var c=GORUNEN[S.secili];if(!c)return;
  if(e.key==='o'||e.key==='Enter')window.open(c.l,'_blank','noopener');
  if(e.key==='s'){if(kayit[c.id])delete kayit[c.id];else kayit[c.id]=c;yaz('akis-kayit',kayit);ciz()}
});
function durumYaz(){
  var g=M.generated||SNAP.generated,el=$('durum');if(!g)return;
  var z=Date.parse(g)/1000,dk=(Date.now()/1000-z)/60;
  el.textContent=(dk>90?'Güncellenmedi: ':'Güncellendi: ')+kac(z)+' önce';el.classList.toggle('eski',dk>90);
}
sekmeCiz();
fetch('masa.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){M=j;durumYaz();var h=location.hash.slice(1);git(SEKME.some(function(t){return t[0]===h})?h:'gundem')}).catch(function(){durumYaz();$('ana').innerHTML='<div class="bos">Masa verisi yüklenemedi. Son haberler yine çalışır.</div>';S.sekme='son';ciz()});
})();
</script>
</body>
</html>
