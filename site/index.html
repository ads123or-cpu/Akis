*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--metin);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px;border-radius:4px}
.ust{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;background:var(--yuzey);border-bottom:1px solid var(--cizgi)}
.logo{font-weight:800;font-size:18px;color:var(--ink);letter-spacing:-.02em}
.sekmeler{display:flex;gap:2px}
.sekmeler button{padding:7px 12px;border-radius:7px;font-weight:600;color:var(--soluk);white-space:nowrap}
.sekmeler button:hover{background:var(--yuzey2);color:var(--ink)}
.sekmeler button[aria-selected=true]{background:var(--vurgu-yumusak);color:var(--vurgu)}
.ara{flex:1;max-width:340px;margin-left:auto;height:36px;padding:0 12px;border:1px solid var(--cizgi);border-radius:8px;background:var(--bg)}
.ikon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--soluk)}
.ikon:hover{background:var(--yuzey2);color:var(--ink)}
.durum{font-size:12px;color:var(--soluk);white-space:nowrap}
.durum.eski{color:var(--sicak);font-weight:600}
.duzen{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;padding:16px}
.yan{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto}
.yan h3{margin:14px 8px 5px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soluk)}

.yan button:hover{background:var(--yuzey2)}
.yan button[aria-pressed=true]{background:var(--vurgu-yumusak);color:var(--vurgu);font-weight:650}

.trend{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;align-items:center;font-size:13px}
.trend b{color:var(--soluk);font-weight:600;margin-right:3px}

.trend a:hover{border-color:var(--vurgu);color:var(--vurgu)}

.tablo{width:100%;border-collapse:collapse;background:var(--yuzey);border-radius:10px;overflow:hidden;font-size:13px}
.tablo th,.tablo td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--cizgi)}
.tablo th{font-size:11.5px;color:var(--soluk);text-transform:uppercase;letter-spacing:.05em}
.kaz{overflow-x:auto;border:1px solid var(--cizgi);border-radius:10px}
.alt{display:none}
.diger{display:flex;justify-content:center;margin-top:12px}
@media (max-width:860px){
 .duzen{grid-template-columns:minmax(0,1fr);padding:10px;padding-bottom:calc(68px + env(safe-area-inset-bottom))}

 .kart{grid-template-columns:104px minmax(0,1fr);gap:9px;padding:8px}.kart h2{font-size:14.5px}.ozet{display:none}
 .alt{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset:auto 0 0;z-index:20;background:var(--yuzey);border-top:1px solid var(--cizgi);padding-bottom:env(safe-area-inset-bottom)}
 .alt button{min-height:50px;font-size:12.5px;font-weight:650;color:var(--soluk)}.alt button[aria-selected=true]{color:var(--vurgu)}

cn/finance/transform/59/w550h309/20261104/efe0-be8d5bee03e2e2d57086f6b5d45156b3.png"},{"t":"Valve应对Steam游戏提交量激增：审核时间延长至12个工作日 要求开发者提交前完成实际运行测试","l":"https://www.cnbeta.com.tw/articles/game/1584954.htm","p":"cnBeta.COM","d":"2026-11-04T06:23:50+00:00","s":"随着Steam平台游戏数量持续增长，Valve正面临越来越大的游戏审核压力。公司近日承认，过去几个月Steam商店页面和游戏版本的审核申请数量显著增加，导致审核团队出现积压。目前，一款游戏从提交审核到获得批准，最长可能需要12个工作日，而此前通常只需要3至5个工作日。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1104/5bc1eba03bde6a8.png"},{"t":"Claude Code核心负责人离职 Anthropic上市前夕失去关键产品主管","l":"https://www.cnbeta.com.tw/articles/tech/1584952.htm","p":"cnBeta.COM","d":"2026-11-04T06:23:07+00:00","s":"人工智能公司 Anthropic 在筹备大规模首次公开募股（IPO）之际，遭遇一项重要人事变动。长期负责 Claude Code 产品工作的高级产品负责人 Cat Wu 已正式离开公司。消息公布后，引发业界对于这家 AI 独角兽未来产品战略和管理稳定性的关注。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1104/075048cb0e2a577.jpg"},{"t":"币安公布63.4亿美元盗窃案初步调查：工程师被虚假招聘欺骗 在自己PC上执行恶意仓库","l":"https://www.cnbeta.com.tw/articles/tech/1584950.htm","p":"cnBeta.COM","d":"2026-11-04T06:20:44+00:00","s":"加密货币交易所币安日前公布 10 月 29 日安全事件的初步调查结果。币安称攻击者经过数月准备，先利用恶意软件、虚假招聘和币安内部 AI 工具接触钱包团队，最终获得钱包签名服务的未经授权访问权限，转移约 63.4 亿美元的数字资产。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1104/cb15954c8966778.png"},{"t":"研究预测南部非洲人象冲突高风险区至2085年或扩大33%至100%","l":"https://www.cnbeta.com.tw/articles/science/1584948.htm","p":"cnBeta.COM","d":"2026-11-04T06:14:54+00:00","s":"一项发表于《PNAS Nexus》的研究预测，到2085年，南部非洲大象袭击农田的高风险区域可能比基准期扩大33%至100%。研究团队指出，人口增长和农地扩张是冲突风险上升的主要驱动因素，气候变干也会加剧问题，但影响相对较小。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1104/544b52b118a940c.jpg"},{"t":"研究揭示蚊子“挑食”秘密：不同种类偏爱不同的人","l":"https://www.cnbeta.com.tw/articles/science/1584946.htm","p":"cnBeta.COM","d":"2026-11-04T06:13:26+00:00","s":"一项最新研究揭开了蚊子为何总爱叮咬某些人的原因。美国佛罗里达国际大学研究团队发现，不同蚊种会被截然不同的人体气味特征所吸引。换句话说，能够强烈吸引某一种蚊子的人，对另一种蚊子来说未必具有吸引力。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1104/97c728320a18f57.jpg"},{"t":"科学家揭开哺乳动物毛发生长排列之谜：细胞追随化学信号移动形成复杂毛囊图案","l":"https://www.cnbeta.com.tw/articles/science/1584944.htm","p":"cnBeta.COM","d" tanıdık.","i":"https://www.merlininkazani.com/social-image/article/264115.jpg"},{"t":"Gelin, Evlenmeden Önce Damadın Valorant'ta Onu Yenmesini İstedi","l":"https://www.merlininkazani.com/gelin-evlenmeden-once-damadin-valorant-ta-onu-yenmesini-istedi-haber-264114","d":"2026-11-04T04:10:00+00:00","s":"Valorant oynayan bir gelin, düğün öncesinde damadına ilginç bir meydan okuma yaptı. Çin'deki törende evlilikten önce tamamlanması gereken bir görev daha vardı.","i":"https://www.merlininkazani.com/social-image/article/264114.jpg"},{"t":"Gerçek Hayatta GTA 6 Oynamaya Çalıştı Polisin Eline Düştü","l":"https://www.merlininkazani.com/gercek-hayatta-gta-6-oynamaya-calisti-polisin-eline-dustu-haber-264113","d":"2026-11-04T04:06:00+00:00","s":"GTA 6 ile hiç ilgisi olmayan bir polis kovalamacası, oyunun çıkış tarihine bağlandı. Polis ekibinin yakalanan sürücüye söyledikleri olaydan daha çok konuşuldu.","i":"https://www.merlininkazani.com/social-image/article/264113.jpg"},{"t":"Skyrim'in 7.000 Basamağı İçin Gerçekten 7.000 Adım Hesaplanmış","l":"https://www.merlininkazani.com/skyrim-in-7-000-basamagi-icin-gercekten-7-000-adim-hesaplanmis-haber-264112","d":"2026-11-04T04:01:00+00:00","s":"Skyrim'deki meşhur 7.000 Basamak aslında sandığımızdan çok daha ilginç bir geliştirme hikâyesine sahip. Bethesda gerçekten sayıya sadık kalmayı denemiş.","i":"https://www.merlininkazani.com/social-image/article/264112.jpg"},{"t":"Arc Raiders'ta Çernobil'deki Bir Piyanodan Alınan Ses Kullanıldı","l":"https://www.merlininkazani.com/arc-raiders-ta-cernobil-deki-bir-piyanodan-alinan-ses-kullanildi-haber-264111","d":"2026-11-04T03:57:00+00:00","s":"Arc Raiders'ın atmosferini oluşturan seslerin arkasından oldukça ilginç bir hikâye çıktı. Oyundaki piyano sesinin kökeni doğrudan Çernobil'e uzanıyor.","i":"https://www.merlininkazani.com/social-image/article/264111.jpg"},{"t":"Yeni Çalışmaya Göre Aşırı DEI Oyun Satışlarını Yüzde 10 Düşürüyor","l":"https://www.merlininkazani.com/yeni-calismaya-gore-asiri-de     '<h2>'+(S.sekme==='reels'?'<span class="sira">'+(i+1)+'</span>':'')+'<a href="'+x(c.l)+'" target="_blank" rel="noopener" data-okundu="'+c.id+'">'+x(c.t)+'</a></h2>'+

  }else if(S.sekme==='reels'){

    h='<div class="ana-ust"><h1>Reels konuları</h1>'+cipler(S.tur,TUR,'tur')+'</div><p class="bilgi">Sıralama: kaç kaynak yazdı, ne kadar hızlı yayılıyor, Google trendi, merak unsuru, Türkiye ilgisi, görsel ve tazelik. Tahmindir, görüntülenme garantisi değildir.</p>';

  }else{
    var sg=M.saglik||{},kl2=M.kaynaklar.slice().sort(function(a,b){return(a.son||'')<(b.son||'')?-1:1});
    h='<div class="ana-ust"><h1>Kaynaklar</h1></div><p class="bilgi">'+(sg.kaynak||0)+' kaynak: '+(sg.basarili||0)+' çalışıyor, '+(sg.bayat||0)+' bu tur yanıt vermedi, '+(sg.beklemede||0)+' beklemede. 12 saatten eski kopya akışa girmez. En eski güncellenen en üstte.</p><div class="kaz"><table class="tablo"><thead><tr><th>Kaynak</th><th>Bölüm</th><th>Son haber</th><th>Durum</th></tr></thead><tbody>'+kl2.map(function(k){return'<tr><td>'+x(k.ad)+'</td><td>'+x(k.cat)+'</td><td>'+(k.son?kac(Date.parse(k.son)/1000)+' önce':'–')+'</td><td>'+(k.bayat?'Yanıt vermedi':'Çalışıyor')+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  a.innerHTML=h;
}
function git(s){S.sekme=s;S.adet=40;S.secili=-1;S.konu='hepsi';if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);ciz();window.scrollTo(0,0)}
function sekmeCiz(){
  $('sekmeler').innerHTML=SEKME.map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('alt').innerHTML=SEKME.slice(0,4).map(function(t){return'<button role="tab" data-sekme="'+t[0]+'">'+t[1].replace('Son haberler','Son').replace('Kaydedilenler','Kayıtlı')+'</button>'}).join('');
}
function bul(id){var m=M.kumeler.concat(sonHaberler()).filter(function(c){return c.id===id})[0];return m||kayit[id]}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-sekme],[data-konu],[data-dil],[data-saat],[data-tur],[data-kat],[data-ac],[data-kaydet],#daha,#tema,[data-okundu]');
  if(!t)return;var d=t.dataset;
  if(d.okundu){okundu[d.okundu]=1;var ks=Object.keys(okundu);if(ks.length>1500)delete okundu[ks[0]];yaz('akis-okundu',okundu);return}
  if(d.sekme)return git(d.sekme);
  if(d.konu){S.konu=d.konu;S.adet=40}
  else if(d.dil)S.dil=d.dil;
  else if(d.saat)S.saat=+d.saat;
  else if(d.tur)S.tur=d.tur;
  else if(d.kat){S.kat=d.kat;S.adet=40}
  else if(d.ac)S.acik[d.ac]=!S.acik[d.ac];
  else if(d.kaydet){if(kayit[d.kaydet])delete kayit[d.kaydet];else{var c=bul(d.kaydet);if(c)kayit[d.kaydet]=c}yaz('akis-kayit',kayit)}
  else if(t.id==='daha')S.adet+=40;
  else if(t.id==='tema'){var r=document.documentElement,kz=matchMedia('(prefers-color-scheme:dark)').matches,su=r.dataset.tema||(kz?'koyu':'acik'),yn=su==='koyu'?'acik':'koyu';r.dataset.tema=yn;try{localStorage.setItem('akis-tema',yn)}catch(er){}return}
  ciz();
});
var zm;$('ara').addEventListener('input',function(){clearTimeout(zm);var v=this.value;zm=setTimeout(function(){S.q=v;S.adet=40;ciz()},150)});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var h=e.target.tagName;
  if(h==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  if(e.key==='/'){e.preventDefault();$('ara').focus();return}
  if((e.key==='j'||e.key==='k')&&GORUNEN.length){S.secili=Math.min(GORUNEN.length-1,Math.max(0,S.secili+(e.key==='j'?1:-1)));ciz();var el=document.querySelector('.kart.secili');if(el)el.scrollIntoView({block:'center'});return}
  var c=GORUNEN[S.secili];if(!c)return;
  if(e.key==='o'||e.key==='Enter')window.open(c.l,'_blank','noopener');
  if(e.key==='s'){if(kayit[c.id])delete kayit[c.id];else kayit[c.id]=c;yaz('akis-kayit',kayit);ciz()}
});
function durumYaz(){
  var g=M.generated||SNAP.generated,el=$('durum');if(!g)return;
  var z=Date.parse(g)/1000,dk=(Date.now()/1000-z)/60;
  el.textContent=(dk>90?'Güncellenmedi: ':'Güncellendi: ')+kac(z)+' önce';el.classList.toggle('eski',dk>90);
}
sekmeCiz();
fetch('masa.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){M=j;durumYaz();var h=location.hash.slice(1);git(SEKME.some(function(t){return t[0]===h})?h:'gundem')}).catch(function(){durumYaz();$('ana').innerHTML='<div class="bos">Masa verisi yüklenemedi. Son haberler yine çalışır.</div>';S.sekme='son';ciz()});
})();
</script>
