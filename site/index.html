<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Akış</title>
<meta name="description" content="Akış: haber merkezi, Google Trends, güncelleme radarı ve Reels konu keşfi">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6b66'/%3E%3Cpath d='M8 20c4-8 8 4 16-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Akış 5 renk sistemi (2026-11-18): sıcak kâğıt (açık), mürekkep (koyu), gece (OLED siyah). Vurgu rengi --vr ayrı seçilir (data-vurgu); --vr-z her temada yüzeyle karıştırılır. */
:root{--bg:#f5f2ec;--yuz:#fffdf8;--yuz2:#ede8de;--yaz:#1b1a16;--ik:#56524a;--ik2:#69645a;--cz:#e1dacd;--sc:#b3361f;--sc-z:#f8e4de;--ye:#16764a;--ye-z:#e0f1e7;--sa:#875800;--sa-z:#f6ead2;--gl:0 1px 2px rgba(40,30,10,.05),0 8px 24px rgba(40,30,10,.07);--vr:var(--vr-a);color-scheme:light;--vr-a:#0b6b66;--vr-k:#4cc9bd;--vr-z:color-mix(in oklab,var(--vr) 13%,var(--yuz));--vr-y:#fff;--r:12px}
:root[data-vurgu=kehribar]{--vr-a:#a34a04;--vr-k:#f5a524}:root[data-vurgu=mor]{--vr-a:#5546d6;--vr-k:#a69cff}:root[data-vurgu=gul]{--vr-a:#b3195a;--vr-k:#f472b6}:root[data-vurgu=klasik]{--vr-a:#2a5fd8;--vr-k:#7aa2ff}
:root[data-tema=koyu],:root[data-tema=gece]{--bg:#0f1214;--yuz:#161a1d;--yuz2:#1e2327;--yaz:#ebe8e1;--ik:#a8a49b;--ik2:#8f8b82;--cz:#293035;--sc:#ff8a70;--sc-z:#3a201a;--ye:#5ad197;--ye-z:#14301f;--sa:#f0b84e;--sa-z:#33291a;--gl:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4);--vr:var(--vr-k);--vr-y:#04201d;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-tema=acik]){--bg:#0f1214;--yuz:#161a1d;--yuz2:#1e2327;--yaz:#ebe8e1;--ik:#a8a49b;--ik2:#8f8b82;--cz:#293035;--sc:#ff8a70;--sc-z:#3a201a;--ye:#5ad197;--ye-z:#14301f;--sa:#f0b84e;--sa-z:#33291a;--gl:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4);--vr:var(--vr-k);--vr-y:#04201d;color-scheme:dark}}
:root[data-tema=gece]{--bg:#000;--yuz:#0c0d0e;--yuz2:#16181a;--cz:#23272a}
/* alan renkleri: listede küçük nokta ve sol menüde işaret (renk tek başına bilgi taşımaz, ad her zaman yazılı) */
:root{--a-gundem:#c2410c;--a-adana:#b45309;--a-tekno:#0369a1;--a-yz:#7c3aed;--a-siyaset:#be123c;--a-spor:#15803d;--a-ekonomi:#a16207;--a-bilim:#0e7490;--a-siber:#4d7c0f;--a-oto:#475569;--a-oyun:#c026d3;--a-eglence:#db2777}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--yaz);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--vr);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
/* üst çubuk */
.ust{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--cz)}
.ust-i{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:6px;height:56px;padding:0 16px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:10px}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--vr);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;inset:6px 4px;border-bottom:2.5px solid #fff;border-radius:0 0 50% 50%;transform:rotate(-12deg)}
.sekme{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.sekme::-webkit-scrollbar{display:none}
.diger{position:relative;flex:none}
.diger summary{list-style:none;cursor:pointer;padding:7px 11px;border-radius:9px;font-size:14.5px;color:var(--ik);font-weight:500;white-space:nowrap}
.diger summary::-webkit-details-marker{display:none}
.diger summary:after{content:"▾";margin-left:5px;font-size:11px}
.diger summary:hover,.diger[open] summary{color:var(--yaz);background:var(--yuz2)}
.diger summary.on{color:var(--yaz);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz)}
.dg-l{position:absolute;top:calc(100% + 6px);left:0;min-width:180px;background:var(--yuz);border-radius:12px;box-shadow:var(--gl),inset 0 0 0 1px var(--cz);padding:6px;z-index:45;display:flex;flex-direction:column}
.dg-l a{padding:9px 12px;border-radius:8px;font-size:14.5px}.dg-l a:hover,.dg-l a.on{background:var(--yuz2)}
@media (max-width:1280px){.saat .y{display:none}.ara-b{min-width:0}.ara-b .y{display:none}}
.sekme a{padding:7px 11px;border-radius:9px;font-size:14.5px;color:var(--ik);font-weight:500;white-space:nowrap}
.sekme a:hover{color:var(--yaz);background:var(--yuz2)}
.sekme a.on{color:var(--yaz);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz)}
.bos{flex:1}
.ara-b{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border-radius:10px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);color:var(--ik);font-size:14px;min-width:200px}
.ara-b kbd,.kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--cz);border-radius:5px;padding:0 5px;color:var(--ik2);margin-left:auto;background:var(--bg)}
.ik-b{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ik)}
.ik-b:hover{background:var(--yuz2);color:var(--yaz)}
.saat{font-size:13px;color:var(--ik);display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap}
.nokta{width:7px;height:7px;border-radius:50%;background:var(--ye);display:inline-block;flex:none}
.nokta.sa{background:var(--sa)}.nokta.sc{background:var(--sc)}
.yeni-veri{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:40;background:var(--vr);color:var(--vr-y);border-radius:99px;padding:8px 16px;font-size:14px;font-weight:600;box-shadow:var(--gl)}
/* yerleşim */
.ana{max-width:1240px;margin:0 auto;padding:22px 16px 110px}
.duzen{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.duzen.tek{grid-template-columns:minmax(0,760px);justify-content:center}
.sag{position:sticky;top:78px;display:flex;flex-direction:column;gap:22px}
.bas{display:flex;align-items:flex-end;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.bas h1{font-size:26px;line-height:1.15;letter-spacing:-.025em;margin:0;font-weight:700}
.bas p{margin:2px 0 0;color:var(--ik);font-size:14px}
.blok{margin:0 0 30px}
.blok-b{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.blok-b h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ik);margin:0;font-weight:600}
.blok-b a,.blok-b button{margin-left:auto;font-size:13.5px;color:var(--vr);font-weight:500}
.kutu{background:var(--yuz);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--cz);padding:14px 16px}
.kutu h2{margin:0 0 8px}
/* satır */
.liste{display:flex;flex-direction:column}
.sat{display:flex;gap:14px;padding:13px 10px;margin:0 -10px;border-radius:12px;cursor:pointer;position:relative;align-items:flex-start}
.sat+.sat{box-shadow:0 -1px 0 var(--cz)}
.sat:hover,.sat.imlec{background:var(--yuz)}
.sat:hover+.sat,.sat.imlec+.sat{box-shadow:none}
.sat.secili{background:var(--vr-z)}
.sat-g{width:76px;height:56px;border-radius:9px;object-fit:cover;flex:none;background:var(--yuz2)}
.sat-m{flex:1;min-width:0}
.sat-t{font-size:16.5px;line-height:1.38;font-weight:600;margin:0;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sat.ok .sat-t{color:var(--ik);font-weight:500}
.sat-ust{margin:0 0 3px}.sat-t a{color:inherit}
.sat-a{font-size:13px;color:var(--ik);margin-top:4px;display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
.sat-a>*+*:before{content:"·";margin-right:6px;color:var(--ik2)}
.sat-a b{color:var(--yaz);font-weight:600}
.sat-o{font-size:14px;color:var(--ik);margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yeni-n{width:7px;height:7px;border-radius:50%;background:var(--vr);position:absolute;left:-3px;top:22px}
.sat-e{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.sat:hover .sat-e,.sat.imlec .sat-e,.sat:focus-within .sat-e,.sat-e .on{opacity:1}
.rk:focus-visible{outline:2px solid var(--vr);outline-offset:0}
.sat-e .on{color:var(--vr)}
.sat-e .ik-b{width:32px;height:32px}
.sat.buyuk .sat-g{width:100%;height:auto;aspect-ratio:16/7;max-height:340px;border-radius:12px;margin-bottom:12px}
.sat.buyuk{flex-direction:column;gap:0}
.sat.buyuk .sat-t{font-size:22px;line-height:1.25;letter-spacing:-.02em;-webkit-line-clamp:4}
.sat.buyuk .sat-e{position:absolute;right:10px;bottom:12px}
.sat.sikis .sat-t{font-size:15px;-webkit-line-clamp:2}
.sat.sikis{padding:9px 10px}
mark{background:var(--sa-z);color:inherit;border-radius:3px;padding:0 2px}
.et{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--yuz2);color:var(--ik);white-space:nowrap}
.et.vr{background:var(--vr-z);color:var(--vr)}.et.sc{background:var(--sc-z);color:var(--sc)}.et.ye{background:var(--ye-z);color:var(--ye)}.et.sa{background:var(--sa-z);color:var(--sa)}
.sat-a .et:before{display:none}
/* çipler */
.cipler{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin:0 0 6px;-webkit-overflow-scrolling:touch}
.cipler::-webkit-scrollbar{display:none}
.cip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);font-size:14px;color:var(--yaz);white-space:nowrap}
.cip:hover{box-shadow:inset 0 0 0 1px var(--ik2)}
.cip.on{background:var(--yaz);color:var(--bg);box-shadow:none}
.cip small{color:var(--ik);font-size:12px}
.cip.on small{color:inherit;opacity:.7}
.seg{display:inline-flex;background:var(--yuz2);border-radius:10px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 11px;border-radius:8px;font-size:13.5px;color:var(--ik);white-space:nowrap}
.seg button.on{background:var(--yuz);color:var(--yaz);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.arac{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.arac select{height:32px;border-radius:9px;border:1px solid var(--cz);background:var(--yuz);padding:0 8px;font-size:14px}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ik);height:32px;padding:0 10px;border-radius:9px}
.tg.on{color:var(--vr);background:var(--vr-z)}
/* trend */
.tr-serit{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.tr-serit::-webkit-scrollbar{display:none}
.tr-c{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 13px;border-radius:12px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);text-align:left;max-width:220px}
.tr-c b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.tr-c span{font-size:12.5px;color:var(--ik)}
.tr-c.firsat{box-shadow:inset 0 0 0 1px var(--sc-z),inset 3px 0 0 var(--sc)}
.tr-s{display:flex;gap:14px;align-items:center;padding:12px 10px;margin:0 -10px;border-radius:12px;cursor:pointer}
.tr-s+.tr-s{box-shadow:0 -1px 0 var(--cz)}
.tr-s:hover,.tr-s.imlec{background:var(--yuz)}
.tr-s:hover+.tr-s{box-shadow:none}
.tr-h{width:72px;flex:none;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.tr-h small{display:block;font-size:11.5px;color:var(--ik);font-weight:500}
.tr-s.son .tr-t,.tr-s.son .tr-h{color:var(--ik)}
.tr-t{font-size:16.5px;font-weight:600;margin:0}
.spark{width:64px;height:24px;flex:none}
.spark polyline{fill:none;stroke:var(--vr);stroke-width:1.6}
.mini{display:flex;flex-direction:column}
.mini a,.mini button{display:flex;gap:10px;align-items:baseline;padding:7px 0;text-align:left;font-size:14.5px;width:100%}
.mini a+a,.mini button+button{border-top:1px solid var(--cz)}
.mini .n{color:var(--ik);font-size:12.5px;font-variant-numeric:tabular-nums;width:54px;flex:none}
.mini .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .sag-n{color:var(--ik);font-size:12.5px;flex:none}
/* reels */
.rk{display:flex;gap:16px;padding:16px;border-radius:14px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);cursor:pointer;margin-bottom:12px}
.rk:hover,.rk.imlec{box-shadow:inset 0 0 0 1px var(--ik2)}
.rk-p{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:17px;background:conic-gradient(var(--vr) calc(var(--p)*1%),var(--yuz2) 0);position:relative}
.rk-p span{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;background:var(--yuz);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rk h3{margin:0;font-size:17px;line-height:1.35;letter-spacing:-.01em}
.rk p{margin:6px 0 0;font-size:14.5px;color:var(--ik)}
.hook{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:9px;background:var(--yuz2);font-size:14.5px;margin-top:6px}
.hook span{flex:1}
/* detay paneli */
.panel{position:fixed;top:56px;right:0;bottom:0;width:min(520px,100%);background:var(--yuz);box-shadow:-1px 0 0 var(--cz),var(--gl);z-index:35;overflow-y:auto;overscroll-behavior:contain;animation:gir .16s ease-out}
@keyframes gir{from{transform:translateX(24px);opacity:0}}
.p-i{padding:18px 22px 60px}
.p-ust{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--yuz);padding:10px 22px;margin:-18px -22px 10px;border-bottom:1px solid var(--cz);z-index:2;font-size:13px;color:var(--ik)}
.p-ust .bos{flex:1}
.panel h2.p-t{font-size:23px;line-height:1.25;letter-spacing:-.02em;margin:6px 0 10px}
.p-g{width:100%;border-radius:12px;aspect-ratio:16/9;object-fit:cover;background:var(--yuz2);margin:4px 0 10px}
.p-o{color:var(--ik);margin:0 0 14px;font-size:15.5px}
.eylem{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.dg{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:10px;background:var(--yuz2);font-size:14px;font-weight:500;white-space:nowrap}
.dg:hover{filter:brightness(.96)}
.dg.ana-d{background:var(--vr);color:var(--vr-y)}
.dg.on{background:var(--vr-z);color:var(--vr)}
.p-b{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ik);margin:20px 0 6px;font-weight:600}
.kay a{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--cz);font-size:14.5px;align-items:baseline}
.kay a:first-child{border-top:0}
.kay a:hover .kt{color:var(--vr)}
.kay .kp{font-weight:600;flex:none;width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kay .kt{flex:1;min-width:0}
.kay .kz{color:var(--ik);font-size:12.5px;flex:none}
.not{width:100%;min-height:84px;border-radius:10px;border:1px solid var(--cz);background:var(--bg);padding:10px 12px;resize:vertical;font-size:14.5px}
.p-sel{height:36px;border-radius:10px;border:1px solid var(--cz);background:var(--bg);padding:0 10px;font-size:14px}
.rnot{background:var(--vr-z);border-radius:12px;padding:12px 14px;font-size:14.5px}
.rnot b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--vr);margin:8px 0 2px}
.rnot b:first-child{margin-top:0}
.kr{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.kr i{height:6px;border-radius:9px;background:var(--yuz2);position:relative;overflow:hidden}
.kr i:after{content:"";position:absolute;inset:0;width:var(--w);background:var(--vr);border-radius:9px}
.perde{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:34}
/* 3 sütun (≥1240 px, liste sayfaları): sol süzgeç · orta akış · sağda kalıcı ayrıntı sütunu */
.akis3{display:grid;grid-template-columns:190px minmax(0,720px);gap:28px;justify-content:center;align-items:start}
.sol-s{position:sticky;top:78px;display:flex;flex-direction:column;gap:2px}
.sol-s a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:9px;font-size:14.5px;color:var(--ik);font-weight:500}
.sol-s a:hover{background:var(--yuz2);color:var(--yaz)}
.sol-s a.on{background:var(--yuz);color:var(--yaz);box-shadow:inset 0 0 0 1px var(--cz)}
.sol-s small{font-size:12px;color:var(--ik2);font-variant-numeric:tabular-nums}
.sol-s .ayr{height:1px;background:var(--cz);margin:8px 4px}
@media (min-width:1240px){
 body.uc .ana{max-width:none;margin:0 420px 0 0}
 body.uc .panel{display:block!important;width:420px;animation:none;box-shadow:-1px 0 0 var(--cz);z-index:20}
 body.uc .perde{display:none!important}
 body.uc .panel .p-kapat-yok{display:none}
}
.p-bos{color:var(--ik);font-size:14.5px;padding:40px 8px}
.p-bos h2{font-size:17px;color:var(--yaz);margin:0 0 8px}
.p-bos p{margin:0 0 12px}
.menu{position:fixed;z-index:70;min-width:230px;background:var(--yuz);border-radius:12px;box-shadow:var(--gl),inset 0 0 0 1px var(--cz);padding:6px;display:flex;flex-direction:column}
.menu button,.menu a{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 12px;border-radius:8px;font-size:14.5px;color:var(--yaz)}
.menu button:hover,.menu a:hover,.menu button:focus-visible,.menu a:focus-visible{background:var(--yuz2);outline:0}
/* arama */
.arama{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.3);display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.ara-k{width:min(680px,100%);background:var(--yuz);border-radius:16px;box-shadow:var(--gl);overflow:hidden;max-height:75vh;display:flex;flex-direction:column}
.ara-k input{border:0;outline:0;background:none;font-size:18px;padding:16px 18px;border-bottom:1px solid var(--cz);width:100%}
.ara-s{overflow-y:auto;padding:6px}
.ara-s button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px}
.ara-s button.on,.ara-s button:hover{background:var(--yuz2)}
.ara-s .t{font-size:15px;font-weight:500;display:block}
.ara-s .a{font-size:12.5px;color:var(--ik)}

:03:09.398634+00:00","s":"젠슨 황 최고경영자(CEO)가 사임한 가운데 엔비디아가 실적 성장세를 이어갔다. 17일(현지시간) 2027회계연도 3분기 실적을 발표에서 반회계기준(GAAP) 매출 1158억달러(약 154조6509억원), 영업이익 775억2000만달러(약 103조5270억원)를 기록했다고 밝혔다. 전년 동기 대비 매출은 103%, 영업이익은 115% 상승했다.희석 주당순이","i":"https://cdn.thelec.kr/news/photo/202611/65581_51678_2039.jpg"},{"t":"지슨, AI 부정행위 탐지 SW 내달 출시...전용 장비는 내년 상반기 공개","l":"https://www.thelec.kr/news/articleView.html?idxno=65592","d":"2026-11-18T02:03:09.398634+00:00","s":"지슨이 기존 전파탐지장비에 적용할 수 있는 인공지능(AI) 부정행위를 잡는 소프트웨어를 내달 출시한다고 18일 밝혔다.기존 지슨 장비에 이 소프트웨어를 적용하면 평균 45평 공간에서 발생하는 블루투스, 와이파이(Wi-Fi), 이동통신 전파를 감지할 수 있다. 감독관은 해당 장비를 들고 시험장 곳곳을 이동하며 의심 전파를 탐지하고 추적 가능하다.지슨은 새로 ","i":"https://cdn.thelec.kr/news/photo/202611/65592_51688_1020.jpg"},{"t":"최태원 SK 회장, '한일 경제협력 빅텐트' 출범","l":"https://www.thelec.kr/news/articleView.html?idxno=65584","d":"2026-11-18T02:03:09.398634+00:00","s":"최태원 SK그룹 회장이 지난 6월 일본 도쿄 닛케이포럼에서 제안한 한일 협력 플랫폼 '빅텐트'가 5개월 만에 출범했다. 양국 경제단체와 연구기관이 쌓아온 협력 성과를 공유하고 공동 과제를 발굴한다. 최종현학술원은 일본 요미우리신문과 '한일 신시대 전략 플랫폼'을 설립하고 공식 웹사이트를 개설했다고 18일 밝혔다. 최종현학술원 이사장인 최 회장과 야마구치 도","i":"https://cdn.thelec.kr/news/photo/202611/65584_51680_5422.jpg"},{"t":"현대로템, 서산 시험센터 증축","l":"https://www.thelec.kr/news/articleView.html?idxno=65593","d":"2026-11-18T02:03:09.398634+00:00","s":"현대로템이 항공우주추진시험센터 증축으로 항공우주 엔진 기술 역량을 강화한다. 현대로템은 지난 17일 충남 서산 항공우주추진시험센터에서 제2시험동 준공식을 진행했다고 18일 밝혔다. 제2시험동은 항공우주 엔진의 안정적인 연소 시험이 가능한 추진시험설비, 개별 구성품의 성능을 평가하는 성능시험실 등을 갖췄다. 기존의 제1시험동과 함께 극초음속 엔진, 재사용 우","i":"https://cdn.thelec.kr/news/photo/202611/65593_51689_171.jpg"},{"t":"삼성SDI, 통합형 ESS 솔루션에 25년 장기 보증 제공","l":"https://www.thelec.kr/news/articleView.html?idxno=65591","d":"2026-11-18T02:03:09.398634+00:00","s":"삼성SDI가 에너지저장장치(ESS)용 배터리와 전력변환장치, 운영시스템을 통합 공급하는 솔루션에 25년 장기 보증을 제공한다. 장기간 운영하는 ESS의 유지보수와 교체 비용 부담을 줄여 북미 시장 경쟁력을 높인다.삼성SDI는 18일 미국 라스베이거스에서 열린 에너지산업 전시회 'RE+ 2026'에서 통합형 ESS 솔루션 'AC 랩(Wrap)'과 장기 보증 ","i":"https://cdn.thelec.kr/news/photo/202611/65591_51687_724.jpg"},{"t":"한화시스템, 美 방산 기업에 단거리 AESA 레이더 수출","l":"https://www.thelec.kr/news/articleView.html?idxno=65586","d":"2026-11-18T02:03:09.398634+00:00","s":"한화시스템이 미국의 방산 기업 리벨리온 인더스트리즈와 단거리 능동형 전자주사식 위상배열(AESA) 레이더 수출 계약을 체결했다고 18일 밝혔다.해당 계약은 파일럿 수출이다. 대규모 수출 전 소량의 제품으로 시장의 반응을 확인해 현지 적합성을 검증한다. 공급 수량과 금액은 공개되지 않았다. 단거리 AESA 레이더는 저고도 드론과 소형 무인기 방어에 특화됐다.","i":"https://cdn.thelec.kr/news/photo/202611/65586_51682_264.jpg"},{"t":"AI 창업 지원한다면서…해외 AI 결제 막힌 '모두의 창업' 지원금","l":"https://www.thelec.kr/news/articleView.html?idxno=65554","d":"2026-11-18T02:03:09.398634+00:00","s":"중소벤처기업부가 기술창업을 지원하기 위해 지급하는 창업지원금이 정작 소프트웨어 개발 현장에서 활용하기 어렵다는 지적이 나온다. 해외 인공지능(AI) 코딩 도구와 클라우드 서비스 결제가 제한되고, 앱 개발에 필요한 테스트용 스마트폰 구매도 금지돼 있기 때문이다. 창업자의 초기 개발비 부담을 덜어주겠다는 정책 취지와 실제 지원금 집행 기준 사이에 괴리가 있다는","i":"https://cdn.thelec.kr/news/photo/202611/65554_51664_4020.png"},{"t":"KT&G, '릴 토니노 람보르기니' 전국 편의점으로 판매 확대","l":"https://www.thelec.kr/news/articleView.html?idxno=65588","d":"2026-11-18T02:03:09.398634+00:00","s":"KT&G가 궐련형 전자담배 '릴 토니노 람보르기니'의 판매처를 전국 모든 편의점으로 확대했다.KT&G는 18일 릴 토니노 람보르기니의 판매 지역을 전국으로 넓혔다고 밝혔다. 지난 9월 서울지역 편의점과 온라인 채널에서 제품을 출시한 뒤 수도권과 주요 대도시 편의점 약 3만4000곳으로 공급을 확대했다.릴 토니노 람보르기니는 마이크로웨이브로 전용 스틱을 가열","i":"https://cdn.thelec.kr/news/photo/202611/65588_51683_407.png"},{"t":"SK이노베이션, 그린수소 생산 효율 높이는 수전해 촉매 개발","l":"https://www.thelec.kr/news/articleView.html?idxno=65590","d":"2026-11-18T02:03:09.398634+00:00","s":"SK이노베이션이 재생에너지의 전력 공급 변동에도 안정적으로 그린수소를 생산할 수 있는 수전해 촉매 기술을 개발했다. 생산한 수소를 활용해 차세대 지속가능항공유(e-SAF) 제조 기술의 상용화도 추진한다.SK이노베이션은 18일 환경과학기술원이 개발한 고효율 수전해 촉매 기술이 영국 왕립화학회가 발행하는 국제학술지 '저널 오브 머티리얼즈 케미스트리 에이'에 게","i":"https://cdn.thelec.kr/news/photo/202611/65590_51685_4842.jpg"},{"t":"NHN, 신작 '최애의 아이 퍼즐 스타' 170여 개국 출시","l":"https://www.thelec.kr/news/articleView.html?idxno=65585","d":"2026-11-18T02:03:09.398634+00:00","s":"NHN이 신작 모바일 퍼즐 게임 '최애의 아이 퍼즐 스타(【최애의 아이】Puzzle Star)'를 글로벌 170여 개국에 출시했다.이 게임은 일본 인기 TV 애니메이션 '최애의 아이'를 기반으로 제작한 첫 공식 퍼즐 게임이다. 구글 플레이와 애플 앱스토어에서 이용할 수 있으며 한국어, 일본어, 영어, 중국어 간체, 번체를 지원한다.게임은 같은 종류의 블록을","i":"https://cdn.thelec.kr/news/photo/202611/65585_51681_1725.jpeg"}]},"kr-bloter":{"name":"블로터","lang":"ko","cat":"tech","plat":"web","url":"https://www.bloter.net/rss/allArticle.xml","updated":"2026-11-18T02:02:56.852298+00:00","items":[{"t":"숨빗AI, 시리즈A 120억 유치…알토스·SV 등 참여","l":"https://www.bloter.net/news/articleView.html?idxno=678827","d":"2026-11-18T02:03:09.179348+00:00","s":"생성형 인공지능(AI)으로 의료영상 판독문 초안을 작성하는 숨빗에이아이(숨빗AI)가 120억원 규모 시리즈A 투자를 유치했다. 중소벤처기업부 스케일업 팁스 연구개발(R&D) 자금 최대 30억원을 더해 150억원을 확보했다. 이 자금으로 흉부 엑스레이에 한정된 제품군을 컴퓨터단층촬영(CT)·자기공명영상(MRI)으로 확장한다.18일 벤처캐피탈(VC) 업계에 따","i":"https://cdn.bloter.net/news/thumbnail/202611/678827_293703_1641_v150.jpg"},{"t":"SBVA, 대만서 '에어비앤비 배출' YC와 접점…창업가 15명 동행","l":"https://www.bloter.net/news/articleView.html?idxno=678830","d":"2026-11-18T02:03:09.179348+00:00","s":"SBVA가 국내 신기술 분야 창업가 15명을 선발해 와이콤비네이터(YC)와의 접점 마련에 나섰다. YC가 대만에서 처음 개최한 ‘YC 스타트업 스쿨 타이베이'에 대표단을 꾸려 YC 파트너·글로벌 창업자와 교류할 자리를 만들었다. 국내 벤처캐피탈(VC) 가운데 이 행사에 참석한 곳은 SBVA가 유일하다. 18일 벤처캐피탈(VC) 업계에 따르면 SBVA는 AI","i":"https://cdn.bloter.net/news/thumbnail/202611/678830_293706_5627_v150.jpg"},{"t":"아주IB투자, 3분기 누적 영업익 276억…연내 3350억 펀드 결성","l":"https://www.bloter.net/news/articleView.html?idxno=678811","d":"2026-11-18T02:03:09.179348+00:00","s":"아주IB투자가 3분기까지 누적 영업이익 276억원을 기록했다. 3분기에는 보유 자산의 평가이익이 축소돼 분기 영업손실을 냈지만 상반기에 확보한 이익으로 누적 흑자를 유지했다.17일 금융감독원 전자공시에 따르면 아주IB투자의 3분기 누적 연결 영업이익은 276억원으로 전년 동기(62억원) 대비 345.5% 증가했다. 상반기 462억원의 영업이익을 올렸으나 3","i":"https://cdn.bloter.net/news/thumbnail/202611/678811_293679_1511_v150.jpg"},{"t":"이지스·하나증권·딜로이트 안진, 패밀리오피스·고액자산 시장 진출","l":"https://www.bloter.net/news/articleView.html?idxno=678978","d":"2026-11-18T02:03:09.179348+00:00","s":"이지스자산운용이 하나증권, 딜로이트 안진회계법인과 함께 패밀리오피스·고액자산가 시장에 진출한다. 기관투자자에게 제공했던 대체투자 기회를 신규 시장으로 확장한다. 상품 구조화부터 매입·매각, 세무·재무 자문까지 3사가 함께 지원한다는 전략이다.이지스자산운용은 17일 서울 영등포구 하나증권 본사에서 하나증권, 딜로이트 안진회계법인과 패밀리오피스·고액자산가 고객","i":"https://cdn.bloter.net/news/thumbnail/202611/678978_293902_157_v150.jpg"},{"t":"삼성전기 증설에 또 지갑 여는 엔비디아…MLCC도 '눈독'","l":"https://www.bloter.net/news/articleView.html?idxno=678976","d":"2026-11-18T02:03:09.179348+00:00","s":"삼성전기가 엔비디아와 AI(인공지능) 반도체 부품 동맹을 공고히 하고 있다. 엔비디아가 공장 증설에 추가 자금을 지원하는 방안까지 검토하면서 양사 협력에도 힘이 실린다. 첨단 기판에서 시작한 협력이 MLCC(적층세라믹커패시터)까지 뻗어가는 모습이다. 엔비디아, 세종·부산 증설에 추가 지원 검토 삼성전기는 18일 엔비디아와 AI 반도체 패키지기판 공급 협력을","i":"https://cdn.bloter.net/news/thumbnail/202611/678976_293899_1023_v150.jpg"},{"t":"한국투자금융지주, KDB생명 인수 불발…산은과 협상 결렬","l":"https://www.bloter.net/news/articleView.html?idxno=678968","d":"2026-11-18T02:03:09.179348+00:00","s":"한국투자금융지주의 KDB생명보험 인수가 무산됐다. 8월 우선협상대상자로 선정된 지 3개월여 만이다. 한국산업은행 등 매각 측과 거래 조건을 놓고 이견을 좁히지 못하면서 주식매매계약 체결에 실패했다.한투금융지주는 18일 KDB생명 매각 관련 우선협상대상자 지위를 상실했다고 공시했다. 한투금융지주 측은 \"산은 등으로부터 KDB생명 매각과 관련해 거래의 우선협상","i":"https://cdn.bloter.net/news/thumbnail/202611/678968_293896_5329_v150.jpg"},{"t":"[빛을 담는 기업들] 그린광학, 방산·ZnS로 상장 첫해 목표 달성할까","l":"https://www.bloter.net/news/articleView.html?idxno=678919","d":"2026-11-18T02:03:09.179348+00:00","s":"초정밀 광학시스템 제조기업 그린광학이 방산용 광학부품과 황화아연(ZnS) 소재를 중심으로 실적 성장세를 이어가고 있다. 지난해 코스닥 상장 이후 국내외 방산 수주를 확대하면서 올해 3분기까지 지난해 연간 영업이익을 넘어서는 성과를 거뒀다. 다만 상장 당시 제시한 연간 실적 추정치와는 여전히 차이가 있어 남은 기간 방산 수주 물량의 매출 전환과 수익성 개선이","i":"https://cdn.bloter.net/news/thumbnail/202611/678919_293849_4852_v150.jpg"},{"t":"케이블TV 4년 연속 적자…\"방발기금 할인·면제 필요\"","l":"https://www.bloter.net/news/articleView.html?idxno=678947","d":"2026-11-18T02:03:09.179348+00:00","s":"정부가 케이블TV 사업자(SO)에 매년 부과하는 방송통신발전기금(방발기금)을 사업자의 실적과 재무 여건에 따라 할인하거나 면제해야 한다는 주장이 나왔다. 수년째 적자가 이어지는 SO들이 기금 부담으로 지역 콘텐츠 제작과 신사업 투자 여력까지 잃고 있다는 이유에서다.한국케이블TV방송협회는 이달 17일 서울 서대문구 협회 대회의실에서 'SO산업의 존립 기반 상","i":"https://cdn.bloter.net/news/thumbnail/202611/678947_293881_2645_v150.jpg"},{"t":"CJ올리브네트웍스, 제약공장 AI 전환…불량검사·설비고장 예측","l":"https://www.bloter.net/news/articleView.html?idxno=678964","d":"2026-11-18T02:03:09.179348+00:00","s":"CJ올리브네트웍스가 제약 제조 현장에 인공지능(AI)을 적용하는 사업을 확대한다. 수액제 제조 공장에 AI 기반 품질검사와 설비 이상 징후 감지 기술을 도입하고 생산·품질 데이터 관리체계도 구축한다. 제품 불량을 줄이는 동시에 설비 고장에 따른 생산 중단을 예방하는 것이 핵심이다. AI로 수액제 불량 검사…설비 이상 징후도 감지CJ올리브네트웍스는 18일 유","i":"https://cdn.bloter.net/news/thumbnail/202611/678964_293895_5216_v150.jpg"},{"t":"카카오뱅크, 몽골 디지털은행 2대 주주로…중앙아시아 공략 확대","l":"https://www.bloter.net/news/articleView.html?idxno=678969","d":"2026-11-18T02:03:09.179348+00:00","s":"카카오뱅크가 몽골 디지털은행의 2대 주주로 올라서며 해외사업의 무게중심을 중앙아시아까지 넓힌다. 인도네시아와 태국에 이은 세 번째 해외 진출이다. 현지 금융회사에 대한 지분 투자와 디지털 금융 기술 협력을 병행해 새로운 성장 기반을 확보하겠다는 전략이다. 카카오뱅크는 18일 몽골 엠뱅크(M bank)에 전략적으로 투자해 지분 15%를 확보한다고 밝혔다. 이","i":"https://cdn.bloter.net/news/thumbnail/202611/678969_293897_5441_v150.jpg"},{"t":"현대카드, JP모간과 'AI 에이전트' 실증…환전·송금 지형 바꿀까","l":"https://www.bloter.net/news/articleView.html?idxno=678963","d":"2026-11-18T02:03:09.179348+00:00","s":"현대카드가 글로벌 투자은행(IB) JP모간과 손잡고 인공지능(AI) 에이전트 기반 금융 거래의 상용화 가능성을 입증했다. 단순한 업무 보조를 넘어 서로 다른 기관의 AI가 자율적으로 소통하며 자금을 관리하는 차세대 인프라 구현에 한 걸음 다가섰다는 평가다. 시장에서는 이번 성과가 기업의 환전·송금 업무 효율성을 높일 것으로 기대하고 있다.18일 현대카드에 ","i":"https://cdn.bloter.net/news/thumbnail/202611/678963_293893_443_v150.jpg"},{"t":"KDB생명 매각 발목 잡은 '1조'…산은과 한국투자금융, 결국 결별","l":"https://www.bloter.net/news/articleView.html?idxno=678961","d":"2026-11-18T02:03:09.179348+00:00","s":"KDB생명 매각 건은 또 다시 좌초됐다. 한국산업은행이 한국투자금융지주와 추진해 온 KDB생명 매각협상을 공식 종료했다. 우선협상대상자 선정 이후 약 3개월간 협상을 이어갔지만 최종 거래 조건에 합의하지 못하면서 일곱 번째 매각 시도마저 무산됐다. 협상 과정에서 약 1조원 규모의 사전 자본확충 요구가 주요 쟁점으로 거론됐지만 산업은행은 구체적인 결렬 원인을","i":"https://cdn.bloter.net/news/thumbnail/202611/678961_293890_3412_v150.jpg"}]},"usgs-45":{"name":"USGS M4.5+ Depremler (1 gün)","lang":"en","cat":"sci","plat":"web","url":"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.atom","updated":"2026-11-18T02:02:56.852298+00:00","items":[{"t":"M 5.3 - 16 km W of Nereju Mic, Romania","d":"2026-11-18T02:01:50.953000+00:00","l":"https://earthquake.usgs.gov/earthquakes/eventpage/us7000tyw8","s":"DYFI? - IV Time 2026-11-18 00:48:56 UTC 2026-11-18 00:48:56 UTC at epicenter Location 45.680°N 26.489°E Depth 130.76 km (81.25 mi)"},{"t":"M 4.9 - 43 km NW of Oxford, New Zealand","d":"2026-11-18T01:23:52.532000+00:00","l":"ht   var t=e.target.closest('[data-act]');
  var ta=e.target.closest('.sat-t a');if(ta&&!t){if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();var ra=ta.closest('[data-id]');if(ra)sec(ra.dataset.id);return}
  if(!t){var r=e.target.closest('[data-id]');if(r&&!e.target.closest('a[href],select,textarea,input')&&!r.closest('#arama')){sec(r.dataset.id)}return}
  var a=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
  if(t.tagName==='SELECT')return;
  if(a==='detay'||a==='trend'){e.preventDefault();sec(id)}
  else if(a==='kaydet'){e.stopPropagation();kaydet(id)}
  else if(a==='gizle'){e.stopPropagation();gizle(id)}
  else if(a==='geri'){if(S.geri)gizle(S.geri)}
  else if(a==='reelsisaret'){durumYaz(id,(durum[id]||{}).d==='reels-fikri'?'kaydedildi':'reels-fikri');toast((durum[id]||{}).d==='reels-fikri'?'Reels fikri olarak işaretlendi':'Reels işareti kaldırıldı')}
  else if(a==='kapat'){sec(null)}
  else if(a==='kop'){e.stopPropagation();kopyala(v)}
  else if(a==='menu'){e.stopPropagation();if(S._menuBtn===t)menuKapat();else menuAc(t,id)}
  else if(a==='mKopya'){var cm=bul(id);menuKapat(true);if(cm&&cm.l)kopyala(cm.l)}
  else if(a==='mReels'){menuKapat(true);durumYaz(id,(durum[id]||{}).d==='reels-fikri'?'kaydedildi':'reels-fikri');toast('Reels durumu güncellendi');ciz()}
  else if(a==='mDetay'){menuKapat();sec(id)}
  else if(a==='kopya'){var c=bul(id);if(c)kopyala(c.t+'\n'+c.l)}
  else if(a==='paylas'){var c2=bul(id);if(c2&&navigator.share)navigator.share({title:c2.t,url:c2.l}).catch(function(){})}
  else if(a==='pen'){S.pen=v;ciz()}
  else if(a==='zaman'){S.zaman=v;S.adet=40;ciz()}else if(a==='cok'){S.cok=!S.cok;S.adet=40;ciz()}else if(a==='trf'){S.tr=v;S.adet=40;ayar.dilSuz=v;yaz('akis2-ayar',ayar);try{history.replaceState(null,'','#/akis/'+S.alan+(v?'?dil='+v:''))}catch(e){}ciz()}
  else if(a==='cevirme'){var cl=ayar.cevirme||[],ci=cl.indexOf(v);if(ci<0)cl.push(v);else cl.splice(ci,1);ayar.cevirme=cl;yaz('akis2-ayar',ayar);ayarAc();ciz()}
  else if(a==='vurgu'){ayar.vurgu=v;yaz('akis2-ayar',ayar);temaUygula();ayarAc()}
  else if(a==='dl'){S.dl=v;S.dalan='';S.adet=40;history.replaceState(null,'','#/dunya/'+v);ciz()}else if(a==='dalan'){S.dalan=v;S.adet=40;ciz()}
  else if(a==='pdl'){S.pdl=v;S.adet=40;history.replaceState(null,'','#/'+S.sayfa+(v?'/'+v:''));ciz()}else if(a==='pkonu'){S.pkonu=v;S.adet=40;ciz()}else if(a==='psira'){S.psira=v;ciz()}else if(a==='ptr'){S.ptr=!S.ptr;S.adet=40;ciz()}else if(a==='pkay'){S.pkay=!S.pkay;ciz()}
  else if(a==='pvars'){ayar.profil=ayar.profil===v?'':v;yaz('akis2-ayar',ayar);toast(ayar.profil?'Bu tarayıcıda Akış açılınca bu masa gelir':'Açılış sayfası yeniden Bugün');ciz()}else if(a==='dsira'){S.dsira=v;ciz()}
  else if(a==='cevir'){ayar.cevir=!ayar.cevir;yaz('akis2-ayar',ayar);toast(ayar.cevir?'Yabancı haberler Türkçe çeviriyle açılacak':'Haberler orijinal dilinde açılacak');if(S.sec==='__ayar')ayarAc();else ciz()}
  else if(a==='sira'){S.sira=v;ciz()}else if(a==='daha'){S.adet+=40;ciz()}else if(a==='rdaha'){S.radet+=20;ciz()}else if(a==='yenidenDene'){yukleniyor={};(D.ozet?Promise.resolve():ozetYukle()).then(function(){rota()}).catch(hata)}else if(a==='suzAc'){S.suzAcik=!S.suzAcik;document.body.classList.toggle('suz-acik',S.suzAcik);ciz()}else if(a==='vdaha'){S.vadet+=48;ciz()}else if(a==='vtur'){S.vtur=v;S.vadet=48;ciz()}else if(a==='vdil'){S.vdil=v;S.vadet=48;ciz()}else if(a==='vgun'){S.vgun=!S.vgun;S.vadet=48;ciz()}else if(a==='vkisa'){S.vkisa=S.vkisa===v?false:v;S.vadet=48;ciz()}
  else if(a==='geo'){S.geo=v;history.replaceState(null,'','#/trend/'+v);ciz()}else if(a==='tfil'){S.tfil=v;ciz()}
  else if(a==='urun'){S.urun=v;S.adet=40;history.replaceState(null,'','#/guncelleme'+(v?'?u='+v:''));ciz()}else if(a==='tur'){S.tur=v;S.adet=40;ciz()}else if(a==='dil'){S.dil=v;S.adet=40;ciz()}
  else if(a==='profil'){S.profil=v;S.radet=20;ciz()}else if(a==='ralt'){S.ralt=v;S.radet=20;ciz()}
  else if(a==='kfil'){S.kfil=v;ciz()}else if(a==='kdur'){S.kdur=S.kdur===v?'':v;ciz()}
  else if(a==='disa')disa();else if(a==='brif')brif();else if(a==='n-uret')kayitTaslak();
  else if(a==='ayar')ayarAc();
  else if(a==='tema'){ayar.tema=v;yaz('akis2-ayar',ayar);temaUygula();ayarAc()}
  else if(a==='gorunum'||a==='gorunumDon'){var gi=GORUNUM.map(function(g){return g[0]}).indexOf(ayar.gorunum);ayar.gorunum=a==='gorunum'?v:GORUNUM[(gi+1)%GORUNUM.length][0];yaz('akis2-ayar',ayar);temaUygula();toast('Görünüm: '+GORUNUM.filter(function(g){return g[0]===ayar.gorunum})[0][1]);if(S.sec==='__ayar')ayarAc();ciz()}
  else if(a==='gorsel'){ayar.gorsel=!ayar.gorsel;yaz('akis2-ayar',ayar);temaUygula();ayarAc()}
  else if(a==='takipKaydet'){ayar.takip=$('takipG').value.split(',').map(function(x){return x.trim()}).filter(Boolean).slice(0,40);yaz('akis2-ayar',ayar);takipKur();toast('Takip kelimeleri kaydedildi');S.sec=null;ciz()}
  else if(a==='okTemizle'){okundu={};yaz('akis-okundu',okundu);toast('Okundu işaretleri silindi');ciz()}
  else if(a==='gizTemizle'){gizli={};yaz('akis-gizli',gizli);toast('Gizlenenler geri geldi');ciz()}
  else if(a==='araSec'){araAcSec(id)}
});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.act==='durum'){durumYaz(t.dataset.id,t.value)}else if(t.dataset&&t.dataset.act==='alt'){S.alt=t.value;S.adet=40;ciz()}else if(t.dataset&&t.dataset.act==='vkanal'){S.vkanal=t.value;S.vadet=48;ciz()}});
$('araAc').onclick=araAc;$('ayarAc').onclick=ayarAc;
$('perde').onclick=function(){sec(null)};
$('arama').onclick=function(e){if(e.target===$('arama'))araKapat()};
$('araK').oninput=function(){S.araSec=0;araCiz()};
$('araK').onkeydown=function(e){var r=S._ara||[];if(e.key==='ArrowDown'){S.araSec=Math.min(r.length-1,S.araSec+1);araCiz();e.preventDefault()}else if(e.key==='ArrowUp'){S.araSec=Math.max(0,S.araSec-1);araCiz();e.preventDefault()}else if(e.key==='Enter'&&r[S.araSec]){araAcSec(r[S.araSec].id)}else if(e.key==='Escape')araKapat()};
function satirlar(){return Array.prototype.slice.call($('ana').querySelectorAll('[data-id]:not(button):not(select)'))}
/* ⋯ Diğer menüsü: kartın ikincil eylemleri tek yerde */
function menuAc(btn,id){
  var c=bul(id),m=$('eylemMenu');if(!c)return;menuKapat();
  var it=[];
  if(c.l)it.push('<a role="menuitem" href="'+esc(acU(c))+'" target="_blank" rel="noopener" data-mx="ac" data-id="'+esc(id)+'">'+ik('dis')+'Haberi yeni sekmede aç</a>');
  if(yabanci(c)&&c.l)it.push('<a role="menuitem" href="'+esc(cevirU(c.l))+'" target="_blank" rel="noopener" data-mx="ac" data-id="'+esc(id)+'">'+ik('cevir')+'Türkçe çeviriyle aç</a>');
  if(c.l)it.push('<button role="menuitem" data-act="mKopya" data-id="'+esc(id)+'">'+ik('kopya')+'Bağlantıyı kopyala</button>');
  it.push('<button role="menuitem" data-act="mReels" data-id="'+esc(id)+'">'+ik('reels')+((durum[id]||{}).d==='reels-fikri'?'Reels işaretini kaldır':'Reels fikri olarak işaretle')+'</button>');
  it.push('<button role="menuitem" data-act="mDetay" data-id="'+esc(id)+'">'+ik('akis')+'Ayrıntıyı aç</button>');
  m.innerHTML=it.join('');m.hidden=false;S._menuBtn=btn;btn.setAttribute('aria-expanded','true');
  var r=btn.getBoundingClientRect(),w=m.offsetWidth,hh=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(innerWidth-w-8,r.right-w))+'px';m.style.top=(r.bottom+6+hh>innerHeight?Math.max(8,r.top-hh-6):r.bottom+6)+'px';
  var ilk=m.querySelector('[role=menuitem]');if(ilk)ilk.focus();
}
function menuKapat(geri){var m=$('eylemMenu');if(m.hidden)return;m.hidden=true;var b=S._menuBtn;S._menuBtn=null;if(b){b.setAttribute('aria-expanded','false');if(geri&&document.contains(b))b.focus()}}
document.addEventListener('click',function(e){var m=$('eylemMenu');if(!m.hidden&&!m.contains(e.target)&&!(e.target.closest&&e.target.closest('[data-act="menu"]')))menuKapat()},true);
$('eylemMenu').addEventListener('keydown',function(e){var l=Array.prototype.slice.call(this.querySelectorAll('[role=menuitem]')),i=l.indexOf(document.activeElement);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();l[(i+(e.key==='ArrowDown'?1:-1)+l.length)%l.length].focus()}else if(e.key==='Escape'||e.key==='Tab'){e.preventDefault();e.stopPropagation();menuKapat(true)}});
$('eylemMenu').addEventListener('click',function(e){var a=e.target.closest('[data-mx="ac"]');if(a){okunduYap(a.dataset.id);setTimeout(function(){menuKapat()},0)}});
function imlecUygula(){var l=satirlar();l.forEach(function(x,i){x.classList.toggle('imlec',i===S.imlec)})}
function hedefId(){if(S.sec&&S.sec!=='__ayar')return S.sec;var l=satirlar();return l[S.imlec]?l[S.imlec].dataset.id:null}
document.addEventListener('focusin',function(e){var r=e.target.closest&&e.target.closest('#ana [data-id]');if(r){var l=satirlar(),i=l.indexOf(r);if(i>=0&&i!==S.imlec){S.imlec=i;imlecUygula()}}});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'){if(e.key==='Escape')e.target.blur();return}
  if(S.ara)return;
  var k=e.key;
  if(k==='/'){e.preventDefault();araAc();return}
  if(S._g&&Date.now()-S._g<1500){S._g=0;var GH={b:'bugun',a:'akis',v:'videolar',r:'reels',k:'kayit',t:'trend',d:'dunya'};if(GH[k]){location.hash='#/'+GH[k];return}}
  if(k==='g'){S._g=Date.now();return}
  if(k==='?'){ayarAc();setTimeout(function(){var ks=document.querySelector('#panel .kisayol');if(ks)ks.scrollIntoView({block:'center'})},50);return}
  if(k==='.'){var mi=hedefId(),mb=mi&&document.querySelector('#ana [data-id="'+mi+'"] [data-act="menu"]');if(mb)menuAc(mb,mi);return}
  if(k==='z'){if(S.sonGizli&&gizli[S.sonGizli])gizle(S.sonGizli);return}
  if(k==='Escape'){if(!$('eylemMenu').hidden){menuKapat(true);return}if(S.sec)sec(null);return}
  if(k==='Enter'&&e.target.matches&&e.target.matches('#ana .rk[data-id]')){sec(e.target.dataset.id);return}
  if(k==='j'||k==='k'){var l=satirlar();if(!l.length)return;S.imlec=Math.max(0,Math.min(l.length-1,S.imlec+(k==='j'?1:-1)));imlecUygula();var fo=l[S.imlec].querySelector('.sat-t a')||(l[S.imlec].tabIndex>=0?l[S.imlec]:null);if(fo)fo.focus({preventScroll:true});l[S.imlec].scrollIntoView({block:'nearest'});if(S.sec&&S.sec!=='__ayar')sec(l[S.imlec].dataset.id);return}
  if(k==='Enter'){var l2=satirlar();if(l2[S.imlec])sec(l2[S.imlec].dataset.id);return}
  var id=hedefId();
  if(k==='o'&&id){var c=bul(id);if(c&&(c.l||(c.og||[])[0])){window.open(c.l?acU(c):c.og[0].l,'_blank','noopener');okunduYap(id)}return}
  if(k==='s'&&id&&id.indexOf('tr:')!==0){kaydet(id);return}
  if(k==='x'&&id&&id.indexOf('tr:')!==0){gizle(id);return}
  if(k==='r'&&id&&id.indexOf('tr:')!==0){durumYaz(id,(durum[id]||{}).d==='reels-fikri'?'kaydedildi':'reels-fikri');toast('Reels durumu güncellendi');return}
  var gor=kisiSekme().concat(SAYFALAR),n=parseInt(k,10);if(n>=1&&n<=Math.min(9,gor.length)){location.hash='#/'+gor[n-1][0];return}
});

/* ---------- açılış ve tazelik ---------- */
function hata(e){$('ana').innerHTML='<div class="bosluk" role="alert">Haberler yüklenemedi. Bağlantınızı kontrol edin.<br><button class="dg ana-d" style="margin-top:12px" data-act="yenidenDene">Yeniden dene</button><p class="bilgi" style="margin-top:8px">Ayrıntı: '+esc(e&&e.message||e)+'</p></div>'}
function tazelik(){
  // küçük sürüm dosyası (birkaç bayt); eski yayında yoksa ozet.json'a düşer
  var gor=function(o){if(D.ozet&&o&&o.generated&&o.generated!==D.ozet.generated)$('yeniVeri').hidden=false};
  fetch('data/surum.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(gor).catch(function(){fetch('data/ozet.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(gor).catch(function(){})});
}
$('yeniVeri').onclick=function(){$('yeniVeri').hidden=true;yukleniyor={};D={ozet:null,alan:{},dil:{},kisi:{},reels:null,video:null,kaynak:null,indeks:null,trend:null,gunc:null};REG={};TREG={};ozetYukle().then(function(){ciz()}).catch(hata)};
setInterval(function(){saatCiz();if(!document.hidden)tazelik()},180000);
try{matchMedia('(min-width:1240px)').addEventListener('change',function(){panelCiz()})}catch(e){}
document.addEventListener('visibilitychange',function(){if(!document.hidden){saatCiz();tazelik()}});
ozetYukle().then(function(){rota();trendYukle().catch(function(){})}).catch(hata);
})();
</script>
