<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Akış</title>
<meta name="description" content="Akış: haber merkezi, Google Trends, güncelleme radarı ve Reels konu keşfi">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6bf0'/%3E%3Cpath d='M8 20c4-8 8 4 16-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f6f3;--yuz:#fff;--yuz2:#f0efeb;--yaz:#1d1d1f;--ik:#6c6c72;--ik2:#9a9aa0;--cz:#e6e5e0;--vr:#2f6bf0;--vr-z:#e9effd;--sc:#d4442e;--sc-z:#fbeae6;--ye:#16925a;--ye-z:#e4f4ec;--sa:#b9770e;--sa-z:#fbf1de;--gl:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--r:12px;color-scheme:light}
:root[data-tema=koyu]{--bg:#121315;--yuz:#1a1b1e;--yuz2:#222327;--yaz:#ececee;--ik:#a0a0a8;--ik2:#74747c;--cz:#2a2b30;--vr:#7aa2ff;--vr-z:#1d2640;--sc:#ff7a62;--sc-z:#3a201b;--ye:#4cc98a;--ye-z:#16301f;--sa:#e8b04a;--sa-z:#33281a;--gl:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-tema=acik]){--bg:#121315;--yuz:#1a1b1e;--yuz2:#222327;--yaz:#ececee;--ik:#a0a0a8;--ik2:#74747c;--cz:#2a2b30;--vr:#7aa2ff;--vr-z:#1d2640;--sc:#ff7a62;--sc-z:#3a201b;--ye:#4cc98a;--ye-z:#16301f;--sa:#e8b04a;--sa-z:#33281a;--gl:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--yaz);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--vr);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
/* üst çubuk */
.ust{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--cz)}
.ust-i{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:6px;height:56px;padding:0 16px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:10px}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--vr);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;inset:6px 4px;border-bottom:2.5px solid #fff;border-radius:0 0 50% 50%;transform:rotate(-12deg)}
.sekme{display:flex;gap:2px}
.sekme a{padding:7px 11px;border-radius:9px;font-size:14.5px;color:var(--ik);font-weight:500;white-space:nowrap}
.sekme a:hover{color:var(--yaz);background:var(--yuz2)}
.sekme a.on{color:var(--yaz);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz)}
.bos{flex:1}
.ara-b{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border-radius:10px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);color:var(--ik);font-size:14px;min-width:200px}
.ara-b kbd,.kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--cz);border-radius:5px;padding:0 5px;color:var(--ik2);margin-left:auto;background:var(--bg)}
.ik-b{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ik)}
.ik-b:hover{background:var(--yuz2);color:var(--yaz)}
.saat{font-size:13px;color:var(--ik);display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap}
.nokta{width:7px;height:7px;border-radius:50%;background:var(--ye);display:inline-block;flex:none}
.nokta.sa{background:var(--sa)}.nokta.sc{background:var(--sc)}
.yeni-veri{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:40;background:var(--vr);color:#fff;border-radius:99px;padding:8px 16px;font-size:14px;font-weight:600;box-shadow:var(--gl)}
/* yerleşim */
.ana{max-width:1240px;margin:0 auto;padding:22px 16px 110px}
.duzen{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.duzen.tek{grid-template-columns:minmax(0,760px);justify-content:center}
.sag{position:sticky;top:78px;display:flex;flex-direction:column;gap:22px}
.bas{display:flex;align-items:flex-end;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.bas h1{font-size:26px;line-height:1.15;letter-spacing:-.025em;margin:0;font-weight:700}
.bas p{margin:2px 0 0;color:var(--ik);font-size:14px}
.blok{margin:0 0 30px}
.blok-b{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.blok-b h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ik);margin:0;font-weight:600}
.blok-b a,.blok-b button{margin-left:auto;font-size:13.5px;color:var(--vr);font-weight:500}
.kutu{background:var(--yuz);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--cz);padding:14px 16px}
.kutu h2{margin:0 0 8px}
/* satır */
.liste{display:flex;flex-direction:column}
.sat{display:flex;gap:14px;padding:13px 10px;margin:0 -10px;border-radius:12px;cursor:pointer;position:relative;align-items:flex-start}
.sat+.sat{box-shadow:0 -1px 0 var(--cz)}
.sat:hover,.sat.imlec{background:var(--yuz)}
.sat:hover+.sat,.sat.imlec+.sat{box-shadow:none}
.sat.secili{background:var(--vr-z)}
.sat-g{width:76px;height:56px;border-radius:9px;object-fit:cover;flex:none;background:var(--yuz2)}
.sat-m{flex:1;min-width:0}
.sat-t{font-size:16.5px;line-height:1.38;font-weight:600;margin:0;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sat.ok .sat-t{color:var(--ik);font-weight:500}
.sat-a{font-size:13px;color:var(--ik);margin-top:4px;display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
.sat-a>*+*:before{content:"·";margin-right:6px;color:var(--ik2)}
.sat-a b{color:var(--yaz);font-weight:600}
.sat-o{font-size:14px;color:var(--ik);margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yeni-n{width:7px;height:7px;border-radius:50%;background:var(--vr);position:absolute;left:-3px;top:22px}
.sat-e{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.sat:hover .sat-e,.sat.imlec .sat-e,.sat-e .on{opacity:1}
.sat-e .on{color:var(--vr)}
.sat-e .ik-b{width:32px;height:32px}
.sat.buyuk .sat-g{width:100%;height:auto;aspect-ratio:16/7;max-height:340px;border-radius:12px;margin-bottom:12px}
.sat.buyuk{flex-direction:column;gap:0}
.sat.buyuk .sat-t{font-size:22px;line-height:1.25;letter-spacing:-.02em;-webkit-line-clamp:4}
.sat.buyuk .sat-e{position:absolute;right:10px;bottom:12px}
.sat.sikis .sat-t{font-size:15px;-webkit-line-clamp:2}
.sat.sikis{padding:9px 10px}
mark{background:var(--sa-z);color:inherit;border-radius:3px;padding:0 2px}
.et{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--yuz2);color:var(--ik);white-space:nowrap}
.et.vr{background:var(--vr-z);color:var(--vr)}.et.sc{background:var(--sc-z);color:var(--sc)}.et.ye{background:var(--ye-z);color:var(--ye)}.et.sa{background:var(--sa-z);color:var(--sa)}
.sat-a .et:before{display:none}
/* çipler */
.cipler{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin:0 0 6px;-webkit-overflow-scrolling:touch}
.cipler::-webkit-scrollbar{display:none}
.cip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);font-size:14px;color:var(--yaz);white-space:nowrap}
.cip:hover{box-shadow:inset 0 0 0 1px var(--ik2)}
.cip.on{background:var(--yaz);color:var(--bg);box-shadow:none}
.cip small{color:var(--ik);font-size:12px}
.cip.on small{color:inherit;opacity:.7}
.seg{display:inline-flex;background:var(--yuz2);border-radius:10px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 11px;border-radius:8px;font-size:13.5px;color:var(--ik);white-space:nowrap}
.seg button.on{background:var(--yuz);color:var(--yaz);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.arac{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.arac select{height:32px;border-radius:9px;border:1px solid var(--cz);background:var(--yuz);padding:0 8px;font-size:14px}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ik);height:32px;padding:0 10px;border-radius:9px}
.tg.on{color:var(--vr);background:var(--vr-z)}
/* trend */
.tr-serit{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.tr-serit::-webkit-scrollbar{display:none}
.tr-c{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 13px;border-radius:12px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);text-align:left;max-width:220px}
.tr-c b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.tr-c span{font-size:12.5px;color:var(--ik)}
.tr-c.firsat{box-shadow:inset 0 0 0 1px var(--sc-z),inset 3px 0 0 var(--sc)}
.tr-s{display:flex;gap:14px;align-items:center;padding:12px 10px;margin:0 -10px;border-radius:12px;cursor:pointer}
.tr-s+.tr-s{box-shadow:0 -1px 0 var(--cz)}
.tr-s:hover,.tr-s.imlec{background:var(--yuz)}
.tr-s:hover+.tr-s{box-shadow:none}
.tr-h{width:72px;flex:none;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.tr-h small{display:block;font-size:11.5px;color:var(--ik);font-weight:500}
.tr-s.son .tr-t,.tr-s.son .tr-h{color:var(--ik)}
.tr-t{font-size:16.5px;font-weight:600;margin:0}
.spark{width:64px;height:24px;flex:none}
.spark polyline{fill:none;stroke:var(--vr);stroke-width:1.6}
.mini{display:flex;flex-direction:column}
.mini a,.mini button{display:flex;gap:10px;align-items:baseline;padding:7px 0;text-align:left;font-size:14.5px;width:100%}
.mini a+a,.mini button+button{border-top:1px solid var(--cz)}
.mini .n{color:var(--ik);font-size:12.5px;font-variant-numeric:tabular-nums;width:54px;flex:none}
.mini .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .sag-n{color:var(--ik);font-size:12.5px;flex:none}
/* reels */
.rk{display:flex;gap:16px;padding:16px;border-radius:14px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);cursor:pointer;margin-bottom:12px}
.rk:hover,.rk.imlec{box-shadow:inset 0 0 0 1px var(--ik2)}
.rk-p{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:17px;background:conic-gradient(var(--vr) calc(var(--p)*1%),var(--yuz2) 0);position:relative}
.rk-p span{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;background:var(--yuz);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rk h3{margin:0;font-size:17px;line-height:1.35;letter-spacing:-.01em}
.rk p{margin:6px 0 0;font-size:14.5px;color:var(--ik)}
.hook{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:9px;background:var(--yuz2);font-size:14.5px;margin-top:6px}
.hook span{flex:1}
/* detay paneli */
.panel{position:fixed;top:56px;right:0;bottom:0;width:min(520px,100%);background:var(--yuz);box-shadow:-1px 0 0 var(--cz),var(--gl);z-index:35;overflow-y:auto;overscroll-behavior:contain;animation:gir .16s ease-out}
@keyframes gir{from{transform:translateX(24px);opacity:0}}
.p-i{padding:18px 22px 60px}
.p-ust{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--yuz);padding:10px 22px;margin:-18px -22px 10px;border-bottom:1px solid var(--cz);z-index:2;font-size:13px;color:var(--ik)}
.p-ust .bos{flex:1}
.panel h2.p-t{font-size:23px;line-height:1.25;letter-spacing:-.02em;margin:6px 0 10px}
.p-g{width:100%;border-radius:12px;aspect-ratio:16/9;object-fit:cover;background:var(--yuz2);margin:4px 0 10px}
.p-o{color:var(--ik);margin:0 0 14px;font-size:15.5px}
.eylem{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.dg{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:10px;background:var(--yuz2);font-size:14px;font-weight:500;white-space:nowrap}
.dg:hover{filter:brightness(.96)}
.dg.ana-d{background:var(--vr);color:#fff}
.dg.on{background:var(--vr-z);color:var(--vr)}
.p-b{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ik);margin:20px 0 6px;font-weight:600}
.kay a{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--cz);font-size:14.5px;align-items:baseline}
.kay a:first-child{border-top:0}
.kay a:hover .kt{color:var(--vr)}
.kay .kp{font-weight:600;flex:none;width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kay .kt{flex:1;min-width:0}
.kay .kz{color:var(--ik);font-size:12.5px;flex:none}
.not{width:100%;min-height:84px;border-radius:10px;border:1px solid var(--cz);background:var(--bg);padding:10px 12px;resize:vertical;font-size:14.5px}
.p-sel{height:36px;border-radius:10px;border:1px solid var(--cz);background:var(--bg);padding:0 10px;font-size:14px}
.rnot{background:var(--vr-z);border-radius:12px;padding:12px 14px;font-size:14.5px}
.rnot b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--vr);margin:8px 0 2px}
.rnot b:first-child{margin-top:0}
.kr{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.kr i{height:6px;border-radius:9px;background:var(--yuz2);position:relative;overflow:hidden}
.kr i:after{content:"";position:absolute;inset:0;width:var(--w);background:var(--vr);border-radius:9px}
.perde{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:34}
/* arama */
.arama{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.3);display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.ara-k{width:min(680px,100%);background:var(--yuz);border-radius:16px;box-shadow:var(--gl);overflow:hidden;max-height:75vh;display:flex;flex-direction:column}
.ara-k input{border:0;outline:0;background:none;font-size:18px;padding:16px 18px;border-bottom:1px solid var(--cz);width:100%}
.ara-s{overflow-y:auto;padding:6px}
.ara-s button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px}
.ara-s button.on,.ara-s button:hover{background:var(--yuz2)}
.ara-s .t{font-size:15px;font-weight:500;display:block}
.ara-s .a{font-size:12.5px;color:var(--ik)}
.ara-ip{padding:14px 18px;color:var(--ik);font-size:14px}
/* kaynak ve tablo */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--ik);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px 8px;border-bottom:1px solid var(--cz);position:sticky;top:56px;background:var(--bg)}
.tbl td{padding:8px;border-bottom:1px solid var(--cz);vertical-align:top}
.tbl td.s{color:var(--ik);white-space:nowrap}
.sayilar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:0 0 18px}
.sayi{background:var(--yuz);border-radius:12px;box-shadow:inset 0 0 0 1px var(--cz);padding:12px 14px;text-align:left}
.sayi b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sayi span{font-size:13px;color:var(--ik)}
.sayi.on{box-shadow:inset 0 0 0 2px var(--vr)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form label{font-size:13px;color:var(--ik);display:flex;flex-direction:column;gap:4px}
.form input,.form select,.inp{height:38px;border-radius:10px;border:1px solid var(--cz);background:var(--bg);padding:0 10px;font-size:14.5px;width:100%}
pre.kod{background:var(--yuz2);border-radius:10px;padding:12px;font-size:12.5px;overflow:auto;white-space:pre-wrap}
.bilgi{font-size:13.5px;color:var(--ik)}
.daha{display:block;width:100%;height:44px;border-radius:12px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);font-weight:500;margin-top:12px;color:var(--ik)}
.daha:hover{color:var(--yaz)}
.bosluk{padding:40px 10px;text-align:center;color:var(--ik)}
.iskelet{height:70px;border-radius:12px;background:linear-gradient(90deg,var(--yuz) 0,var(--yuz2) 50%,var(--yuz) 100%);background-size:200% 100%;animation:isk 1.2s infinite;margin:8px 0}
@keyframes isk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--yaz);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:14px;z-index:60;box-shadow:var(--gl);display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast button{color:var(--vr);font-weight:600;filter:brightness(1.4)}
.alt-nav{display:none}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.kisayol{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;align-items:center}
/* yoğun görünüm */
.yogun .sat{padding:8px 10px}.yogun .sat-g{width:56px;height:42px}.yogun .sat-t{font-size:15px;-webkit-line-clamp:2}.yogun .sat-o{display:none}
.gorselsiz .sat-g:not(.p-g){display:none}
@media (max-width:1100px){.duzen{grid-template-columns:minmax(0,1fr)}.sag{position:static}.sag .masa-only{display:none}.ara-b{min-width:0}.ara-b .y{display:none}}
@media (max-width:860px){
 .sekme{display:none}.saat .y{display:none}
 .ust-i{height:52px}
 .ana{padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
 .panel{top:0;width:100%;z-index:45;animation:yuk .18s ease-out}
 @keyframes yuk{from{transform:translateY(30px);opacity:0}}
 .p-i{padding:14px 18px calc(80px + env(safe-area-inset-bottom))}
 .p-ust{margin:-14px -18px 10px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top))}
 .alt-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--yuz) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--cz);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .alt-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ik);padding:4px 0}
 .alt-nav a.on{color:var(--vr)}
 .alt-nav svg.i{width:22px;height:22px}
 .bas h1{font-size:23px}
 .sat-e{opacity:1}.sat-e .gz{display:none}
 .sat.buyuk .sat-t{font-size:20px}

function takipKur(){var k=(ayar.takip||[]).map(function(w){return w.trim()}).filter(function(w){return w.length>1});takipRx=k.length?new RegExp('('+k.map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+')','gi'):null}
takipKur();
function vurgu(t){var e=esc(duz(t));return takipRx?e.replace(takipRx,'<mark>$1</mark>'):e}
function takipEsles(t){if(!ayar.takip||!ayar.takip.length)return false;var f=fold(t);return ayar.takip.some(function(w){w=fold(w.trim());return w.length>1&&f.indexOf(w)>=0})}
function kaynakEt(c){var k=c.kaynaklar||c.k||[];if(!k.length&&c.og)k=c.og.map(function(o){return o.p});var ad=k.slice(0,2).join(', ');var ek=(c.ks||k.length)-2;return esc(ad)+(ek>0?' +'+ek:'')}

/* ---------- satır ---------- */
function satir(c,o){
  o=o||{};if(!c||gizli[c.id])return'';
  var tur=o.tur&&c.tur?'<span class="et '+(TUR_RENK[c.tur]||'')+'">'+TUR_AD[c.tur]+'</span>':'';
  var kb=c.kb>=3?'<b>'+c.kb+' kaynak</b>':'';
  var al=o.alanYok?'':((c.alanlar||c.a||[])[0]?'<span>'+ALAN[(c.alanlar||c.a)[0]]+'</span>':'');
  var yeni=oncekiZiyaret&&c.son>oncekiZiyaret&&!okundu[c.id]?'<i class="yeni-n" title="Son ziyaretten sonra"></i>':'';
  var img=c.i&&ayar.gorsel?'<img class="sat-g" loading="lazy" decoding="async" referrerpolicy="no-referrer" src="'+esc(c.i)+'" alt="" onerror="this.remove()">':'';
  var ozet=o.ozet&&c.s&&fold(c.s).indexOf(fold(c.t).slice(0,40))!==0?'<p class="sat-o">'+esc(ozetTemiz(c.s))+'</p>':'';
  var urun=o.urun&&c.urunAd?'<span>'+esc(c.urunAd)+'</span>':'';
  var dilE=o.dilEt&&c.dil?'<span class="et" title="'+(c.dil==='tr'?'Türkçe haber':'Yabancı dilde haber')+'">'+esc(String(c.dil).toUpperCase())+'</span>':'';
  return '<article class="sat'+(o.buyuk?' buyuk':'')+(o.sikis?' sikis':'')+(okundu[c.id]?' ok':'')+(S.sec===c.id?' secili':'')+'" data-id="'+c.id+'">'+yeni+img+
   '<div class="sat-m"><h3 class="sat-t">'+vurgu(c.t)+'</h3>'+ozet+
   '<div class="sat-a">'+tur+dilE+urun+kb+'<span class="kn">'+kaynakEt(c)+'</span><span>'+ago(c.son)+'</span>'+al+(durum[c.id]?'<span class="et vr">'+DURUM_AD[durum[c.id].d]+'</span>':'')+'</div></div>'+
   '<div class="sat-e"><button class="ik-b gz" data-act="gizle" data-id="'+c.id+'" aria-label="İlgisiz, gizle" title="İlgisiz (X)">'+ik('x')+'</button><button class="ik-b'+(kayit[c.id]?' on':'')+'" data-act="kaydet" data-id="'+c.id+'" aria-label="Kaydet" title="Kaydet (S)">'+ik('kayit')+'</button></div></article>';
}
function liste(arr,o){var h=arr.map(function(c){return satir(c,o)}).join('');return h?'<div class="liste">'+h+'</div>':'<div class="bosluk">Bu süzgeçte haber yok.</div>'}
function iskelet(n){var h='';for(var i=0;i<(n||4);i++)h+='<div class="iskelet"></div>';return h}
function trendCip(t){return '<button class="tr-c'+(t.firsat?' firsat':'')+'" data-act="trend" data-id="'+esc(t.id)+'" title="'+(t.firsat?'Akış kaynaklarında bu konuda haber az ya da yok':'')+'"><b>'+esc(t.t)+'</b><span>'+hacim(t.n)+' arama · '+ago(t.ilk)+'</span></button>'}
function spark(seri){if(!seri||seri.length<2)return'<svg class="spark"></svg>';var mx=Math.max.apply(null,seri.map(function(s){return s[1]}))||1,t0=seri[0][0],t1=seri[seri.length-1][0]||t0+1;var p=seri.map(function(s){return((s[0]-t0)/Math.max(1,t1-t0)*62+1).toFixed(1)+','+(22-s[1]/mx*20).toFixed(1)}).join(' ');return'<svg class="spark" viewBox="0 0 64 24"><polyline points="'+p+'"/></svg>'}
function trendSatir(t){if(!t)return'';return '<div class="tr-s'+(t.aktif?'':' son')+'" data-id="'+esc(t.id)+'"><div class="tr-h">'+hacim(t.n)+'<small>'+(t.aktif?'arama':'söndü')+'</small></div><div class="sat-m"><p class="tr-t">'+vurgu(t.t)+'</p><div class="sat-a"><span>'+agoUzun(t.ilk)+' başladı</span>'+(t.kume?'<span>'+t.kume.kb+' bağımsız kaynak</span>':'')+'<span>'+ALAN[t.alan]+'</span>'+(t.firsat?'<span class="et sc">Bizde '+(t.kume?'az':'yok')+'</span>':'')+(t.artis?'<span class="et ye">yükseliyor</span>':'')+'</div></div>'+spark(t.seri)+'</div>'}

/* ---------- sayfalar ---------- */
function sayfaBugun(){
  var o=D.ozet;if(!o)return iskelet(6);
  var sicak=(o.sicak[S.pen]||[]).filter(function(c){return!gizli[c.id]});
  var ilk=sicak[0],gerisi=sicak.slice(1,9);
  var gor={};sicak.slice(0,9).forEach(function(c){gor[c.id]=1});
  var yuk=(o.yukselen||[]).filter(function(c){return!gor[c.id]&&!gizli[c.id]}).slice(0,5);yuk.forEach(function(c){gor[c.id]=1});
  var son=(o.son||[]).filter(function(c){return!gor[c.id]&&!gizli[c.id]}).slice(0,24);
  var tr=(o.trend_tr||[]);
  var h='<div class="duzen"><div>';
  h+='<div class="bas"><div><h1>'+selam()+'</h1><p>'+o.toplam.haber.toLocaleString('tr')+' haber, '+o.toplam.cok_kaynakli+' çok kaynaklı konu · '+(D.ozet.saglik.kaynak||'')+' kaynak</p></div><span class="bos"></span><button class="dg" data-act="brif">'+ik('kopya')+'Günün özetini kopyala</button></div>';
  if(tr.length)h+='<section class="blok"><div class="blok-b"><h2>Google’da şimdi · Türkiye</h2><a href="#/trend">Tüm trendler</a></div><div class="tr-serit">'+tr.slice(0,12).map(function(t){t.id='tr:TR:'+fold(t.t);t.geo='TR';if(!TREG[t.id])TREG[t.id]=t;return trendCip(TREG[t.id])}).join('')+'</div></section>';
  h+='<section class="blok"><div class="blok-b"><h2>Öne çıkanlar</h2><span class="seg" style="margin-left:auto">'+[['1','1 sa'],['6','6 sa'],['24','24 sa']].map(function(p){return'<button data-act="pen" data-v="'+p[0]+'" class="'+(S.pen===p[0]?'on':'')+'">'+p[1]+'</button>'}).join('')+'</span></div>';
  h+=ilk?satir(ilk,{buyuk:true,ozet:true}):'<div class="bosluk">Bu pencerede en az iki bağımsız kaynağın yazdığı konu yok.</div>';
  h+=liste(gerisi)+'</section>';
  if(ayar.takip&&ayar.takip.length)h+='<section class="blok"><div class="blok-b"><h2>Takip ettiklerin</h2><button data-act="ayar">Düzenle</button></div><div id="takipK">'+takipHtml()+'</div></section>';
  if(yuk.length)h+='<section class="blok"><div class="blok-b"><h2>Yükselen</h2></div>'+liste(yuk,{sikis:true})+'</section>';
  h+='<section class="blok"><div class="blok-b"><h2>Son gelenler</h2><a href="#/akis/gundem">Tüm akış</a></div>'+liste(son,{sikis:true})+'</section>';
  h+='</div><aside class="sag">'+sagRay()+'</aside></div>';
  return h;
}
function selam(){var s=new Date().getHours();return s<5?'İyi geceler':s<11?'Günaydın':s<17?'İyi günler':s<22?'İyi akşamlar':'İyi geceler'}
function takipHtml(){
  var es=[],gor={};
  Object.keys(REG).forEach(function(id){var c=REG[id];if(c.son&&simdi()-c.son<48*3600&&takipEsles(c.t)&&!gizli[id]){es.push(c);gor[id]=1}});
  if(D.indeks)D.indeks.kayitlar.forEach(function(c){if(!gor[c.id]&&simdi()-c.son<48*3600&&takipEsles(c.t)&&!gizli[c.id]){es.push(reg(Object.assign({kaynaklar:c.k,alanlar:c.a},c)));gor[c.id]=1}});
  else indeksYukle().then(function(){var k=$('takipK');if(k)k.innerHTML=takipHtml()}).catch(function(){});
  es.sort(function(a,b){return b.son-a.son});
  return es.length?liste(es.slice(0,8),{sikis:true}):'<div class="bilgi">Son 48 saatte takip kelimelerinle eşleşen haber yok: '+esc(ayar.takip.join(', '))+'</div>';
}
function sagRay(){
  var o=D.ozet,h='';
  var tr=o.trend_tr||[];
  var fr=tr.filter(function(t){return t.firsat}).slice(0,6);
  if(fr.length)h+='<div class="kutu masa-only"><div class="blok-b"><h2>Aranıyor, yazan az</h2><a href="#/trend">Trendler</a></div><p class="bilgi" style="margin:-2px 0 4px">Google’da yükselen ama kaynaklarımızda haberi olmayan ya da tek kaynaklı aramalar.</p><div class="mini">'+fr.map(function(t){var id='tr:TR:'+fold(t.t);return'<button data-act="trend" data-id="'+esc(id)+'"><span class="n">'+hacim(t.n)+'</span><span class="t">'+esc(t.t)+'</span>'+(t.firsat?'<span class="et sc">yok</span>':'<span class="sag-n">'+(t.kume?t.kume.kb+' kaynak':'')+'</span>')+'</button>'}).join('')+'</div></div>';
  var g=o.guncelleme_ozet||[];
  if(g.length)h+='<div class="kutu"><div class="blok-b"><h2>Güncelleme radarı</h2><a href="#/guncelleme">Tümü</a></div><div class="mini">'+g.slice(0,7).map(function(u){return'<a href="#/guncelleme?u='+u.k+'"><span class="t"><b>'+esc(u.ad)+'</b> <span class="bilgi">'+esc(u.ilk)+'</span></span><span class="sag-n">'+(u.n24?u.n24+' yeni':ago(u.son))+'</span></a>'}).join('')+'</div></div>';
  var r=o.reels_ilk||[];
  if(r.length)h+='<div class="kutu"><div class="blok-b"><h2>Reels için</h2><a href="#/reels">Tümü</a></div><div class="mini">'+r.slice(0,5).map(function(x){return'<button data-act="detay" data-id="'+x.id+'"><span class="n">'+Math.round(x.puan)+' puan</span><span class="t">'+esc(x.t)+'</span></button>'}).join('')+'</div></div>';
  return h;
}
function sayfaAkis(){
  var a=S.alan,j=D.alan[a];
  var h='<div class="duzen tek"><div><div class="bas"><div><h1>'+ALAN[a]+'</h1><p>'+(D.ozet?D.ozet.sayim[a].toplam.toLocaleString('tr')+' konu · son 6 saatte '+D.ozet.sayim[a].son6:'')+'</p></div></div>';
  h+='<div class="cipler">'+ALANLAR.map(function(k){return'<a class="cip'+(k===a?' on':'')+'" href="#/akis/'+k+'">'+ALAN[k]+'</a>'}).join('')+'<a class="cip" href="#/guncelleme">Güncellemeler</a></div>';
  if(!j){alanYukle(a).then(ciz).catch(hata);return h+iskelet(6)+'</div></div>'}
  var alts={};j.kumeler.forEach(function(c){((c.alt||{})[a]||[]).forEach(function(x){alts[x]=(alts[x]||0)+1});(a==='gundem'?c.gundem_alt||[]:[]).forEach(function(x){alts[x]=(alts[x]||0)+1})});
  var altAd=(D.ozet&&D.ozet.alt_ad)||{};
  var altK=Object.keys(alts).sort(function(x,y){return alts[y]-alts[x]});
  var dZ=+S.zaman,dT=simdi(),dS={'':0,tr:0,yab:0};
  j.kumeler.forEach(function(c){if(gizli[c.id])return;if(dZ&&dT-c.son>dZ*3600)return;if(S.cok&&c.kb<3)return;if(S.alt&&((c.alt||{})[a]||[]).indexOf(S.alt)<0&&(c.gundem_alt||[]).indexOf(S.alt)<0)return;dS['']++;if((c.diller||[]).indexOf('tr')>=0)dS.tr++;else dS.yab++});
  h+='<div class="arac"><span class="seg">'+[['1','1 sa'],['6','6 sa'],['24','24 sa'],['72','3 gün'],['0','Hepsi']].map(function(z){return'<button data-act="zaman" data-v="'+z[0]+'" class="'+(S.zaman===z[0]?'on':'')+'">'+z[1]+'</button>'}).join('')+'</span>';
  h+='<button class="tg'+(S.cok?' on':'')+'" data-act="cok">3+ kaynak</button><span class="seg" role="group" aria-label="Dil"><button data-act="trf" data-v="" class="'+(!S.tr?'on':'')+'">Tüm diller <small>'+dS['']+'</small></button><button data-act="trf" data-v="tr" class="'+(S.tr==='tr'?'on':'')+'">Türkçe <small>'+dS.tr+'</small></button><button data-act="trf" data-v="yab" class="'+(S.tr==='yab'?'on':'')+'" title="Türkçe kaynağı olmayan konular">Yabancı <small>'+dS.yab+'</small></button></span>';
  if(altK.length)h+='<select data-act="alt" aria-label="Alt konu"><option value="">Tüm alt konular</option>'+altK.map(function(k){return'<option value="'+k+'"'+(S.alt===k?' selected':'')+'>'+esc(altAd[k]||k)+' ('+alts[k]+')</option>'}).join('')+'</select>';
  h+='<span class="bos"></span><span class="seg"><button data-act="sira" data-v="onem" class="'+(S.sira==='onem'?'on':'')+'">Önemli</button><button data-act="sira" data-v="yeni" class="'+(S.sira==='yeni'?'on':'')+'">En yeni</button></span></div>';
  var z=+S.zaman,t=simdi();
  var l=j.kumeler.filter(function(c){if(gizli[c.id])return false;if(z&&t-c.son>z*3600)return false;if(S.cok&&c.kb<3)return false;if(S.tr){var trv=(c.diller||[]).indexOf('tr')>=0;if(S.tr==='tr'?!trv:trv)return false}if(S.alt&&((c.alt||{})[a]||[]).indexOf(S.alt)<0&&(c.gundem_alt||[]).indexOf(S.alt)<0)return false;return true});
  if(S.sira==='yeni')l=l.slice().sort(function(x,y){return y.son-x.son});
  h+='<p class="bilgi" style="margin:4px 0 6px">'+l.length+' konu</p>'+liste(l.slice(0,S.adet),{ozet:!ayar.yogun,alanYok:true});
  if(l.length>S.adet)h+='<button class="daha" data-act="daha">Daha fazla göster ('+(l.length-S.adet)+')</button>';
  return h+'</div></div>';
}
function sayfaTrend(){
  var j=D.trend;
  if(!j){trendYukle().then(ciz).catch(hata);return iskelet(8)}
  var g=j.ulkeler[S.geo]?S.geo:'TR',u=j.ulkeler[g]||{trendler:[]};
  var h='<div class="duzen tek"><div><div class="bas"><div><h1>Google Trends</h1><p>'+esc(u.ad||g)+' · günlük arama trendleri, haberlerimizle eşleştirildi</p></div></div>';
  h+='<div class="cipler">'+j.sira.map(function(k){return'<button class="cip'+(k===g?' on':'')+'" data-act="geo" data-v="'+k+'">'+esc(j.ulkeler[k].ad)+' <small>'+j.ulkeler[k].trendler.filter(function(t){return t.aktif}).length+'</small></button>'}).join('')+'</div>';
  h+='<div class="arac"><span class="seg">'+[['hepsi','Hepsi'],['firsat','Bizde yok / az'],['var','Haberi olan']].map(function(f){return'<button data-act="tfil" data-v="'+f[0]+'" class="'+(S.tfil===f[0]?'on':'')+'">'+f[1]+'</button>'}).join('')+'</span></div>';
  var l=u.trendler.filter(function(t){return S.tfil==='hepsi'||(S.tfil==='firsat'?t.firsat:!t.firsat)});
  var ak=l.filter(function(t){return t.aktif}),sn=l.filter(function(t){return!t.aktif});
  h+=ak.length?'<div class="liste">'+ak.map(trendSatir).join('')+'</div>':'<div class="bosluk">Şu an bu süzgeçte trend yok.</div>';
  if(sn.length)h+='<div class="blok-b" style="margin-top:26px"><h2>Son 48 saatte sönenler</h2></div><div class="liste">'+sn.slice(0,20).map(trendSatir).join('')+'</div>';
  h+='<p class="bilgi" style="margin-top:20px">'+esc(j.not_)+'</p>';
  return h+'</div></div>';
}
function sayfaGunc(){
  var j=D.gunc;
  if(!j){guncYukle().then(ciz).catch(hata);return iskelet(8)}
  var h='<div class="duzen tek"><div><div class="bas"><div><h1>Güncelleme radarı</h1><p>İşletim sistemi, uygulama ve arayüz güncellemeleri · son '+j.gun+' gün</p></div></div>';
  // Dil süzgeci: '' hepsi, 'tr' Türkçe, 'yab' Türkçe olmayan. Ürün ve dil sayaçları süzgece göre hesaplanır.
  var dilUy=function(x){return!S.dil||(S.dil==='tr'?x.dil==='tr':x.dil!=='tr')};
  var dilSay={'':0,tr:0,yab:0};j.urunler.forEach(function(u){u.ogeler.forEach(function(x){if(S.tur&&x.tur!==S.tur)return;if(S.urun&&u.k!==S.urun)return;dilSay['']++;if(x.dil==='tr')dilSay.tr++;else dilSay.yab++})});
  var gec=Date.now()/1000;
  h+='<div class="cipler"><button class="cip'+(!S.urun?' on':'')+'" data-act="urun" data-v="">Tümü</button>'+j.urunler.map(function(u){var f=u.ogeler.filter(dilUy);if(S.dil&&!f.length&&S.urun!==u.k)return'';var n24=f.filter(function(x){return gec-x.son<86400}).length;return'<button class="cip'+(S.urun===u.k?' on':'')+'" data-act="urun" data-v="'+u.k+'">'+esc(u.ad)+' <small>'+(n24||f.length)+'</small></button>'}).join('')+'</div>';
  h+='<div class="arac"><span class="seg"><button data-act="tur" data-v="" class="'+(!S.tur?'on':'')+'">Hepsi</button>'+j.turler.map(function(t){return'<button data-act="tur" data-v="'+t.k+'" class="'+(S.tur===t.k?'on':'')+'">'+esc(t.ad)+'</button>'}).join('')+'</span>'+
    '<span class="seg" role="group" aria-label="Dil"><button data-act="dil" data-v="" class="'+(!S.dil?'on':'')+'">Tüm diller <small>'+dilSay['']+'</small></button><button data-act="dil" data-v="tr" class="'+(S.dil==='tr'?'on':'')+'">Türkçe <small>'+dilSay.tr+'</small></button><button data-act="dil" data-v="yab" class="'+(S.dil==='yab'?'on':'')+'">Yabancı <small>'+dilSay.yab+'</small></button></span></div>';
  var us=S.urun?j.urunler.filter(function(u){return u.k===S.urun}):j.urunler;
  var l=[];us.forEach(function(u){u.ogeler.forEach(function(x){if((!S.tur||x.tur===S.tur)&&dilUy(x))l.push(x)})});
  l.sort(function(a,b){return b.son-a.son});
  h+=liste(l.slice(0,S.adet),{tur:true,urun:!S.urun,ozet:!ayar.yogun,dilEt:true});
  if(l.length>S.adet)h+='<button class="daha" data-act="daha">Daha fazla göster ('+(l.length-S.adet)+')</button>';
  h+='<p class="bilgi" style="margin-top:20px">'+esc(j.not_)+'</p>';
  return h+'</div></div>';
}

}
function sayfaReels(){
  var j=D.reels;
  if(!j){reelsYukle().then(ciz).catch(hata);return iskelet(8)}
  var h='<div class="duzen tek"><div><div class="bas"><div><h1>Reels fikirleri</h1><p>10 ölçütlü editoryal puan · tahmindir, viral garantisi değildir</p></div></div>';

function sec(id){if(!id&&S._push){S._push=false;history.back();return}var y=location.hash.split('?')[0]||'#/'+S.sayfa,u=y+(id?'?k='+encodeURIComponent(id):'');if(id&&!S.sec&&matchMedia('(max-width:1100px)').matches){history.pushState(null,'',u);S._push=true}else history.replaceState(null,'',u);S.sec=id;if(id)okunduYap(id);ciz()}

function araAc(){S.ara=true;$('arama').hidden=false;var k=$('araK');k.value='';k.focus();araCiz();indeksYukle().then(araCiz).catch(function(){})}
function araKapat(){S.ara=false;$('arama').hidden=true}
function araSonuc(){
  var q=fold($('araK').value.trim());if(q.length<2)return[];var w=q.split(/\s+/),o=[],gor={};
  function uy(t){var f=fold(t);return w.every(function(x){return f.indexOf(x)>=0})}
  Object.keys(TREG).forEach(function(id){var t=TREG[id];if(uy(t.t))o.push({id:id,t:t.t,a:'Google Trends · '+hacim(t.n)+' arama',z:t.son||simdi()})});
  (D.indeks?D.indeks.kayitlar:[]).forEach(function(c){if(o.length<300&&uy(c.t+' '+(c.k||[]).join(' ')+' '+(c.e||[]).join(' '))){gor[c.id]=1;o.push({id:c.id,t:c.t,a:(c.k||[]).slice(0,2).join(', ')+' · '+ago(c.son)+(c.kb>=2?' · '+c.kb+' kaynak':''),z:c.son,r:c})}});
  Object.keys(REG).forEach(function(id){var c=REG[id];if(!gor[id]&&c.t&&uy(c.t))o.push({id:id,t:c.t,a:ago(c.son),z:c.son||0})});
  o.sort(function(a,b){return b.z-a.z});return o.slice(0,40);
}
function araCiz(){var r=araSonuc();S._ara=r;if(S.araSec>=r.length)S.araSec=0;var q=$('araK').value.trim();$('araS').innerHTML=q.length<2?'<div class="ara-ip">En az 2 harf yazın. Konu, kişi, marka, kaynak adı ya da trend arayabilirsiniz.'+(D.indeks?'':' Dizin yükleniyor…')+'</div>':r.length?r.map(function(x,i){return'<button class="'+(i===S.araSec?'on':'')+'" data-act="araSec" data-id="'+esc(x.id)+'"><span class="t">'+esc(x.t)+'</span><span class="a">'+esc(x.a)+'</span></button>'}).join(''):'<div class="ara-ip">Sonuç yok.</div>'}
function araAcSec(id){var x=(S._ara||[]).filter(function(y){return y.id===id})[0];if(x&&x.r)reg(Object.assign({kaynaklar:x.r.k,alanlar:x.r.a},x.r));araKapat();sec(id)}

/* ---------- yönlendirme ---------- */
function rota(){
  var h=location.hash.replace(/^#\/?/,''),p=h.split('?'),yol=p[0].split('/'),q=new URLSearchParams(p[1]||'');
  var s=yol[0]||'bugun';if(!SAYFALAR.some(function(x){return x[0]===s}))s='bugun';
  if(s!==S.sayfa){S.sayfa=s;S.adet=40;S.imlec=-1;S._sayfaDegisti=true}
  if(s==='akis'&&yol[1]&&ALAN[yol[1]]&&yol[1]!==S.alan){S.alan=yol[1];S.alt='';S.adet=40;S.imlec=-1;S._sayfaDegisti=true}
  if(s==='guncelleme'&&q.get('u')!=null)S.urun=q.get('u');
  if(s==='trend'&&yol[1])S.geo=yol[1].toUpperCase();
  var k=q.get('k');if(!k)S._push=false;S.sec=k||null;if(k)okunduYap(k);
  ciz();
}

  var t=e.target.closest('[data-act]');
  if(!t){var r=e.target.closest('[data-id]');if(r&&!e.target.closest('a[href],select,textarea,input')&&!r.closest('#arama')){sec(r.dataset.id)}return}

  else if(a==='sira'){S.sira=v;ciz()}else if(a==='daha'){S.adet+=40;ciz()}else if(a==='rdaha'){S.radet+=20;ciz()}

  else if(a==='urun'){S.urun=v;S.adet=40;history.replaceState(null,'','#/guncelleme'+(v?'?u='+v:''));ciz()}else if(a==='tur'){S.tur=v;S.adet=40;ciz()}else if(a==='dil'){S.dil=v;S.adet=40;ciz()}

  else if(a==='kfil'){S.kfil=v;ciz()}else if(a==='kdur'){S.kdur=S.kdur===v?'':v;ciz()}

  else if(a==='yogun'){ayar.yogun=!ayar.yogun;yaz('akis2-ayar',ayar);temaUygula();ayarAc()}
  else if(a==='gorsel'){ayar.gorsel=!ayar.gorsel;yaz('akis2-ayar',ayar);temaUygula();ayarAc()}

  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'){if(e.key==='Escape')e.target.blur();return}
