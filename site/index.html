<style>

.zc{position:relative;margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--cz)}.zc li{position:relative;padding:0 0 9px 0;font-size:12.5px}.zc li:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--vg2)}.zc time{color:var(--sk);font-size:11.5px;display:block}
.bt{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.btn{padding:5px 10px;border:1px solid var(--cz);border-radius:7px;font-weight:650;font-size:12px;background:var(--yz)}.btn:hover{border-color:var(--vg);color:var(--vg)}.btn.p{background:var(--vg);border-color:var(--vg);color:var(--bg)}.btn.p:hover{color:var(--bg);opacity:.9}.btn[aria-pressed=true]{border-color:var(--vg);color:var(--vg);background:var(--vgy)}

.say-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:0 0 12px}.say-k button{padding:9px 10px;border:1px solid var(--cz);border-radius:9px;background:var(--yz);text-align:left}.say-k button[aria-pressed=true]{border-color:var(--vg)}.say-k b{display:block;font-size:20px;color:var(--ink);line-height:1.1}.say-k span{font-size:11.5px;color:var(--sk);font-weight:600}

pre.kod{margin:6px 0;padding:9px 11px;border-radius:8px;background:var(--yz2);overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx);white-space:pre-wrap;word-break:break-all}

 .rk-ust{grid-template-columns:54px minmax(0,1fr)}.rk-ust .puan{grid-column:1/3;width:auto;height:auto;padding:6px;flex-direction:row;gap:8px;justify-content:flex-start;font-size:16px}.rk dl{grid-template-columns:1fr}.rk dt{margin-top:4px}.kb-bar{grid-template-columns:110px 1fr 28px}
 .sag{width:100vw}.ol{grid-template-columns:repeat(2,auto)}
}

席一场科学研讨会时表示，前沿人工智能模型正快速向生物学领域迈进，其能力很快将达到可能造成现实危害的临界点。这一变化虽然有望推动新药研发和医学创新，但同时也可能带来全新的安全挑战，引发业界对于生物安全风险的关注。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1109/7207967f7bad67c.jpg"},{"t":"微软CEO畅想2000万AI智能体与20万员工协同工作","l":"https://www.cnbeta.com.tw/articles/tech/1585554.htm","p":"cnBeta.COM","d":"2026-11-09T05:49:39+00:00","s":"微软首席执行官萨提亚·纳德拉（Satya Nadella）近日有关人工智能未来工作模式的一段访谈重新受到关注。他提出，微软未来可能拥有200万甚至2000万个AI智能体，与约20万名人类员工共同工作。这一设想恰好出现在微软向约6万名员工提供自愿离职方案不到两周之后，引发外界对人工智能是否正在改变微软人员结构的讨论。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/0122/a72bb8bd59c3697.webp"},{"t":"《时之笛》Switch 2重制版现身Windows原生移植 支持5K分辨率与最高240帧","l":"https://www.cnbeta.com.tw/articles/game/1585552.htm","p":"cnBeta.COM","d":"2026-11-09T05:48:32+00:00","s":"开发者tangerineturtle1发布名为NX2navi的Windows移植项目，将11月5日推出的Switch 2版《塞尔达传说：时之笛》通过静态重编译转换成x86-64原生程序，并使用Vulkan渲染。它不需要在游玩时模拟Switch 2硬件，而是在用户电脑上预先生成可运行的PC版本。 阅读全文","i":"https://www.techpowerup.com/img/Vw5ghI9h42eLBgWd.jpg"},{"t":"马斯克Terafab半导体工厂野心再升级 2032年目标月产70万片存储晶圆","l":"https://www.cnbeta.com.tw/articles/tech/1585550.htm","p":"cnBeta.COM","d":"2026-11-09T05:47:55+00:00","s":"埃隆·马斯克旗下的Terafab半导体制造项目正在进一步扩大规划规模。据Wccftech 11月8日报道，特斯拉与SpaceX组建的半导体合资企业Terafab，已经向半导体设备供应商透露，计划到2032年实现每月100万片晶圆的生产能力。其中，存储芯片将占据绝大部分，目标达到每月70万片，另外30万片用于生产逻辑芯片。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1109/6faf77ee001bdc9.jpg"},{"t":"华擎展示英特尔下一代至强平台主板：支持4TB DDR5内存 瞄准Diamond Rapids处理器","l":"https://www.cnbeta.com.tw/articles/tech/1585548.htm","p":"cnBeta.COM","d":"2026-11-09T05:47:27+00:00","s":"在近期举行的开放计算项目全球峰会（OCP Global Summit）上，服务器硬件厂商华擎Rack（ASRock Rack）首次展示了一款面向英特尔下一代Xeon 7“Diamond Rapids”处理器平台的早期服务器主板，为外界提前揭开了未来高性能数据中心平台的部分技术细节。 阅读全文","i":"https://www.techpowerup.com/img/ZT6D4x4lqBY6z41P.jpg"},{"t":"NVIDIA董事会调查或引发AI行业震荡 耶鲁大学教授预测黄仁勋去留概率约为五五开","l":"https://www.cnbeta.com.tw/articles/tech/1585546.htm","p":"cnBeta.COM","d":"2026-11-09T05:46:16+00:00","s":"NVIDIA首席执行官黄仁勋正面临职业生涯中一次极为严峻的考验。随着NVIDIA董事会宣布对其与涉嫌中国情报人员Alice Huang之间的关系启动独立调查，外界开始关注这场风波是否会最终导致这位全球最具影响力的科技企业领导人之一离职。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1030/fb8f3513e6cfe36.jpg"},{"t":"格陵兰冰盖曾大幅后退近百公里 远古暖期留下气候变化警示","l":"https://www.cnbeta.com.tw/articles/science/1585544.htm","p":"cnBeta.COM","d":"2026-11-09T05:43:34+00:00","s":"最新研究显示，大约41.6万年前，格陵兰岛西北部的冰盖曾发生显著退缩，其边缘位置比今天向内陆后退超过97公里。这一发现来自埋藏在冰层深处的古老沉积物，为科学家了解气候变暖如何影响格陵兰冰盖提供了重要线索。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1109/db8d3e27cfe0445.jpg"},{"t":"加拿大冰帽曾扩张约2000年 气候变暖或中断下一次冰期开端","l":"https://www.cnbeta.com.tw/articles/science/1585542.htm","p":"cnBeta.COM","d":"2026-11-09T05:43:07+00:00","s":"一项发表于《科学》的研究提出，地球下一次冰期可能在约2000年前已经开始萌芽，但人为造成的气候变暖后来逆转了北极地区冰层扩张。研究人员分析加拿大巴芬岛的巴恩斯冰帽后发现，它作为劳伦泰德冰盖最后一块残存部分，曾在经历长期萎缩后重新扩大，直到约1960年夏季气温上升，冰帽开始退缩。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1109/dd16ea7bdc0eab1.jpg"},{"t":"科学家从7000年前的皮革中提取出古代DNA 与现今西班牙山羊仍存在遗传联系","l":"https://www.cnbeta.com.tw/articles/science/1585540.htm","p":"cnBeta.COM","d":"2026-11-09T05:42:27+00:00","s":"一块保存了约7000年的古代山羊皮革，正在帮助科学家重新认识欧洲新石器时代的畜牧业和皮革加工技术。研究人员成功从这件出土于西班牙南部洞穴的古代皮革中提取出DNA，并发现它与今天生活在西班牙北部的某些山羊品种具有密切的遗传联系。这意味着，一条源自新石器时代的山羊遗传谱系，可能已经在伊比利亚半岛延续了数千年。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1109/cfcfba5f8e0b7ba.jpg"}]},"bloomberght":{"name":"Bloomberg HT","lang":"tr","cat":"eco","plat":"web","url":"https://www.bloomberght.com/rss","updated":"2026-11-09T06:11:40.035295+00:00","items":[{"t":"Ekonomi ve siyaset gündemi - 9 Kasım 2026","l":"https://www.bloomberght.com/ekonomi-ve-siyaset-gundemi-9-kasim-2026-3793901","d":"2026-11-09T05:51:29+00:00","s":"Ekonomi ve siyaset gündeminde günün öne çıkan gelişmeleri...","i":"https://geoim.bloomberght.com/l/2026/11/09/ver1794203511/3793901/jpg/1280x720"},{"t":"TESKOMB kefaletli krediler 900 milyar TL'yi aştı","l":"https://www.bloomberght.com/teskomb-kefaletli-krediler-900-milyar-tl-yi-asti-3793900","d":"2026-11-09T05:40:18+00:00","s":"Ticaret Bakanlığı'nın açıklamasına göre, TESKOMB kefaletiyle, Halkbank kaynaklı olarak ve Hazine'nin yüzde 50 maliyet sübvansiyonu ile esnaf ve function trendG(c){var p=c.yog;if(c.h6o===0&&c.h6>0)return '<span class="tr-ok" title="Önceki 6 saatte hiç haber yok">▲ yeni</span>';if(p>=30)return '<span class="tr-ok" title="Son 6 saat / önceki 6 saat">▲ +'+Math.min(p,500)+'%</span>';if(p<=-30)return '<span class="tr-dus" title="Son 6 saat / önceki 6 saat">▼ '+p+'%</span>';return ''}

function dAd(d){return (DURUMLAR.filter(function(x){return x[0]===d})[0]||[0,d])[1]}
function listeHtml(arr,adet){
  var h='',n=Math.min(arr.length,adet);
  for(var i=0;i<n;i++)h+=S.gor==='kart'?kart(arr[i],i):satir(arr[i],i);

/* ---- süzgeç ---- */
var PEN={'1':1,'6':6,'24':24,'72':72,'168':168};
function suz(arr,opt){
  opt=opt||{};var now=Date.now()/1000,q=S.q?fold(S.q).split(/\s+/).filter(Boolean):null;
  return arr.filter(function(c){
    if(!opt.gizliGoster&&gizli[c.id])return false;
    if(S.zaman!=='hepsi'){
      if(S.zaman==='ozel'){var b=S.zBas?Date.parse(S.zBas)/1000:0,s=S.zSon?Date.parse(S.zSon+'T23:59:59')/1000:1e12;if(c.son<b||c.son>s)return false}
      else if(now-c.son>PEN[S.zaman]*3600)return false}
    var dk=Object.keys(S.dil).filter(function(k){return S.dil[k]});
    if(dk.length){var ok=false;(c.diller||[c.dil]).forEach(function(d){var kk=['tr','en','zh','de','fr','ja','ko','ar'].indexOf(d)>=0?d:'x';if(S.dil[kk])ok=true});if(!ok)return false}
    if(S.alt&&!((c.alt&&c.alt[S.alanKey||S.alan]||[]).indexOf(S.alt)>=0||(c.gundem_alt||[]).indexOf(S.alt)>=0))return false;
    if(S.ek){var ek=[].concat(c.ul||[],c.ld||[],c.mk||[]);if(ek.indexOf(S.ek)<0)return false}
    if(S.kapsam==='tr'&&!((c.gundem_alt||[]).indexOf('turkiye')>=0||c.dil==='tr'))return false;
    if(S.kapsam==='dunya'&&(c.gundem_alt||[]).indexOf('turkiye')>=0)return false;
    if(S.kapsam==='federasyon'&&!/federasyon|TFF|TBF|TVF|UEFA|FIFA|NBA|ATP|WTA|Olympic|Olimpiyat/.test((c.kaynaklar||[]).join(' ')+' '+c.t))return false;
    if(q){var m=fold(c.t+' '+(c.s||'')+' '+(c.kaynaklar||[]).join(' '));for(var i=0;i<q.length;i++)if(m.indexOf(q[i])<0)return false}
    return true})}
