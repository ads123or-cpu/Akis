rong><\/p><p><img src=\"https://img.3dmgame.com/uploads/images/news/20261105/1793829139_421237_jpg_r.jpg"},{"t":"Monolith Soft出现在《塞尔达：时之笛 重制版》特别鸣谢名单","l":"https://www.cnbeta.com.tw/articles/game/1585120.htm","p":"cnBeta.COM","d":"2026-11-05T06:31:45+00:00","s":"《塞尔达：时之笛 重制版》公开片尾制作人员名单，Monolith Soft出现在“特别鸣谢”部分，确认该工作室曾协助本作开发。 阅读全文","i":"https://img.3dmgame.com/uploads/images/news/20261105/1793841513_761456_jpg_r.jpg"},{"t":"奥特曼回应内存分配言论争议：短暂改名“Ram Altman”自嘲","l":"https://www.cnbeta.com.tw/articles/funny/1585118.htm","p":"cnBeta.COM","d":"2026-11-05T06:25:45+00:00","s":"据《商业内幕》报道，OpenAI CEO萨姆·奥特曼(Sam Altman)曾短暂将自己在X上的名字改为“Ram Altman”。RAM指的是内存。此前，奥特曼就内存资源如何分配发表了争议性言论，被网友调侃对电脑内存的需求胃口太大。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/805a85326f50e48.png"},{"t":"Anthropic公布Claude生物学研究成果：首次解析新型蛋白质结构 3天实验缩短至90分钟","l":"https://www.cnbeta.com.tw/articles/tech/1585116.htm","p":"cnBeta.COM","d":"2026-11-05T06:24:00+00:00","s":"11月5日，Anthropic公布了旗下AI模型Claude在生物学研究领域的最新成果。该公司研究团队在Claude协助下，首次解析出在原核细胞中构建的Vault（穹窿颗粒）三维结构，并将原本需要约3天的蛋白质颗粒纯化流程缩短至90分钟。Claude还参与了蛋白质数据库检索、DNA构建设计和冷冻电镜数据分析等多个科研环节。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/69f06b1e841e2d3.png"},{"t":"离职消息公布仅一天 Claude Code负责人宣布加盟OpenAI","l":"https://www.cnbeta.com.tw/articles/tech/1585114.htm","p":"cnBeta.COM","d":"2026-11-05T06:22:40+00:00","s":"据《商业内幕》报道，Anthropic旗下AI编程工具Claude Code前产品负责人Cat Wu已宣布加入OpenAI，将领导其核心产品团队的产品管理工作。OpenAI已向该媒体确认这一消息。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/b281c34dadc3ae9.png"},{"t":"大一新生手机丢沙漠 埋了一个多月后意外被捡到","l":"https://www.cnbeta.com.tw/articles/tech/1585112.htm","p":"cnBeta.COM","d":"2026-11-05T06:21:55+00:00","s":"据“阿拉尔发布”公众号消息，塔里木大学一名大一新生的苹果手机遗失在沙漠中一个多月，近日意外被找回。 9月16日，这名大一新生随军训徒步队伍，在沙漠之门重走沙海老兵路时不慎丢失手机。手机内存储了近400G照片与视频，全是他入学前的珍贵回忆。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1105/34613696801f0cb.png"},{"t":"OpenAI自曝GPT-6 Astra异常行为：做安全研究时“暗中少干活” 任务完成度低近四成","l":"https://www.cnbeta.com.tw/articles/tech/1585110.htm","p":"cnBeta.COM","d":"2026-11-0
