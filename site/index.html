<style>

.zc{position:relative;margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--cz)}.zc li{position:relative;padding:0 0 9px 0;font-size:12.5px}.zc li:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--vg2)}.zc time{color:var(--sk);font-size:11.5px;display:block}
.bt{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.btn{padding:5px 10px;border:1px solid var(--cz);border-radius:7px;font-weight:650;font-size:12px;background:var(--yz)}.btn:hover{border-color:var(--vg);color:var(--vg)}.btn.p{background:var(--vg);border-color:var(--vg);color:var(--bg)}.btn.p:hover{color:var(--bg);opacity:.9}.btn[aria-pressed=true]{border-color:var(--vg);color:var(--vg);background:var(--vgy)}

.say-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:0 0 12px}.say-k button{padding:9px 10px;border:1px solid var(--cz);border-radius:9px;background:var(--yz);text-align:left}.say-k button[aria-pressed=true]{border-color:var(--vg)}.say-k b{display:block;font-size:20px;color:var(--ink);line-height:1.1}.say-k span{font-size:11.5px;color:var(--sk);font-weight:600}

pre.kod{margin:6px 0;padding:9px 11px;border-radius:8px;background:var(--yz2);overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx);white-space:pre-wrap;word-break:break-all}

 .rk-ust{grid-template-columns:54px minmax(0,1fr)}.rk-ust .puan{grid-column:1/3;width:auto;height:auto;padding:6px;flex-direction:row;gap:8px;justify-content:flex-start;font-size:16px}.rk dl{grid-template-columns:1fr}.rk dt{margin-top:4px}.kb-bar{grid-template-columns:110px 1fr 28px}
 .sag{width:100vw}.ol{grid-template-columns:repeat(2,auto)}
}

"tech","plat":"web","url":"https://rss.cnbeta.com.tw/","updated":"2026-11-10T05:42:40.471871+00:00","items":[{"t":"机器人首次在太空自主搭建结构 DARPA验证轨道制造关键技术","l":"https://www.cnbeta.com.tw/articles/science/1585694.htm","p":"cnBeta.COM","d":"2026-11-10T05:41:08+00:00","s":"在人类迈向更大规模太空基础设施建设的道路上，一项重要里程碑近日诞生。由美国加州理工学院研发、美国国防高级研究计划局（DARPA）资助的一台机器人，成功在轨道上完成结构组装任务，被研究团队称为人类首次实现太空中的自主结构建造。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/7afc4fcfe4587d5.webp"},{"t":"澳航空客A350-1000ULR创商业航空新纪录 连续飞行24小时24分钟 航程2.3万公里","l":"https://www.cnbeta.com.tw/articles/tech/1585692.htm","p":"cnBeta.COM","d":"2026-11-10T05:39:11+00:00","s":"澳洲航空（Qantas）的一架空客A350-1000ULR超远程客机，正式创造了商业航空史上最长的不间断飞行距离纪录。从澳大利亚墨尔本起飞后，飞机连续飞行24小时24分钟，最终抵达法国图卢兹，航程达到23155公里。这一纪录已经获得国际航空联合会（FAI）核实，并被吉尼斯世界纪录收录。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/ef7a0f7068d322c.webp"},{"t":"范德堡大学疑遭勒索软件攻击 百万级敏感信息或面临泄露风险","l":"https://www.cnbeta.com.tw/articles/tech/1585690.htm","p":"cnBeta.COM","d":"2026-11-10T05:37:58+00:00","s":"美国知名高校范德堡大学近日遭遇一起严重网络安全事件。校方表示，目前正在应对一场仍在进行中的网络安全事故，该事件可能波及学校设备、内部系统以及多项云服务。为降低风险，学校已紧急要求学生、教师及其他工作人员关闭学校配发的设备，断开校园无线网络连接，并密切关注设备是否出现异常情况。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/a223b41cf3fa4b9.webp"},{"t":"苹果发布iOS 27.2.1版更新修复多个漏洞 修复程序也移植到iOS 26.x和iOS 18.x","l":"https://www.cnbeta.com.tw/articles/tech/1585688.htm","p":"cnBeta.COM","d":"2026-11-10T05:33:24+00:00","s":"苹果日前发布 iOS 27.2.1 版更新，此次更新主要是修复已知问题和安全漏洞，其中值得关注的是涉及 iMessage 群聊和蓝牙配对中的安全漏洞，这些漏洞可能会带来隐私风险。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/6345d2901f3da07.jpg"},{"t":"微软改进Windows Hello登录 人脸识别还在转圈时也能直接PIN解锁","l":"https://www.cnbeta.com.tw/articles/tech/1585686.htm","p":"cnBeta.COM","d":"2026-11-10T05:29:47+00:00","s":"微软正在改进 Windows Hello 登录体验：当电脑尝试进行人脸或指纹识别时，用户也可以直接输入已经设置的 PIN 码进行解锁，不必等待识别结束后再手动切换登录方式。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/e517eff23e0fb49.png"},{"t":"Google Gemini关联邮箱和云端硬盘后 部分内容会被人工审核","l":"https://www.cnbeta.com.tw/articles/tech/1585684.htm","p":"cnBeta.COM","d":
