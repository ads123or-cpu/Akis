<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Akış</title>
<meta name="description" content="Akış: haber merkezi, Google Trends, güncelleme radarı ve Reels konu keşfi">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6b66'/%3E%3Cpath d='M8 20c4-8 8 4 16-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Akış 5 renk sistemi (2026-11-18): sıcak kâğıt (açık), mürekkep (koyu), gece (OLED siyah). Vurgu rengi --vr ayrı seçilir (data-vurgu); --vr-z her temada yüzeyle karıştırılır. */
:root{--bg:#f5f2ec;--yuz:#fffdf8;--yuz2:#ede8de;--yaz:#1b1a16;--ik:#56524a;--ik2:#69645a;--cz:#e1dacd;--sc:#b3361f;--sc-z:#f8e4de;--ye:#16764a;--ye-z:#e0f1e7;--sa:#875800;--sa-z:#f6ead2;--gl:0 1px 2px rgba(40,30,10,.05),0 8px 24px rgba(40,30,10,.07);--vr:var(--vr-a);color-scheme:light;--vr-a:#0b6b66;--vr-k:#4cc9bd;--vr-z:color-mix(in oklab,var(--vr) 13%,var(--yuz));--vr-y:#fff;--r:12px}
:root[data-vurgu=kehribar]{--vr-a:#a34a04;--vr-k:#f5a524}:root[data-vurgu=mor]{--vr-a:#5546d6;--vr-k:#a69cff}:root[data-vurgu=gul]{--vr-a:#b3195a;--vr-k:#f472b6}:root[data-vurgu=klasik]{--vr-a:#2a5fd8;--vr-k:#7aa2ff}
:root[data-tema=koyu],:root[data-tema=gece]{--bg:#0f1214;--yuz:#161a1d;--yuz2:#1e2327;--yaz:#ebe8e1;--ik:#a8a49b;--ik2:#8f8b82;--cz:#293035;--sc:#ff8a70;--sc-z:#3a201a;--ye:#5ad197;--ye-z:#14301f;--sa:#f0b84e;--sa-z:#33291a;--gl:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4);--vr:var(--vr-k);--vr-y:#04201d;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-tema=acik]){--bg:#0f1214;--yuz:#161a1d;--yuz2:#1e2327;--yaz:#ebe8e1;--ik:#a8a49b;--ik2:#8f8b82;--cz:#293035;--sc:#ff8a70;--sc-z:#3a201a;--ye:#5ad197;--ye-z:#14301f;--sa:#f0b84e;--sa-z:#33291a;--gl:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4);--vr:var(--vr-k);--vr-y:#04201d;color-scheme:dark}}
:root[data-tema=gece]{--bg:#000;--yuz:#0c0d0e;--yuz2:#16181a;--cz:#23272a}
/* alan renkleri: listede küçük nokta ve sol menüde işaret (renk tek başına bilgi taşımaz, ad her zaman yazılı) */
:root{--a-gundem:#c2410c;--a-adana:#b45309;--a-tekno:#0369a1;--a-yz:#7c3aed;--a-siyaset:#be123c;--a-spor:#15803d;--a-ekonomi:#a16207;--a-bilim:#0e7490;--a-siber:#4d7c0f;--a-oto:#475569;--a-oyun:#c026d3;--a-eglence:#db2777}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--yaz);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--vr);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
/* üst çubuk */
.ust{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--cz)}
.ust-i{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:6px;height:56px;padding:0 16px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:10px}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--vr);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;inset:6px 4px;border-bottom:2.5px solid #fff;border-radius:0 0 50% 50%;transform:rotate(-12deg)}
.sekme{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.sekme::-webkit-scrollbar{display:none}
.diger{position:relative;flex:none}
.diger summary{list-style:none;cursor:pointer;padding:7px 11px;border-radius:9px;font-size:14.5px;color:var(--ik);font-weight:500;white-space:nowrap}
.diger summary::-webkit-details-marker{display:none}
.diger summary:after{content:"▾";margin-left:5px;font-size:11px}
.diger summary:hover,.diger[open] summary{color:var(--yaz);background:var(--yuz2)}
.diger summary.on{color:var(--yaz);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz)}
.dg-l{position:absolute;top:calc(100% + 6px);left:0;min-width:180px;background:var(--yuz);border-radius:12px;box-shadow:var(--gl),inset 0 0 0 1px var(--cz);padding:6px;z-index:45;display:flex;flex-direction:column}
.dg-l a{padding:9px 12px;border-radius:8px;font-size:14.5px}.dg-l a:hover,.dg-l a.on{background:var(--yuz2)}
@media (max-width:1280px){.saat .y{display:none}.ara-b{min-width:0}.ara-b .y{display:none}}
.sekme a{padding:7px 11px;border-radius:9px;font-size:14.5px;color:var(--ik);font-weight:500;white-space:nowrap}
.sekme a:hover{color:var(--yaz);background:var(--yuz2)}
.sekme a.on{color:var(--yaz);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz)}
.bos{flex:1}
.ara-b{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border-radius:10px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);color:var(--ik);font-size:14px;min-width:200px}
.ara-b kbd,.kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--cz);border-radius:5px;padding:0 5px;color:var(--ik2);margin-left:auto;background:var(--bg)}
.ik-b{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ik)}
.ik-b:hover{background:var(--yuz2);color:var(--yaz)}
.saat{font-size:13px;color:var(--ik);display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap}
.nokta{width:7px;height:7px;border-radius:50%;background:var(--ye);display:inline-block;flex:none}
.nokta.sa{background:var(--sa)}.nokta.sc{background:var(--sc)}
.yeni-veri{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:40;background:var(--vr);color:var(--vr-y);border-radius:99px;padding:8px 16px;font-size:14px;font-weight:600;box-shadow:var(--gl)}
/* yerleşim */
.ana{max-width:1240px;margin:0 auto;padding:22px 16px 110px}
.duzen{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.duzen.tek{grid-template-columns:minmax(0,760px);justify-content:center}
.sag{position:sticky;top:78px;display:flex;flex-direction:column;gap:22px}
.bas{display:flex;align-items:flex-end;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.bas h1{font-size:26px;line-height:1.15;letter-spacing:-.025em;margin:0;font-weight:700}
.bas p{margin:2px 0 0;color:var(--ik);font-size:14px}
.blok{margin:0 0 30px}
.blok-b{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.blok-b h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ik);margin:0;font-weight:600}
.blok-b a,.blok-b button{margin-left:auto;font-size:13.5px;color:var(--vr);font-weight:500}
.kutu{background:var(--yuz);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--cz);padding:14px 16px}
.kutu h2{margin:0 0 8px}
/* satır */
.liste{display:flex;flex-direction:column}
.sat{display:flex;gap:14px;padding:13px 10px;margin:0 -10px;border-radius:12px;cursor:pointer;position:relative;align-items:flex-start}
.sat+.sat{box-shadow:0 -1px 0 var(--cz)}
.sat:hover,.sat.imlec{background:var(--yuz)}
.sat:hover+.sat,.sat.imlec+.sat{box-shadow:none}
.sat.secili{background:var(--vr-z)}
.sat-g{width:76px;height:56px;border-radius:9px;object-fit:cover;flex:none;background:var(--yuz2)}
.sat-m{flex:1;min-width:0}
.sat-t{font-size:16.5px;line-height:1.38;font-weight:600;margin:0;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sat.ok .sat-t{color:var(--ik);font-weight:500}
.sat-ust{margin:0 0 3px}.sat-t a{color:inherit}
.sat-a{font-size:13px;color:var(--ik);margin-top:4px;display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
.sat-a>*+*:before{content:"·";margin-right:6px;color:var(--ik2)}
.sat-a b{color:var(--yaz);font-weight:600}
.sat-o{font-size:14px;color:var(--ik);margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yeni-n{width:7px;height:7px;border-radius:50%;background:var(--vr);position:absolute;left:-3px;top:22px}
.sat-e{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.sat:hover .sat-e,.sat.imlec .sat-e,.sat:focus-within .sat-e,.sat-e .on{opacity:1}
.rk:focus-visible{outline:2px solid var(--vr);outline-offset:0}
.sat-e .on{color:var(--vr)}
.sat-e .ik-b{width:32px;height:32px}
.sat.buyuk .sat-g{width:100%;height:auto;aspect-ratio:16/7;max-height:340px;border-radius:12px;margin-bottom:12px}
.sat.buyuk{flex-direction:column;gap:0}
.sat.buyuk .sat-t{font-size:22px;line-height:1.25;letter-spacing:-.02em;-webkit-line-clamp:4}
.sat.buyuk .sat-e{position:absolute;right:10px;bottom:12px}
.sat.sikis .sat-t{font-size:15px;-webkit-line-clamp:2}
.sat.sikis{padding:9px 10px}
mark{background:var(--sa-z);color:inherit;border-radius:3px;padding:0 2px}
.et{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--yuz2);color:var(--ik);white-space:nowrap}
.et.vr{background:var(--vr-z);color:var(--vr)}.et.sc{background:var(--sc-z);color:var(--sc)}.et.ye{background:var(--ye-z);color:var(--ye)}.et.sa{background:var(--sa-z);color:var(--sa)}
.sat-a .et:before{display:none}
/* çipler */
.cipler{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin:0 0 6px;-webkit-overflow-scrolling:touch}
.cipler::-webkit-scrollbar{display:none}
.cip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);font-size:14px;color:var(--yaz);white-space:nowrap}
.cip:hover{box-shadow:inset 0 0 0 1px var(--ik2)}
.cip.on{background:var(--yaz);color:var(--bg);box-shadow:none}
.cip small{color:var(--ik);font-size:12px}
.cip.on small{color:inherit;opacity:.7}
.seg{display:inline-flex;background:var(--yuz2);border-radius:10px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 11px;border-radius:8px;font-size:13.5px;color:var(--ik);white-space:nowrap}
.seg button.on{background:var(--yuz);color:var(--yaz);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.arac{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.arac select{height:32px;border-radius:9px;border:1px solid var(--cz);background:var(--yuz);padding:0 8px;font-size:14px}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ik);height:32px;padding:0 10px;border-radius:9px}
.tg.on{color:var(--vr);background:var(--vr-z)}
/* trend */
.tr-serit{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.tr-serit::-webkit-scrollbar{display:none}
.tr-c{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 13px;border-radius:12px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);text-align:left;max-width:220px}
.tr-c b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.tr-c span{font-size:12.5px;color:var(--ik)}
.tr-c.firsat{box-shadow:inset 0 0 0 1px var(--sc-z),inset 3px 0 0 var(--sc)}
.tr-s{display:flex;gap:14px;align-items:center;padding:12px 10px;margin:0 -10px;border-radius:12px;cursor:pointer}
.tr-s+.tr-s{box-shadow:0 -1px 0 var(--cz)}
.tr-s:hover,.tr-s.imlec{background:var(--yuz)}
.tr-s:hover+.tr-s{box-shadow:none}
.tr-h{width:72px;flex:none;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.tr-h small{display:block;font-size:11.5px;color:var(--ik);font-weight:500}
.tr-s.son .tr-t,.tr-s.son .tr-h{color:var(--ik)}
.tr-t{font-size:16.5px;font-weight:600;margin:0}
.spark{width:64px;height:24px;flex:none}
.spark polyline{fill:none;stroke:var(--vr);stroke-width:1.6}
.mini{display:flex;flex-direction:column}
.mini a,.mini button{display:flex;gap:10px;align-items:baseline;padding:7px 0;text-align:left;font-size:14.5px;width:100%}
.mini a+a,.mini button+button{border-top:1px solid var(--cz)}
.mini .n{color:var(--ik);font-size:12.5px;font-variant-numeric:tabular-nums;width:54px;flex:none}
.mini .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .sag-n{color:var(--ik);font-size:12.5px;flex:none}
/* reels */
.rk{display:flex;gap:16px;padding:16px;border-radius:14px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);cursor:pointer;margin-bottom:12px}
.rk:hover,.rk.imlec{box-shadow:inset 0 0 0 1px var(--ik2)}
.rk-p{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:17px;background:conic-gradient(var(--vr) calc(var(--p)*1%),var(--yuz2) 0);position:relative}
.rk-p span{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;background:var(--yuz);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rk h3{margin:0;font-size:17px;line-height:1.35;letter-spacing:-.01em}
.rk p{margin:6px 0 0;font-size:14.5px;color:var(--ik)}
.hook{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:9px;background:var(--yuz2);font-size:14.5px;margin-top:6px}
.hook span{flex:1}
/* detay paneli */
.panel{position:fixed;top:56px;right:0;bottom:0;width:min(520px,100%);background:var(--yuz);box-shadow:-1px 0 0 var(--cz),var(--gl);z-index:35;overflow-y:auto;overscroll-behavior:contain;animation:gir .16s ease-out}
@keyframes gir{from{transform:translateX(24px);opacity:0}}
.p-i{padding:18px 22px 60px}
.p-ust{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--yuz);padding:10px 22px;margin:-18px -22px 10px;border-bottom:1px solid var(--cz);z-index:2;font-size:13px;color:var(--ik)}
.p-ust .bos{flex:1}
.panel h2.p-t{font-size:23px;line-height:1.25;letter-spacing:-.02em;margin:6px 0 10px}
.p-g{width:100%;border-radius:12px;aspect-ratio:16/9;object-fit:cover;background:var(--yuz2);margin:4px 0 10px}
.p-o{color:var(--ik);margin:0 0 14px;font-size:15.5px}
.eylem{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.dg{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:10px;background:var(--yuz2);font-size:14px;font-weight:500;white-space:nowrap}
.dg:hover{filter:brightness(.96)}
.dg.ana-d{background:var(--vr);color:var(--vr-y)}
.dg.on{background:var(--vr-z);color:var(--vr)}
.p-b{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ik);margin:20px 0 6px;font-weight:600}
.kay a{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--cz);font-size:14.5px;align-items:baseline}
.kay a:first-child{border-top:0}
.kay a:hover .kt{color:var(--vr)}
.kay .kp{font-weight:600;flex:none;width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kay .kt{flex:1;min-width:0}
.kay .kz{color:var(--ik);font-size:12.5px;flex:none}
.not{width:100%;min-height:84px;border-radius:10px;border:1px solid var(--cz);background:var(--bg);padding:10px 12px;resize:vertical;font-size:14.5px}
.p-sel{height:36px;border-radius:10px;border:1px solid var(--cz);background:var(--bg);padding:0 10px;font-size:14px}
.rnot{background:var(--vr-z);border-radius:12px;padding:12px 14px;font-size:14.5px}
.rnot b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--vr);margin:8px 0 2px}
.rnot b:first-child{margin-top:0}
.kr{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.kr i{height:6px;border-radius:9px;background:var(--yuz2);position:relative;overflow:hidden}
.kr i:after{content:"";position:absolute;inset:0;width:var(--w);background:var(--vr);border-radius:9px}
.perde{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:34}
/* 3 sütun (≥1240 px, liste sayfaları): sol süzgeç · orta akış · sağda kalıcı ayrıntı sütunu */
.akis3{display:grid;grid-template-columns:190px minmax(0,720px);gap:28px;justify-content:center;align-items:start}
.sol-s{position:sticky;top:78px;display:flex;flex-direction:column;gap:2px}
.sol-s a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:9px;font-size:14.5px;color:var(--ik);font-weight:500}
.sol-s a:hover{background:var(--yuz2);color:var(--yaz)}
.sol-s a.on{background:var(--yuz);color:var(--yaz);box-shadow:inset 0 0 0 1px var(--cz)}
.sol-s small{font-size:12px;color:var(--ik2);font-variant-numeric:tabular-nums}
.sol-s .ayr{height:1px;background:var(--cz);margin:8px 4px}
@media (min-width:1240px){
 body.uc .ana{max-width:none;margin:0 420px 0 0}
 body.uc .panel{display:block!important;width:420px;animation:none;box-shadow:-1px 0 0 var(--cz);z-index:20}
 body.uc .perde{display:none!important}
 body.uc .panel .p-kapat-yok{display:none}
}
.p-bos{color:var(--ik);font-size:14.5px;padding:40px 8px}
.p-bos h2{font-size:17px;color:var(--yaz);margin:0 0 8px}
.p-bos p{margin:0 0 12px}
.menu{position:fixed;z-index:70;min-width:230px;background:var(--yuz);border-radius:12px;box-shadow:var(--gl),inset 0 0 0 1px var(--cz);padding:6px;display:flex;flex-direction:column}
.menu button,.menu a{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 12px;border-radius:8px;font-size:14.5px;color:var(--yaz)}
.menu button:hover,.menu a:hover,.menu button:focus-visible,.menu a:focus-visible{background:var(--yuz2);outline:0}
/* arama */
.arama{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.3);display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.ara-k{width:min(680px,100%);background:var(--yuz);border-radius:16px;box-shadow:var(--gl);overflow:hidden;max-height:75vh;display:flex;flex-direction:column}
.ara-k input{border:0;outline:0;background:none;font-size:18px;padding:16px 18px;border-bottom:1px solid var(--cz);width:100%}
.ara-s{overflow-y:auto;padding:6px}
.ara-s button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px}
.ara-s button.on,.ara-s button:hover{background:var(--yuz2)}
.ara-s .t{font-size:15px;font-weight:500;display:block}
.ara-s .a{font-size:12.5px;color:var(--ik)}

plat":"web","url":"https://www.thelec.kr/rss/allArticle.xml","updated":"2026-11-18T03:11:46.912560+00:00","items":[{"t":"엠플러스, 삼성SDI 혁신기술 경진대회 대상 수상","l":"https://www.thelec.kr/news/articleView.html?idxno=65596","d":"2026-11-18T03:11:58.557650+00:00","s":"엠플러스가 삼성SDI 혁신기술 경진대회에서 각형 배터리 캔캡 레이저 용접 기술로 대상을 수상했다.엠플러스는 18일 삼성SDI가 주최한 'S-NOVA'에서 최고상을 받았다고 밝혔다. S-NOVA는 삼성SDI가 협력사의 기술 혁신성과 양산 적용 가능성을 평가하는 행사다. 지난달 27일 기흥사업장에서 열린 대회에는 최종 4개사가 본선에 진출했다.엠플러스는 고정된","i":"https://cdn.thelec.kr/news/photo/202611/65596_51693_5459.jpg"},{"t":"LG엔솔, 나트륨 배터리와 반도체 변압기 결합","l":"https://www.thelec.kr/news/articleView.html?idxno=65595","d":"2026-11-18T03:11:58.557650+00:00","s":"LG에너지솔루션이 나트륨이온(소듐이온) 배터리와 반도체 변압기(SST)를 결합한 차세대 전력 공급 솔루션을 공개했다. 인공지능(AI) 데이터센터와 전력망의 급격한 부하 변화에도 안정적으로 전력을 공급하기 위한 기술이다.LG에너지솔루션은 17~19일 미국 라스베이거스에서 열리는 'RE+ 2026'에서 소듐이온 배터리 기반 전력 시스템을 선보였다.SST는 전력","i":"https://cdn.thelec.kr/news/photo/202611/65595_51690_1917.jpg"},{"t":"삼성전기, 엔비디아와 MLCC 협력","l":"https://www.thelec.kr/news/articleView.html?idxno=65583","d":"2026-11-18T03:11:58.557650+00:00","s":"삼성전기가 엔비디아와의 협력 범위를 반도체 패키지기판에서 적층세라믹커패시터(MLCC)로 넓힌다. 엔비디아는 삼성전기의 세종·부산 사업장에 패키지기판 전용 공장 증설 자금을 지원하기로 한 데 이어 추가 자금 지원도 검토하기로 했다. 삼성전기는 엔비디아와 고신뢰성 MLCC 협력을 추진한다고 18일 밝혔다. 지난달 인공지능(AI) 반도체용 패키지기판 공급을 위한","i":"https://cdn.thelec.kr/news/photo/202611/65583_51679_356.png"},{"t":"젠슨 황 공백 없었다…엔비디아 3분기 매출 시장 전망 상회","l":"https://www.thelec.kr/news/articleView.html?idxno=65581","d":"2026-11-18T03:11:58.557650+00:00","s":"젠슨 황 최고경영자(CEO)가 사임한 가운데 엔비디아가 실적 성장세를 이어갔다. 17일(현지시간) 2027회계연도 3분기 실적을 발표에서 반회계기준(GAAP) 매출 1158억달러(약 154조6509억원), 영업이익 775억2000만달러(약 103조5270억원)를 기록했다고 밝혔다. 전년 동기 대비 매출은 103%, 영업이익은 115% 상승했다.희석 주당순이","i":"https://cdn.thelec.kr/news/photo/202611/65581_51678_2039.jpg"},{"t":"지슨, AI 부정행위 탐지 SW 내달 출시...전용 장비는 내년 상반기 공개","l":"https://www.thelec.kr/news/articleView.html?idxno=65592","d":"2026-11-18T03:11:58.557650+00:00","s":"지슨이 기존 전파탐지장비에 적용할 수 있는 인공지능(AI) 부정행위를 잡는 소프트웨어를 내달 출시한다고 18일 밝혔다.기존 지슨 장비에 이 소프트웨어를 적용하면 평균 45평 공간에서 발생하는 블루투스, 와이파이(Wi-Fi), 이동통신 전파를 감지할 수 있다. 감독관은 해당 장비를 들고 시험장 곳곳을 이동하며 의심 전파를 탐지하고 추적 가능하다.지슨은 새로 ","i":"https://cdn.thelec.kr/news/photo/202611/65592_51688_1020.jpg"},{"t":"최태원 SK 회장, '한일 경제협력 빅텐트' 출범","l":"https://www.thelec.kr/news/articleView.html?idxno=65584","d":"2026-11-18T03:11:58.557650+00:00","s":"최태원 SK그룹 회장이 지난 6월 일본 도쿄 닛케이포럼에서 제안한 한일 협력 플랫폼 '빅텐트'가 5개월 만에 출범했다. 양국 경제단체와 연구기관이 쌓아온 협력 성과를 공유하고 공동 과제를 발굴한다. 최종현학술원은 일본 요미우리신문과 '한일 신시대 전략 플랫폼'을 설립하고 공식 웹사이트를 개설했다고 18일 밝혔다. 최종현학술원 이사장인 최 회장과 야마구치 도","i":"https://cdn.thelec.kr/news/photo/202611/65584_51680_5422.jpg"},{"t":"현대로템, 서산 시험센터 증축","l":"https://www.thelec.kr/news/articleView.html?idxno=65593","d":"2026-11-18T03:11:58.557650+00:00","s":"현대로템이 항공우주추진시험센터 증축으로 항공우주 엔진 기술 역량을 강화한다. 현대로템은 지난 17일 충남 서산 항공우주추진시험센터에서 제2시험동 준공식을 진행했다고 18일 밝혔다. 제2시험동은 항공우주 엔진의 안정적인 연소 시험이 가능한 추진시험설비, 개별 구성품의 성능을 평가하는 성능시험실 등을 갖췄다. 기존의 제1시험동과 함께 극초음속 엔진, 재사용 우","i":"https://cdn.thelec.kr/news/photo/202611/65593_51689_171.jpg"},{"t":"삼성SDI, 통합형 ESS 솔루션에 25년 장기 보증 제공","l":"https://www.thelec.kr/news/articleView.html?idxno=65591","d":"2026-11-18T03:11:58.557650+00:00","s":"삼성SDI가 에너지저장장치(ESS)용 배터리와 전력변환장치, 운영시스템을 통합 공급하는 솔루션에 25년 장기 보증을 제공한다. 장기간 운영하는 ESS의 유지보수와 교체 비용 부담을 줄여 북미 시장 경쟁력을 높인다.삼성SDI는 18일 미국 라스베이거스에서 열린 에너지산업 전시회 'RE+ 2026'에서 통합형 ESS 솔루션 'AC 랩(Wrap)'과 장기 보증 ","i":"https://cdn.thelec.kr/news/photo/202611/65591_51687_724.jpg"},{"t":"한화시스템, 美 방산 기업에 단거리 AESA 레이더 수출","l":"https://www.thelec.kr/news/articleView.html?idxno=65586","d":"2026-11-18T03:11:58.557650+00:00","s":"한화시스템이 미국의 방산 기업 리벨리온 인더스트리즈와 단거리 능동형 전자주사식 위상배열(AESA) 레이더 수출 계약을 체결했다고 18일 밝혔다.해당 계약은 파일럿 수출이다. 대규모 수출 전 소량의 제품으로 시장의 반응을 확인해 현지 적합성을 검증한다. 공급 수량과 금액은 공개되지 않았다. 단거리 AESA 레이더는 저고도 드론과 소형 무인기 방어에 특화됐다.","i":"https://cdn.thelec.kr/news/photo/202611/65586_51682_264.jpg"},{"t":"AI 창업 지원한다면서…해외 AI 결제 막힌 '모두의 창업' 지원금","l":"https://www.thelec.kr/news/articleView.html?idxno=65554","d":"2026-11-18T03:11:58.557650+00:00","s":"중소벤처기업부가 기술창업을 지원하기 위해 지급하는 창업지원금이 정작 소프트웨어 개발 현장에서 활용하기 어렵다는 지적이 나온다. 해외 인공지능(AI) 코딩 도구와 클라우드 서비스 결제가 제한되고, 앱 개발에 필요한 테스트용 스마트폰 구매도 금지돼 있기 때문이다. 창업자의 초기 개발비 부담을 덜어주겠다는 정책 취지와 실제 지원금 집행 기준 사이에 괴리가 있다는","i":"https://cdn.thelec.kr/news/photo/202611/65554_51664_4020.png"},{"t":"KT&G, '릴 토니노 람보르기니' 전국 편의점으로 판매 확대","l":"https://www.thelec.kr/news/articleView.html?idxno=65588","d":"2026-11-18T03:11:58.557650+00:00","s":"KT&G가 궐련형 전자담배 '릴 토니노 람보르기니'의 판매처를 전국 모든 편의점으로 확대했다.KT&G는 18일 릴 토니노 람보르기니의 판매 지역을 전국으로 넓혔다고 밝혔다. 지난 9월 서울지역 편의점과 온라인 채널에서 제품을 출시한 뒤 수도권과 주요 대도시 편의점 약 3만4000곳으로 공급을 확대했다.릴 토니노 람보르기니는 마이크로웨이브로 전용 스틱을 가열","i":"https://cdn.thelec.kr/news/photo/202611/65588_51683_407.png"},{"t":"SK이노베이션, 그린수소 생산 효율 높이는 수전해 촉매 개발","l":"https://www.thelec.kr/news/articleView.html?idxno=65590","d":"2026-11-18T03:11:58.557650+00:00","s":"SK이노베이션이 재생에너지의 전력 공급 변동에도 안정적으로 그린수소를 생산할 수 있는 수전해 촉매 기술을 개발했다. 생산한 수소를 활용해 차세대 지속가능항공유(e-SAF) 제조 기술의 상용화도 추진한다.SK이노베이션은 18일 환경과학기술원이 개발한 고효율 수전해 촉매 기술이 영국 왕립화학회가 발행하는 국제학술지 '저널 오브 머티리얼즈 케미스트리 에이'에 게","i":"https://cdn.thelec.kr/news/photo/202611/65590_51685_4842.jpg"},{"t":"NHN, 신작 '최애의 아이 퍼즐 스타' 170여 개국 출시","l":"https://www.thelec.kr/news/articleView.html?idxno=65585","d":"2026-11-18T03:11:58.557650+00:00","s":"NHN이 신작 모바일 퍼즐 게임 '최애의 아이 퍼즐 스타(【최애의 아이】Puzzle Star)'를 글로벌 170여 개국에 출시했다.이 게임은 일본 인기 TV 애니메이션 '최애의 아이'를 기반으로 제작한 첫 공식 퍼즐 게임이다. 구글 플레이와 애플 앱스토어에서 이용할 수 있으며 한국어, 일본어, 영어, 중국어 간체, 번체를 지원한다.게임은 같은 종류의 블록을","i":"https://cdn.thelec.kr/news/photo/202611/65585_51681_1725.jpeg"}]},"kr-aitimes":{"name":"AI타임스","lang":"ko","cat":"tech","plat":"web","url":"https://www.aitimes.com/rss/allArticle.xml","updated":"2026-11-18T03:11:46.912560+00:00","items":[{"t":"엔비디아 이사회, 젠슨 황 CEO 복귀 거부...후임자 물색 본격화","l":"https://www.aitimes.com/news/articleView.html?idxno=217517","d":"2026-11-18T03:11:58.359776+00:00","s":"엔비디아가 젠슨 황 전 CEO의 복귀 가능성을 공식적으로 일축하고 후임자 선임 절차에 들어갔다. 황의 사임을 둘러싼 논란이 계속되는 가운데 분기 매출은 두 배 이상 증가하는 등 견조한 실적을 기록했지만, 중국 수출 중단과 경영진 교체에 따른 불확실성은 새로운 과제로 떠올랐다.하비 존스 엔비디아 이사회 의장은 17일(현지시간) 3분기 실적 발표 컨퍼런스콜에서","i":"https://cdn.aitimes.com/news/photo/202611/217517_221793_4838.jpg"},{"t":"[AI리더의 서가] VLA 로보틱스 입문","l":"https://www.aitimes.com/news/articleView.html?idxno=217283","d":"2026-11-18T03:11:58.359776+00:00","s":"VLA 로보틱스 입문김병규 | 위키북스2026년 11월 17일추천이유독자는 파이썬 기초 지식만으로도 시뮬레이션에서 실제 로봇까지 피지컬 AI의 전 과정을 직접 경험할 수 있습니다. 이 책은 데이터 수집부터 모델 학습, 로봇 제어까지 단계적으로 실습하며 AI가 어떻게 로봇의 행동을 만드는지 실제로 체득하게 합니다.상세보기 \"로봇을 다뤄 본 적은 없는데 피지컬","i":"https://cdn.aitimes.com/news/photo/202611/217283_221511_485.jpg"},{"t":"[11월17일] 미국 이어 중국도 'AI 과학적 발견' 경쟁…문샷, 생물학·화학 연구에 집중","l":"https://www.aitimes.com/news/articleView.html?idxno=217482","d":"2026-11-18T03:11:58.359776+00:00","s":"중국 AI 기업들도 미국의 오픈AI와 앤트로픽이 주도하는 'AI 과학적 발견' 경쟁에 뛰어들고 있습니다. 그동안 미국 최첨단 모델과의 성능 격차를 줄이는 데 집중했던 중국 기업들이 이제는 수학과 과학 분야에서 새로운 지식을 만들어내는 능력을 차세대 경쟁력으로 내세우기 시작한 것입니다.사우스차이나모닝포스트(SCMP)는 16일(현지시간) 문샷 AI가 '키미' ","i":"https://cdn.aitimes.com/news/photo/202611/217482_221743_436.png"},{"t":"오픈AI, 세계 2위 성능 'GPT-6.2 아스트라' 출시...API 20% 인하","l":"https://www.aitimes.com/news/articleView.html?idxno=217513","d":"2026-11-18T03:11:58.359776+00:00","s":"오픈AI가 차세대 플래그십 모델 'GPT-6.2 아스트라(Astra)'와 'GPT-6.2 솔(Sol)'을 출시했다. 안전성 문제로 이전 버전의 출시를 취소한 지 약 50일 만으로, 종합 성능 평가에서 세계 2위에 오르고 API 가격도 20% 인하하는 등 성능과 비용 경쟁력을 동시에 강화했다.오픈AI는 17일(현지시간) 공식 블로그를 통해 최고 성능 모델인 ","i":"https://cdn.aitimes.com/news/photo/202611/217513_221791_5050.png"}]},"cumhuriyet":{"name":"Cumhuriyet","lang":"tr","cat":"tr","plat":"web","url":"https://www.cumhuriyet.com.tr/rss/son_dakika.xml","updated":"2026-11-18T03:11:46.912560+00:00","items":[{"t":"Gökova’daki Sahil Güvenlik Hizmet Binası mahkemelik oldu: ‘Kıyılar valilik oluruyla betonlaştırılamaz!'","l":"https://www.cumhuriyet.com.tr/turkiye/gokova-daki-sahil-guvenlik-hizmet-binasi-mahkemelik-oldu-kiyilar-valilik-oluruyla-betonlastirilamaz-2557084","d":"2026-11-18T03:11:47.283445+00:00","s":"Muğla’nın Ula ilçesine bağlı Akyaka’da, Gökova Özel Çevre Koruma Bölgesi sınırları içindeki mendireğe inşa edilen Sahil Güvenli function satir(c,o){

   '<div class="sat-m"><div class="sat-a sat-ust">'+tur+dilE+cev+urun+kaynakIlk(c)+'<span>'+agoUzun(c.son)+'</span>'+al+(durum[c.id]?'<span class="et vr">'+DURUM_AD[durum[c.id].d]+'</span>':'')+'</div>'+
   '<h3 class="sat-t"><a href="'+esc(secU(c.id))+'">'+vurgu(c.t)+'</a></h3>'+ozet+'</div>'+
   '<div class="sat-e"><button class="ik-b'+(kayit[c.id]?' on':'')+'" data-act="kaydet" data-id="'+c.id+'" aria-label="'+(kayit[c.id]?'Kaydedildi':'Kaydet')+'" title="Kaydet (S)">'+ik('kayit')+'</button><button class="ik-b gz" data-act="gizle" data-id="'+c.id+'" aria-label="Gizle" title="Gizle (X, geri al: Z)">'+ik('x')+'</button><button class="ik-b" data-act="menu" data-id="'+c.id+'" aria-label="Diğer eylemler" aria-haspopup="menu" aria-expanded="false" title="Diğer">'+ik('ayar')+'</button></div></article>';
}
function zcEt(ts){var d=new Date(ts*1000),n=new Date(),g=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);var s=('0'+d.getHours()).slice(-2)+':00';if(simdi()-ts<3600)return'Son 1 saat';return(g===0?'Bugün ':g===1?'Dün ':d.toLocaleDateString('tr',{day:'numeric',month:'long'})+' ')+s}
function liste(arr,o){o=o||{};
  if(ayar.gorunum==='zaman'&&!o.sikis&&arr.length>3){var son='',h2='';arr.slice().sort(function(a,b){return(b.son||0)-(a.son||0)}).forEach(function(c){var s=satir(c,o);if(!s)return;var e=zcEt(c.son||0);if(e!==son){h2+='<h4 class="zc-s">'+e+'</h4>';son=e}var d=new Date((c.son||0)*1000);h2+=s.replace('<div class="sat-m">','<time class="zs">'+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'</time><div class="sat-m">')});return h2?'<div class="liste zc">'+h2+'</div>':'<div class="bosluk">Bu süzgeçte haber yok.</div>'}
  var h=arr.map(function(c){return satir(c,o)}).join('');return h?'<div class="liste">'+h+'</div>':'<div class="bosluk">Bu süzgeçte haber yok.</div>'}
function iskelet(n){var h='';for(var i=0;i<(n||4);i++)h+='<div class="iskelet"></div>';return h}
function trendCip(t){return '<button class="tr-c'+(t.firsat?' firsat':'')+'" data-act="trend" data-id="'+esc(t.id)+'" title="'+(t.firsat?'Akış kaynaklarında bu konuda haber az ya da yok':'')+'"><b>'+esc(t.t)+'</b><span>'+hacim(t.n)+' arama · '+ago(t.ilk)+'</span></button>'}
function spark(seri){if(!seri||seri.length<2)return'<svg class="spark"></svg>';var mx=Math.max.apply(null,seri.map(function(s){return s[1]}))||1,t0=seri[0][0],t1=seri[seri.length-1][0]||t0+1;var p=seri.map(function(s){return((s[0]-t0)/Math.max(1,t1-t0)*62+1).toFixed(1)+','+(22-s[1]/mx*20).toFixed(1)}).join(' ');return'<svg class="spark" viewBox="0 0 64 24"><polyline points="'+p+'"/></svg>'}
