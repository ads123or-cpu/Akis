<style>

.zc{position:relative;margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--cz)}.zc li{position:relative;padding:0 0 9px 0;font-size:12.5px}.zc li:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--vg2)}.zc time{color:var(--sk);font-size:11.5px;display:block}
.bt{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.btn{padding:5px 10px;border:1px solid var(--cz);border-radius:7px;font-weight:650;font-size:12px;background:var(--yz)}.btn:hover{border-color:var(--vg);color:var(--vg)}.btn.p{background:var(--vg);border-color:var(--vg);color:var(--bg)}.btn.p:hover{color:var(--bg);opacity:.9}.btn[aria-pressed=true]{border-color:var(--vg);color:var(--vg);background:var(--vgy)}

.say-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:0 0 12px}.say-k button{padding:9px 10px;border:1px solid var(--cz);border-radius:9px;background:var(--yz);text-align:left}.say-k button[aria-pressed=true]{border-color:var(--vg)}.say-k b{display:block;font-size:20px;color:var(--ink);line-height:1.1}.say-k span{font-size:11.5px;color:var(--sk);font-weight:600}

pre.kod{margin:6px 0;padding:9px 11px;border-radius:8px;background:var(--yz2);overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx);white-space:pre-wrap;word-break:break-all}

 .rk-ust{grid-template-columns:54px minmax(0,1fr)}.rk-ust .puan{grid-column:1/3;width:auto;height:auto;padding:6px;flex-direction:row;gap:8px;justify-content:flex-start;font-size:16px}.rk dl{grid-template-columns:1fr}.rk dt{margin-top:4px}.kb-bar{grid-template-columns:110px 1fr 28px}
 .sag{width:100vw}.ol{grid-template-columns:repeat(2,auto)}
}

.com.tw/","updated":"2026-11-10T15:02:59.288592+00:00","items":[{"t":"亚马逊旗下Ring发布飞行无人机和巡逻机器人","l":"https://www.cnbeta.com.tw/articles/tech/1585830.htm","p":"cnBeta.COM","d":"2026-11-10T14:54:05+00:00","s":"亚马逊旗下Ring正进一步深入监控领域，推出一款用于家庭监控的室内无人机，以及一款旨在为企业巡逻的自主机器人。该公司周二发布了售价250美元的Ring Drone Cam。这是一款安防摄像头，可以从一个房间飞到另一个房间，包括楼上，并可在白天或夜间拍摄画面。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/1e22f88fa4bd14e.jpg"},{"t":"Aura推出新款10英寸彩色电子墨水相框 售价降至349美元","l":"https://www.cnbeta.com.tw/articles/tech/1585828.htm","p":"cnBeta.COM","d":"2026-11-10T14:52:55+00:00","s":"美国数字相框制造商Aura推出了新一代Ink电子墨水相框，新产品将屏幕尺寸从上一代的13英寸缩小至10英寸，同时改进了彩色显示技术，并将售价从499美元降低至349美元。Aura希望通过这款产品，让电子相框在外观上更加接近传统纸质照片，使其能够自然融入家庭装饰，而不是显得像一块摆放在墙上的电子屏幕。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/7a24cdfb7133a9b.webp"},{"t":"iPhone Air 2与iPhone 18模型机曝光 Air系列有望增加第二颗后置摄像头","l":"https://www.cnbeta.com.tw/articles/tech/1585826.htm","p":"cnBeta.COM","d":"2026-11-10T14:49:20+00:00","s":"苹果下一代iPhone的设计细节再次提前曝光。网络上出现了疑似iPhone Air 2和标准版iPhone 18的金属模型机，展示了两款新机可能采用的外观设计。其中最值得关注的变化是，iPhone Air 2终于有望摆脱单摄像头配置，增加第二颗后置摄像头。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/c0684ae7edae914.jpg"},{"t":"传闻称苹果将于2027年上半年推出OLED版iPad Air 提供双尺寸选择","l":"https://www.cnbeta.com.tw/articles/tech/1585824.htm","p":"cnBeta.COM","d":"2026-11-10T14:48:47+00:00","s":"供应链消息显示苹果计划在2027年上半年将iPad Air产品线全面升级至OLED显示屏，这意味着现有两种尺寸的iPad Air都将告别LCD面板。事实上，关于OLED版iPad Air的传闻已持续一年多时间。早在2025年10月，就有消息称苹果正在开发采用OLED屏幕的iPad Air，而发布时间预计不会早于2027年。近期相关爆料进一步将时间范围缩小至2027年上半年，而最新报告则补充了出货量","i":"https://static.cnbetacdn.com/article/2026/1110/b4734e56d1314d2.jpg"},{"t":"西班牙考虑暂停TikTok运营","l":"https://www.cnbeta.com.tw/articles/tech/1585822.htm","p":"cnBeta.COM","d":"2026-11-10T14:39:55+00:00","s":"西班牙青年和儿童部已要求检察官对TikTok展开调查，原因是该平台上存在数千个视频，据称这些视频描绘了儿童性虐待以及疑似恋童癖者之间的互动。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1104/277f105eb8fd25c.png"},{"t":"Anthropic投资人：美国企业的开源支出账单近9成流向中国公司","l":"https://www.cnbeta.com.tw/articles/tech/1585820.htm","p":"cnBeta.COM","d":"2026-11-10T14:39:33+00:00","s":"美国企业花在开源大模型上的钱，正在持续流向中国公司。近日，硅谷风投机构门罗风投（Menlo Ventures）发布《2026年企业AI现状报告》。基于对近400名美国企业AI业务负责人的调研，报告估算，美国企业用于开源大模型的支出中，89%流向了中国模型，受访者负责的AI支出合计超过40亿美元。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/b4922ae3cf42fe9.png"},{"t":"阿里巴巴：拟分拆平头哥赴港独立上市","l":"https://www.cnbeta.com.tw/articles/tech/1585818.htm","p":"cnBeta.COM","d":"2026-11-10T14:39:14+00:00","s":"11月10日，阿里巴巴公告称，拟分拆全资子公司平头哥（上海）技术股份有限公司赴香港联交所主板独立上市。香港联交所已确认阿里巴巴可进行此次分拆，平头哥已于2026年9月11日以保密形式向港交所递交上市申请（A1表格）。此次分拆拟通过全球发售H股进行，包括香港公开发售及向机构和专业投资者配售。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/b28527612d33211.jpg"},{"t":"成本3万美元 特斯拉人形机器人擎天柱预计明年交付","l":"https://www.cnbeta.com.tw/articles/tech/1585816.htm","p":"cnBeta.COM","d":"2026-11-10T14:37:42+00:00","s":"日前，马斯克在巴伦投资大会上对外披露特斯拉人形机器人Optimus（擎天柱）最新规划。马斯克表示， 擎天柱的初期成本可能与电动汽车差不多，每台机器人的初始成本约为3万美元，之后会降至2万美元左右，预计将在2027年底左右开始交付，但交付形式可能是“租”而不是“卖”。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/3b02a38bfc623a5.png"},{"t":"旅客称高铁座椅充电越充越掉电 12306回应","l":"https://www.cnbeta.com.tw/articles/tech/1585814.htm","p":"cnBeta.COM","d":"2026-11-10T14:37:10+00:00","s":"你有没有在乘坐高铁的时候遇到过类似的尴尬场景，插上座椅旁的USB口给手机充电，等了半天不仅电量没往上涨，反而越充越少甚至还往下掉。 近日有不少网友在社交平台发帖吐槽自己的类似遭遇，高铁座椅自带的USB充电口给手机充电越充耗电的相关话题很快冲上热门，引发了大量有同款经历的乘客共鸣。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/8f3fa4701a1460a.png"}]},"gnq-savunma":{"name":"Savunma (GN)","lang":"tr","cat":"tr","plat":"gnews","url":"https://news.google.com/rss/search?q=savunma%20sanayii%20when%3A1d&hl=tr&gl=TR&ceid=TR:tr","updated":"2026-11-10T15:02:59.288592+00:00","items":[{"t":"AeroVironment, kimliği açıklanmayan bir ABD müşterisiyle 940 milyon dolarlık sözleşme imzaladı","l":"https://news.google.com/rss/articles/CBMi0wFBVV95cUxNNFpNdGl6TjFVSDExTGtrRHRWTUgzb3ZrMGk5eUVPV0VSMUxqWlFXa2VmUDRwTXlxUzZDamx2WGtoWF9ueDJFb25GRG9EeWhnTkdkQWU3YWdpcDJ2N2JfRmN2NmY0ZzR3QUplR2VOelRHNlp3Q0NBMGFpV0NEbmlxbTVxYmRqNGljaGl6Mm9yMjNIM1hNb0FHZUJ3dWJBTEtCYVluR0V2cHFUU0g5d0YwWFhIU2poaTlQRnJQVHZaSm9xTUsxQ var PEN={'1':1,'6':6,'24':24,'72':72,'168':168};

    if(S.alt&&!((c.alt&&c.alt[S.alanKey||S.alan]||[]).indexOf(S.alt)>=0||(c.gundem_alt||[]).indexOf(S.alt)>=0))return false;
    if(S.ek){var ek=[].concat(c.ul||[],c.ld||[],c.mk||[]);if(ek.indexOf(S.ek)<0)return false}
