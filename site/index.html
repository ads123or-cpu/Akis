*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--metin);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}

.ust{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;background:var(--yuzey);border-bottom:1px solid var(--cizgi)}
.logo{font-weight:800;font-size:18px;color:var(--ink);letter-spacing:-.02em}
.sekmeler{display:flex;gap:2px}

.ikon:hover{background:var(--yuzey2);color:var(--ink)}
.durum{font-size:12px;color:var(--soluk);white-space:nowrap}
.durum.eski{color:var(--sicak);font-weight:600}
.duzen{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;padding:16px}

.kaz{overflow-x:auto;border:1px solid var(--cizgi);border-radius:10px}
.alt{display:none}
.diger{display:flex;justify-content:center;margin-top:12px}

出相对随机的分布。瑞士日内瓦大学研究团队近日提出了一种新的解释：这些复杂的毛囊排列，可能并不需要一套精密的生物定位系统，而是由细胞移动与化学信号之间简单的相互作用自然形成。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1104/8096c954ab601fc.jpg"},{"t":"《GTA 6》预载时间提前两天公布：安装空间最高达212GB","l":"https://www.cnbeta.com.tw/articles/game/1584942.htm","p":"cnBeta.COM","d":"2026-11-04T06:10:47+00:00","s":"Rockstar Games 日前更新了《侠盗猎车手6》（GTA 6）的官方公告和支持页面，将游戏数字版预载时间提前两天开放。根据最新安排，已经完成数字预购的玩家可从11月10日起开始下载游戏，而此前官方在今年6月公布的预载日期为11月12日。游戏正式发售日期仍维持在11月19日不变。 阅读全文","i":"https://www.techpowerup.com/img/MLAdMMEvujlAUJjd.jpg"},{"t":"Google将推出Quick Share SDK Android与iOS应用明年起可绕过系统分享菜单","l":"https://www.cnbeta.com.tw/articles/tech/1584940.htm","p":"cnBeta.COM","d":"2026-11-04T06:07:52+00:00","s":"Google日前在 Android Dev Summit 开发者峰会上宣布，将于 2027 年上半年推出全新的 Quick Share SDK，同时还将发布面向 iPhone 应用的 Quick Share iOS SDK。这意味着未来无论是Android应用还是 iOS 应用，都可以直接集成 Quick Share 功能，让用户在应用内部完成文件分享，而无需再经过系统级分享菜单或全屏 Quick","i":"https://static.cnbetacdn.com/article/2026/1104/bcc7edc3efbd32c.jpg"}]},"win-gn-tr":{"name":"GN Windows (TR)","lang":"tr","cat":"win","plat":"gnews","url":"https://news.google.com/rss/search?q=Windows+11+OR+Windows+Microsoft&hl=tr&gl=TR&ceid=TR:tr","updated":"2026-11-04T08:47:45.014734+00:00","items":[{"t":"Windows 11, 8 GB RAM'li bilgisayarlarda yüzde 40'a kadar hızlandı","l":"https://news.google.com/rss/articles/CBMiqAFBVV95cUxNSmhGMDhkLU4zaHU4UFRhXzFwYllhbmdIcWFCNHlsdzN1SXdaWWFmR0NkU3Z0WWNZQWJzWWRUN2U3SjQwNVhueXFrSGY1eUFrbnc0XzlETmxOaHlnRTJoT0dSbzlGOFdXUFAtY3lyVWJTdXVxdmNFWmRyd09BSlI0Z3Q3NVF0b1ExZGUxSXN5TjYteTJ5UzdjR09oUnprQWpUb1dYeUozd0E?oc=5","d":"2026-11-04T07:03:00+00:00","p":"CHIP Online","s":""},{"t":"Microsoft: “Windows 11 artık 8 GB RAM’li PC’lerde daha hızlı çalışıyor” - Teknoloji haberleri","l":"https://news.google.com/rss/articles/CBMilAFBVV95cUxNcVdSUTlHaTBDV3NFaXd6WlVXMUZQeWROMThuc3IwR01GaElxakFEd29uNXBVUXdIYlNETVlDNlc5eC14VVl2T3J3dXh2d3hpM0pFVk5EcXhmTmVrbjJlMU5neE5xMzhsYV9OZjBtcUJpTk1mQ1YxLXBUUDFCN1NrSFYzdjBPRWJxVEd4SDdMYW1mSlpr?oc=5","d":"2026-11-04T06:05:39+00:0   else if(d.tur)S.tur=d.tur;

  ciz();
});

document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var h=e.target.tagName;
  if(h==='INPUT'){if(e.key==='Escape')e.target.blur();return}

});
