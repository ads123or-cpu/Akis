*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--metin);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px;border-radius:4px}
.ust{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;background:var(--yuzey);border-bottom:1px solid var(--cizgi)}
.logo{font-weight:800;font-size:18px;color:var(--ink);letter-spacing:-.02em}
.sekmeler{display:flex;gap:2px}
.sekmeler button{padding:7px 12px;border-radius:7px;font-weight:600;color:var(--soluk);white-space:nowrap}
.sekmeler button:hover{background:var(--yuzey2);color:var(--ink)}
.sekmeler button[aria-selected=true]{background:var(--vurgu-yumusak);color:var(--vurgu)}
.ara{flex:1;max-width:340px;margin-left:auto;height:36px;padding:0 12px;border:1px solid var(--cizgi);border-radius:8px;background:var(--bg)}
.ikon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--soluk)}
.ikon:hover{background:var(--yuzey2);color:var(--ink)}
.durum{font-size:12px;color:var(--soluk);white-space:nowrap}
.durum.eski{color:var(--sicak);font-weight:600}
.duzen{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;padding:16px}
.yan{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto}
.yan h3{margin:14px 8px 5px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soluk)}
.yan h3:first-child{margin-top:0}
.yan button{display:flex;justify-content:space-between;width:100%;padding:6px 8px;border-radius:6px;text-align:left;font-weight:500}
.yan button:hover{background:var(--yuzey2)}
.yan button[aria-pressed=true]{background:var(--vurgu-yumusak);color:var(--vurgu);font-weight:650}

.ana-ust{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}

.dg[aria-pressed=true]{color:var(--sicak);border-color:var(--sicak)}

.sira{font-weight:800;color:var(--sicak);margin-right:4px}
.kaynaklar{margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--cizgi);list-style:none;display:grid;gap:5px;font-size:13px}
.kaynaklar li{display:flex;gap:8px;justify-content:space-between}
.kaynaklar a:hover{color:var(--vurgu)}
.kaynaklar span{flex-shrink:0;color:var(--soluk);font-size:12px}
.trend{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;align-items:center;font-size:13px}
.trend b{color:var(--soluk);font-weight:600;margin-right:3px}
.trend a{padding:2px 8px;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:6px}
.trend a:hover{border-color:var(--vurgu);color:var(--vurgu)}
.bos{padding:40px 16px;text-align:center;color:var(--soluk);background:var(--yuzey);border:1px dashed var(--cizgi);border-radius:10px}
.tablo{width:100%;border-collapse:collapse;background:var(--yuzey);border-radius:10px;overflow:hidden;font-size:13px}
.tablo th,.tablo td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--cizgi)}
.tablo th{font-size:11.5px;color:var(--soluk);text-transform:uppercase;letter-spacing:.05em}
.kaz{overflow-x:auto;border:1px solid var(--cizgi);border-radius:10px}
.alt{display:none}
.diger{display:flex;justify-content:center;margin-top:12px}
@media (max-width:860px){
 .duzen{grid-template-columns:minmax(0,1fr);padding:10px;padding-bottom:calc(68px + env(safe-area-inset-bottom))}

 .yan{position:static;max-height:none;min-width:0;display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin:0 -10px;padding-inline:10px;scrollbar-width:none}
 .yan h3{display:none}.yan button{width:auto;white-space:nowrap;gap:5px;border:1px solid var(--cizgi);background:var(--yuzey)}
 .kart{grid-template-columns:104px minmax(0,1fr);gap:9px;padding:8px}.kart h2{font-size:14.5px}.ozet{display:none}
 .alt{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset:auto 0 0;z-index:20;background:var(--yuzey);border-top:1px solid var(--cizgi);padding-bottom:env(safe-area-inset-bottom)}
 .alt button{min-height:50px;font-size:12.5px;font-weight:650;color:var(--soluk)}.alt button[aria-selected=true]{color:var(--vurgu)}

整套组件运往中国，在当地拆解并回收其中的高端HBM内存。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1103/9e5f4c11ca21f22.jpg"},{"t":"北欧国家未来也可能遭遇40℃极端高温 发生概率已比1981年增加六倍","l":"https://www.cnbeta.com.tw/articles/science/1584836.htm","p":"cnBeta.COM","d":"2026-11-03T07:47:25+00:00","s":"长期以来，挪威、瑞典和芬兰等北欧国家一直被认为是欧洲较为凉爽的地区，即使欧洲大陆遭遇严重热浪，这些国家通常也不会出现特别极端的高温。然而，芬兰气象研究所的一项最新研究指出，40℃高温已经不能被视为北欧地区不可能发生的天气现象。随着气候变化持续推进，这种极端温度出现的概率正在明显上升。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1103/6ab3fbcc674d36f.webp"},{"t":"英国网络安全机构拉响警报：AI时代将至 老旧系统面临新型网络威胁","l":"https://www.cnbeta.com.tw/articles/tech/1584834.htm","p":"cnBeta.COM","d":"2026-11-03T07:36:46+00:00","s":"英国国家网络安全中心（NCSC）近日发布警告称，英国关键基础设施运营方必须尽快为下一代网络攻击做好准备。该机构预计，到2028年前后，由人工智能驱动的恶意软件和勒索软件攻击将成为现实威胁，而大量仍在使用老旧系统的组织可能成为重点目标。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1103/54a3667610592a4.jpg"},{"t":"持续七年的漏气危机画上句号 国际空间站俄方PrK通道或被永久封闭","l":"https://www.cnbeta.com.tw/articles/science/1584832.htm","p":"cnBeta.COM","d":"2026-11-03T07:35:53+00:00","s":"持续困扰国际空间站多年的空气泄漏问题似乎终于迎来了最终解决方案。多家航天领域消息显示，位于国际空间站俄罗斯“星辰”号服务舱尾部的PrK转运通道已被决定永久关闭。由于长期存在且无法彻底修复的裂缝，该通道未来将不再承担人员进入和货物卸载任务，俄罗斯货运飞船的运营方式也将因此发生重大调整。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1030/20304cff7c9b7e6.jpg"},{"t":"科学家发现无需改变化学成分即可调控磁性的新方法","l":"https://www.cnbeta.com.tw/articles/science/1584830.htm","p":"cnBeta.COM","d":"2026-11-03T07:34:48+00:00","s":"美国能源部橡树岭国家实验室（ORNL）研究团队宣布，他们发现了一种无需改变材料化学组成即可调控磁性的新方法。研究表明，仅通过施加轻微机械应变，就能够改变某些晶体材料内部的磁结构，并进一步影响其电子传输特性。这一发现有望为下一代自旋电子学器件开发开辟新的技术路径。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1103/848187bf9bf266b.jpg"},{"t":"苹果加强App Store年龄分级管理 约会与位置共享功能须强制申报","l":"https://www.cnbeta.com.tw/articles/tech/1584828.htm","p":"cnBeta.COM","d":"2026-11-03T06:36:29+00:00","s":"苹果宣布将进一步完善App Store应用年龄分级体系。从2026年11月16日起，开发者在提交应用年龄评级问卷时，必须明确披露应用是否包含“位置共享”或“约会与关系”相关功能，以便系统为应用分配更准确的年龄分级。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1103/c30250b9dacf168.jpg"},{"t":"苹果与Epic最高法院之争再度延后 将于2027年1月正式开庭审理","l":"https://www.cnbeta.com.tw/articles/tech/1584826.htm","p":"cnBeta.COM","d":"2026-11-03T06:33:43+00:00","s":"美国最高法院已开启本年度10月会期，但苹果与Epic Games之间持续多年的法律纠纷并未迎来最终裁决。根据美国最高法院最新公布的信息，双方将在2027年1月11日正式向最高法院陈述各自主张，而在此之前，相关争议仍将在下级法院体系中继续推进。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1103/d385d3b0fdc5aeb.jpg"},{"t":"Google搜索近期出现风控界面：用户点击搜索结果要等待10秒进行自动验证","l":"https://www.cnbeta.com.tw/articles/tech/1584824.htm","p":"cnBeta.COM","d":"2026-11-03T06:30:58+00:00","s":"近期Google搜索出现奇怪的风控问题，用户点击搜索结果条目时可能会自动进入“正在验证您的请求”页面，该页面可能需要等待数秒甚至十几秒才能完成，验证完成后才能跳转到最终页面。在Google官方社区也有其他用户遇到此类问题。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1103/9dba1b9dd213fce.png"},{"t":"“押金退还”并不真退，共享寄存柜的缺德生意经","l":"https://www.cnbeta.com.tw/articles/tech/1584822.htm","p":"cnBeta.COM","d":"2026-11-03T06:25:22+00:00","s":"你使用完共享存物柜后看到了“押金退还”的提示，但钱真的退回到你的账户里了吗？《羊城晚报》的调查，揭开了共享寄存柜行业潜藏的运营套路：用户用完寄存箱后，小程序页面会弹出“退款成功”的提示，但押金并不会自动原路退回用户的微信等账户，而是转入小程序内余额，需要用户自行手动发起提现。也就是说，如果不去手动提现的话，那么钱就一直留在服务商那里，很多用户却想当然地以为“退款成功”就是退到了自己的账户里。 阅读","i":"https://static.cnbetacdn.com/article/2026/1103/b8d2fd719afedd3.jpg"},{"t":"“女版乔布斯”，入狱后还在骗","l":"https://www.cnbeta.com.tw/articles/movie/1584820.htm","p":"cnBeta.COM","d":"2026-11-03T06:17:17+00:00","s":"这个时代有一个臭名昭著的“骗子”，伊丽莎白·霍姆斯。她曾许诺用指尖的少量血液完成大量疾病检测，把公司推上90亿美元估值，最终因欺诈入狱。现在，她又出现在人们的视线里了。在2023年5月30日开始服刑前，霍姆斯邀请导演内森·菲尔德和兰斯·奥本海姆进入自己的生活并进行拍摄，她向两位导演承诺：“你可以看到一切。” 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1103/a8e39113799ea17.jpg"},{"t":"美国NASA 3000万美元太空救援失败 雨燕天文台预计将于本周坠落地球","l":"https://www.cnbeta.com.tw/articles/science/1584818.htm","p":"cnBeta.COM","d":"2026-11-03T06:13:37+00:00","s":"据美联社报道， 美国太空军预测NASA“雨燕”（Swift）天文台最早将于本周五坠入大气层。 而此前一项耗资3000万美元的私人太空救援任务宣告失败，这颗在轨运行22年的望远镜正不可逆转地越降越低。报道称，雨燕天文台于10月20日进行了最后一次观测，目前在距离地球表面不到171英里的轨道上运行。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1103/23dfb59a9e65f9c.png"},{"t":"靠嘲笑AI赚钱，一群年轻人被好莱坞盯上了","l":"https://www.cnbeta.com.tw/articles/tech/1584816.htm","p":"cnBeta.COM","d":"2026-11-03T06:13:03+00:00","s":"据美国科技媒体《WIRED》报道，当好莱坞各大制片公司忙着将生成式AI引入电影和电视剧制作时，一群专门拿AI开玩笑的内容创作
