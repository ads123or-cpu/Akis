<style>

.zc{position:relative;margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--cz)}.zc li{position:relative;padding:0 0 9px 0;font-size:12.5px}.zc li:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--vg2)}.zc time{color:var(--sk);font-size:11.5px;display:block}
.bt{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.btn{padding:5px 10px;border:1px solid var(--cz);border-radius:7px;font-weight:650;font-size:12px;background:var(--yz)}.btn:hover{border-color:var(--vg);color:var(--vg)}.btn.p{background:var(--vg);border-color:var(--vg);color:var(--bg)}.btn.p:hover{color:var(--bg);opacity:.9}.btn[aria-pressed=true]{border-color:var(--vg);color:var(--vg);background:var(--vgy)}

.say-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:0 0 12px}.say-k button{padding:9px 10px;border:1px solid var(--cz);border-radius:9px;background:var(--yz);text-align:left}.say-k button[aria-pressed=true]{border-color:var(--vg)}.say-k b{display:block;font-size:20px;color:var(--ink);line-height:1.1}.say-k span{font-size:11.5px;color:var(--sk);font-weight:600}

pre.kod{margin:6px 0;padding:9px 11px;border-radius:8px;background:var(--yz2);overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx);white-space:pre-wrap;word-break:break-all}

 .rk-ust{grid-template-columns:54px minmax(0,1fr)}.rk-ust .puan{grid-column:1/3;width:auto;height:auto;padding:6px;flex-direction:row;gap:8px;justify-content:flex-start;font-size:16px}.rk dl{grid-template-columns:1fr}.rk dt{margin-top:4px}.kb-bar{grid-template-columns:110px 1fr 28px}
 .sag{width:100vw}.ol{grid-template-columns:repeat(2,auto)}
}

"d":"2026-11-10T06:23:23+00:00","s":"OpenAI近日宣布，已在内部研究基础设施中部署名为“Control Room”的中央控制系统。当模型任务引发安全或网络安全风险时， 该系统可在收到停止指令后最长35秒内阻断模型继续输出 。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/559568d9047aacb.jpg"},{"t":"中国籍外卖骑手墨尔本遇害案开庭：嫌疑人脱衣称自己是受害者 将接受精神疾病鉴定","l":"https://www.cnbeta.com.tw/articles/tech/1585726.htm","p":"cnBeta.COM","d":"2026-11-10T06:23:03+00:00","s":"11月6日，澳大利亚墨尔本一名中国籍熊猫外卖骑手遭人袭击后死亡，另一名骑手受伤，事件引发关注。维多利亚州警方于11月7日更新案情称，事发时，两名外卖骑手发现一名陌生男子正在破坏他们的自行车，随后三方发生肢体冲突。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/2d386b508fcece8.jpg"},{"t":"AI写作指控席卷出版业 作家被迫证明自己不是AI","l":"https://www.cnbeta.com.tw/articles/tech/1585724.htm","p":"cnBeta.COM","d":"2026-11-10T06:22:08+00:00","s":"据《连线》（WIRED）报道，随着人工智能生成内容大量涌现，一场围绕“小说究竟是不是人写的”的争议正在出版业蔓延。在一本恐怖小说被检测出约78%的内容可能由AI生成、随后遭出版商撤销出版计划后，越来越多的作家开始担忧：即便作品完全由自己创作，也可能因为文字风格被怀疑使用AI，甚至面临抵制和声誉损失。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/75fa93fc0e2745b.jpg"},{"t":"“全球最强模型”又刷新了 但这还是给人用的吗？","l":"https://www.cnbeta.com.tw/articles/tech/1585722.htm","p":"cnBeta.COM","d":"2026-11-10T06:21:38+00:00","s":"当地时间 11 月 9 日，Anthropic 发布 Claude Fable 5.2 与 Claude Mythos 5.2。两者共用同一个底层模型。Fable 面向所有用户，内置网络安全与生物安全防护；Mythos 拆掉这些限制，只对通过 Cyber 或 Life Sciences 验证计划的机构开放。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/ce49959e33bfbe2.png"},{"t":"英伟达黄仁勋遭股东集体诉讼 调查风波致英伟达市值蒸发超万亿元","l":"https://www.cnbeta.com.tw/articles/tech/1585720.htm","p":"cnBeta.COM","d":"2026-11-10T06:19:10+00:00","s":"英伟达董事会11月8日宣布，将针对有关首席执行官黄仁勋个人关联事项的指控启动独立调查。受相关风波影响，黄仁勋的去留成为市场焦点。当地时间9日，英伟达股价走低，最终收跌4.27%，报每股178.67美元，市值缩水约1930亿美元（约合人民币12882亿元）。而在美股收盘五分钟后，英伟达及黄仁勋便遭到股东集体诉讼，指控其涉嫌欺诈股东。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/5f6c7ec40fb919a.jpg"},{"t":"娃哈哈两年三度变更董事长","l":"https://www.cnbeta.com.tw/articles/tech/1585718.htm","p":"cnBeta.COM","d":"2026-11-10T06:15:12+00:00","s":"11月10日，有报道称，杭州娃哈哈集团有限公司法定代表人、董事长兼总经理许思敏已辞职。内部人士表示，许思敏还未完全离开公司，接任许思敏的具体人选，娃哈哈内部已有相关讨论，仍未最终敲定。 阅读全文","i":"https://static.cnbetacdn.com/article/2025/1024/67e88b89be5804e.jpg"},{"t":"微软加速清理Windows 11历史遗留界面 古老对话框或将陆续退场","l":"https://www.cnbeta.com.tw/articles/tech/1585716.htm","p":"cnBeta.COM","d":"2026-11-10T06:03:37+00:00","s":"微软正进一步推进Windows 11现代化改造计划，而存在数十年的传统对话框和旧版系统界面有望迎来新一轮清理。根据最新测试版本中发现的变化，这家软件巨头正在尝试将更多遗留组件替换为符合Windows 11设计语言的新界面，以提升系统整体一致性。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/2839d9fb6b767fa.jpg"},{"t":"派拉蒙天空之舞CEO：AI可能成为电影史上最大创意突破 影响力将超过CGI","l":"https://www.cnbeta.com.tw/articles/movie/1585714.htm","p":"cnBeta.COM","d":"2026-11-10T06:01:20+00:00","s":"派拉蒙天空之舞（Paramount Skydance）首席执行官David Ellison认为，人工智能有望成为现代电影产业历史上最重要的创意技术突破，其影响力甚至可能超过上世纪90年代计算机生成图像（CGI）和数字合成技术的普及。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/7eb7f03339c1719.jpg"},{"t":"AMDLSS 5 2.0更新发布 Radeon显卡运行DLSS性能最高提升64%","l":"https://www.cnbeta.com.tw/articles/tech/1585712.htm","p":"cnBeta.COM","d":"2026-11-10T06:00:10+00:00","s":"第三方兼容工具AMDLSS 5近日迎来2.0版本更新，开发者宣称新版本通过一系列底层优化，显著提升了AMD Radeon显卡运行英伟达DLSS技术时的性能表现，部分场景下帧率增幅最高可达到64%。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1110/fee358d64b30854.jpg"}]},"gn-de-welt":{"name":"Google News: Welt (DE)","lang":"de","cat":"world","plat":"gnews","url":"https://news.google.com/rss?hl=de&gl=DE&ceid=DE:de","updated":"2026-11-10T06:29:55.288465+00:00","items":[{"t":"GTA 6: Release-Zeit, Preload-Datum, Download-Größe und mehr - PC-WELT","l":"https://news.google.com/rss/articles/CBMirAFBVV95cUxQZ0l4YnBvSUYzQWVBUWgyWXNmNFZlWUlvWHlKZkJRMEhSWWx0VUxhNDNmUmtxNXlpWnpHMllqYWFOVmwweHU0TUFDcDdhTFotUU9CdDNPUmQ2LWU2MmtRMHh0WUR6d2pCLURTVlFvMV9kcXQ3V040RlZoM3RTR25YSDdId0VfSTFWbi1ib1ZGQm9vbFJHYWNfZy1WZzRQejREcUJlU2x6dkNBVDha?oc=5","d":"2026-11-10T06:26:54+00:00","p":"PC-WELT","s":""},{"t":"Demenz: Droht Alzheimer? „Unser Modell liefert bessere Vorhersage zu früherem Zeitpunkt“","l":"https://news.google.com/rss/articles/CBMi6AFBVV95cUxOWVV5VnkwV1I2eEZsZ3RMXy05NUNMdU9FYTBHSThIb0ZOLXctUF9vcTNCUjRGZ2JqZU53OHFiVDV5MFdXcExncFQwcnlIanZKSTd2bEtmdjdMbWdaZ0l6ZlFoZHVPU2g2dkpFalNVckRuOXRqVFNqTUlCUTQydUNtcjhh function suz(arr,opt){

      else if(now-c.son>PEN[S.zaman]*3600)return false}

    if(dk.length){var ok=false;(c.diller||[c.dil]).forEach(function(d){var kk=['tr','en','zh','de','fr','ja','ko','ar'].indexOf(d)>=0?d:'x';if(S.dil[kk])ok=true});if(!ok)return false}
    if(S.alt&&!((c.alt&&c.alt[S.alanKey||S.alan]||[]).indexOf(S.alt)>=0||(c.gundem_alt||[]).indexOf(S.alt)>=0))return false;
    if(S.ek){var ek=[].concat(c.ul||[],c.ld||[],c.mk||[]);if(ek.indexOf(S.ek)<0)return false}
    if(S.kapsam==='tr'&&!((c.gundem_alt||[]).indexOf('turkiye')>=0||c.dil==='tr'))return false;
    if(S.kapsam==='dunya'&&(c.gundem_alt||[]).indexOf('turkiye')>=0)return false;
