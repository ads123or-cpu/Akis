<style>

.zc{position:relative;margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--cz)}.zc li{position:relative;padding:0 0 9px 0;font-size:12.5px}.zc li:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--vg2)}.zc time{color:var(--sk);font-size:11.5px;display:block}
.bt{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.btn{padding:5px 10px;border:1px solid var(--cz);border-radius:7px;font-weight:650;font-size:12px;background:var(--yz)}.btn:hover{border-color:var(--vg);color:var(--vg)}.btn.p{background:var(--vg);border-color:var(--vg);color:var(--bg)}.btn.p:hover{color:var(--bg);opacity:.9}.btn[aria-pressed=true]{border-color:var(--vg);color:var(--vg);background:var(--vgy)}

.say-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:0 0 12px}.say-k button{padding:9px 10px;border:1px solid var(--cz);border-radius:9px;background:var(--yz);text-align:left}.say-k button[aria-pressed=true]{border-color:var(--vg)}.say-k b{display:block;font-size:20px;color:var(--ink);line-height:1.1}.say-k span{font-size:11.5px;color:var(--sk);font-weight:600}

pre.kod{margin:6px 0;padding:9px 11px;border-radius:8px;background:var(--yz2);overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx);white-space:pre-wrap;word-break:break-all}

 .rk-ust{grid-template-columns:54px minmax(0,1fr)}.rk-ust .puan{grid-column:1/3;width:auto;height:auto;padding:6px;flex-direction:row;gap:8px;justify-content:flex-start;font-size:16px}.rk dl{grid-template-columns:1fr}.rk dt{margin-top:4px}.kb-bar{grid-template-columns:110px 1fr 28px}
 .sag{width:100vw}.ol{grid-template-columns:repeat(2,auto)}
}

function url(u){return /^https?:\/\//i.test(u)?esc(u):'#'}
function tem(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k]})}
function alanRenk(a){return 'var(--c-'+a+')'}
function reg(c){if(c&&c.id){var e=REG[c.id];if(e&&e.og&&!c.og){return e}REG[c.id]=Object.assign(REG[c.id]||{},c)}return c}
function bul(id){return REG[id]||kayit[id]||(durum[id]&&{id:id,t:durum[id].t,l:durum[id].l,son:durum[id].ts,kb:0,ks:0,alanlar:[],og:[]})}
function toast(m,geri){var k=$('kat');k.innerHTML='<div class="toast" role="status"><span>'+esc(m)+'</span>'+(geri?'<button data-act="geri">Geri al</button>':'')+'</div>';S.geri=geri||null;clearTimeout(toast.t);toast.t=setTimeout(function(){k.innerHTML='';S.geri=null},6000)}
function kopyala(m){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(m).then(function(){toast('Kopyalandı')},function(){toast('Kopyalanamadı')})}else{var t=document.createElement('textarea');t.value=m;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Kopyalandı')}catch(e){toast('Kopyalanamadı')}t.remove()}}
function img(c,cls){var h='<div class="res '+(cls||'')+'">';if(c.i)h+='<img src="'+url(c.i)+'" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">';return h+'<b aria-hidden="true">'+esc((c.t||'?').charAt(0).toLocaleUpperCase('tr'))+'</b></div>'}
function ikon(n){var p={yildiz:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',gizle:'M3 3l18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a15 15 0 0 1-3 3.3M6.6 6.6A15 15 0 0 0 3 12s4 6 9 6a9 9 0 0 0 3.4-.7',kop:'M9 9h10v10H9zM5 15V5h10',reels:'M4 4h16v16H4zM4 9h16M9 4l3 5M14 4l3 5M10 12.5l5 3-5 3z',ok:'M7 17L17 7M8 7h9v9'};return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+p[n]+'"/></svg>'}
function dilEt(d){return (DILLER.filter(function(x){return x[0]===d})[0]||[0,d.toUpperCase()])[1]}
function pctT(c,w){var o=w==='24'?c.h24o:c.h6o,n=w==='24'?c.h24:c.h6;if(o==null)return '';if(!o&&n)return '<span class="tr-ok">yeni konu</span>';var p=Math.round(100*(n-o)/Math.max(1,o));if(p>=20)return '<span class="tr-ok">▲ +'+p+'%</span>';if(p<=-20)return '<span class="tr-dus">▼ '+p+'%</span>';return '<span class="tr-dus">≈ sabit</span>'}
function trendG(c){var p=c.yog;if(c.h6o===0&&c.h6>0)return '<span class="tr-ok" title="Önceki 6 saatte hiç haber yok">▲ yeni</span>';if(p>=30)return '<span class="tr-ok" title="Son 6 saat / önceki 6 saat">▲ +'+Math.min(p,500)+'%</span>';if(p<=-30)return '<span class="tr-dus" title="Son 6 saat / önceki 6 saat">▼ '+p+'%</span>';return ''}
function guncel(c){var h=(Date.now()/1000-c.son)/3600;return h<1?'<span class="rozet yes">taze</span>':''}
function alanE(c){var a=(c.alanlar||[]).slice(0,2);return a.map(function(x){return '<span class="alan-e" style="color:'+alanRenk(x)+'"><i style="background:'+alanRenk(x)+'"></i>'+esc(ALAN_KISA[x]||x)+'</span>'}).join('')}
function kbEt(c){var kb=c.kb==null?c.ks:c.kb;return '<span class="kb '+(kb<2?'tek':'')+'" title="Bağımsız kaynak sayısı (ajans kopyaları ve aynı bültenden türeyenler tek sayılır). Toplam yayıncı: '+(c.ks||kb)+'">'+kb+' kaynak</span>'}

/* ---- kart çizimi ---- */
function satir(c,i){
  var k=okundu[c.id]?' okundu':'',g=gizli[c.id]?' gizli-k':'',se=S.sec===c.id?' secili':'';
  return '<div class="sat'+k+g+se+'" data-i="'+i+'" data-id="'+c.id+'" role="article"><div>'+img(c)+'</div><div style="min-width:0"><h3 class="bas">'+esc(c.t)+'</h3>'+(c.s?'<p class="ozt">'+esc(c.s)+'</p>':'')+'<div class="meta">'+alanE(c)+kbEt(c)+'<span>'+ago(c.son)+' önce</span>'+trendG(c)+guncel(c)+(c.resmi?'<span class="rozet resmi">resmî kaynak</span>':'')+((c.diller||[]).length>1?'<span>'+c.diller.map(dilEt).join('·')+'</span>':'<span>'+dilEt(c.dil||'tr')+'</span>')+(kayit[c.id]?'<span class="rozet resmi">kaydedildi</span>':'')+(durum[c.id]&&durum[c.id].d?'<span class="rozet">'+esc(dAd(durum[c.id].d))+'</span>':'')+'</div></div>'+eylem(c)+'</div>'}
function eylem(c){return '<div class="eyl"><button data-act="kaydet" data-id="'+c.id+'" aria-pressed="'+(!!kayit[c.id])+'" title="Kaydet (S)" aria-label="Kaydet">'+ikon('yildiz')+'</button><button data-act="reelsisaret" data-id="'+c.id+'" aria-pressed="'+(!!(durum[c.id]&&durum[c.id].d==='reels-fikri'))+'" title="Reels adayı işaretle" aria-label="Reels adayı">'+ikon('reels')+'</button><button data-act="gizle" data-id="'+c.id+'" title="İlgisiz — gizle (X)" aria-label="Gizle">'+ikon('gizle')+'</button></div>'}
function kart(c,i){
  var k=okundu[c.id]?' okundu':'',g=gizli[c.id]?' gizli-k':'',se=S.sec===c.id?' secili':'';
  return '<article class="kart'+k+g+se+'" data-i="'+i+'" data-id="'+c.id+'">'+img(c)+'<div class="gv"><h3 class="bas">'+esc(c.t)+'</h3>'+(c.s?'<p class="ozt">'+esc(c.s)+'</p>':'')+'<div class="meta">'+alanE(c)+kbEt(c)+'<span>'+ago(c.son)+' önce</span>'+trendG(c)+'</div></div>'+eylem(c)+'</article>'}
function dAd(d){return (DURUMLAR.filter(function(x){return x[0]===d})[0]||[0,d])[1]}
function listeHtml(arr,adet){
  var h='',n=Math.min(arr.length,adet);
  for(var i=0;i<n;i++)h+=S.gor==='kart'?kart(arr[i],i):satir(arr[i],i);
  var ic=S.gor==='kart'?'<div class="kartlar">'+h+'</div>':'<div class="liste">'+h+'</div>';
  if(!n)return '<div class="bos">Bu süzgeçle eşleşen konu yok.</div>';
  if(n<arr.length)ic+='<div class="diger"><button class="dgm" data-act="daha">Daha fazla yükle ('+(arr.length-n)+' konu daha)</button></div>';
  return ic}

/* ---- süzgeç ---- */
var PEN={'1':1,'6':6,'24':24,'72':72,'168':168};
function suz(arr,opt){
  opt=opt||{};var now=Date.now()/1000,q=S.q?fold(S.q).split(/\s+/).filter(Boolean):null;
  return arr.filter(function(c){
    if(!opt.gizliGoster&&gizli[c.id])return false;
    if(S.zaman!=='hepsi'){
      if(S.zaman==='ozel'){var b=S.zBas?Date.parse(S.zBas)/1000:0,s=S.zSon?Date.parse(S.zSon+'T23:59:59')/1000:1e12;if(c.son<b||c.son>s)return false}
      else if(now-c.son>PEN[S.zaman]*3600)return false}
    var dk=Object.keys(S.dil).filter(function(k){return S.dil[k]});
    if(dk.length){var ok=false;(c.diller||[c.dil]).forEach(function(d){var kk=['tr','en','zh','de','fr','ja','ko','ar'].indexOf(d)>=0?d:'x';if(S.dil[kk])ok=true});if(!ok)return false}
    if(S.alt&&!((c.alt&&c.alt[S.alanKey||S.alan]||[]).indexOf(S.alt)>=0||(c.gundem_alt||[]).indexOf(S.alt)>=0))return false;
    if(S.ek){var ek=[].concat(c.ul||[],c.ld||[],c.mk||[]);if(ek.indexOf(S.ek)<0)return false}
    if(S.kapsam==='tr'&&!((c.gundem_alt||[]).indexOf('turkiye')>=0||c.dil==='tr'))return false;
    if(S.kapsam==='dunya'&&(c.gundem_alt||[]).indexOf('turkiye')>=0)return false;
    if(S.kapsam==='federasyon'&&!/federasyon|TFF|TBF|TVF|UEFA|FIFA|NBA|ATP|WTA|Olympic|Olimpiyat/.test((c.kaynaklar||[]).join(' ')+' '+c.t))return false;
    if(q){var m=fold(c.t+' '+(c.s||'')+' '+(c.kaynaklar||[]).join(' '));for(var i=0;i<q.length;i++)if(m.indexOf(q[i])<0)return false}
    return true})}

   '<div class="ol"><span>Kaynak<b>'+c.kb+'</b></span><span>İlk yayın<b>'+ago(c.ilk)+'</b></span><span>Son güncelleme<b>'+ago(c.son)+'</b></span><span>Yoğunluk<b>'+(w==='1'?c.h1:w==='6'?c.h6:c.h24)+' haber '+pctT(c,w==='24'?'24':'6')+'</b></span></div>'+
   '<div class="lnk">'+(c.kaynaklar||[]).slice(0,5).map(function(k){return '<a href="#" data-act="ac-konu" data-id="'+c.id+'">'+esc(k)+'</a>'}).join('')+(c.kb>5?'<a href="#" data-act="ac-konu" data-id="'+c.id+'">+'+(c.kb-5)+'</a>':'')+'</div></div>'}

function ustAlan(){
  var a=S.alan,c=KUME[a];return '<div class="ustb"><h1>'+esc(ALAN[a][0])+'</h1><span class="alt-b" style="margin:0">'+(c?c.toplam.toLocaleString('tr-TR')+' konu · en güncel '+c.kumeler.length+' tanesi yüklendi':'')+'</span><span class="bosluk"></span><span class="sek" role="group" aria-label="Sıralama">'+[['sicak','Sıcaklık'],['yeni','En yeni'],['kaynak','Kaynak sayısı']].map(function(p){return '<button data-act="sirala" data-v="'+p[0]+'" aria-pressed="'+(S.sirala===p[0])+'">'+p[1]+'</button>'}).join('')+'</span></div>'}
function altSecenek(a){
  var set={},c=KUME[a]||{kumeler:[]};
  c.kumeler.forEach(function(k){((k.alt&&k.alt[a])||[]).forEach(function(x){set[x]=(set[x]||0)+1});if(a==='gundem')(k.gundem_alt||[]).forEach(function(x){set[x]=(set[x]||0)+1})});
  return Object.keys(set).filter(function(x){return set[x]>=2}).sort(function(x,y){return set[y]-set[x]}).slice(0,16).map(function(x){return [x,(a==='gundem'?GUNDEM_ALT[x]:null)||ALT_AD[x]||x,set[x]]})}
function entSecenek(a){
  var set={},c=KUME[a]||{kumeler:[]},ad={trump:'Trump',biden:'Biden',putin:'Putin',zelenski:'Zelenski',erdogan:'Erdoğan',netanyahu:'Netanyahu',macron:'Macron',xi:'Şi Cinping',rusya:'Rusya',ukrayna:'Ukrayna',abd:'ABD',cin:'Çin',iran:'İran',israil:'İsrail',filistin:'Filistin',suriye:'Suriye',turkiye:'Türkiye',almanya:'Almanya',fransa:'Fransa',ingiltere:'İngiltere',japonya:'Japonya',hindistan:'Hindistan',apple:'Apple',samsung:'Samsung',google:'Google',microsoft:'Microsoft',openai:'OpenAI',anthropic:'Anthropic',meta:'Meta',nvidia:'NVIDIA',tesla:'Tesla',xiaomi:'Xiaomi',huawei:'Huawei',tiktok:'TikTok',togg:'Togg',spacex:'SpaceX'};
  c.kumeler.forEach(function(k){[].concat(k.ul||[],k.ld||[],k.mk||[]).forEach(function(x){set[x]=(set[x]||0)+1})});
  var want=a==='tekno'?['mk']:a==='siyaset'?['ul','ld']:[];
  return Object.keys(set).filter(function(x){return set[x]>=2&&ad[x]}).sort(function(x,y){return set[y]-set[x]}).slice(0,14).map(function(x){return [x,ad[x],set[x]]})}
function zamanFil(){
  var zs=[['hepsi','Tümü'],['1','1 sa'],['6','6 sa'],['24','24 sa'],['72','3 gün'],['168','7 gün'],['ozel','Özel']];
  return '<div class="fil"><span class="et">Zaman</span>'+zs.map(function(z){return '<button class="cp" data-act="zaman" data-v="'+z[0]+'" aria-pressed="'+(S.zaman===z[0])+'">'+z[1]+'</button>'}).join('')+(S.zaman==='ozel'?'<input class="cp" type="date" id="z-bas" value="'+esc(S.zBas)+'" aria-label="Başlangıç"> – <input class="cp" type="date" id="z-son" value="'+esc(S.zSon)+'" aria-label="Bitiş">':'')+'<span class="et" style="margin-left:8px">Dil</span>'+DILLER.map(function(d){return '<button class="cp" data-act="dil" data-v="'+d[0]+'" aria-pressed="'+(!!S.dil[d[0]])+'">'+d[1]+'</button>'}).join('')+'</div>'}
function sayfaAlan(){
  var a=S.alan,c=KUME[a];

  var alts=altSecenek(a);
  if(alts.length)h+='<div class="fil"><span class="et">Konu</span><button class="cp" data-act="alt" data-v="" aria-pressed="'+(!S.alt)+'">Tümü</button>'+alts.map(function(x){return '<button class="cp" data-act="alt" data-v="'+x[0]+'" aria-pressed="'+(S.alt===x[0])+'">'+esc(x[1])+' <small>'+x[2]+'</small></button>'}).join('')+'</div>';
  var es=entSecenek(a);if(es.length&&(a==='tekno'||a==='siyaset'))h+='<div class="fil"><span class="et">'+(a==='tekno'?'Marka':'Ülke / lider')+'</span><button class="cp" data-act="ek" data-v="" aria-pressed="'+(!S.ek)+'">Tümü</button>'+es.map(function(x){return '<button class="cp" data-act="ek" data-v="'+x[0]+'" aria-pressed="'+(S.ek===x[0])+'">'+esc(x[1])+'</button>'}).join('')+'</div>';
  if(a==='spor')h+='<div class="fil"><span class="et">Kapsam</span>'+[['hepsi','Tümü'],['tr','Türkiye'],['dunya','Dünya'],['federasyon','Federasyon / lig açıklamaları']].map(function(x){return '<button class="cp" data-act="kapsam" data-v="'+x[0]+'" aria-pressed="'+(S.kapsam===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  var notlar_={ekonomi:'Resmî veri (TCMB, TÜİK, Fed, AMB…) kaynak listesinde “resmi kurum” etiketiyle ayrıdır; konu kartında “resmî kaynak” rozeti görünür.',bilim:'Her konuda kanıt düzeyi: hakemli dergi, basın bülteni, ön çalışma (preprint) ya da haber. Detay panelinde kaynak etiketleri görünür.',siber:'Resmî uyarılar (CISA, USOM vb.) “resmî kaynak” rozetiyle; haber siteleri rozetsizdir.',siyaset:'Ajans kopyaları ve aynı bültenden türeyen haberler bağımsız doğrulama sayılmaz.'};
  if(notlar_[a])h+='<p class="alt-b">'+esc(notlar_[a])+'</p>';
  var arr=suz(c.kumeler.map(reg));
  if(a==='ekonomi'&&S.ek==='resmi')arr=arr.filter(function(x){return x.resmi});
  if(S.sirala==='yeni')arr.sort(function(x,y){return y.son-x.son});else if(S.sirala==='kaynak')arr.sort(function(x,y){return y.kb-x.kb||y.son-x.son});
  LIST=arr;return h+listeHtml(arr,S.adet)}
