<style>

.zc{position:relative;margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--cz)}.zc li{position:relative;padding:0 0 9px 0;font-size:12.5px}.zc li:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--vg2)}.zc time{color:var(--sk);font-size:11.5px;display:block}
.bt{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.btn{padding:5px 10px;border:1px solid var(--cz);border-radius:7px;font-weight:650;font-size:12px;background:var(--yz)}.btn:hover{border-color:var(--vg);color:var(--vg)}.btn.p{background:var(--vg);border-color:var(--vg);color:var(--bg)}.btn.p:hover{color:var(--bg);opacity:.9}.btn[aria-pressed=true]{border-color:var(--vg);color:var(--vg);background:var(--vgy)}

.say-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:0 0 12px}.say-k button{padding:9px 10px;border:1px solid var(--cz);border-radius:9px;background:var(--yz);text-align:left}.say-k button[aria-pressed=true]{border-color:var(--vg)}.say-k b{display:block;font-size:20px;color:var(--ink);line-height:1.1}.say-k span{font-size:11.5px;color:var(--sk);font-weight:600}

pre.kod{margin:6px 0;padding:9px 11px;border-radius:8px;background:var(--yz2);overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx);white-space:pre-wrap;word-break:break-all}

 .rk-ust{grid-template-columns:54px minmax(0,1fr)}.rk-ust .puan{grid-column:1/3;width:auto;height:auto;padding:6px;flex-direction:row;gap:8px;justify-content:flex-start;font-size:16px}.rk dl{grid-template-columns:1fr}.rk dt{margin-top:4px}.kb-bar{grid-template-columns:110px 1fr 28px}
 .sag{width:100vw}.ol{grid-template-columns:repeat(2,auto)}
}

3ffb44303060c5b45fccf5fad.png"},{"t":"韦伯望远镜疑似发现“近乎原始”的早期星系 或为大爆炸模型补上关键一环","l":"https://www.cnbeta.com.tw/articles/science/1585836.htm","p":"cnBeta.COM","d":"2026-11-10T17:03:31+00:00","s":"天文学家利用詹姆斯·韦伯空间望远镜（JWST）观测到一个几乎不含重元素的遥远星系，并将其命名为 AMORE6。 研究人员认为，这可能是迄今最接近“零金属”状态的星系候选体；若后续观测得以确认，它将成为长期寻找的第三星族（星族III）星系的首个实证，从而为宇宙学标准模型提供关键支持。相关论文已于今年7月31日提交至《自然》杂志，并发布在预印本平台 arXiv 上，第一作者为加州理工学院红外处理与分析","i":"https://static.cnbetacdn.com/article/2026/1111/308df073a1c8018.jpg"},{"t":"Anthropic 启动IPO路演 估值目标高达1.4万亿美元","l":"https://www.cnbeta.com.tw/articles/tech/1585834.htm","p":"cnBeta.COM","d":"2026-11-10T16:59:54+00:00","s":"Anthropic 已正式启动首次公开募股（IPO）的投资者路演。公司计划发行 8.25 亿股股票，每股发行价区间为 70 至 78 美元，最高募资规模可达 643.5 亿美元。若按区间上限定价，其完全稀释估值将接近 1.4 万亿美元，这将是人工智能行业迄今规模最大的上市交易之一。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1111/d34271677f31a68.webp"},{"t":"Google发布Gemini 4 Carbon 推出智能体“蜂群”功能","l":"https://www.cnbeta.com.tw/articles/tech/1585832.htm","p":"cnBeta.COM","d":"2026-11-10T16:58:22+00:00","s":"11月10日，Google宣布将其最新人工智能模型 Gemini 4 Carbon 向公众全面开放。就在两周前，该模型还只向一小批“网络安全防御人员”提供。Google称，Carbon 是迄今“最强的模型”，有能力与 Anthropic 和 OpenAI 最顶尖的系统一较高下。 阅读全文","i":"https://static.cnbetacdn.com/article/2026/1111/c28a365afa0c20f.jpg"}]},"gn-tr-son":{"name":"Google Haberler Son Dakika","lang":"tr","cat":"tr","plat":"gnews","url":"https://news.google.com/rss/search?q=son+dakika+when:3h&hl=tr&gl=TR&ceid=TR:tr","updated":"2026-11-10T17:08:03.469858+00:00","items":[{"t":"\"Türkiye İklim Okulu\", COP31 kapsamında uluslararası etkinliklere ev sahipliği yaptı","l":"https://news.google.com/rss/articles/CBMiywFBVV95cUxQLUlQLUhhNi1OdVFoQ1hNcjE5RUs3Q2ktQ3ZoSF9YWkNpNFl1dWlLMEhJUzlTZUx1S3RMcnhtbURBVm8wS2Y1bHN2Y2JfUVMxRmxITFpNaTNSUUY0YnlqcGg2LW04NHFJbEsyc0RVRkVXbzRobWprZjV6OXpRNHk4X0pzUEZlUFo0cklXdWlIRnhSTkVpUmRjLTlSbHgtZVdhVDBvQzRFdHAzZFFrZ0ZoSjljeTZuaVEtMHBkR2pfN1QxLWo0NHQwVEwxVQ?oc=5","d":"2026-11-10T17:04:00+00:00","p":"TRT Haber","s":""},{"t":"Erdoğan'dan COP31 zirvesinde diplomasi trafiği!","l":"https://news.google
