<style>
/* Akış 7 — editoryal, sakin; tek vurgu rengi; açık/koyu tema light-dark() ile */
:root{color-scheme:light dark;
 --bg:light-dark(#f6f5f2,#0e1013);--yuz:light-dark(#fff,#16191d);--yuz2:light-dark(#eeece7,#1e2227);--cz:light-dark(#e3e0d9,#2a2f35);
 --yaz:light-dark(#16171a,#ecebe7);--ik:light-dark(#55575c,#a4a7ad);--ik2:light-dark(#6c6e73,#8b8f96);
 --sc:light-dark(#b42d18,#ff8a70);--sc-z:light-dark(#fae5df,#3a201a);--ye:light-dark(#13704a,#5ad197);--ye-z:light-dark(#e0f1e7,#14301f);--sa:light-dark(#835600,#f0b84e);--sa-z:light-dark(#f7ebd3,#33291a);
 --vr-a:#0b6b66;--vr-k:#4cc9bd;--vr:light-dark(var(--vr-a),var(--vr-k));--vr-y:light-dark(#fff,#06201d);--vr-z:color-mix(in oklab,var(--vr) 12%,var(--yuz));--toast-vr:light-dark(var(--vr-k),var(--vr-a));
 --gl:0 1px 2px rgb(0 0 0/.06),0 10px 30px rgb(0 0 0/.08);--r1:8px;--r2:12px;--r3:16px;--ust:56px;
 --a-gundem:#c2410c;--a-adana:#b45309;--a-tekno:#0369a1;--a-yz:#7c3aed;--a-siyaset:#be123c;--a-spor:#15803d;--a-ekonomi:#a16207;--a-bilim:#0e7490;--a-siber:#4d7c0f;--a-oto:#64748b;--a-oyun:#c026d3;--a-eglence:#db2777;--a-savunma:#787236}
:root[data-tema=acik]{color-scheme:light}:root[data-tema=koyu]{color-scheme:dark}
:root[data-vurgu=kehribar]{--vr-a:#a34a04;--vr-k:#f5a524}:root[data-vurgu=mor]{--vr-a:#5546d6;--vr-k:#a69cff}:root[data-vurgu=klasik]{--vr-a:#2a5fd8;--vr-k:#7aa2ff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--ust) + 8px)}
body{margin:0;background:var(--bg);color:var(--yaz);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4{text-wrap:balance}
:focus-visible{outline:2px solid var(--vr);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.gizli-m{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
/* üst çubuk */
.ust{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--cz)}
.ust-i{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:4px;height:var(--ust);padding:0 16px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.025em;display:flex;align-items:center;gap:9px;margin-right:14px;flex:none}
.logo i{width:24px;height:24px;border-radius:7px;background:var(--vr);display:inline-grid;place-items:center}
.logo i svg{width:16px;height:16px;stroke:var(--vr-y);stroke-width:2.6;fill:none;stroke-linecap:round}
.ana-nav{display:flex;gap:2px}
.ana-nav a,.ana-nav button{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:var(--r1);font-size:15px;color:var(--ik);font-weight:500;white-space:nowrap}
.ana-nav a:hover,.ana-nav button:hover{color:var(--yaz);background:var(--yuz2)}
.ana-nav [aria-current=page],.ana-nav .on{color:var(--yaz);background:var(--yuz2)}
.bos{flex:1}
.saat{font-size:13px;color:var(--ik);display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap}
.nokta{width:7px;height:7px;border-radius:50%;background:var(--ye);display:inline-block;flex:none}
.nokta.sa{background:var(--sa)}.nokta.sc{background:var(--sc)}
.ara-b{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 12px;border-radius:var(--r2);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);color:var(--ik);font-size:14px;min-width:220px}
.ara-b:hover{box-shadow:inset 0 0 0 1px var(--ik2)}
kbd,.kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--cz);border-radius:5px;padding:0 5px;color:var(--ik2);background:var(--bg)}
.ara-b kbd{margin-left:auto}
.ik-b{width:38px;height:38px;border-radius:var(--r1);display:inline-grid;place-items:center;color:var(--ik);flex:none}
.ik-b:hover{background:var(--yuz2);color:var(--yaz)}
.ik-b.on{color:var(--vr)}
.yeni-veri{white-space:nowrap;position:fixed;top:calc(var(--ust) + 10px);left:50%;transform:translateX(-50%);z-index:40;background:var(--vr);color:var(--vr-y);border-radius:99px;padding:9px 18px;font-size:14px;font-weight:600;box-shadow:var(--gl)}
/* yerleşim */
.ana{max-width:1320px;margin:0 auto;padding:24px 16px 120px}
.sayfa{max-width:780px;margin:0 auto}
.sayfa.genis{max-width:1080px}
.iki{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:44px;align-items:start;max-width:1180px;margin:0 auto}
.ray{position:sticky;top:calc(var(--ust) + 20px);display:flex;flex-direction:column;gap:28px}
.bas{display:flex;align-items:flex-end;gap:12px;margin:0 0 18px;flex-wrap:wrap}
.bas h1{font-size:28px;line-height:1.12;letter-spacing:-.03em;margin:0;font-weight:700}
.bas p{margin:6px 0 0;color:var(--ik);font-size:14.5px}
.bolum{margin:0 0 36px}
.bolum-b{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.bolum-b h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ik);margin:0;font-weight:650}
.bolum-b .sag-l{margin-left:auto;font-size:14px;color:var(--vr);font-weight:500;white-space:nowrap}
.bilgi{font-size:13.5px;color:var(--ik)}
.an{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none;background:var(--ik2)}
/* satır (Akış görünümü varsayılan) */
.liste{display:flex;flex-direction:column}
.sat{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"m g";column-gap:14px;padding:14px 12px;margin:0 -12px;border-radius:var(--r2);cursor:pointer;position:relative;content-visibility:auto;contain-intrinsic-size:auto 104px}
.sat+.sat:before{content:"";position:absolute;left:12px;right:12px;top:0;border-top:1px solid var(--cz)}
.sat:hover,.sat.imlec{background:var(--yuz)}
.sat:hover:before,.sat.imlec:before,.sat:hover+.sat:before,.sat.imlec+.sat:before,.sat.secili:before,.sat.secili+.sat:before{border-color:transparent}
.sat.secili{background:var(--vr-z)}
.sat-g{grid-area:g;width:96px;height:68px;border-radius:var(--r1);object-fit:cover;background:var(--yuz2);display:block}
.sat-m{grid-area:m;min-width:0}
.sat-u{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ik);min-width:0;white-space:nowrap;margin:0 0 4px}
.sat-u .kn{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;color:var(--yaz);font-weight:550}
.sat-u>*{flex:none}
.sat-u .ks b{color:var(--yaz);font-weight:600}
/* satır sınırı bağlantının kendisinde: odak geri dönünce başlık kutusu kaymasın */
.sat-t{font-size:17px;line-height:1.36;font-weight:620;margin:0;letter-spacing:-.012em;overflow-wrap:anywhere}
.sat-t a,.dk-t a{color:inherit;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sat.ok .sat-t{color:var(--ik);font-weight:500}
.sat-o{font-size:14.5px;color:var(--ik);margin:5px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yeni-n{position:absolute;left:1px;top:23px;width:6px;height:6px;border-radius:50%;background:var(--vr)}
.sat-e{position:absolute;right:8px;bottom:8px;display:flex;opacity:0;background:var(--yuz);border-radius:var(--r1);box-shadow:0 0 0 1px var(--cz),0 4px 12px rgb(0 0 0/.08)}
.sat:hover .sat-e,.sat.imlec .sat-e,.sat:focus-within .sat-e{opacity:1}
.sat-e .ik-b{width:34px;height:34px}
.sat-e .on{opacity:1}
@media (hover:none){.sat-e{display:none}}
.et{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--yuz2);color:var(--ik);white-space:nowrap;line-height:1.6}
.et.vr{background:var(--vr-z);color:var(--vr)}.et.sc{background:var(--sc-z);color:var(--sc)}.et.ye{background:var(--ye-z);color:var(--ye)}.et.sa{background:var(--sa-z);color:var(--sa)}
.et.dl{background:none;box-shadow:inset 0 0 0 1px var(--cz);font:600 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em;text-transform:uppercase;padding:0 5px;border-radius:5px}
.et.dl.cok{color:var(--vr);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--vr) 45%,transparent)}
mark{background:var(--sa-z);color:inherit;border-radius:3px;padding:0 2px}
/* Başlıklar görünümü */
.g-basliklar .gv .sat{grid-template-columns:minmax(0,1fr);grid-template-areas:"m";padding:9px 12px;contain-intrinsic-size:auto 64px}
.g-basliklar .gv .sat-g,.g-basliklar .gv .sat-o,.g-basliklar .gv .sat-e{display:none}
.g-basliklar .gv .sat-t{font-size:15.5px;font-weight:560}.g-basliklar .gv .sat-t a{-webkit-line-clamp:2}
.g-basliklar .gv .sat-u{font-size:12.5px;margin:0 0 2px}
/* Kartlar görünümü */
.g-kartlar .gv.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.g-kartlar .gv .sat{display:flex;flex-direction:column;margin:0;padding:0;border-radius:var(--r3);overflow:hidden;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);contain-intrinsic-size:auto 320px}
.g-kartlar .gv .sat:before{display:none}
.g-kartlar .gv .sat:hover,.g-kartlar .gv .sat.imlec{box-shadow:inset 0 0 0 1px var(--ik2)}
.g-kartlar .gv .sat.secili{box-shadow:inset 0 0 0 2px var(--vr);background:var(--yuz)}
.g-kartlar .gv .sat-g{order:-1;width:100%;height:auto;aspect-ratio:16/9;border-radius:0}
.g-kartlar .gv .sat-m{padding:12px 14px 14px}
.g-kartlar .gv .sat-t{font-size:16px}.g-kartlar .gv .sat-t a{-webkit-line-clamp:4}
.g-kartlar .gv .sat-o{font-size:13.5px;-webkit-line-clamp:3}
.g-kartlar .gv .sat-e{top:6px;bottom:auto;background:color-mix(in srgb,var(--yuz) 90%,transparent);border-radius:var(--r1)}
.g-kartlar .gv .yeni-n{left:8px;top:8px;z-index:1;width:8px;height:8px;box-shadow:0 0 0 2px var(--yuz)}
.gorselsiz .sat-g:not(.p-g){display:none}
/* çipler, segment, düğmeler */
.serit{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin:0 0 10px;overscroll-behavior-x:contain}
.serit::-webkit-scrollbar{display:none}
.cip{flex:none;position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:99px;background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);font-size:14px;white-space:nowrap}
.cip:hover{box-shadow:inset 0 0 0 1px var(--ik2)}
.cip.on,.cip[aria-pressed=true]{background:var(--yaz);color:var(--bg);box-shadow:none}
.cip small{color:var(--ik);font-size:12px}.cip.on small{color:inherit;opacity:.75}
.cip .an{margin-right:1px}
.seg{display:inline-flex;background:var(--yuz2);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none;flex:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;height:30px;padding:0 12px;border-radius:8px;font-size:13.5px;color:var(--ik);white-space:nowrap;flex:none}
.seg button.on{background:var(--yuz);color:var(--yaz);box-shadow:0 1px 2px rgb(0 0 0/.1)}
.seg small{font-size:11.5px;opacity:.8}
.arac{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.arac select,.sec{height:36px;border-radius:10px;border:1px solid var(--cz);background:var(--yuz);padding:0 10px;font-size:14px;max-width:100%}
.tg{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ik);height:36px;padding:0 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--cz);white-space:nowrap}
.tg:hover{color:var(--yaz)}
.tg.on{color:var(--vr);background:var(--vr-z);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--vr) 35%,transparent)}
.dg{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:10px;background:var(--yuz2);font-size:14.5px;font-weight:550;white-space:nowrap}
.dg:hover{filter:brightness(.97)}
.dg.ana-d{background:var(--vr);color:var(--vr-y)}
.dg.on{background:var(--vr-z);color:var(--vr)}
.daha{display:block;width:100%;height:48px;border-radius:var(--r2);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);font-weight:550;margin-top:14px;color:var(--ik)}
.daha:hover{color:var(--yaz)}
.bosluk{padding:44px 12px;text-align:center;color:var(--ik)}
.iskelet{height:76px;border-radius:var(--r2);background:linear-gradient(90deg,var(--yuz) 0,var(--yuz2) 50%,var(--yuz) 100%);background-size:200% 100%;animation:isk 1.2s infinite;margin:10px 0}
@keyframes isk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.iskelet{animation:none}}
.sayac{font-size:13.5px;color:var(--ik);margin:2px 0 6px}.sayac b{color:var(--yaz)}
.suz-b{display:none}
/* Bugün */
.manset{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:center;padding:0 0 22px;margin:0 0 6px;border-bottom:1px solid var(--cz);cursor:pointer}
.manset img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r3);background:var(--yuz2);display:block}
.manset h2{font-size:clamp(22px,2.6vw,30px);line-height:1.18;letter-spacing:-.028em;margin:6px 0 10px;font-weight:700}
.manset h2 a{color:inherit}
.manset p{margin:0;color:var(--ik);font-size:15.5px}
.manset.gorselsiz-m{grid-template-columns:minmax(0,1fr)}
.manset.secili h2{color:var(--vr)}
.tr-serit{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.tr-serit::-webkit-scrollbar{display:none}
.tr-c{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 14px;border-radius:var(--r2);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);text-align:left;max-width:230px}
.tr-c:hover{box-shadow:inset 0 0 0 1px var(--ik2)}
.tr-c b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.tr-c span{font-size:12.5px;color:var(--ik)}
.tr-c.firsat{box-shadow:inset 0 0 0 1px var(--sc-z),inset 3px 0 0 var(--sc)}
.kutu{background:var(--yuz);border-radius:var(--r3);box-shadow:inset 0 0 0 1px var(--cz);padding:16px 18px}
.mini{display:flex;flex-direction:column}
.mini>a,.mini>button{display:flex;gap:10px;align-items:baseline;padding:9px 0;text-align:left;font-size:14.5px;width:100%;min-height:40px}
.mini>*+*{border-top:1px solid var(--cz)}
.mini .n{color:var(--ik);font-size:12.5px;width:56px;flex:none}
.mini .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .sn{color:var(--ik);font-size:12.5px;flex:none}
.mini>a:hover .t,.mini>button:hover .t{color:var(--vr)}
.dunya-serit{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,270px);gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.dunya-serit::-webkit-scrollbar{display:none}
.dk{display:flex;flex-direction:column;gap:6px;padding:13px 15px;border-radius:var(--r2);background:var(--yuz);box-shadow:inset 0 0 0 1px var(--cz);cursor:pointer;min-height:124px;min-width:0}
.dk:hover{box-shadow:inset 0 0 0 1px var(--ik2)}
.dk-u{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--ik);white-space:nowrap}
.dk-u b{font-size:14px;color:var(--yaz)}
.dk-t{font-size:15px;line-height:1.38;font-weight:600;margin:0}
.dk-a{margin-top:auto;font-size:12.5px;color:var(--ik);display:flex;gap:10px}
.dk-a a{color:var(--vr);margin-left:auto}
.sik .sat{padding:10px 12px;contain-intrinsic-size:auto 66px;grid-template-columns:minmax(0,1fr);grid-template-areas:"m"}
.sik .sat-t{font-size:15.5px}.sik .sat-t a{-webkit-line-clamp:2}
.sik .sat-g,.sik .sat-o{display:none}
/* Akış alan başlıkları */
.alan-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;border-bottom:1px solid var(--cz)}
.alan-nav::-webkit-scrollbar{display:none}
.alan-nav a{flex:none;display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 12px;font-size:15px;font-weight:550;color:var(--ik);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.alan-nav a:hover{color:var(--yaz)}
.alan-nav a[aria-current=page]{color:var(--yaz);border-bottom-color:var(--vr)}
.alan-nav small{font-size:12px;color:var(--ik2);font-weight:500}
.alt-nav-s{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px}
.alt-nav-s::-webkit-scrollbar{display:none}
.alt-nav-s a{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;font-size:14px;color:var(--ik);box-shadow:inset 0 0 0 1px var(--cz);white-space:nowrap;position:relative}
.alt-nav-s a[aria-current=page]{background:var(--vr-z);color:var(--vr);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--vr) 35%,transparent);font-weight:600}
.konu-s{margin:-2px 0 12px}
.konu-s .cip{height:30px;font-size:13px;padding:0 11px;background:none}
.konu-s .cip.on{background:var(--yaz)}
/* trend */
.tr-s{display:flex;gap:14px;align-items:center;padding:13px 12px;margin:0 -12px;border-radius:var(--r2);cursor:pointer;position:relative}
.tr-s+.tr-s:before{content:"";position:absolute;left:12px;right:12px;top:0;border-top:1px solid var(--cz)}
.tr-s:hover,.tr-s.imlec{background:var(--yuz)}
.tr-s.secili{background:var(--vr-z)}
.tr-h{width:74px;flex:none;font-weight:700;font-size:15px}
.tr-h small{display:block;font-size:11.5px;color:var(--ik);font-weight:500}
.tr-s.son .tr-t,.tr-s.son .tr-h{color:var(--ik)}

function takipHtml(){

  else indeksYukle().then(function(){var k=$('takipK');if(k)k.innerHTML=takipHtml()}).catch(function(){});
  es.sort(function(a,b){return b.son-a.son});
  return es.length?liste(es.slice(0,8),{},'sik'):'<p class="bilgi">Son 48 saatte takip kelimelerinle eşleşen haber yok: '+esc(ayar.takip.join(', '))+'</p>';
